openapi: 3.1.0
info:
  title: Cognia External Bridge — MCP Streamable HTTP
  version: "0.2.0"
  license:
    name: MIT
    identifier: MIT
  summary: Canonical loopback MCP Streamable HTTP endpoint backed by the bundled Node sidecar.
  description: |
    Cognia exposes its inbound External Bridge through one MCP transport:
    `GET|POST|DELETE /mcp/stream`. The legacy `/mcp` and `/mcp/sse`
    facades are not mounted.

    The listener is loopback-only and rejects non-loopback Host or Origin
    values. Each client has an independent credential verifier, identity,
    expiry, and scope set. The authenticated client is bound to every MCP
    session; a session ID cannot be reused by another client.

    An initialize request without `Mcp-Session-Id` creates a session. Active
    sessions are capped at 128 and idle sessions are reclaimed after five
    minutes. Requests above capacity fail with an explicit 503 overload error.
    Request bodies are limited to 1 MiB.
servers:
  - url: http://127.0.0.1:{port}
    description: Loopback bind managed by the Cognia host.
    variables:
      port:
        default: "47920"
        description: Bound port reported by the External Bridge status API.
tags:
  - name: health
    description: Liveness probe; no bearer credential required.
  - name: mcp
    description: MCP Streamable HTTP transport.
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: mcpHealth
      tags: [health]
      summary: Liveness probe.
      security: []
      responses:
        "200":
          description: Server is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
              examples:
                ok: { value: { ok: true, version: "0.1.0" } }
        "403":
          description: Non-loopback Host or Origin was rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }

  /mcp/stream:
    post:
      operationId: mcpStreamPost
      tags: [mcp]
      summary: Create a session or send a JSON-RPC request within an existing session.
      description: |
        Send `initialize` without `Mcp-Session-Id` to create a session. The
        response includes the new session ID. All later requests carry the
        same header. Notifications without a JSON-RPC `id` return 202.
        Requests accepting `text/event-stream` receive SSE through the matching
        response; other requests receive one JSON response.
      parameters:
        - $ref: "#/components/parameters/McpSessionIdOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonRpcRequest" }
      responses:
        "200":
          description: JSON-RPC response or SSE stream. New sessions include `Mcp-Session-Id`.
          headers:
            Mcp-Session-Id:
              $ref: "#/components/headers/McpSessionId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
            text/event-stream:
              schema: { type: string }
        "202":
          description: Notification accepted; no JSON-RPC response is expected.
          headers:
            Mcp-Session-Id:
              $ref: "#/components/headers/McpSessionId"
        "400":
          description: Invalid JSON, empty body, or missing session ID for a non-initialize request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "401":
          description: Missing, invalid, or expired client credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "403":
          description: Cross-origin request or session/client identity mismatch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "404":
          description: Unknown or reclaimed session ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "413":
          description: Request body exceeded 1 MiB.
        "502":
          description: The session sidecar could not start or accept the request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "503":
          description: The 128-session admission limit has been reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
              example: { error: "MCP session capacity exceeded (maximum 128 active sessions)" }
        "504":
          description: Timed out waiting for the matching sidecar response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
    get:
      operationId: mcpStreamGet
      tags: [mcp]
      summary: Open the server-to-client SSE stream for an existing session.
      parameters:
        - $ref: "#/components/parameters/McpSessionIdRequired"
      responses:
        "200":
          description: Long-lived SSE stream of JSON-RPC messages.
          content:
            text/event-stream:
              schema: { type: string }
        "400":
          description: Missing session ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "401":
          description: Missing, invalid, or expired client credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "403":
          description: Session belongs to another client, or request is non-local.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "404":
          description: Unknown or reclaimed session ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
    delete:
      operationId: mcpStreamDelete
      tags: [mcp]
      summary: Close an existing session.
      parameters:
        - $ref: "#/components/parameters/McpSessionIdRequired"
      responses:
        "204":
          description: Session closed.
        "400":
          description: Missing session ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "401":
          description: Missing, invalid, or expired client credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "403":
          description: Request is non-local.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "404":
          description: Unknown session ID or a session owned by another client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }

components:
  parameters:
    McpSessionIdOptional:
      name: Mcp-Session-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: Omit only for the initial `initialize` request.
    McpSessionIdRequired:
      name: Mcp-Session-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Session identifier returned by the initial `initialize` response.
  headers:
    McpSessionId:
      description: Newly created MCP session identifier.
      schema: { type: string, format: uuid }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        One-time-visible per-client credential. The server stores only its
        SHA-256 verifier, compares supplied credentials in constant time, and
        binds the resulting client identity and canonical scopes to the MCP
        session. Rotation, revocation, or expiry closes established sessions.

  schemas:
    HealthResponse:
      type: object
      required: [ok, version]
      additionalProperties: false
      properties:
        ok: { type: boolean, enum: [true] }
        version: { type: string, description: "Cargo crate version of the desktop process." }

    SimpleError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: { type: string }

    # ── JSON-RPC 2.0 envelopes (intentionally permissive) ────────────────────

    JsonRpcRequest:
      description: |
        JSON-RPC 2.0 request envelope. Per the MCP spec, `id` may be a
        string or a number; notification envelopes omit `id`. `params` is
        optional and may be either an array or an object.
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: { type: string, enum: ["2.0"] }
        id:
          oneOf:
            - { type: string }
            - { type: number }
            - { type: "null" }
          description: Omit for notifications.
        method: { type: string, description: "MCP method name." }
        params:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: array, items: {} }

    JsonRpcResponse:
      description: |
        JSON-RPC 2.0 response envelope. Either `result` or `error` is
        present, not both. Pass-through; the server does not validate.
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: { type: string, enum: ["2.0"] }
        id:
          oneOf:
            - { type: string }
            - { type: number }
            - { type: "null" }
        result:
          description: Method-specific success payload.
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: array, items: {} }
            - { type: string }
            - { type: number }
            - { type: boolean }
            - { type: "null" }
        error: { $ref: "#/components/schemas/JsonRpcError" }

    JsonRpcError:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: integer
          description: |
            Standard JSON-RPC code (`-32700` parse error, `-32600` invalid
            request, `-32601` method not found, `-32602` invalid params,
            `-32603` internal error) or an MCP-specific code.
        message: { type: string }
        data:
          description: Optional error payload — shape determined by the sidecar.
