      tags: [rpc-plugin]
      summary: Invoke an allowlisted method on the confined system LSP channel.
      description: Requires remote-control authorization for device JWTs; the loopback brain service token is also accepted. The server fixes the channel id and rejects every non-LSP method.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, payloadJson]
              properties:
                method: { type: string, pattern: "^lsp:" }
                payloadJson: { type: string, description: Serialized JSON request payload. }
      responses:
        "200":
          {
            description: Serialized JSON result.,
            content: { application/json: { schema: { type: string } } },
          }
        "400":
          {
            description: Method is outside the LSP allowlist or the payload is invalid.,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "404":
          {
            description: System LSP host is not loaded.,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

