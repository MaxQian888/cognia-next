  # rpc — multi-agent config
  # ─────────────────────────────────────────────────────────────────────────

  /api/v1/_rpc/read_agent_config:
    post:
      operationId: rpcReadAgentConfig
      tags: [rpc-agent-config]
      summary: Read the on-disk config file for a coding-agent CLI.
      description: |
        Read-only — skips the idempotency cache. `agent` is the canonical
        slug (`claude-code`, `cursor`, `cline`, `codex`, …). Returns the raw
        file plus a parsed JSON tree; on parse failure the parsed field is
        null and `parseError` carries the message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              properties:
                agent: { type: string, description: "Canonical agent slug." }
            examples:
              cursor: { value: { agent: "cursor" } }
      responses:
        "200":
          description: Config snapshot. `path` is null when the agent is unsupported on this OS.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentReadResult" }
              examples:
                exists:
                  value:
                    path: "C:\\Users\\me\\.cursor\\mcp.json"
                    exists: true
                    writable: true
                    format: "json"
                    raw: '{ "mcpServers": { } }'
                    parsed: { mcpServers: {} }
                missing:
                  value:
                    path: "C:\\Users\\me\\.cursor\\mcp.json"
                    exists: false
                    writable: true
                    format: "json"
                    raw: ""
                    parsed: null
        "400":
          {
            description: unknown agent,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: filesystem error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/write_agent_config:
    post:
      operationId: rpcWriteAgentConfig
      tags: [rpc-agent-config]
      summary: Atomically write a coding-agent CLI's config file.
      description: |
        Re-serialises `value` to the format the file expects (JSON / JSONC /
        TOML), writes a `.bak` next to the original, then atomically replaces
        the file. Read-only agents are rejected (400). Comment-preserving
        TOML edits use `toml_edit`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, value]
              properties:
                agent: { type: string }
                value:
                  type: object
                  additionalProperties: true
                  description: Canonical JSON tree to serialise into the agent's format.
      responses:
        "200":
          description: Wrote. `backupPath` is null when the file did not exist before.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentWriteResult" }
        "400":
          description: unknown agent, agent is read-only, or no path on this OS.
          content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: serialise / write error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

