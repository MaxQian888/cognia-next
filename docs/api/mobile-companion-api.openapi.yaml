      summary: Return the External Bridge MCP HTTP server's live status.
      description: Read-only — skips the idempotency cache.
      requestBody:
        required: true
        content:
          { application/json: { schema: { type: object }, examples: { empty: { value: {} } } } }
      responses:
        "200":
          description: Status snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServerStatus" }
              examples:
                running:
                  { value: { running: true, port: 47920, startedAt: "2026-05-09T08:31:12Z" } }
                stopped: { value: { running: false } }
        "401": { $ref: "#/components/responses/JwtRejected" }

  /api/v1/_rpc/mcp_server_start:
    post:
      operationId: rpcMcpServerStart
      tags: [rpc-mcp]
      summary: Start the process-owned External Bridge MCP server.
      description: Requires remote-control authorization for device JWTs; the loopback brain service token is also accepted. The server resolves its packaged sidecar path and ignores a client-supplied path on headless hosts.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/McpServerLifecycleRequest" } },
          }
      responses:
        "200":
          {
            description: Bound TCP port.,
            content:
              { application/json: { schema: { type: integer, minimum: 1, maximum: 65535 } } },
          }
        "400":
          {
            description: Invalid settings or bearer token.,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "409":
          {
            description: Server is already running.,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "503":
          {
            description: Packaged sidecar or TCP listener is unavailable.,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/mcp_server_restart:
    post:
      operationId: rpcMcpServerRestart
      tags: [rpc-mcp]
      summary: Atomically stop and restart the process-owned MCP server.
      description: Requires remote-control authorization for device JWTs; the loopback brain service token is also accepted.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/McpServerLifecycleRequest" } },
          }
      responses:
        "200":
          {
            description: Newly bound TCP port.,
            content:
              { application/json: { schema: { type: integer, minimum: 1, maximum: 65535 } } },
          }
        "400":
          {
            description: Invalid settings or bearer token.,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "503":
          {
            description: Packaged sidecar or TCP listener is unavailable.,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/mcp_server_stop:
    post:
      operationId: rpcMcpServerStop
      tags: [rpc-mcp]
      summary: Gracefully stop the process-owned MCP server.
      description: Idempotent when already stopped. Requires remote-control authorization for device JWTs; the loopback brain service token is also accepted.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200":
          {
            description: Server is stopped.,
            content: { application/json: { schema: { type: "null" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }

  /api/v1/_rpc/orchestration_proxy_response:
    post:
      operationId: rpcOrchestrationProxyResponse
      tags: [rpc-mcp]
      summary: Resolve one pending MCP orchestration request.
      description: First reply wins; unknown or already-resolved ids are a no-op. Requires remote-control authorization so an observation-only paired device cannot spoof agent, team, or plugin-tool results.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, ok]
              additionalProperties: false
              properties:
                id: { type: string }
                ok: { type: boolean }
                result: {}
                error: { type: [string, "null"] }
      responses:
        "200":
          {
            description: Reply accepted or id was already resolved.,
            content: { application/json: { schema: { type: "null" } } },
          }
        "400":
          {
            description: Invalid reply envelope.,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }

  /api/v1/_rpc/test_mcp_server:
    post:
      operationId: rpcTestMcpServer
      tags: [rpc-mcp]
      summary: Probe a remote / local MCP server via JSON-RPC handshake.
      description: |
        Spawns a stdio process, or opens an SSE / streamable-HTTP connection,
        runs the MCP `initialize` → `notifications/initialized` → `tools/list`
        handshake, captures the tool list, and tears it down. The handshake
        is bound by a 10-second timeout; the protocol version pinned at
        request time is `2024-11-05`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transport]
              properties:
                transport: { type: string, enum: [stdio, http, sse] }
                command:
                  type: string
                  description: stdio only — executable path or command name.
                args:
                  type: array
                  items: { type: string }
                env:
                  type: object
                  additionalProperties: { type: string }
                url:
                  type: string
                  description: http / sse only — endpoint URL.
                headers:
                  type: object
                  additionalProperties: { type: string }
                  description: http / sse only — extra request headers.
            examples:
              stdio:
                value:
                  transport: "stdio"
                  command: "node"
                  args: ["./mcp-server.mjs"]
              http:
                value:
                  transport: "http"
                  url: "https://example.com/mcp"
                  headers: { Authorization: "Bearer xxx" }
      responses:
        "200":
          description: Probe finished. `ok=false` carries the reason in `error`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpTestResult" }
              examples:
                ok:
                  value:
                    ok: true
                    tool_count: 3
                    tools:
                      - { name: "wiki_search", description: "Search the indexed wiki." }
                    duration_ms: 412
                fail:
                  value:
                    ok: false
                    tool_count: 0
                    tools: []
                    error: "spawn node: ENOENT"
                    duration_ms: 18
        "400":
          {
            description: missing transport-required field,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }

  # ─────────────────────────────────────────────────────────────────────────
  # rpc — sync
  # ─────────────────────────────────────────────────────────────────────────

  /api/v1/_rpc/sync_pull:
    post:
      operationId: rpcSyncPull
      tags: [rpc-sync]
      summary: Pull a Dexie table delta since a cursor.
      description: |
        The phone hits this endpoint to incrementally sync a desktop-owned
        Dexie table. The Rust handler emits `companion://sync-pull-request`
        to the renderer, which queries Dexie and replies via the
        `companion_sync_pull_response` Tauri command. Default timeout
        **30 seconds** — slow desktops bubble up as a 500.

        Read-only — skips the idempotency cache (the same `(table, since)`
        pair returns the same delta, and stalling phone clients behind a
        60-second TTL would mask fresh writes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [table]
              properties:
                table:
                  type: string
                  enum:
                    [
                      characters,
                      skills,
                      sessions,
                      messages,
                      workflows,
                      workflowRuns,
                      twinProfile,
                      plugins,
                      adapterInstances,
                      settings,
                      conversationOverrides,
                      goals,
                      memories,
                      mcpServers,
                      terminalHistory,
                      agentTeamBoard,
                    ]
                  description: |
                    Allowlist; mirror of `lib/sync/types.ts:SyncableTable` (live
                    registry: `sync_registry.rs::default_tables`, listable via
                    `sync_list_tables`). Any other value returns 400 to prevent a
                    malicious phone from asking for arbitrary tables.
                    `agentTeamBoard` (v104) is the one-way Agent-Team board mirror —
                    board edits travel back as `team_*` control RPCs, never as sync
                    writes.
                since:
                  type: integer
                  format: int64
                  default: 0
                  description: Last cursor the phone received (ms epoch). Pass `0` for a full pull.
            examples:
              full: { value: { table: "characters", since: 0 } }
              incremental: { value: { table: "messages", since: 1714900000000 } }
      responses:
        "200":
          description: |
            Delta payload as produced by the renderer. Shape is owned by the
            TS sync layer and forwarded verbatim. The Rust side does not
            inspect the body.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Table not in the allowlist.
          content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          description: Renderer reported an error or did not reply within the timeout.
          content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } }

  /api/v1/_rpc/sync_list_tables:
    post:
      operationId: rpcSyncListTables
      tags: [rpc-sync]
      summary: List every Dexie table the phone is allowed to mirror.
