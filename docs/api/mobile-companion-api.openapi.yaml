    post:
      operationId: rpcWorkflowApprovalRespond
      tags: [rpc-workflows]
      summary: Resolve a pending workflow approval (ADR-0061 P2, control-gated).
      description: |
        Approves or rejects a blocked `action.approval.request` step.
        Requires the remote-control capability. The responder identity is
        the JWT-verified `callerDeviceId` injected server-side — any
        client-sent value is overwritten.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvalId, decision]
              properties:
                approvalId: { type: string }
                decision: { type: string, enum: [approved, rejected] }
      responses:
        "200":
          description: Resolution outcome — ok=false means no longer pending.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  reason: { type: string, enum: [not-found] }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403":
          {
