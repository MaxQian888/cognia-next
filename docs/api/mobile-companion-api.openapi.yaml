openapi: 3.1.0
info:
  title: Cognia Mobile Companion API
  version: "0.1.0"
  license:
    name: MIT
    identifier: MIT
  summary: Pairing, JWT-authenticated RPC, and event stream for the cognia-next mobile client.
  description: |
    Axum HTTP + WebSocket server hosted inside the cognia-next Tauri desktop
    process. The mobile Capacitor client (and any other authenticated
    consumer) drives the desktop through this surface.

    ## Lifecycle

    1. The desktop calls `POST /api/v1/auth/pair/issue` from its own UI to
       obtain a fresh **pair JWT** (5-minute TTL, single-use, scope=`pair`).
       The token is encoded into a QR code (or copied as a manual textbox).
    2. The phone scans the QR / pastes the token, then `POST /api/v1/auth/pair`
       redeems it for a long-lived **device JWT** (90-day TTL, scope=`device`).
       The pair JWT is single-use; a second redemption returns 409.
    3. The phone uses the device JWT in `Authorization: Bearer <jwt>` for
       every authenticated request and `?token=<jwt>` on the `/ws/v1/events`
       upgrade (browsers cannot reliably set headers on WS upgrades).

    ## Bind strategy

    The default bind is `127.0.0.1` (loopback only). The "LAN-accessible"
    toggle in Settings switches the bind to `0.0.0.0`. With M2.8 the desktop
    can additionally generate a self-signed TLS cert (`rcgen`, 10-year, key
    persisted at `<app_data>/cognia/companion/tls.{pem,key}`) whose
    SHA-256 SubjectPublicKeyInfo fingerprint is embedded into the QR
    payload — the phone pins it across future calls. A Cloudflared tunnel
    URL is also a valid `servers` entry when the user opts in.

    ## Body limits

    - JSON request body limit: **64 KiB** (`tower_http::limit::RequestBodyLimitLayer`).
    - The WS upgrade route is intentionally **outside** that body-size layer,
      because the layer interferes with the upgrade handshake.

    ## Idempotency

    Non-read-only RPC commands honour the `Idempotency-Key` header. A
    successful response is cached for **60 seconds** under
    `(device_id, idempotency_key)`. A second request with the same pair
    returns the cached body without re-executing the command. Read-only
    commands skip the cache (their idempotency is structural).

    The current read-only set is: `claude_sidecar_status`,
    `claude_sub_load_token`, `claude_has_api_key`, `claude_has_oauth_bearer`,
    `skills_load_registry`, `skills_scan_native`, `mcp_server_status`,
    `read_agent_config`, `sync_pull`.

    ## Error envelopes

    Two distinct error shapes — one per route family. The **pair / whoami /
    middleware** family wraps the body in `{ error: { code, message } }`.
    The **RPC dispatch** family is flat: `{ code, message }`. Both are
    documented as schemas (`AuthError`, `RpcError`).

    ## Sequencing & RPC dispatch

    `POST /api/v1/_rpc/{name}` is the dispatch route on the wire — every
    command is delivered to that single path with `name` as a path
    parameter. To make every command's exact request and response shape
    discoverable, this spec **also** documents each command as its own
    explicit path entry (`/api/v1/_rpc/claude_send`, etc.). The two
    representations describe the same wire contract; tooling that follows
    the explicit-per-command paths will produce well-typed clients.

    Unknown command names return HTTP 404 with `{ code: "unknown_command" }`.

servers:
  - url: http://127.0.0.1:7890
    description: Loopback bind (default; only same-machine clients reach it).
  - url: http://0.0.0.0:7890
    description: LAN bind (M2.8 toggle in Settings → Connections).
  - url: https://{tunnelHost}
    description: Cloudflared tunnel URL (opt-in; user installs `cloudflared`).
    variables:
      tunnelHost:
        default: example.trycloudflare.com
        description: Resolved at runtime from `cloudflared`'s stderr.

tags:
  - name: auth
    description: Pre-authentication pair exchange (no JWT required).
  - name: identity
    description: Authenticated device identity probe.
  - name: rpc-dispatch
    description: The wildcard RPC dispatch route + the read-only command list.
  - name: rpc-claude-session
    description: Claude Agent SDK chat-session control plane.
  - name: rpc-subscription
    description: Claude Pro/Max OAuth credential management.
  - name: rpc-provider-env
    description: Provider API key / base URL environment writes for the sidecar.
  - name: rpc-agent-config
    description: Multi-agent settings file IO (Claude Code, Cursor, Cline, Codex, …).
  - name: rpc-skills
    description: Native skills registry / install / uninstall.
  - name: rpc-mcp
    description: External-bridge MCP server status + remote MCP probing.
  - name: rpc-sync
    description: Server → client incremental sync (table delta pull).
  # Previously used by operations but never declared — declared here for hygiene.
  - name: rpc-messages
    description: Desktop message/session store reads + mutations.
  - name: rpc-push
    description: FCM / APNs push-token registration.
  - name: rpc-data
    description: Wave 2 desktop-write bridge (character / skill / plugin / settings).
  - name: rpc-remote-control
    description: Remote session control — attach/detach, goal steering, consent.
  # Wave 4.1 — full desktop-surface exposure.
  - name: rpc-git
    description: Git porcelain over a repo path (ADR-0038). Writes are control-gated.
  - name: rpc-files
    description: Filesystem reads/writes — raw absolute paths + sandboxed workspace variants.
  - name: rpc-terminal
    description: Terminal session listing/kill + one-shot command execution.
  - name: rpc-plugin
    description: Plugin install / uninstall / list + plugin backup.
  - name: rpc-workflow-crud
    description: Workflow definition CRUD, schedule pause/resume, run listing + cancel.
  - name: rpc-twin
    description: Digital Twin delete + source CRUD + ingest-job control.
  - name: rpc-backup
    description: App-data backup export / import.
  - name: rpc-settings
    description: User-facing settings + per-conversation overrides.
  - name: events
    description: WebSocket bridge for live Tauri events (chat messages, run state, …).

security:
  - bearerAuth: []

paths:
  # ─────────────────────────────────────────────────────────────────────────
  # auth
  # ─────────────────────────────────────────────────────────────────────────

  /api/v1/auth/pair/issue:
    post:
      operationId: issuePairJwt
      tags: [auth]
      summary: Issue a single-use pair JWT (loopback-only in practice).
      description: |
        Issues a fresh pair JWT (`scope = "pair"`, 5-minute TTL, single-use
        `jti`). The desktop QR generator calls this; the token is encoded
        into the QR code / manual paste payload. The request body is empty.

        **Loopback origin**: this route exists in the same router as the
        protected routes, but in normal operation only the desktop UI calls
        it (the phone never sees the issue endpoint). The router can be
        bound to LAN, in which case any process on the LAN can request a
        pair JWT — that is acceptable because the JWT is useless without
        being scanned and redeemed within 5 minutes.
      security: [] # no auth
      responses:
        "200":
          description: A fresh single-use pair JWT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueResponse" }
              examples:
                ok:
                  value:
                    pairJwt: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    expiresAtMs: 1714900200000
        "413":
          description: Request body exceeded 64 KiB (the request body for this endpoint must be empty).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthError" }
        "500":
          description: Internal error issuing the JWT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthError" }
              examples:
                jwtIssueFailed:
                  value:
                    error:
                      code: jwt_issue_failed
                      message: "JWT signature or format invalid: …"

  /api/v1/auth/pair:
    post:
      operationId: redeemPairJwt
      tags: [auth]
      summary: Redeem a pair JWT and receive a long-lived device JWT.
      description: |
        Validates the pair JWT (signature, scope=`pair`, expiry), marks its
        `jti` as redeemed in the in-process LRU, mints a 90-day device JWT
        bound to a fresh `device_id` (UUIDv4), and emits the
        `companion://device-paired` Tauri event so the renderer can persist
        the row to Dexie.

        The pair JWT is **single-use**: a second redemption with the same
        `jti` returns 409.
      security: [] # no auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairRequest" }
            examples:
              minimal:
                value:
                  pairJwt: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  deviceLabel: "Pixel 9 Pro"
                  devicePlatform: "android"
                  devicePubkey: "MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA…"
                  appVersion: "0.1.0"
      responses:
        "200":
          description: Pair JWT redeemed; device JWT returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairResponse" }
              examples:
                ok:
                  value:
                    deviceId: "9f6cb9c4-2c79-4f02-9b37-2b62ad03f0e1"
                    deviceJwt: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    serverVersion: "0.1.0"
        "400":
          description: Malformed body or `device_label` longer than 64 chars.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthError" }
              examples:
                malformed:
                  value:
                    error:
                      code: malformed_request
                      message: "JSON syntax error: …"
                labelTooLong:
                  value:
                    error:
                      code: device_label_too_long
                      message: "device_label must be at most 64 characters"
        "401":
          description: Pair JWT invalid, expired, or wrong scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthError" }
              examples:
                invalid:
                  value:
                    error:
                      code: invalid_pair_jwt
                      message: "pair JWT is invalid, expired, or has the wrong scope"
        "409":
          description: Pair JWT already redeemed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthError" }
              examples:
                redeemed:
                  value:
                    error:
                      code: pair_jwt_redeemed
                      message: "pair JWT has already been used"
        "500":
          description: Internal error issuing the device JWT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthError" }
              examples:
                jwtIssueFailed:
                  value:
                    error:
                      code: jwt_issue_failed
                      message: "JWT signature or format invalid: …"

  # ─────────────────────────────────────────────────────────────────────────
  # identity
  # ─────────────────────────────────────────────────────────────────────────

  /api/v1/whoami:
    get:
      operationId: whoami
      tags: [identity]
      summary: Return the device id and server version for the bearer JWT.
      description: |
        Verifies the device JWT and returns the `device_id` plus the server
        crate version. The mobile client uses this as a JWT-still-valid
        probe after pair, before resuming a session.

        Successful calls additionally emit the `companion://device-seen`
        Tauri event so the renderer can update `pairedDevices.lastSeenAt`.
      responses:
        "200":
          description: JWT valid; identity returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhoamiResponse" }
              examples:
                ok:
                  value:
                    device_id: "9f6cb9c4-2c79-4f02-9b37-2b62ad03f0e1"
                    server_version: "0.1.0"
        "401":
          $ref: "#/components/responses/JwtRejected"

  # ─────────────────────────────────────────────────────────────────────────
  # rpc — wildcard dispatch
  # ─────────────────────────────────────────────────────────────────────────

  /api/v1/_rpc/{name}:
    post:
      operationId: rpcDispatch
      tags: [rpc-dispatch]
      summary: Dispatch any RPC command by name.
      description: |
        The wire-true representation of every RPC call. Every command in this
        spec — `claude_send`, `sync_pull`, … — flows through this path with
        `name` as the path segment.

        Each command's exact request and response shapes are also documented
        as their own explicit `/api/v1/_rpc/<command>` paths in this spec
        (with full schemas and examples) so generated clients get per-command
        typing. Both representations describe the same route on the server.

        Unknown command names return HTTP 404 with `{ code: "unknown_command" }`.
      parameters:
        - $ref: "#/components/parameters/RpcName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: |
          Per-command JSON arguments. See each `/api/v1/_rpc/<command>`
          path entry for the exact request schema.
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Command-specific argument object. Empty object `{}` is valid for argument-less commands.
      responses:
        "200":
          description: Command-specific success body. See the dedicated path entries for exact shapes.
          content:
            application/json:
              schema:
                description: Command-specific success body. May be `null` for fire-and-forget commands.
                oneOf:
                  - { type: object, additionalProperties: true }
                  - { type: array, items: {} }
                  - { type: string }
                  - { type: number }
                  - { type: boolean }
                  - { type: "null" }
        "400":
          description: Malformed args.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RpcError" }
              examples:
                missingField:
                  value:
                    code: malformed_request
                    message: "missing required field: session_id"
        "401":
          $ref: "#/components/responses/JwtRejected"
        "404":
          description: Command name not in the dispatch allowlist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RpcError" }
              examples:
                unknown:
                  value:
                    code: unknown_command
                    message: "RPC command 'wallpaper_save' is not exposed to mobile clients"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          description: Internal error inside the dispatched handler.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RpcError" }
        "503":
          description: |
            `app_handle` is not available. Surfaces in test harnesses where the
            companion server is spawned without a real Tauri AppHandle, and at
            very early boot before the Tauri event loop is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RpcError" }
              examples:
                serviceUnavailable:
                  value:
                    code: service_unavailable
                    message: "app_handle not available (test mode)"

  # ─────────────────────────────────────────────────────────────────────────
  # rpc — chat session
  # ─────────────────────────────────────────────────────────────────────────

  /api/v1/_rpc/claude_send:
    post:
      operationId: rpcClaudeSend
      tags: [rpc-claude-session]
      summary: Push a user message into a Claude SDK session (spawns sidecar if needed).
      description: |
        Forwards `prompt` to the Claude Agent SDK sidecar, attaching any
        per-call `options` (system prompt, tools allowlist, MCP servers,
        provider credentials, …). UserPromptSubmit hooks run before the
        SDK call; a hook can short-circuit the turn or append additional
        context. Returns `null` on accept; streaming output is delivered
        out-of-band via the `/ws/v1/events` channel as `claude://message`
        frames.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, prompt]
              properties:
                session_id:
                  type: string
                  description: Logical session id chosen by the caller (Dexie row key).
                prompt:
                  description: |
                    Either a plain string or an array of content blocks (text + image) — forwarded
                    verbatim to the Claude Agent SDK. Image blocks follow Anthropic's content-block format.
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: object
                        additionalProperties: true
                options:
                  $ref: "#/components/schemas/SendOptions"
            examples:
              text:
                value:
                  session_id: "sess_01HK..."
                  prompt: "Summarise the staged changes."
                  options:
                    cwd: "C:/Users/me/repo"
                    model: "claude-opus-4-7"
                    appendSystemPrompt: "Be terse."
                    allowedTools: ["Read", "Grep", "Bash"]
                    maxTurns: 6
              imageBlock:
                value:
                  session_id: "sess_01HK..."
                  prompt:
                    - { type: "text", text: "What's in the screenshot?" }
                    - {
                        type: "image",
                        source: { type: "base64", media_type: "image/png", data: "..." },
                      }
      responses:
        "200":
          description: Accepted — streaming output flows over the WS channel.
          content:
            application/json:
              schema: { type: "null" }
        "400":
          description: |
            Mutually exclusive options or invalid range — `systemPrompt` AND `appendSystemPrompt`,
            `resumeSessionId` AND `forkFromSessionId`, `maxTurns` outside 1..=100,
            invalid `settingSources` member, empty `provider`, or unsupported
            `providerCredentials.protocol`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RpcError" }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          description: Sidecar spawn failure or hook block.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RpcError" }

  /api/v1/_rpc/claude_interrupt:
    post:
      operationId: rpcClaudeInterrupt
      tags: [rpc-claude-session]
      summary: Interrupt the in-flight turn for a session.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string }
      responses:
        "200":
          description: Interrupt signalled; running tools tear down asynchronously.
          content: { application/json: { schema: { type: "null" } } }
        "400":
          {
            description: missing session_id,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: internal error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/claude_compact:
    post:
      operationId: rpcClaudeCompact
      tags: [rpc-claude-session]
      summary: Request manual context compaction for a Claude SDK session.
      description: |
        Sends a compact control message to the sidecar read loop. `focus`,
        when present, is forwarded as the optional compact instruction.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string }
                focus:
                  { type: string, nullable: true, description: Optional compact instruction/focus. }
      responses:
        "200":
          description: Compact request signalled; resulting stream events arrive over WebSocket.
          content: { application/json: { schema: { type: "null" } } }
        "400":
          {
            description: missing session_id,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: internal error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/claude_approve:
    post:
      operationId: rpcClaudeApprove
      tags: [rpc-claude-session]
      summary: Resolve a pending tool-use approval prompt.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, request_id, decision]
              properties:
                session_id: { type: string }
                request_id:
                  {
                    type: string,
                    description: "ID of the pending approval request emitted via WS.",
                  }
                decision:
                  type: string
                  enum: [allow, deny, edit]
                  description: |
                    `allow` proceeds, `deny` rejects with the optional `message` shown to the
                    model, `edit` re-runs with `updated_input` substituted for the original arguments.
                message:
                  { type: string, description: "Optional rejection reason or note (denial only)." }
                updated_input:
                  description: "Replacement tool input — required when decision = edit."
                  oneOf:
                    - type: object
                      additionalProperties: true
                    - type: "null"
      responses:
        "200":
          description: Approval forwarded.
          content: { application/json: { schema: { type: "null" } } }
        "400":
          {
            description: malformed args,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: internal error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/claude_close_session:
    post:
      operationId: rpcClaudeCloseSession
      tags: [rpc-claude-session]
      summary: Tear down a Claude SDK session and free its sidecar slot.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string }
      responses:
        "200": { description: Closed., content: { application/json: { schema: { type: "null" } } } }
        "400":
          {
            description: missing session_id,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: internal error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  # ─────────────────────────────────────────────────────────────────────────
  # rpc — remote session control (requires the allowRemoteControl capability)
  # ─────────────────────────────────────────────────────────────────────────

  /api/v1/_rpc/session_attach:
    post:
      operationId: rpcSessionAttach
      tags: [rpc-remote-control]
      summary: Attach this device as a live watcher of a host session.
      description: |
        Marks the device as watching `session_id` so a `permission_request`
        for that session (when it is not the desktop's foreground session) is
        routed to this device for approval instead of being auto-denied.
        Requires the `allowRemoteControl` capability — a device without it
        gets `403 remote_control_forbidden`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, deviceId]
              properties:
                sessionId: { type: string }
                deviceId:
                  {
                    type: string,
                    description: "This device's id, so the host can refcount watchers.",
                  }
      responses:
        "200":
          { description: Attached., content: { application/json: { schema: { type: "null" } } } }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "500":
          {
            description: internal error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/session_detach:
    post:
      operationId: rpcSessionDetach
      tags: [rpc-remote-control]
      summary: Stop watching a host session.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, deviceId]
              properties:
                sessionId: { type: string }
                deviceId: { type: string }
      responses:
        "200":
          { description: Detached., content: { application/json: { schema: { type: "null" } } } }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "500":
          {
            description: internal error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/goal_pause:
    post:
      operationId: rpcGoalPause
      tags: [rpc-remote-control]
      summary: Pause a host /goal self-driving loop.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goalId]
              properties:
                goalId: { type: string }
      responses:
        "200":
          description: The updated goal (or null when unknown).
          content:
            {
              application/json:
                {
                  schema:
                    { oneOf: [{ type: object, additionalProperties: true }, { type: "null" }] },
                },
            }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "500":
          {
            description: internal error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/goal_resume:
    post:
      operationId: rpcGoalResume
      tags: [rpc-remote-control]
      summary: Resume a paused host /goal loop.
      parameters:
