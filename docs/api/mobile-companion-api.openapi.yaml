          application/json:
            schema:
              type: object
              required: [capabilities]
              properties:
                capabilities:
                  type: array
                  maxItems: 64
                  items: { type: string }
                  description: "Capability ids from lib/platform/capabilities.ts (core ids or plugin:<id>)."
      responses:
        "200":
          { description: Recorded., content: { application/json: { schema: { type: "null" } } } }
        "400":
