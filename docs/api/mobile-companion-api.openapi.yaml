  /api/v1/_rpc/conversation_overrides_update:
    post:
      operationId: rpcConversationOverridesUpdate
      tags: [rpc-settings]
      summary: Upsert a per-conversation override (pin / archive / title).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [input],
                    properties: { input: { type: object, additionalProperties: true } },
                  },
              },
          }
      responses:
        "200":
          {
            description: Upserted row.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { override: { type: object, additionalProperties: true } },
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/backup_export:
    post:
      operationId: rpcBackupExport
      tags: [rpc-backup]
      summary: Build an app-data backup package (read-only snapshot; secrets excluded).
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    properties:
                      {
                        options:
                          {
                            type: object,
                            properties:
                              {
                                includeSessions: { type: boolean },
                                includeBuiltIns: { type: boolean },
                              },
                          },
                      },
                  },
              },
          }
      responses:
        "200":
          {
            description: Backup package.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { package: { type: object, additionalProperties: true } },
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/backup_import:
    post:
      operationId: rpcBackupImport
      tags: [rpc-backup]
      summary: Apply an app-data backup package. Requires allowRemoteControl.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [package],
                    properties:
                      {
                        package: { type: object, additionalProperties: true },
                        options:
                          {
                            type: object,
                            properties:
                              {
                                mergeStrategy: { type: string, enum: [skip, overwrite, duplicate] },
                                includeSessions: { type: boolean },
                              },
                          },
                      },
                  },
              },
          }
      responses:
        "200":
          {
            description: Import summary.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { summary: { type: object, additionalProperties: true } },
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/logs_query:
    post:
      operationId: rpcLogsQuery
      tags: [rpc-logs]
      summary: Bounded tail query over the desktop's on-disk log files (read-only).
      description: |
        Reads the tail (at most 4 MiB) of `cognia-structured.log` (JSON lines
        from the Rust tracing subscriber) or `cognia.log` (plain
        tauri-plugin-log lines) and returns filtered entries newest-first.
        Parsing is best-effort — unparseable lines are skipped.
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    properties:
                      {
                        query:
                          {
                            type: object,
                            description: Filter set. A bare flattened query object (no wrapper) is also accepted.,
                            properties:
                              {
                                file:
                                  { type: string, enum: [structured, plain], default: structured },
                                minLevel: { type: string, enum: [trace, debug, info, warn, error] },
                                target:
                                  {
                                    type: string,
                                    description: Hierarchy prefix match on the record target.,
                                  },
                                contains:
                                  {
                                    type: string,
                                    description: Case-insensitive substring match on the message.,
                                  },
                                sinceMs:
                                  {
                                    type: integer,
                                    format: int64,
                                    description: Only entries at or after this Unix-epoch ms.,
                                  },
                                limit: { type: integer, minimum: 1, maximum: 1000, default: 200 },
                              },
                          },
                      },
                  },
              },
          }
      responses:
        "200":
          {
            description: Filtered log entries,
            newest first,
            plus scan metadata.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [entries, fileSize, scannedBytes, truncated, path],
                        properties:
                          {
                            entries:
                              {
                                type: array,
                                items:
                                  {
                                    type: object,
                                    required: [timestamp, level, target, message],
                                    properties:
                                      {
                                        timestamp: { type: string },
                                        epochMs: { type: integer, format: int64 },
                                        level: { type: string },
                                        target: { type: string },
                                        message: { type: string },
                                        fields: { type: object, additionalProperties: true },
                                      },
                                  },
                              },
                            fileSize: { type: integer, format: int64 },
                            scannedBytes: { type: integer, format: int64 },
                            truncated: { type: boolean },
                            path: { type: string },
                          },
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/logs_list_files:
    post:
      operationId: rpcLogsListFiles
      tags: [rpc-logs]
      summary: List the desktop's log-directory files with sizes (read-only).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: {} } } }
      responses:
        "200":
          {
            description: Log files,
            newest-modified first.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items:
                          {
                            type: object,
                            required: [name, size],
                            properties:
                              {
                                name: { type: string },
                                size: { type: integer, format: int64 },
                                modifiedMs: { type: integer, format: int64 },
                              },
                          },
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/fleet_get_snapshot:
    post:
      operationId: rpcFleetGetSnapshot
      tags: [rpc-fleet]
      summary: Current live agent-fleet snapshot (read-only).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: {} } } }
      responses:
        "200":
          {
            description: The fleet snapshot (sessions + generatedAt).,
            content: { application/json: { schema: { type: object } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/fleet_permission_respond:
    post:
      operationId: rpcFleetPermissionRespond
      tags: [rpc-fleet]
      summary: Answer a parked fleet permission request (remote-control gated).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, behavior]
              properties:
                requestId: { type: string }
                behavior: { type: string, enum: [allow, deny] }
      responses:
        "200":
          {
            description: True when the parked request was still awaiting an answer.,
            content: { application/json: { schema: { type: boolean } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/fleet_opencode_send_message:
    post:
      operationId: rpcFleetOpencodeSendMessage
      tags: [rpc-fleet]
      summary: Inject a prompt into an OpenCode fleet session (remote-control gated).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, text]
              properties:
                sessionId: { type: string }
                text: { type: string }
      responses:
        "200":
          {
            description: The queued command id.,
            content: { application/json: { schema: { type: string } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/fleet_focus_terminal:
    post:
      operationId: rpcFleetFocusTerminal
      tags: [rpc-fleet]
      summary: Focus the terminal behind a fleet session (remote-control gated).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, sessionId]
              properties:
                agent: { type: string }
                sessionId: { type: string }
      responses:
        "200": { description: Focused (null body). }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/fleet_question_respond:
    post:
      operationId: rpcFleetQuestionRespond
      tags: [rpc-fleet]
      summary: Answer a parked AskUserQuestion on a fleet session (remote-control gated).
      description: >
        Selections are per-question option INDICES, in question order, so the
        answer is immune to the display truncation the snapshot applies to
        option labels. Answering races the agent's own hook timeout; a late
        answer is rejected rather than applied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, selections]
              properties:
                requestId: { type: string }
                selections:
                  type: array
                  items: { type: array, items: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Whether the answer reached a still-waiting request.
          content: { application/json: { schema: { type: boolean } } }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/fleet_interrupt_session:
    post:
      operationId: rpcFleetInterruptSession
      tags: [rpc-fleet]
      summary: Interrupt a fleet session's current turn (remote-control gated).
      description: >
        Delivers a single SIGINT to the agent process — equivalent to pressing
        Ctrl-C once in that terminal, which cancels the in-flight turn without
        exiting. The pid is re-verified alive and identity-checked first, so a
        recycled pid cannot be signalled. There is no acknowledgement channel:
        a 200 means the signal was sent, not that the turn stopped. Unsupported
        on Windows, where console control events cannot reach a process that
        does not share our console.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, sessionId]
              properties:
                agent: { type: string }
                sessionId: { type: string }
      responses:
        "200": { description: Signal sent (null body). }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "500":
          description: >
            Refused or failed. `interrupt_unsupported`, `interrupt_not_running`
            and `interrupt_identity_mismatch` are the structured refusal codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RpcError" }

  /api/v1/_rpc/lark_entry_issue:
    post:
      operationId: rpcLarkEntryIssue
      tags: [rpc-lark]
      summary: Mint a Lark entry-context or surface token (service scope).
      description: >
        Headless-brain-only (service JWT). `kind: "entry"` mints a 300-second
        single-use personal entry token binding a resolved principal + verified
        platform identity to a conversation; `kind: "surface"` mints a
        long-lived integrity-only descriptor baked into Chat Tab / group-menu
        URLs. Tokens are HS256 over the companion secret and are consumed by
        `POST /integrations/lark/entry/resolve`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [entry, surface] }
                principalId: { type: string }
                accountId: { type: string }
                openId: { type: string }
                tenantKey: { type: string }
                appId: { type: string }
                adapterId: { type: string }
                entryType: { type: string }
                conversationKey: { type: string }
                sessionId: { type: string }
                chatId: { type: string }
                surface: { type: string, enum: [chat_tab, group_menu] }
                urlVersion: { type: integer }
      responses:
        "200":
          description: Token minted. Entry kind also returns jti + expiresAt.
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { description: Requires the headless service token. }
        "500":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RpcError" }

  /api/v1/_rpc/lark_result_complete:
    post:
      operationId: rpcLarkResultComplete
      tags: [rpc-lark]
      summary: Complete an async Lark intent (service scope).
      description: >
        The headless brain posts the outcome of an intent registered by the
        Lark entry surface (surface resolves, message-shortcut imports,
        plus-menu creates). Browsers observe it via
        `GET /integrations/lark/intent/{requestId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string }
                result: { description: Arbitrary JSON result on success. }
                error: { type: string }
      responses:
        "200": { description: "`{accepted}` — false when the id is unknown." }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { description: Requires the headless service token. }

  /api/v1/_rpc/lark_metrics_record:
    post:
      operationId: rpcLarkMetricsRecord
      tags: [rpc-lark]
      summary: Bump an allowlisted Lark counter (service scope).
      description: >
        Fire-and-forget metric bump from the headless brain. Names are
        hardcoded in `metrics.rs::record_lark_counter` — unknown names are
        rejected, so the brain cannot mint arbitrary Prometheus series.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200": { description: Counter bumped. }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { description: Requires the headless service token. }
        "500":
          description: Unknown metric name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RpcError" }

# ───────────────────────────────────────────────────────────────────────────
# components
# ───────────────────────────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 device JWT issued by `POST /api/v1/auth/pair`. Claims:
        - `scope`: `"device"`
        - `iat`, `exp` (90-day TTL)
        - `device_id` (UUIDv4)
        Secret material lives in the Tauri process; no remote signing.

  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: |
        Optional caller-chosen idempotency key. When present and the command
        is **not** read-only, the success body is cached for 60 s under
        `(device_id, idempotency_key)`. A retry with the same key returns
        the cached body without re-running the command. Read-only commands
        (`claude_sidecar_status`, `claude_sub_load_token`, `claude_has_*`,
        `skills_load_registry`, `skills_scan_native`, `mcp_server_status`,
        `read_agent_config`, `sync_pull`) skip the cache entirely.
      schema:
        type: string
        maxLength: 255
        example: "0ec7f3ae-9b29-4b9a-bb69-0da70e8f1bf4"

    RpcName:
      in: path
      name: name
      required: true
      description: RPC command name. The authoritative allowlist is the set of dedicated `/api/v1/_rpc/<command>` paths above; this enum is a non-exhaustive convenience sample.
      schema:
        type: string
        enum:
          - claude_send
          - claude_interrupt
          - claude_approve
          - claude_close_session
          - claude_sidecar_status
          - claude_set_oauth_bearer
          - claude_set_api_key
          - claude_set_provider_env
          - claude_has_api_key
          - claude_has_oauth_bearer
          - claude_restart_sidecar
          - read_agent_config
          - write_agent_config
          - skills_scan_native
          - skills_load_registry
          - skills_install_native
          - skills_uninstall_native
          - mcp_server_status
          - test_mcp_server
          - sync_pull

  responses:
    JwtRejected:
      description: |
        JWT missing, malformed, expired, wrong scope, or wrong signature.
        Specific `error.code`: `missing_authorization`, `invalid_signature`,
        `expired_token`, `wrong_scope`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthError" }
          examples:
            missing:
              value:
                {
                  error:
                    {
                      code: missing_authorization,
                      message: "Authorization header or ?token= query parameter is required",
                    },
                }
            expired:
              value: { error: { code: expired_token, message: "ExpiredSignature" } }
            wrongScope:
              value: { error: { code: wrong_scope, message: 'JWT scope must be "device"' } }
    PayloadTooLarge:
      description: Request body exceeded the 64 KiB limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RpcError" }
          examples:
            tooLarge:
              value: { code: payload_too_large, message: "request body exceeded 65536 bytes" }
    RemoteControlForbidden:
      description: |
        The device is paired and authenticated but lacks the elevated
        remote-control capability (`allowRemoteControl` is off for it). The
        owner grants it per-device from the desktop paired-devices settings
        (biometric-gated). `code` is `remote_control_forbidden`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RpcError" }
          examples:
            forbidden:
              value:
                {
                  code: remote_control_forbidden,
                  message: "this device is not authorized for remote control; enable it from the desktop paired-devices settings",
                }
    ServiceTokenRequired:
      description: |
        This native plugin execution/control command is reserved for the
        headless brain's short-lived service JWT. Device-scoped JWTs are
        rejected even when `allowRemoteControl` is enabled; service tokens are
        additionally accepted only from loopback by the JWT middleware.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RpcError" }
          examples:
            forbidden:
              value:
                {
                  code: remote_control_forbidden,
                  message: "this command requires the headless service token",
                }

  schemas:
    # ── Auth wire shapes ─────────────────────────────────────────────────────

    IssueResponse:
      type: object
      required: [pairJwt, expiresAtMs]
      additionalProperties: false
      properties:
        pairJwt: { type: string, description: 'HS256 JWT, scope="pair", 5-min TTL, single-use.' }
        expiresAtMs: { type: integer, format: int64, description: "Millisecond epoch." }

    PairRequest:
      type: object
      required: [pairJwt, deviceLabel, devicePlatform, devicePubkey, appVersion]
      additionalProperties: false
      properties:
        pairJwt: { type: string }
        deviceLabel:
          type: string
          maxLength: 64
          description: "Human label shown in Settings → Connections. Validated server-side at ≤64 characters (chars, not bytes)."
        devicePlatform:
          type: string
          description: "Free-form identifier (`ios`, `android`, `web`, `desktop`, …). Echoed back into the Tauri device-paired event."
        devicePubkey:
          type: string
          description: "Base64-encoded device public key (currently informational; will be used by future encrypted channels)."
        appVersion:
          type: string
          description: "Mobile client semver."

    PairResponse:
      type: object
      required: [deviceId, deviceJwt, serverVersion]
      additionalProperties: false
      properties:
        deviceId: { type: string, format: uuid }
        deviceJwt: { type: string, description: 'HS256 JWT, scope="device", 90-day TTL.' }
        serverVersion: { type: string, description: "Cargo crate version of the desktop process." }

    WhoamiResponse:
      type: object
      required: [device_id, server_version]
      additionalProperties: false
      properties:
        device_id: { type: string, format: uuid }
        server_version: { type: string }

    # ── Error envelopes ──────────────────────────────────────────────────────

    # Wave 3.1: AuthError is now an alias for RpcError. Both /auth/* and
    # /_rpc/* return the same flat `{ code, message, details? }` shape.
    AuthError:
      $ref: "#/components/schemas/RpcError"

    RpcError:
      description: |
        Unified flat error envelope for every endpoint under /api/v1/.
        Wave 3.1 collapsed the prior `{ error: { code, message } }`
        nested shape used by /auth/* into this flat form.
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: |
            Stable snake-case code. Known values: `unknown_command`,
            `malformed_request`, `service_unavailable`, `internal_error`,
            `payload_too_large`, `validation_failed`, `rate_limited`,
            `invalid_pair_jwt`, `pair_jwt_redeemed`, `device_label_too_long`,
            `missing_authorization`, `expired_token`, `wrong_scope`,
            `device_revoked`.
        message: { type: string }
        details:
          description: |
            Optional structured payload — populated by `validation_failed`
            with the field-level errors from JSON-schema validation
            (Wave 3.2), and by `rate_limited` with `retry_after_ms`.
          type: object
          additionalProperties: true

    # ── Claude session ───────────────────────────────────────────────────────

    SendOptions:
      type: object
      additionalProperties: true
      description: |
        Per-call options forwarded verbatim to the Claude Agent SDK (or the
        AI SDK dispatch path for non-Anthropic providers). Unrecognised
        fields ride along under `extra` (serde flatten). `null` is rejected
        for optional fields — use `undefined`/missing instead, otherwise the
        SDK's option parser crashes with "Cannot read properties of null".
      properties:
        cwd: { type: string }
        model: { type: string }
        fallbackModel: { type: string }
        systemPrompt:
          {
            type: string,
            description: "Replaces the SDK default system prompt. Mutually exclusive with appendSystemPrompt.",
          }
        appendSystemPrompt:
          {
            type: string,
            description: "Appended to the SDK default. Mutually exclusive with systemPrompt.",
          }
        allowedTools: { type: array, items: { type: string } }
        disallowedTools: { type: array, items: { type: string } }
        additionalDirectories: { type: array, items: { type: string } }
        permissionMode: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        mcpServers:
          type: object
          additionalProperties: true
          description: Per-name MCP server config map; forwarded to the SDK verbatim.
        maxTurns: { type: integer, minimum: 1, maximum: 100 }
        includePartialMessages: { type: boolean }
        settingSources:
          type: array
          items: { type: string, enum: [user, project, local] }
        agents:
          type: object
          additionalProperties: true
          description: Dynamic subagent definitions keyed by name.
        strictMcpConfig:
          type: boolean
          description: When true, only `mcpServers` from this object are loaded — settings.json is ignored.
        effort:
          type: string
          enum: [low, medium, high, xhigh, max]
        resumeSessionId:
          {
            type: string,
            description: "Resume an existing SDK session by id. Mutually exclusive with forkFromSessionId.",
          }
        forkFromSessionId:
          { type: string, description: "Fork a new branch from an existing SDK session id." }
        provider:
          type: string
          description: |
            Provider id this turn dispatches against. `null`/missing or
            `"anthropic"` keeps the Claude Agent SDK path; any other value
            (`openai`, `google`, `mistral`, `cohere`, `openrouter`, custom)
            flows through the AI SDK dispatcher.
        providerCredentials: { $ref: "#/components/schemas/ProviderCredentials" }
        aliasResolution:
          type: object
          additionalProperties: true
          description: Renderer-side metadata; the sidecar ignores this.
        routingDecision:
          type: object
          additionalProperties: true

    ProviderCredentials:
      type: object
      additionalProperties: false
      properties:
        apiKey: { type: string }
        baseUrl: { type: string }
        protocol:
          type: string
          enum: [openai, anthropic, google, mistral, cohere]
          description: AI SDK protocol family (required for custom provider ids).

    SidecarStatus:
      type: object
      required: [ready]
      additionalProperties: false
      properties:
        ready: { type: boolean }

    # ── Subscription credential ──────────────────────────────────────────────

    SubscriptionCredential:
      type: object
      required: [accessToken, refreshToken, expiresAtMs, mode]
      additionalProperties: false
      properties:
        accessToken: { type: string, description: "OAuth bearer token. Treat as secret." }
        refreshToken:
          {
            type: string,
            description: "Long-lived refresh token. May rotate on every refresh — persist the latest.",
          }
        expiresAtMs: { type: integer, format: int64 }
        mode:
          type: string
          enum: [subscription, console]
          description: '"subscription" = Pro/Max, "console" = API billing.'
        scope: { type: string }
        email: { type: string, format: email }
        plan: { type: string, description: "pro | max | team | console (provider may not return)." }
        storedAtMs: { type: integer, format: int64, description: "Last-write timestamp." }

    # ── Multi-agent config ───────────────────────────────────────────────────

    AgentReadResult:
      type: object
      required: [exists, writable, format, raw, parsed]
      additionalProperties: false
      properties:
        path: { oneOf: [{ type: string }, { type: "null" }] }
        exists: { type: boolean }
        writable: { type: boolean }
        format: { type: string, enum: [json, jsonc, toml] }
        raw: { type: string }
        parsed:
          description: Canonical JSON tree, or null when the file is missing or unparseable.
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: array, items: {} }
            - { type: string }
            - { type: number }
            - { type: boolean }
            - { type: "null" }
        parseError: { type: string, description: "Filled when exists=true but parse failed." }

    AgentWriteResult:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string }
        backupPath:
          {
            type: string,
            description: "`.bak` next to the original. Null when the file did not exist before.",
          }

    # ── Skills ───────────────────────────────────────────────────────────────

    NativeSkillResource:
      type: object
      required: [kind, path, name, content, encoding, size]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [script, reference, asset] }
        path: { type: string, description: "Relative to the skill directory." }
        name: { type: string }
        content:
          { type: string, description: "UTF-8 or base64-encoded; encoding given in `encoding`." }
        encoding: { type: string, enum: [utf-8, base64] }
        mimeType: { type: string }
        size: { type: integer, format: int64 }

    NativeSkill:
      type: object
      required: [dirName, filePath, content, resources]
      additionalProperties: false
      properties:
        dirName:
          { type: string, description: "Directory name under ~/.claude/skills/ (kebab-case slug)." }
        filePath: { type: string, description: "Absolute path to SKILL.md." }
        content: { type: string, description: "Raw SKILL.md including YAML frontmatter." }
        resources:
          type: array
          items: { $ref: "#/components/schemas/NativeSkillResource" }

    InstallSkillRequest:
      type: object
      required: [dirName, content, resources, clean]
      additionalProperties: false
      properties:
        dirName: { type: string }
        content: { type: string, description: "Serialised SKILL.md including YAML frontmatter." }
        resources:
          type: array
          items: { $ref: "#/components/schemas/NativeSkillResource" }
        clean:
          type: boolean
          description: When true, blow away pre-existing files in the directory before writing.

    InstallSkillResponse:
      type: object
      required: [directory, writtenFiles]
      additionalProperties: false
      properties:
        directory: { type: string }
        writtenFiles:
          type: array
          items: { type: string }

    RegistryEntry:
      type: object
      required: [id, source, sourceType]
      additionalProperties: false
      properties:
        id: { type: string }
        source: { type: string }
        sourceType: { type: string }
        skillPath: { type: string }
        computedHash: { type: string }
        displayName: { type: string }
        description: { type: string }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        author: { type: string }
        iconUrl: { type: string }
        rawSkillUrl: { type: string }

    # ── Native plugin gateway ────────────────────────────────────────────────

    PluginApiInvokeRequest:
      type: object
      required: [sdkVersion, pluginId, requestId, api, payload]
      additionalProperties: false
      properties:
        sdkVersion: { type: string }
        pluginId: { type: string }
        requestId: { type: string }
        api: { type: string, pattern: "^[^:]+:[^:]+$" }
        payload: {}
        timeoutMs: { type: integer, minimum: 1 }
        context: {}

    PluginApiError:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            [
              INVALID_REQUEST,
              PERMISSION_REQUIRED,
              PERMISSION_DENIED,
              NOT_SUPPORTED,
              NOT_FOUND,
              CONFLICT,
              TIMEOUT,
              INCOMPATIBLE_SDK,
              INTERNAL,
            ]
        message: { type: string }
        details: {}

    PluginApiCompat:
      type: object
      required: [sdkVersion, minSupportedSdk, compatible]
      additionalProperties: false
      properties:
        sdkVersion: { type: string }
        minSupportedSdk: { type: string }
        compatible: { type: boolean }

    PluginApiInvokeResponse:
      type: object
      required: [requestId, success, runtimeVersion, compat]
      additionalProperties: false
      properties:
        requestId: { type: string }
        success: { type: boolean }
        data: {}
        error: { $ref: "#/components/schemas/PluginApiError" }
        runtimeVersion: { type: string }
        compat: { $ref: "#/components/schemas/PluginApiCompat" }

    PluginApiBatchItem:
      type: object
      required: [requestId, api, payload]
      additionalProperties: false
      properties:
        requestId: { type: string }
        api: { type: string, pattern: "^[^:]+:[^:]+$" }
        payload: {}
        timeoutMs: { type: integer, minimum: 1 }
        context: {}

    PluginApiBatchRequest:
      type: object
      required: [sdkVersion, pluginId, requests]
      additionalProperties: false
      properties:
        sdkVersion: { type: string }
        pluginId: { type: string }
        strategy: { type: string, enum: [continueOnError, abortOnError] }
        requests:
          type: array
          items: { $ref: "#/components/schemas/PluginApiBatchItem" }

    PluginApiBatchResponse:
      type: object
      required: [success, results]
      additionalProperties: false
      properties:
        success: { type: boolean }
        results:
          type: array
          items: { $ref: "#/components/schemas/PluginApiInvokeResponse" }

    PluginApiCapability:
      type: object
      required: [api, supported, highRisk, requiredPermissions]
      additionalProperties: false
      properties:
        api: { type: string }
        supported: { type: boolean }
        highRisk: { type: boolean }
        requiredPermissions: { type: array, items: { type: string } }

    # ── MCP ──────────────────────────────────────────────────────────────────

    McpServerStatus:
      type: object
      required: [running]
      additionalProperties: false
      properties:
        running: { type: boolean }
        port: { type: integer, format: int32, minimum: 0, maximum: 65535 }
        startedAt: { type: string, format: date-time, description: "ISO-8601." }

    McpServerLifecycleRequest:
      type: object
      required: [port, token, settingsJson]
      additionalProperties: false
      properties:
        port: { type: integer, minimum: 0, maximum: 65535 }
        token: { type: string, minLength: 32 }
        settingsJson: { type: string, description: Serialized ExternalBridgeSettings snapshot. }
        sidecarPath:
          {
            type: string,
            deprecated: true,
            description: Legacy local-Tauri hint; ignored by the headless Companion facade,
            which resolves the packaged host sidecar.,
          }

    McpTestResult:
      type: object
      required: [ok, tool_count, tools, duration_ms]
      additionalProperties: false
      properties:
        ok: { type: boolean }
        tool_count: { type: integer, minimum: 0 }
        tools:
          type: array
          items: { $ref: "#/components/schemas/McpToolInfo" }
        error: { type: string }
        duration_ms: { type: integer, minimum: 0 }

    McpToolInfo:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }

    # ── WebSocket frames ─────────────────────────────────────────────────────

    EventFrame:
      type: object
      required: [type, seq, payload, ts_ms]
      additionalProperties: false
      properties:
        type:
          type: string
          description: |
            Tauri event channel name. Common values:
            `claude://message`, `claude://tool-use`, `claude://approval-request`,
            `claude://session-state`, `companion://device-seen`,
            `connectors://webhook/<adapter_id>`, `workflow:trigger`,
            `workflow:run-state`. The set is open-ended.
        seq:
          {
            type: integer,
            format: int64,
            minimum: 1,
            description: "Monotonically increasing sequence number.",
          }
        payload:
          description: Arbitrary JSON payload from the Tauri event.
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: array, items: {} }
            - { type: string }
            - { type: number }
            - { type: boolean }
            - { type: "null" }
        ts_ms: { type: integer, format: int64, description: "Publish timestamp (ms epoch)." }

    PingFrame:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [ping] }

    ResyncRequiredFrame:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [resync_required] }
