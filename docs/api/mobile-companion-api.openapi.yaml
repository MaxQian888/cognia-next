  /api/v1/_rpc/skill_set_enabled:
    post:
      operationId: rpcSkillSetEnabled
      tags: [rpc-data]
      summary: Enable or disable a skill (maps to status enabled/disabled).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, enabled]
              properties:
                id: { type: string }
                enabled: { type: boolean }
      responses:
        "200":
          { description: Applied., content: { application/json: { schema: { type: "null" } } } }
        "400":
          {
            description: missing id or non-boolean enabled,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: renderer error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/plugin_set_enabled:
    post:
      operationId: rpcPluginSetEnabled
      tags: [rpc-data]
      summary: Enable or disable a plugin (live).
      description: |
        Drives the live PluginManager — enabling resolves and auto-enables
        required dependencies, loads the plugin, and registers its
        contributions; disabling unloads it and unregisters contributions. The
        enabled state is persisted, so it survives a reload. A genuine enable
        failure (e.g. a missing/disabled required dependency) returns 500 with
        the error; it does not silently leave the flag flipped. When no live
        manager is available (headless deployment) the call falls back to
        persisting the flag for the next load.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, enabled]
              properties:
                id: { type: string }
                enabled: { type: boolean }
      responses:
        "200":
          { description: Applied., content: { application/json: { schema: { type: "null" } } } }
        "400":
          {
            description: missing id or non-boolean enabled,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: renderer error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/adapter_update_policy:
    post:
      operationId: rpcAdapterUpdatePolicy
      tags: [rpc-data]
      summary: Patch a connector adapter's outbound policy.
      description: Per-field patch. `quietHours:null` clears the existing window; omitted fields are left unchanged.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                defaultMode: { type: string, enum: [auto, manual, draft] }
                muted: { type: boolean }
                quietHours:
                  type: [object, "null"]
                  properties:
                    from: { type: string }
                    to: { type: string }
                    tz: { type: string }
      responses:
        "200":
          { description: Applied., content: { application/json: { schema: { type: "null" } } } }
        "400":
          {
            description: missing id,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: renderer error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/app_settings_update:
    post:
      operationId: rpcAppSettingsUpdate
      tags: [rpc-data]
      summary: Patch user-facing AppSettings. Keys are allowlisted server-side.
      description: |
        Only the mobile-editable subset of AppSettings keys is accepted (theme,
        fontScale, language, appearance, WebRTC config, agent defaults such as
        permissionMode / defaultSystemPrompt / bareMode, etc.). A non-allowlisted
        key (credentials, transport, sidecar config) or a non-object patch
        returns `400 validation_failed`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patch]
              properties:
                patch:
                  type: object
                  additionalProperties: true
                  description: "Allowlisted AppSettings keys only."
                  propertyNames:
                    # BEGIN GENERATED settings-sync
                    enum:
                      - a11y
                      - accentColor
                      - activeCustomThemeId
                      - activePluginThemeId
                      - autoMode
                      - bareMode
                      - briefMode
                      - cartesiaVoice
                      - colorTheme
                      - compaction
                      - composerBehavior
                      - conversationSidebar
                      - conversationTimeline
                      - conversationTitle
                      - customCss
                      - customCssEnabled
                      - customThemes
                      - debugMode
                      - deepgramVoice
                      - defaultMaxThinkingTokens
                      - defaultModel
                      - defaultSearchProvider
                      - defaultSystemPrompt
                      - density
                      - edgeVoice
                      - elevenlabsVoice
                      - fontScale
                      - geminiVoice
                      - humeVoice
                      - importedVscodeThemes
                      - instructions
                      - language
                      - lastInboxViewedAt
                      - lmntVoice
                      - mistralVoiceId
                      - mobileComputerUseEnabled
                      - motion
                      - notificationPreferences
                      - openaiVoice
                      - permissionMode
                      - pinnedWorkflowIds
                      - profile
                      - radius
                      - reduceMotion
                      - searchEnabled
                      - searchFallbackEnabled
                      - searchMaxResults
                      - sidebarLayout
                      - streamPartialMessages
                      - sttLanguage
                      - surfaceSkillsEnabled
                      - systemVoice
                      - telemetryEnabled
                      - theme
                      - ttsAutoPlay
                      - ttsEnabled
                      - ttsPitch
                      - ttsProvider
                      - ttsRate
                      - ttsVolume
                      - typographyExt
                      - wallpapers
                      - xiaomiVoice
                    # END GENERATED settings-sync
            examples:
              theme: { value: { patch: { theme: "dark" } } }
      responses:
        "200":
          description: The persisted settings.
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings: { type: object, additionalProperties: true }
        "400":
          {
            description: validation_failed — non-allowlisted key or non-object patch,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: renderer error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  # ─────────────────────────────────────────────────────────────────────────
  # rpc — twin
  # ─────────────────────────────────────────────────────────────────────────

  /api/v1/_rpc/twin_profile_get:
    post:
      operationId: rpcTwinProfileGet
      tags: [rpc-twin]
      summary: Read a Digital Twin profile by id.
      description: Read-only — skips the idempotency cache. Routed through desktop_writes_bridge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [twinId]
              properties:
                twinId: { type: string }
      responses:
        "200":
          description: "The profile, or `{ profile: null }` when absent."
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { type: [object, "null"], additionalProperties: true }
        "400":
          {
            description: missing twinId,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: renderer error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/external_agent_list:
    post:
      operationId: rpcExternalAgentList
      tags: [rpc-data]
      summary: List the desktop's configured external agents.
      description: |
        Read-only projection of the desktop's external-agent config (which
        lives in a Zustand/localStorage store, not Dexie, so there is no sync
        mirror). Skips the idempotency cache. Routed through
        desktop_writes_bridge. Powers the mobile `/me/external-agents` page.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: The configured external agents.
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items:
                      type: object
                      required: [id, name, protocol, transport, enabled, defaultPermissionMode]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        protocol: { type: string }
                        transport: { type: string }
                        enabled: { type: boolean }
                        defaultPermissionMode: { type: string }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: renderer error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/external_agent_update:
    post:
      operationId: rpcExternalAgentUpdate
      tags: [rpc-data]
      summary: Enable/disable an external agent or change its permission mode.
      description: |
        Patches the desktop external-agent config. `enabled` toggles the agent
        on/off; `defaultPermissionMode` is clamped on the desktop to what the
        agent's protocol can enforce (never escalated past it). At least one
        editable field must be present. Routed through desktop_writes_bridge.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, patch]
              properties:
                id: { type: string }
                patch:
                  type: object
                  properties:
                    enabled: { type: boolean }
                    defaultPermissionMode:
                      type: string
                      enum: [default, acceptEdits, bypassPermissions, plan, dontAsk]
      responses:
        "200":
          description: The updated agent projection, or null when missing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { type: [object, "null"], additionalProperties: true }
        "400":
          {
            description: missing id/patch or no editable fields,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: renderer error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/spawn_external_agent:
    post:
      operationId: rpcSpawnExternalAgent
      tags: [rpc-control]
      summary: Spawn an external agent process on the headless server (service scope only).
      description: |
        ADR-0059 R11. RCE-grade by construction, so the arm is triple-gated:
        the JWT must carry the headless brain's `service` scope (loopback-
        minted; a device JWT gets 403), the spawn request must clear the
        preset-only SpawnPolicy allowlist (agent-CLI binaries, allowlisted
        npx packages, workspace-rooted cwd, default-deny env), and every
        decision — allow AND deny — is appended to the server audit log.
        Unavailable on desktop installs.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config:
                  type: object
                  required: [id, command]
                  properties:
                    id: { type: string }
                    command: { type: string }
                    args: { type: array, items: { type: string } }
                    env: { type: object, additionalProperties: { type: string } }
                    cwd: { type: [string, "null"] }
      responses:
        "200":
          description: The spawned agent id.
          content:
            application/json:
              schema: { type: string }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403":
          {
            description: device-scope token or SpawnPolicy denial,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "503":
          {
            description: not a headless install,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/send_to_external_agent:
    post:
      operationId: rpcSendToExternalAgent
      tags: [rpc-control]
      summary: Write one line to a spawned external agent's stdin (service scope only).
      description: |
        ADR-0059 R11. Service-scope companion of `spawn_external_agent`;
        audited. Unavailable on desktop installs.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, message]
              properties:
                agent_id: { type: string }
                message: { type: string }
      responses:
        "200":
          {
            description: Line written.,
