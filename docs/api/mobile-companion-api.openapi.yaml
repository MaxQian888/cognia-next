  /api/v1/_rpc/terminal_exec:
    post:
      operationId: rpcTerminalExec
      tags: [rpc-terminal]
      summary: Run a one-shot command and capture output.
      description: |
        Arbitrary code execution on the host. Bounded by `timeoutMs` (default
        120000, max 600000); on timeout the child is killed and `timedOut` is
        set. Device tokens require allowRemoteControl; the loopback-only
        headless service token is authorized directly. The child inherits the
        host process environment plus `env`.
        With `shell: true`, `command` is a complete shell line run via the
        platform shell (`cmd /C` / `sh -c`) — `args` must be empty then.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [command],
                    properties:
                      {
                        command: { type: string },
                        args: { type: array, items: { type: string } },
                        cwd: { type: string },
                        env: { type: object, additionalProperties: { type: string } },
                        timeoutMs: { type: integer },
                        shell: { type: boolean },
                      },
                  },
              },
          }
      responses:
        "200":
          {
            description: Captured stdout/stderr/exit.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [stdout, stderr, timedOut],
                        properties:
                          {
                            stdout: { type: string },
                            stderr: { type: string },
                            exitCode: { type: integer, nullable: true },
                            timedOut: { type: boolean },
                          },
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

