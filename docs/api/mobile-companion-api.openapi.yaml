  # ─────────────────────────────────────────────────────────────────────────
  # WebSocket — events
  # ─────────────────────────────────────────────────────────────────────────

  /ws/v1/events:
    get:
      operationId: wsEvents
      tags: [events]
      summary: WebSocket upgrade — live Tauri event bridge.
      description: |
        WebSocket bridge from internal Tauri events to mobile clients.
        OpenAPI 3.1 does not formally describe WebSocket protocols; the
        upgrade endpoint is documented here as an HTTP `GET` whose 101
        response transitions to a WS connection. Frame-level details live
        in the `x-websocket` extension on this operation.

        ## Auth

        `Authorization: Bearer <jwt>` is preferred; browsers cannot
        reliably set arbitrary headers on a `new WebSocket()` upgrade, so
        the middleware also accepts `?token=<jwt>` as a fallback. If both
        are present, the header wins.

        ## Lifecycle

        1. Client opens `wss://<host>/ws/v1/events?token=<jwt>&since=<seq>`.
        2. If `since` is older than the oldest retained frame, the server
           sends `{ "type": "resync_required" }` and closes immediately.
        3. Otherwise the server replays every retained frame with `seq > since`.
        4. New frames stream as JSON text frames as they arrive.
        5. Server sends `{ "type": "ping" }` heartbeats every **25 s**.
        6. Server closes if no client frame is received for **90 s** (idle timeout).
        7. Slow subscribers that overflow the 256-slot broadcast channel
           (`tokio::sync::broadcast`) are dropped with a `Lagged` close.

        ## Replay window

        The server keeps a ring buffer of the **last 200 frames** and
        evicts anything older than **60 s**. A client whose `since` cursor
        falls outside both bounds receives `resync_required` and must
        re-bootstrap state via a `sync_pull` walk.
      parameters:
        - in: query
          name: token
          required: false
          description: |
            Device JWT. Optional only when `Authorization: Bearer` is present.
            For browser-side WebSocket clients this query parameter is the
            standard way to authenticate the upgrade.
          schema: { type: string }
        - in: query
          name: since
          required: false
          description: Last sequence number the client received. Omit (or pass 0) for a fresh subscription with no replay.
          schema: { type: integer, format: int64, minimum: 0 }
        - in: header
          name: Upgrade
          required: true
          schema: { type: string, enum: [websocket] }
        - in: header
          name: Connection
          required: true
          schema: { type: string, enum: [Upgrade] }
        - in: header
          name: Sec-WebSocket-Key
          required: true
          schema: { type: string }
        - in: header
          name: Sec-WebSocket-Version
          required: true
          schema: { type: string, enum: ["13"] }
      responses:
        "101":
          description: |
            Switching protocols — the connection is now a WebSocket. Subsequent
            text frames carry one of the schemas under `content` (server → client)
            or `WsClientFrame` (client → server).
          headers:
            Upgrade: { schema: { type: string, enum: [websocket] } }
            Connection: { schema: { type: string, enum: [Upgrade] } }
            Sec-WebSocket-Accept: { schema: { type: string } }
          content:
            application/json:
              schema:
                description: |
                  Discriminated union of every server-emitted text frame. After the
                  upgrade, the WebSocket carries text frames whose JSON body matches
                  one of these shapes.
                oneOf:
                  - { $ref: "#/components/schemas/EventFrame" }
                  - { $ref: "#/components/schemas/PingFrame" }
                  - { $ref: "#/components/schemas/ResyncRequiredFrame" }
        "200":
          description: |
            Synthetic 2xx documenting the WebSocket message contract. The router never
            actually returns a 200 for `/ws/v1/events` — clients receive 101 on success
            or 401/426 on failure. This entry exists so OpenAPI tooling that requires a
            2xx response per operation can find one.
          content:
            application/json:
              schema:
                description: |
                  Frames the server may send during the lifetime of an open WebSocket.
                oneOf:
                  - { $ref: "#/components/schemas/EventFrame" }
                  - { $ref: "#/components/schemas/PingFrame" }
                  - { $ref: "#/components/schemas/ResyncRequiredFrame" }
        "401":
          $ref: "#/components/responses/JwtRejected"
        "426":
          description: Upgrade required — issued when the request is not a valid WS upgrade.
      x-websocket:
        subprotocol: null
        heartbeat:
          serverInterval: 25s
          clientIdleTimeout: 90s
        replay:
          ringBufferSize: 200
          retentionMs: 60000
          broadcastSlots: 256
          lagBehavior: close
        outboundFrames:
          - name: EventFrame
            description: A live event forwarded from the Tauri event emitter.
            schema: { $ref: "#/components/schemas/EventFrame" }
          - name: PingFrame
            description: Heartbeat sent every 25 s.
            schema: { $ref: "#/components/schemas/PingFrame" }
          - name: ResyncRequiredFrame
            description: Sent when the client's `since` cursor is older than the retained ring buffer; followed by an immediate close.
            schema: { $ref: "#/components/schemas/ResyncRequiredFrame" }
        inboundFrames:
          - name: AnyTextOrPong
            description: |
              Any text or pong frame the client sends resets the idle timer.
              The server does not require the client to echo a particular
              shape; sending an empty `{}` every 30 s is sufficient. Binary
              frames are silently ignored.
            schema:
              oneOf:
                - { type: object, additionalProperties: true }
                - { type: string }

