                session_id: { type: string }
                limit: { type: integer, minimum: 0 }
                offset: { type: integer, minimum: 0 }
            examples:
              page: { value: { session_id: "s_123", limit: 50, offset: 0 } }
      responses:
        "200":
          description: A page of messages (shape owned by the data plane, forwarded verbatim).
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        "400":
          {
            description: missing session_id,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }

  /api/v1/_rpc/message_send:
