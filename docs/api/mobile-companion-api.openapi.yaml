  # ─────────────────────────────────────────────────────────────────────────
  # rpc — connectors (mobile outbound queue)
  # ─────────────────────────────────────────────────────────────────────────

  /api/v1/_rpc/connector_send:
    post:
      operationId: rpcConnectorSend
      tags: [rpc-connectors]
      summary: Insert a user-authored message into a session (share-target path).
      description: |
        Despite the `connector_send` name (kept for wire compatibility with the
        mobile outbound-queue command set), this does **NOT** transmit anything
        to an external connector platform. It appends a `role: "user"` message
        to the named local chat session — the OS share-target flow, where the
        phone hands a snippet of shared text/url to a selected conversation. It
        does not trigger an AI reply (use `claude_send` for that) and does not
        reach Slack/Telegram/etc. To deliver an outbound message through a
        connector, approve a pending draft via `connector_approve_draft`, which
        the desktop outbound runner then sends on the platform.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, segments]
              properties:
                sessionId: { type: string }
                segments:
                  type: array
                  description: "Content segments; `text` fields are concatenated."
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      text: { type: string }
      responses:
        "200":
          description: The created message id.
          content:
            application/json:
              schema:
                type: object
                required: [messageId]
                properties:
                  messageId: { type: string }
        "400":
          {
            description: missing sessionId,
            non-array segments,
            or empty text,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: renderer error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

