      description: Read-only — skips the idempotency cache.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limit, offset]
              properties:
                limit: { type: integer, minimum: 0 }
                offset: { type: integer, minimum: 0 }
                before:
                  { type: integer, description: "Optional ms-epoch upper bound (updatedAt <)." }
            examples:
              firstPage: { value: { limit: 50, offset: 0 } }
      responses:
        "200":
          description: A page of sessions. `next_offset` is set when more rows remain.
          content:
            application/json:
              schema:
                type: object
                required: [rows, total]
                properties:
                  rows: { type: array, items: { type: object, additionalProperties: true } }
                  total: { type: integer }
                  next_offset: { type: integer }
        "400":
          {
            description: missing limit/offset,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }

  /api/v1/_rpc/message_get_by_session:
    post:
