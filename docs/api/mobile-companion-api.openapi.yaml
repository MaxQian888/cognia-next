  # ─────────────────────────────────────────────────────────────────────────
  # rpc — workflow CRUD (ADR-0027 Wave 4.1). Routed through the desktop-writes
  # bridge. create/update/schedule are ungated; delete + cancel are gated.
  # ─────────────────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────────────────
  # rpc-ide — managed code-server lifecycle, proxy artifacts, and the
  # agent↔IDE broker. Lifecycle and proxy calls need a headless host; the
  # broker calls are reserved for the loopback service token.
  # ─────────────────────────────────────────────────────────────────────────

  /api/v1/_rpc/codeserver_supported:
    post:
      operationId: rpcCodeserverSupported
      tags: [rpc-ide]
      summary: Report whether this host's platform can run managed code-server (read-only).
      description: Resolves the download target for the current OS and architecture. Answers on every host, including desktop, and never starts anything.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200":
          {
            description: true when a managed code-server build exists for this platform.,
            content: { application/json: { schema: { type: boolean } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/codeserver_status:
    post:
      operationId: rpcCodeserverStatus
      tags: [rpc-ide]
      summary: Report the managed code-server state for one workspace root (read-only).
      description: Never spawns. Requires a headless host.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root]
              properties:
                root: { type: string }
      responses:
        "200":
          {
            description: Running flag,
            loopback port,
            and active profile.,
            content: { application/json: { schema: { type: object, additionalProperties: true } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "503":
          {
            description: not a headless install,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/codeserver_ensure:
    post:
      operationId: rpcCodeserverEnsure
      tags: [rpc-ide]
      summary: Ensure a healthy managed code-server is serving a workspace root. Requires allowRemoteControl.
      description: Downloads and installs the pinned build on first use, then spawns it bound to loopback. Returns the existing instance when one is already healthy. Requires a headless host.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root]
              properties:
                root: { type: string }
                profile: { type: string, enum: [managed, native] }
      responses:
        "200":
          {
            description: Running flag,
            loopback port,
            and active profile.,
            content: { application/json: { schema: { type: object, additionalProperties: true } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "503":
          {
            description: not a headless install,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/codeserver_stop:
    post:
      operationId: rpcCodeserverStop
      tags: [rpc-ide]
      summary: Stop the managed code-server serving one workspace root. Requires allowRemoteControl.
      description: Idempotent when already stopped. Requires a headless host.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root]
              properties:
                root: { type: string }
      responses:
        "200":
          {
            description: true when an instance was running and has been stopped.,
            content: { application/json: { schema: { type: boolean } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "503":
          {
            description: not a headless install,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/codeserver_stop_all:
    post:
      operationId: rpcCodeserverStopAll
      tags: [rpc-ide]
      summary: Stop every managed code-server instance on this host. Requires allowRemoteControl.
      description: Idempotent. Requires a headless host.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200":
          {
            description: All instances stopped.,
            content: { application/json: { schema: { type: "null" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "503":
          {
            description: not a headless install,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/codeserver_list_proxies:
    post:
      operationId: rpcCodeserverListProxies
      tags: [rpc-ide]
      summary: List built managed proxy extension artifacts (read-only, service scope only).
      description: Reserved for the loopback brain service token; device JWTs are rejected. Requires a headless host.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200":
          {
            description: Proxy artifact descriptors.,
            content:
              {
                application/json:
                  { schema: { type: array, items: { type: object, additionalProperties: true } } },
              },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403":
          {
            description: device-scope token,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "503":
          {
            description: not a headless install,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/codeserver_build_proxy:
    post:
      operationId: rpcCodeserverBuildProxy
      tags: [rpc-ide]
      summary: Build a managed proxy extension artifact (service scope only).
      description: Generates the .vsix that lets an existing VS Code extension reach Cognia's broker. Reserved for the loopback brain service token; device JWTs are rejected. Requires a headless host.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request]
              properties:
                request: { type: object, additionalProperties: true }
      responses:
        "200":
          {
            description: Built proxy artifact descriptor.,
