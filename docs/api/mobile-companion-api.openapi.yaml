  /api/v1/_rpc/plugin_stage_version:
    post:
      operationId: rpcPluginStageVersion
      tags: [rpc-plugin]
      summary: Download and stage a plugin version without activating it. Requires allowRemoteControl.
      description: Stages the update in a transaction; the returned transactionId is required by the commit / finalize / discard calls. Signature verification is enforced when requireSignature is set or the plugin already carries a trusted key.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pluginId, version, downloadUrl]
              properties:
                pluginId: { type: string }
                version: { type: string }
                downloadUrl: { type: string, format: uri }
                checksum: { type: string }
                signatureHex: { type: string }
                publicKeyHex: { type: string }
                requireSignature: { type: boolean }
      responses:
        "200":
          {
            description: Staged update descriptor,
            including its transactionId.,
            content: { application/json: { schema: { type: object, additionalProperties: true } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/plugin_commit_staged_update:
    post:
      operationId: rpcPluginCommitStagedUpdate
      tags: [rpc-plugin]
      summary: Swap a staged plugin version into place. Requires allowRemoteControl.
      description: Second phase of the staged update. The previous version is retained so finalize or discard can still be called.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pluginId, transactionId]
              properties:
                pluginId: { type: string }
                transactionId: { type: string }
      responses:
        "200":
          {
            description: Committed plugin runtime snapshot.,
            content: { application/json: { schema: { type: object, additionalProperties: true } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/plugin_finalize_staged_update:
    post:
      operationId: rpcPluginFinalizeStagedUpdate
      tags: [rpc-plugin]
      summary: Drop the retained previous version after a successful commit. Requires allowRemoteControl.
      description: Third phase of the staged update; after this the transaction can no longer be rolled back.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pluginId, transactionId]
              properties:
                pluginId: { type: string }
                transactionId: { type: string }
      responses:
        "200":
          { description: Finalized., content: { application/json: { schema: { type: "null" } } } }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/plugin_discard_staged_update:
    post:
      operationId: rpcPluginDiscardStagedUpdate
      tags: [rpc-plugin]
      summary: Roll back a staged or committed update. Requires allowRemoteControl.
      description: Restores the retained previous version and deletes the staged payload. Valid until the transaction is finalized.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pluginId, transactionId]
              properties:
                pluginId: { type: string }
                transactionId: { type: string }
      responses:
        "200":
          { description: Discarded., content: { application/json: { schema: { type: "null" } } } }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
