    post:
      operationId: rpcTerminalCompletePaths
      tags: [rpc-terminal]
      summary: File/dir path completion for a terminal fragment. Requires allowRemoteControl.
      description: |
        Lists `cwd`-resolved completion candidates for the path fragment under
        the remote client's cursor (mirrors the local desktop autocomplete
        provider). `cwd` is an unconfined absolute path, so — like
        `read_text_file` — this is gated behind the remote-control capability
        even though it is a pure read.
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [cwd, fragment],
                    properties:
                      {
                        cwd: { type: string },
                        fragment: { type: string },
                        showHidden: { type: boolean },
                        limit: { type: integer },
                      },
                  },
              },
          }
      responses:
        "200":
          {
            description: Ranked candidates (dirs first).,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items:
                          {
                            type: object,
                            required: [name, isDir],
                            properties: { name: { type: string }, isDir: { type: boolean } },
                          },
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/terminal_kill_port:
    post:
      operationId: rpcTerminalKillPort
      tags: [rpc-terminal]
      summary: Free a TCP port by killing its listener(s). Requires allowRemoteControl.
      description: |
        Best-effort "free port" quick fix — resolves the PID(s) listening on
        `port` (netstat on Windows, lsof elsewhere) and signals them. Returns
        the PIDs that were signalled, possibly empty.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [port],
                    properties: { port: { type: integer, minimum: 1, maximum: 65535 } },
                  },
              },
          }
      responses:
        "200":
          {
            description: Signalled PIDs.,
            content: { application/json: { schema: { type: array, items: { type: integer } } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

