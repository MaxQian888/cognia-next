            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/automation_consent_respond:
    post:
      operationId: rpcAutomationConsentRespond
      tags: [rpc-remote-control]
      summary: Resolve a host computer-use consent prompt from this device.
      description: |
        Resolves the pending automation ConsentBroker request whose
        `automation:consent-request` frame streamed over `/ws/v1/events`.
        First-responder wins (desktop overlay or any attached device).
        Distinct from `claude_approve`, which resolves Claude SDK tool-use
        prompts. Requires the `allowRemoteControl` capability.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, allow]
              properties:
                id:
                  { type: string, description: "Broker request id from the consent-request frame." }
                allow: { type: boolean }
                persist:
                  {
                    type: boolean,
                    description: "Remember the allow/deny for this session's matching tuple.",
                  }
                prompt:
                  description: "Optional prompt echo so a persisted grant keys on the right tuple."
                  oneOf:
                    - type: object
                      additionalProperties: true
                    - type: "null"
      responses:
        "200":
          { description: Resolved., content: { application/json: { schema: { type: "null" } } } }
        "400":
          {
            description: malformed args,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "500":
          {
            description: internal error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

  /api/v1/_rpc/companion_can_control:
    post:
      operationId: rpcCompanionCanControl
      tags: [rpc-remote-control]
      summary: Probe whether this device holds the remote-control capability.
      description: |
        Read-only — skips the idempotency cache. Reports whether the calling
        device may issue control RPCs (e.g. `automation_consent_respond`,
        `session_attach`). The mobile shell calls this once so observe-only
        devices hide control affordances (the computer-use consent sheet)
        instead of surfacing a prompt that 403s on tap. NOT gated by
        `allowRemoteControl` — every paired device may query its own standing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "Empty body." }
            examples:
              empty: { value: {} }
      responses:
        "200":
          description: Capability snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [allowed]
                properties:
                  allowed:
                    { type: boolean, description: "True when this device may issue control RPCs." }
              examples: { allowed: { value: { allowed: true } } }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "500":
          {
            description: internal error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

