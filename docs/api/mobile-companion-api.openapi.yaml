  /api/v1/_rpc/plugin_install:
    post:
      operationId: rpcPluginInstall
      tags: [rpc-plugin]
      summary: Install a plugin from a source descriptor. Requires allowRemoteControl.
      description: |
        `payload.manifestJson` is required: the backend validates it before any
        disk write — it must be valid JSON, its `id` must equal `pluginId`, and
        its `version` must be non-empty. A manifest-less, malformed, or
        id-mismatched install is rejected (no plugin directory is created).
        Signature verification stays renderer-side and is config-gated (off by
        default). The install persists the on-disk plugin + Rust snapshot. On a
        headless server, cognia-server publishes `plugin://runtime-changed` and
        the Node brain refreshes the canonical PluginManager serially. On a
        desktop companion host, the renderer observes the new plugin after its
        next reload.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pluginId, source, payload]
              properties:
                pluginId: { type: string }
                source: { type: string }
                payload:
                  type: object
                  required: [manifestJson]
                  properties:
                    manifestJson:
                      type: string
                      description: "Plugin manifest JSON. Must parse, declare an `id` equal to `pluginId`, and a non-empty `version`."
      responses:
        "200":
          {
            description: Installed snapshot.,
            content: { application/json: { schema: { type: object, additionalProperties: true } } },
          }
        "401": { $ref: "#/components/responses/JwtRejected" }
        "403": { $ref: "#/components/responses/RemoteControlForbidden" }
        "500":
          {
            description: error,
            content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } },
          }

