  # event to its Node brain; a desktop host still applies the change on renderer
  # reload because its PluginManager belongs to that renderer process.
  # ─────────────────────────────────────────────────────────────────────────

  /api/v1/_rpc/plugin_list:
    post:
      operationId: rpcPluginList
      tags: [rpc-plugin]
      summary: List installed plugin runtime snapshots (read-only).
