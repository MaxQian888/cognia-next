openapi: 3.1.0
info:
  title: Cognia Remote Control — local task / event bridge
  version: "0.1.0"
  license:
    name: MIT
    identifier: MIT
  summary: Loopback HTTP listener that lets local automation scripts trigger scheduler tasks and emit Tauri events.
  description: |
    Local axum HTTP server that accepts task triggers and event emissions
    from same-machine automation (cron jobs, IDE tasks, custom scripts)
    and forwards them into the Tauri event bus where the renderer's
    scheduler / event listeners pick them up.

    ## Bind strategy

    The listener **always** binds `127.0.0.1`. The IPv4 allowlist is a
    defence-in-depth check; IPv6 callers must arrive through an
    IPv4-mapped address (`::ffff:127.0.0.1`) and are mapped through
    `to_canonical` before allowlist comparison. Pure IPv6 callers are
    rejected with 403.

    ## Auth

    `Authorization: Bearer <token>` — constant-time compared via
    `subtle::ConstantTimeEq`. The token is rotated through a Tauri
    command; the server is restarted on rotation.

    ## Allowlist

    The renderer-side `RemoteControlInboundConfig.allowlist` is a list of
    CIDR strings (`127.0.0.1/32`, `192.168.0.0/16`, …). Defaults to
    `["127.0.0.1/32"]`. Requests from outside the allowlist return 403
    *before* the bearer check runs.

    ## Rate limit

    Per-token fixed-window rate limiter (default 60 requests / minute).
    Exceeding the budget returns 429.

    ## Body limit

    8 KiB (`tower_http::limit::RequestBodyLimitLayer`) — these endpoints
    accept tiny payloads only.

servers:
  - url: http://127.0.0.1:{port}
    description: Loopback bind (the only bind option).
    variables:
      port:
        default: "47821"
        description: Default port; configurable via `RemoteControlInboundConfig.port`.

tags:
  - name: health
    description: Liveness probe.
  - name: tasks
    description: Trigger a configured scheduler task to run now.
  - name: events
    description: Emit a Tauri event into the renderer.
  - name: commands
    description: Dispatch a generic subsystem command (workflow / goal / team / plan / chat / connector).
  - name: reads
    description: GET read surface (catalog + run status). Reachable by a `read`-capability token.

security:
  - bearerAuth: []

paths:
  /api/v1/health:
    get:
      operationId: remoteControlHealth
      tags: [health]
      summary: Liveness probe.
      description: |
        Exempted from auth, allowlist, and rate limit. (Implementation
        note: in the current build the middleware is applied to all
        routes; loopback origins are always allowed by the default
        allowlist, so the practical effect is the same — `/api/v1/health`
        is reachable by anyone the listener is reachable by.)

        ## IPC payloads documented for reference

        Successful calls to `POST /api/v1/tasks/{id}/run` and
        `POST /api/v1/events` cause the server to emit Tauri events
        (`remote-control://run-task` and `remote-control://emit-event`)
        whose payloads follow [`RunTaskEvent`](#/components/schemas/RunTaskEvent)
        and [`EmitEvent`](#/components/schemas/EmitEvent). Renderer-side
        configuration follows
        [`RemoteControlInboundConfig`](#/components/schemas/RemoteControlInboundConfig);
        live status is [`RemoteControlStatus`](#/components/schemas/RemoteControlStatus).
      security: []
      responses:
        "200":
          description: Server is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
              examples:
                ok: { value: { ok: true, version: "0.1.0" } }

  /api/v1/tasks/{id}/run:
    post:
      operationId: runTask
      tags: [tasks]
      summary: Trigger a scheduler task by id.
      description: |
        Emits the `remote-control://run-task` Tauri event. The renderer's
        scheduler subscriber matches the `task_id` against its own task
        registry and calls `runTaskNow` (or surfaces "unknown task" in
        the audit log). The HTTP response is 202 the moment the event is
        emitted — completion of the task itself is not awaited.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Logical task id matching a renderer-side scheduler task.
      requestBody:
        required: false
        description: Optional payload forwarded into the task as `RunTaskEvent.payload`. Default `{}`.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriggerTaskRequestBody" }
            examples:
              empty: { value: {} }
              withPayload:
                value:
                  payload: { reason: "scheduled re-index", source: "cron" }
      responses:
        "202":
          description: Event emitted; renderer will run the task asynchronously.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedResponse" }
              examples:
                accepted: { value: { accepted: true } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: Tauri event emit failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
              examples: { fail: { value: { error: "emit failed" } } }

  /api/v1/events:
    post:
      operationId: emitEvent
      tags: [events]
      summary: Emit a Tauri event with arbitrary type and data.
      description: |
        Emits the `remote-control://emit-event` Tauri event. The renderer
        subscriber forwards it into its own event bus. `eventType` is
        required and trimmed; empty values return 400.

        Returns 202 the moment the Tauri emit succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmitEventRequestBody" }
            examples:
              minimal:
                value: { eventType: "system.alarm" }
              full:
                value:
                  eventType: "tray.click"
                  eventSource: "external-cli"
                  data: { which: "tray-icon-2", at: 1714900000000 }
      responses:
        "202":
          description: Event emitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedResponse" }
        "400":
          description: Missing body or empty `eventType`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
              examples:
                missing: { value: { error: "request body required" } }
                empty: { value: { error: "eventType required" } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: Tauri event emit failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }

  /api/v1/commands/{target}:
    post:
      operationId: runCommand
      tags: [commands]
      summary: Dispatch a generic subsystem command by target.
      description: |
        Emits the `remote-control://command` Tauri event. The renderer's
        dispatch registry (`lib/remote-control/dispatch.ts`) routes by `target`
        into each subsystem's existing headless run entry and returns a
        `RemoteCommandResult` that is recorded in the durable audit log and the
        `remoteControlRunStatus` projection — poll `GET /api/v1/runs/{runId}`
        for the outcome.

        Unknown targets are rejected with 404 *before* the event is emitted, so
        a typo never fires a dead event. The server-generated `runId` is
        returned in the 202 body for correlation.

        ## Idempotency

        Supply an `Idempotency-Key` header to make a retry safe: a replay within
        the TTL returns the original `runId` (and an `idempotent-replayed: true`
        response header) without re-dispatching. A cron/CI double-fire therefore
        does not double-execute.

        ## Capability + sensitivity

        Requires a `write` token. A subset of targets (see
        [`SENSITIVE_TARGETS`](#/components/schemas/RemoteCommandTarget)) cause
        model-cost, outbound, or host-command side effects (`chat.send`,
        `connector.send`, `goal.create`, `terminal.exec`) and additionally
        require `RemoteControlInboundConfig.allowSensitiveTargets = true`, else
        403. `terminal.exec` is further gated by the renderer's
        `settings.terminal.allowUnattendedExecution` master switch + command
        safety classifier — only the exit status is surfaced, never stdout.
      parameters:
        - in: path
          name: target
          required: true
          schema: { $ref: "#/components/schemas/RemoteCommandTarget" }
          description: Logical subsystem command target.
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string }
          description: Optional caller-supplied dedupe key (UUID recommended).
      requestBody:
        required: false
        description: Free-form per-target args. Default `{}`. Each renderer-side handler validates its own required shape.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandRequestBody" }
            examples:
              goalPause: { value: { args: { goalId: "g_42" } } }
              workflowRun: { value: { args: { workflowId: "wf_7", runParams: {} } } }
              pluginEnable: { value: { args: { pluginId: "computer-use" } } }
              terminalExec: { value: { args: { command: "git status", timeoutMs: 30000 } } }
      responses:
        "202":
          description: |
            Command accepted and dispatched. `runId` correlates the run in the
            audit log + `GET /api/v1/runs/{runId}`. The `idempotent-replayed`
            response header is `true` when this is a deduped replay.
          headers:
            idempotent-replayed:
              schema: { type: boolean }
              description: Present and `true` when the response is an idempotency-cache replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandAcceptedResponse" }
              examples:
                accepted: { value: { accepted: true, runId: "run_3f2a91c0" } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Either the token lacks `write` capability, or the target is in
            `SENSITIVE_TARGETS` and `allowSensitiveTargets` is off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
              examples:
                capability: { value: { error: "insufficient capability" } }
                sensitive: { value: { error: "sensitive_target_disabled" } }
        "404":
          description: Unknown command target (not in `RemoteCommandTarget`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
              examples: { unknown: { value: { error: "unknown command target" } } }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: Tauri event emit failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }

  # ── Read surface (GET) ──────────────────────────────────────────────────────
  # All GET reads are reachable by a `read`-capability token. Every read except
  # `/targets` round-trips to the renderer (it owns Dexie); a closed / busy
  # window returns 503 `window_unavailable` after a bounded wait. `/targets` is
  # answered natively in Rust and is always available.

  /api/v1/targets:
    get:
      operationId: listTargets
      tags: [reads]
      summary: List the dispatchable command targets (+ which are sensitive).
      responses:
        "200":
          description: Target allowlist.
          content:
            application/json:
              schema:
                type: object
                required: [targets, sensitive]
                properties:
                  targets:
                    { type: array, items: { $ref: "#/components/schemas/RemoteCommandTarget" } }
                  sensitive:
                    { type: array, items: { $ref: "#/components/schemas/RemoteCommandTarget" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/tasks:
    get:
      operationId: listTasks
      tags: [reads]
      summary: Scheduler task catalog (summarised, PII-gated).
      responses:
        "200":
          description: Task summaries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/WindowUnavailable" }

  /api/v1/workflows/{id}/runs:
    get:
      operationId: listWorkflowRuns
      tags: [reads]
      summary: Run history for a workflow (most recent first).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Workflow id.
      responses:
        "200":
          description: Run summaries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/WindowUnavailable" }

  /api/v1/goals:
    get:
      operationId: listGoals
      tags: [reads]
      summary: Goals for a background session (redacted objective only).
      parameters:
        - in: query
          name: sessionId
          required: true
          schema: { type: string }
          description: Background session id the goals belong to.
      responses:
        "200":
          description: Goal summaries (`objective` is the PII-redacted `safeObjective`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  goals: { type: array, items: { type: object, additionalProperties: true } }
        "400":
          description: Missing `sessionId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/WindowUnavailable" }

  /api/v1/audit:
    get:
      operationId: listAudit
      tags: [reads]
      summary: Recent inbound remote-control audit entries (PII-gated fields).
      responses:
        "200":
          description: Audit entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/WindowUnavailable" }

  /api/v1/runs/{runId}:
    get:
      operationId: getRunStatus
      tags: [reads]
      summary: Outcome of a dispatched command run.
      description: |
        Reads the `remoteControlRunStatus` projection, falling back to the
        durable `workflowRuns` row for workflow targets (which share the same
        `runId`, so terminal status survives a restart). Long-running targets
        advance past `accepted` to a terminal status: `team.dispatch`,
        `plan.run`, `chat.send`, and `terminal.exec` are stamped when their run
        settles; `goal.create` derives its live status from the authoritative
        `goals` table via the run's stored `correlationId` (`goalId`). `run` is
        `null` for an unknown runId.
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Run status, or `{ run: null }` when unknown."
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    oneOf:
                      - { type: "null" }
                      - { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/WindowUnavailable" }

  /api/v1/runs:
    get:
      operationId: listRuns
      tags: [reads]
      summary: Most-recent dispatched command runs + their status.
      responses:
        "200":
          description: Run-status rows (newest first).
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/WindowUnavailable" }

  /api/v1/workflows:
    get:
      operationId: listWorkflowDefinitions
      tags: [reads]
      summary: Visual workflow definitions (id / name / node count, PII-gated).
      responses:
        "200":
          description: Workflow definition summaries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflows: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/WindowUnavailable" }

  /api/v1/teams:
    get:
      operationId: listTeams
      tags: [reads]
      summary: Agent-team roster + status (PII-gated names).
      responses:
        "200":
          description: Team summaries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/WindowUnavailable" }

  /api/v1/teams/{id}:
    get:
      operationId: getTeam
      tags: [reads]
      summary: A single agent team's detail.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Team id.
      responses:
        "200":
          description: "Team detail, or `{ team: null }` when unknown."
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    oneOf:
                      - { type: "null" }
                      - { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/WindowUnavailable" }

  /api/v1/plugins:
    get:
      operationId: listPlugins
      tags: [reads]
      summary: Installed plugin catalog + enabled state.
      responses:
        "200":
          description: Plugin summaries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugins: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/WindowUnavailable" }

  /api/v1/connectors:
    get:
      operationId: listConnectors
      tags: [reads]
      summary: Configured platform-connector adapter instances (PII-gated names).
      responses:
        "200":
          description: Connector adapter-instance summaries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectors: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/WindowUnavailable" }

  /api/v1/backups:
    get:
      operationId: listBackups
      tags: [reads]
      summary: Recent backup-history rows.
      responses:
        "200":
          description: Backup-history summaries (newest first).
          content:
            application/json:
              schema:
                type: object
                properties:
                  backups: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/WindowUnavailable" }

  /api/v1/ocr/cache:
    get:
      operationId: getOcrCacheStats
      tags: [reads]
      summary: OCR result-cache stats (row count + bytes).
      responses:
        "200":
          description: Cache stats.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ocrCache:
                    type: object
                    properties:
                      count: { type: integer, minimum: 0 }
                      bytes: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/WindowUnavailable" }

  /api/v1/sessions/{id}/messages:
    get:
      operationId: listSessionMessages
      tags: [reads]
      summary: Per-session chat text (PII-gated row by row; non-conformant rows dropped).
      description: |
        The most PII-sensitive read on the surface. Each message's text is
        passed through the redaction gate individually; any row that fails — or
        that carries no readable text (tool/file-only messages) — is dropped
        entirely. A partially-redacted body is never emitted.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Chat session id.
      responses:
        "200":
          description: "Conversational text rows: `{ id, role, text }`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/WindowUnavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Static bearer token managed by the renderer's Remote Control
        Settings. Constant-time compared via `subtle`. Rotation is a
        full server restart.

  responses:
    Unauthorized:
      description: Missing or wrong bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SimpleError" }
          examples:
            missing: { value: { error: "missing bearer token" } }
            wrong: { value: { error: "invalid token" } }
    Forbidden:
      description: |
        IP rejected. Either the canonical IPv4 (`to_canonical`) is not in
        the allowlist, or the caller arrived via pure IPv6 (the listener
        is IPv4-only).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SimpleError" }
          examples:
            notAllowed: { value: { error: "origin not allowed" } }
            ipv6: { value: { error: "ipv6 not supported" } }
    PayloadTooLarge:
      description: Request body exceeded the 8 KiB cap.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SimpleError" }
    RateLimited:
      description: |
        Per-token rate limit exceeded. Default budget is
        `RemoteControlInboundConfig.rateLimitPerMin` (60) requests per
        minute, fixed window.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SimpleError" }
          examples:
            limit: { value: { error: "rate limit exceeded" } }
    WindowUnavailable:
      description: |
        A read that round-trips to the renderer could not be answered: the
        Cognia window is closed or too busy to respond within the bounded
        timeout. Retry once a window is open. (`/api/v1/targets` is answered
        natively and never returns this.)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SimpleError" }
          examples:
            unavailable: { value: { error: "window_unavailable" } }

  schemas:
    HealthResponse:
      type: object
      required: [ok, version]
      additionalProperties: false
      properties:
        ok: { type: boolean, enum: [true] }
        version: { type: string, description: "Cargo crate version of the desktop process." }

    AcceptedResponse:
      type: object
      required: [accepted]
      additionalProperties: false
      properties:
        accepted: { type: boolean, enum: [true] }

    SimpleError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: { type: string }

    # ── Generic command surface ──────────────────────────────────────────────

    RemoteCommandTarget:
      description: |
        Logical subsystem command target accepted by `POST /api/v1/commands/{target}`.
        This enum is the cross-language source of truth: the Rust `KNOWN_TARGETS`
        allowlist (`src-tauri/src/remote_control/server.rs`) and the TS
        `REMOTE_COMMAND_TARGETS` union (`types/remote-control/index.ts`) are both
        held in lock-step with it by parity tests.

        Targets marked **sensitive** (`chat.send`, `connector.send`,
        `goal.create`, `terminal.exec`) cause model-cost, outbound, or
        host-command side effects and require
        `RemoteControlInboundConfig.allowSensitiveTargets = true`.
      type: string
      enum:
        - scheduler.task.run
        - scheduler.event
        - workflow.run
        - workflow.cancel
        - goal.create
        - goal.continue
        - goal.pause
        - goal.resume
        - goal.stop
        - team.dispatch
        - team.stop
        - plan.run
        - chat.send
        - connector.send
        - terminal.exec
        - plugin.enable
        - plugin.disable

    CommandRequestBody:
      type: object
      additionalProperties: false
      properties:
        args:
          type: object
          additionalProperties: true
          description: Free-form per-target args; each renderer handler validates its own shape.

    CommandAcceptedResponse:
      type: object
      required: [accepted, runId]
      additionalProperties: false
      properties:
        accepted: { type: boolean, enum: [true] }
        runId:
          type: string
          description: Server-generated correlation id. Poll `GET /api/v1/runs/{runId}` for the outcome.

    # ── Request bodies ───────────────────────────────────────────────────────

    TriggerTaskRequestBody:
      type: object
      additionalProperties: false
      properties:
        payload:
          description: Optional task payload forwarded into the renderer's task runner.
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: array, items: {} }
            - { type: string }
            - { type: number }
            - { type: boolean }
            - { type: "null" }

    EmitEventRequestBody:
      type: object
      required: [eventType]
      additionalProperties: false
      properties:
        eventType:
          type: string
          minLength: 1
          description: Tauri event channel name. Whitespace-only values are rejected (400).
        eventSource:
          type: string
          description: Optional free-form source label.
        data:
          description: Optional payload object.
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: array, items: {} }
            - { type: string }
            - { type: number }
            - { type: boolean }
            - { type: "null" }

    # ── Renderer-side IPC payloads (documented for reference) ────────────────

    RunTaskEvent:
      description: |
        Payload of the `remote-control://run-task` Tauri event the server emits
        to the renderer. Documented here so renderer-side subscribers know the
        exact shape; it is not the HTTP response of this surface.
      type: object
      required: [taskId]
      additionalProperties: false
      properties:
        taskId: { type: string }
        payload:
          description: Mirror of `TriggerTaskRequestBody.payload`.
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: array, items: {} }
            - { type: string }
            - { type: number }
            - { type: boolean }
            - { type: "null" }

    EmitEvent:
      description: |
        Payload of the `remote-control://emit-event` Tauri event the server
        emits to the renderer.
      type: object
      required: [eventType]
      additionalProperties: false
      properties:
        eventType: { type: string }
        eventSource: { type: string }
        data:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: array, items: {} }
            - { type: string }
            - { type: number }
            - { type: boolean }
            - { type: "null" }

    # ── Configuration shapes (documented for reference) ──────────────────────

    RemoteControlInboundConfig:
      description: Renderer-side configuration that drives this server's bind.
      type: object
      required: [enabled, port, allowlist, rateLimitPerMin]
      additionalProperties: false
      properties:
        enabled: { type: boolean, default: false }
        port: { type: integer, format: int32, minimum: 0, maximum: 65535, default: 47821 }
        allowlist:
          type: array
          items: { type: string, description: "CIDR string (`127.0.0.1/32`, `192.168.0.0/16`)." }
          default: ["127.0.0.1/32"]
        rateLimitPerMin: { type: integer, minimum: 0, default: 60 }
        capability:
          type: string
          enum: [read, write]
          default: write
          description: "`read` → health + GET reads; `write` → also the POST command/task/event routes."
        allowSensitiveTargets:
          type: boolean
          default: false
          description: "When false, `SENSITIVE` command targets are rejected with 403 even for a write token."

    RemoteControlStatus:
      description: Live status reported by the renderer's Settings page.
      type: object
      required: [inboundRunning, inboundCallsTotal, hasInboundToken]
      additionalProperties: false
      properties:
        inboundRunning: { type: boolean }
        boundPort:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
        lastCallAt: { type: string, format: date-time }
        inboundCallsTotal: { type: integer, format: int64, minimum: 0 }
        hasInboundToken: { type: boolean }
