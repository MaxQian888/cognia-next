# Cognia ACP profile: cognia-acp
#
# Host-plane composition for the DeepSeek Harness Agent Client Protocol server,
# reached over JSON-RPC stdio by Cognia's existing `AcpClientAdapter`.
#
# WHY THIS PROFILE EXISTS, AND WHY IT IS NOT THE DEFAULT
#
# Upstream calls this an "automation-only" server, and its README is explicit:
# "Committed answers only -- live progress, reasoning, tool activity, plans,
# titles, and usage stay off the wire." `session/update` emits one
# `agent_message_chunk` per committed assistant message and nothing else.
#
# So this profile trades away everything the SDK profile is good at. What it
# buys is the one thing the SDK transport cannot do at all: answer a question
# mid-turn. `session/request_permission` carries one-shot allow/reject choices,
# and `session/cancel` cancels a single prompt without killing the runtime.
#
# Pick this profile when the user must approve individual tool calls.
# Pick `host.sdk-readonly.yml` when they want to watch what the agent is doing.
# A session cannot move between them: the two differ in both what the user can
# see and what they can veto.
#
# INVARIANT — THIS PROFILE MUST COMPOSE AN APPROVAL PROVIDER.
#
# The exact opposite of the SDK read-only profile, and for the same underlying
# reason. DSH tools let a model retry a denied call with
# `sandbox_permissions: "workspace-write"`, and `ctx.approval` decides.
#
#   - On the SDK transport there is no client to ask, so composing an approval
#     provider would hand the model self-service escalation. That profile
#     therefore composes none, and escalation fails closed.
#   - Here there IS a client to ask: the request travels to Cognia over ACP and
#     the user answers it. Omitting `dsh-user-approval` would instead make every
#     approval-gated tool fail closed with no way to proceed, which reads as a
#     broken agent rather than a safe one.
#
# `@deepseek-ai/dsh-acp` declares `dsh-user-approval` as a peer dependency for
# precisely this reason.
#
# Also absent by design: no stdout logger. Stdout carries only protocol frames.

# ── transport ───────────────────────────────────────────────────────────────

# Opens an AgentSideConnection on stdin/stdout and drives `ctx.agents`.
# `provider` and `model` are the route every ACP-created agent inherits.
- id: acp
  name: "@deepseek-ai/dsh-acp"
  config:
    provider: deepseek-official
    model: !!js process.env.COGNIA_DSH_MODEL ?? 'deepseek-v4-flash'

# ── approval ────────────────────────────────────────────────────────────────

# `ctx.approval`. Requests are dispatched over ACP to Cognia, which routes them
# through its own permission cascade before the user ever sees them; a decision
# here can only narrow what Cognia already allows.
- id: user-approval
  name: "@deepseek-ai/dsh-user-approval"

# ── model route ─────────────────────────────────────────────────────────────

- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek"
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    models:
      - id: !!js process.env.COGNIA_DSH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: !!js Number(process.env.COGNIA_DSH_CONTEXT_WINDOW ?? 1000000)

# ── sandbox ─────────────────────────────────────────────────────────────────

# `workspace-write` is defensible here only because escalation beyond it now
# reaches a human. The fs fence and the bash runner derive their writable-root
# set from the same `writableRoots` function, so the two cannot drift.
- id: sandbox
  name: "@deepseek-ai/dsh-sandbox-local"

- id: sandbox-policy
  name: "@deepseek-ai/dsh-sandbox-policy"
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.COGNIA_DSH_WORKSPACE ?? process.cwd()

# ── filesystem ──────────────────────────────────────────────────────────────

- id: fs-sandboxed
  name: "@deepseek-ai/dsh-fs-sandbox"
  config:
    cwd: !!js process.env.COGNIA_DSH_WORKSPACE ?? process.cwd()

- id: tool-fs
  name: "@deepseek-ai/dsh-tool-fs"

# ── agent spine ─────────────────────────────────────────────────────────────

- id: agent-spine
  name: "@deepseek-ai/dsh-agent-spine-demo"
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.COGNIA_DSH_PERSONA ?? 'You are a helpful software engineering assistant.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

# ── persistence ─────────────────────────────────────────────────────────────

# ACP supports fresh sessions only — upstream lists load, list, resume, delete
# and fork as unsupported — so this log is for observability and crash repair,
# never for reattaching to an earlier conversation.
- id: sessions
  name: "@deepseek-ai/dsh-session-persistence-jsonl"
  config:
    root: !!js process.env.COGNIA_DSH_SESSION_ROOT ?? './.sessions'
    compression: none
