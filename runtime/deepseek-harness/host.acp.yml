# Cognia overlay over the official sdk-minimal bundle (0.1.5-rc.1).
# Patch config replaces the whole upstream config; keep required values explicit.
- id: llm-deepseek
  disabled: !!js process.env.COGNIA_DSH_PROVIDER === 'cognia'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    defaultContextWindow: !!js Number(process.env.COGNIA_DSH_CONTEXT_WINDOW ?? 1000000)
    streamIdleTimeoutMs: 172800000

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: !!js process.env.COGNIA_DSH_PERSONA ?? 'You are a helpful software engineering assistant.'

- id: sessions
  config:
    root: !!js process.env.COGNIA_DSH_SESSION_ROOT
    compression: none

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.COGNIA_DSH_WORKSPACE

# ACP owns stdio and forwards one-shot approval decisions to Cognia.
- id: subprocess
  disabled: true
- id: pty
  disabled: true
- id: terminal-bash
  disabled: true
- id: terminal-pwsh
  disabled: true
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: jobs
  disabled: true

- id: sdk-jsonrpc-server
  disabled: true
- id: sdk-app-startup
  disabled: true

- insert:
    - id: cognia-services
      name: "./launcher.mjs"
    - id: attachment-local
      name: "@deepseek-ai/dsh-attachment-local"
      config:
        dshHome: !!js process.env.DSH_HOME
    - id: fs-sandboxed
      name: "@deepseek-ai/dsh-fs-sandbox"
      config:
        cwd: !!js process.env.COGNIA_DSH_WORKSPACE
    - id: tool-fs
      name: "@deepseek-ai/dsh-tool-fs"
    - id: acp-app-startup
      name: "@deepseek-ai/dsh-acp-app"
    - id: acp
      name: "@deepseek-ai/dsh-acp"
      inject: [acpAppStartup, cogniaServicesReady]
      config:
        provider: !!js process.env.COGNIA_DSH_PROVIDER ?? 'deepseek-official'
        model: !!js process.env.COGNIA_DSH_MODEL ?? 'deepseek-v4-flash'
    - id: user-approval
      name: "@deepseek-ai/dsh-user-approval"
      config:
        policy: ask
