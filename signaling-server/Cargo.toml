[package]
name = "cognia-signaling-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Stateless WebRTC signaling rendezvous for the cognia mobile↔desktop WAN transport (ADR-0021)"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "cognia-signaling-server"
path = "src/main.rs"

[lib]
name = "cognia_signaling_server"
path = "src/lib.rs"

[dependencies]
# HTTP + WebSocket server
axum = { version = "0.8", features = ["macros", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

# Shared wasm-safe protocol + rate-limiting primitives (also consumed by the
# Cloudflare Worker in `worker/`).
cognia-signaling-core = { path = "core" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors and CLI
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

# Concurrency
parking_lot = "0.12"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
http = "1"

# This crate is also the workspace root. `core/` is a member (shared with the
# Worker); `worker/` is excluded because it targets wasm32 with Worker-only
# dependencies that must never be built for the host target by `cargo build` /
# `cargo llvm-cov`. The Worker is built independently via `worker-build`.
[workspace]
members = ["core"]
exclude = ["worker"]
resolver = "2"
