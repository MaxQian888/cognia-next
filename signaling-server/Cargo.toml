[package]
name = "cognia-signaling-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Stateless WebRTC signaling rendezvous for the cognia mobile↔desktop WAN transport (ADR-0021)"
license = "MIT"
publish = false

[[bin]]
name = "cognia-signaling-server"
path = "src/main.rs"

[lib]
name = "cognia_signaling_server"
path = "src/lib.rs"

[dependencies]
# HTTP + WebSocket server
axum = { version = "0.8", features = ["macros", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors and CLI
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

# Concurrency
parking_lot = "0.12"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
http = "1"
