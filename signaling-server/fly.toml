# Sample Fly.io configuration for the cognia signaling rendezvous service.
# Adjust `app` and `primary_region` for your own deployment.
#
# Deploy with:
#   flyctl launch --no-deploy --copy-config
#   flyctl deploy

app = "cognia-signaling"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 7892
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "2s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
