# Cargo workspace root for cognia-next.
#
# Members share one Cargo.lock + one target/ directory at the repo root:
#   - src-tauri/           — the Tauri desktop app (`cognia-next`, lib
#                            `app_lib`) + the headless `cognia-server` binary.
#   - crates/*             — library crates and standalone services. Every
#                            member has a layer in
#                            `scripts/gates/rust-architecture.json`, and
#                            `pnpm audit:rust-architecture` keeps the edges
#                            pointing down and library crates Tauri-free by
#                            default (ADR-0196). New Rust logic goes into the
#                            lowest-layer crate that can own it, not
#                            `src-tauri/src`.
#
# Intentionally excluded:
#   - services/signaling-server/, services/share-server/
#                                   standalone deploy artifacts built via
#                                   Dockerfile/Fly.io. Each keeps its own
#                                   Cargo.lock to isolate the deploy image.
#   - crates/cognia-plugin-template, plugins/wasm-example-formatter
#                                   wasm32-wasip2 components built with
#                                   `cargo component`; their tighter
#                                   release profile (opt-level = "s")
#                                   and different target conflict with
#                                   a desktop workspace.
#   - crates/cognia-plugin-template-ts
#                                   pure TypeScript template, no Rust.

[workspace]
resolver = "3"
members = [
  "src-tauri",
  "crates/cognia-cli",
  "crates/cognia-headless-contract",
  # ADR-0175. The one RFC 9457 problem document every companion plane answers
  # with. A leaf: the gateway, connectors and headless-contract crates carry it
  # and none of them depends on cognia-core.
  "crates/cognia-problem",
  "crates/cognia-sandbox-runner",
  # ADR-0196 P6h — Windows elevation helpers build without the desktop app.
  "crates/cognia-elevated-setup",
  "crates/cognia-sidecar",
  "crates/cognia-codeserver",
  # ADR-0067 Tier-A decomposition — subsystem library crates extracted from the
  # monolithic `app_lib` so an edit recompiles ~2–15k LOC + a relink instead of
  # the whole 170k-LOC tree.
  "crates/cognia-core",
  "crates/cognia-instrument",
  # ADR-0176. The shared bare-mirror object cache plus the one credential
  # policy and the git runner that enforces a clone budget. A leaf, like
  # cognia-instrument: cognia-git, cognia-task-workspace and src-tauri all
  # carry it, and it carries none of them.
  "crates/cognia-git-mirror",
  # RFC 8785 canonical JSON, byte-identical to the TypeScript side. A leaf:
  # cognia-cli signs Character Packs with it and cognia-environment digests
  # EnvironmentSpecs with it (ADR-0182).
  "crates/cognia-canonical-json",
  # ADR-0196 P2 — the provider balance-script sandbox (QuickJS) and its token
  # storage, out of the foundation crate `cognia-net`.
  "crates/cognia-provider-diagnostics",
  # ADR-0196 P4 — the companion's transport leaves (TLS identity, mDNS/mesh,
  # tunnel, WebRTC peer/envelope/framing), out of `companion_api`.
  "crates/cognia-companion-connectivity",
  # ADR-0196 P4 — the companion's wire contract (generated command descriptors,
  # settings-sync allowlist, paging), out of `companion_api`.
  "crates/cognia-companion-contract",
  # ADR-0196 P4 — the companion's event bus, push delivery, store bridges and
  # remote execution contexts, out of `companion_api`.
  "crates/cognia-companion-bus",
  # ADR-0196 P4 — the companion's security ledger, identity resolution, tokens,
  # grants, rate limits and audit trail, out of `companion_api`.
  "crates/cognia-companion-security",
  # ADR-0196. The reference-counted OS keep-awake assertion the sidecar, the
  # companion worker and the desktop screen-hold command share.
  "crates/cognia-power",
  # ADR-0196 P7. The companion core: state, listener, auth, canonical remote
  # execution, WebSocket planes, signaling, A2A and ACP.
  "crates/cognia-companion",
  "crates/cognia-companion-rpc",
  # ADR-0196 P6c — the settings-hook runtime (`.claude/settings.json` hooks,
  # built-ins, trust, webhook/command handlers) and the settings readers, out
  # of `app_lib`.
  "crates/cognia-hooks",
  # ADR-0196 P6f — the task-workspace host surface (service slot, maintenance,
  # hook and event sinks, command bodies), out of `app_lib`.
  "crates/cognia-task-workspace-host",
  # ADR-0196 P6d — Agent Fleet (registry, ingress routes, installers, terminal
  # control, recovery), out of `app_lib`.
  "crates/cognia-fleet",
  # ADR-0196 P6g — Chromium cookie import (profile discovery, Safe Storage
  # decryption), out of `app_lib`.
  "crates/cognia-browser-cookies",
  # ADR-0201 — local Chromium: runtime supervision, installer, extensions,
  # user-Chrome discovery, local files and dev servers.
  "crates/cognia-local-browser",
  # ADR-0196 P6b — Codex App dispatch over the app-server control socket, out of
  # `app_lib`.
  "crates/cognia-codex-app",
  # ADR-0182 — runtime environments: EnvironmentSpec, the two-level image
  # catalog, admission policy and the tenant environment store.
  "crates/cognia-environment",
  # ADR-0183 — the in-sandbox supervisor: bundle staging, image probe, agent
  # init. A static musl binary, so it must stay off cognia-net and anything
  # else that links a network stack.
  "crates/cognia-sandboxd",
  "crates/cognia-bootstrap-agent",
  "crates/cognia-github-runner",
  # ADR-0182/0183 — the host side of runtime environment sandboxes: admission
  # against the tenant environment store and the Docker driver that stages the
  # agent bundle, probes the image and starts the agent. Step ② grows the
  # Kubernetes pool here (ADR-0184).
  "crates/cognia-sandbox-pool",
  "crates/cognia-git",
  "crates/cognia-ocr",
  "crates/cognia-vector",
  # ADR-0196 P2 — the per-tool OS execution sandbox (ADR-0028), out of
  # cognia-automation so the terminal and plugin host stop linking UI automation.
  "crates/cognia-exec-sandbox",
  "crates/cognia-automation",
  "crates/cognia-scheduling",
  # ADR-0067 Tier-B — foundation crates unblocking the subscription/
  # connectors/terminal/plugin_api extractions.
  "crates/cognia-secrets",
  "crates/cognia-net",
  # Native local-video processing (FFmpeg/FFprobe discovery, probing, frame
  # extraction, analysis, trimming) behind the plugin media API. Not part of the
  # Tier-B list above — it unblocks none of those extractions.
  "crates/cognia-media",
  # ADR-0067 Tier-B subsystem crates.
  "crates/cognia-terminal",
  "crates/cognia-subscription",
  "crates/cognia-connectors",
  "crates/cognia-plugin-runtime",
  # ADR-0067 follow-up — remaining subsystem leaves.
  "crates/cognia-skills",
  "crates/cognia-tts",
  "crates/cognia-gateway",
  "crates/cognia-ccswitch",
  "crates/cognia-mcp-server",
  "crates/cognia-external-agent",
  "crates/cognia-task-workspace",
  # Background-job supervisor: process-group-safe spawn/kill for the built-in
  # agent's `bash(run_in_background)` and for scheduled tasks. Linked by both
  # src-tauri and the headless `cognia-server` binary.
  "crates/cognia-jobs",
  # Crash capture, logging and telemetry. Created with the diagnostic service;
  # the app's crash/logging/telemetry cluster moved in under ADR-0067 Tier C.
  "crates/cognia-observability",
  # ADR-0067 Tier C — leaves lifted out of the regrown `app_lib`.
  "crates/cognia-agents",
  "crates/cognia-files",
  "crates/cognia-agent-state",
  # The provider-neutral deploy target contract, and the controller and signed
  # agent built on it. New crates, not extractions from `app_lib`.
  "crates/cognia-deployment",
  "crates/cognia-ops-controller",
  "crates/cognia-deploy-agent",
  # ADR-0149 — identity primitives (people, orgs, membership resolution,
  # tenant-scoped grants) shared by the app and by tenant-scoped services.
  "crates/cognia-tenant-auth",
  # ADR-0149 §6 — the collaboration plane. Server-authoritative Issues; the
  # client keeps a read-only cache.
  "crates/cognia-collab-server",
]
exclude = [
  "services/signaling-server",
  "services/share-server",
  "crates/cognia-plugin-template",
  "crates/cognia-plugin-template-ts",
  "plugins/wasm-example-formatter",
]

# ADR-0196 — package metadata every member inherits (`edition.workspace = true`
# …). `version` is deliberately NOT here: `scripts/sync/version-sync.mjs`
# rewrites the literal `version = "…"` line of the app-version members, and
# `check-runtime-versions.mjs` reads the gateway's.
[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/MaxQian888/cognia-next"

# ADR-0196 — one version for each third-party dependency that three or more
# members declare. Members inherit with `x.workspace = true` and add their own
# `features`. Workspace features are additive and cannot be switched off by a
# member, so none are declared here; a crate whose default features differ
# from the entry below keeps a local declaration.
[workspace.dependencies]
serde = { version = "1" }
serde_json = { version = "1" }
tokio = { version = "1" }
thiserror = { version = "2" }
tempfile = { version = "3" }
parking_lot = { version = "0.12" }
base64 = { version = "0.23" }
uuid = { version = "1" }
log = { version = "0.4" }
sha2 = { version = "0.11" }
tauri = { version = "=2.12.0" }
reqwest = { version = "0.13", default-features = false }
chrono = { version = "0.4" }
dirs = { version = "7" }
hex = { version = "0.4" }
url = { version = "2" }
futures-util = { version = "0.3", default-features = false }
once_cell = { version = "1" }
async-trait = { version = "0.1" }
ed25519-dalek = { version = "3" }
rand = { version = "0.10" }
axum = { version = "0.8" }
regex = { version = "1" }
rusqlite = { version = "0.40", features = ["fallible_uint"] }
rustls = { version = "0.23", default-features = false }
libc = { version = "0.2" }
notify = { version = "8" }
tower-http = { version = "0.7" }
anyhow = { version = "1" }
bytes = { version = "1" }
clap = { version = "4" }
schemars = { version = "1" }
tower = { version = "0.5" }
tracing = { version = "0.1" }
subtle = { version = "2" }
tokio-tungstenite = { version = "0.30", default-features = false }
flate2 = { version = "1" }
hmac = { version = "0.13" }
rcgen = { version = "0.14" }
zip = { version = "8", default-features = false }
rustls-native-certs = { version = "0.8" }
ignore = { version = "0.4" }
tracing-subscriber = { version = "0.3" }
aes-gcm = { version = "0.11" }
git2 = { version = "0.21", default-features = false }
jsonwebtoken = { version = "11" }
sysinfo = { version = "0.39", default-features = false }
tar = { version = "0.4" }
toml_edit = { version = "0.25" }
wait-timeout = { version = "0.2" }
wiremock = { version = "0.6" }
tauri-plugin-clipboard-manager = { version = "2" }
tauri-plugin-opener = { version = "2" }

[workspace.lints.rust]
# `tokio_unstable` is set for every crate by `.cargo/config.toml` (dial9's
# tokio telemetry). Any other unknown `cfg` is an error — in particular
# `desktop` / `mobile`, which only `tauri-build` defines and only for
# `src-tauri`: code carrying them into a library crate would otherwise
# silently compile out. The workspace had zero hits when this landed.
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(tokio_unstable)'] }

# `rten` and `rten-imageproc` are pulled in transitively when the optional
# `ocr-ocrs` feature is enabled on the `cognia-next` member. Upstream README
# requires opt-level = 3 even in dev profile — without it, smoke tests crawl.
# Profile overrides live at the workspace root per Cargo's rules; package-
# level `[profile.*]` blocks in workspace members are ignored.
[profile.dev]
# Keep filename/line information for panic backtraces and breakpoints without
# making every Tauri edit relink the full type/variable-level DWARF graph.
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package.rten]
opt-level = 3

[profile.dev.package.rten-imageproc]
opt-level = 3

# Opt-in profile for the rare LLDB session that needs locals and full Rust type
# information. Normal `cargo build` / `tauri dev` stays on the fast dev profile.
[profile.dev-full]
inherits = "dev"
debug = "full"
split-debuginfo = "unpacked"

# Keep line-table debug info in release so the crash-report subsystem's
# minidumps (`crash::monitor`) are symbolicable offline via `minidump-stackwalk`
# without shipping full debuginfo. Profile overrides must live at the workspace
# root — package-level `[profile.*]` in members is ignored by Cargo.
[profile.release]
debug = "line-tables-only"
# Optimize the shipped desktop binary: thin-LTO + single codegen unit improve
# runtime across the heavy dep tree (wasmtime JIT, crypto, sqlite), and `strip`
# drops the symbol table for a much smaller download. `panic = "unwind"` is left
# at its default — the crash-handler/minidumper path relies on unwinding, so do
# NOT switch to `panic = "abort"`. `debug = "line-tables-only"` (above) is kept
# so minidumps stay symbolicable.
lto = "thin"
codegen-units = 1
strip = true

# `cargo test` compiles the whole `app_lib` crate plus every inline
# `#[cfg(test)]` module into ONE giant test binary (lib + all deps:
# wasmtime, webrtc, qdrant, git2, …). With the dev profile's full `debug = 2`
# the per-crate DWARF/CodeView type info makes LLVM run out of memory on
# Windows (`rustc-LLVM ERROR: out of memory` → STATUS_STACK_BUFFER_OVERRUN).
# The test profile keeps line tables only — panic backtraces still carry
# file:line, but the heavy type debuginfo that blows the memory budget is
# dropped. Keep this explicit even though the fast `dev` profile now makes the
# same tradeoff; `dev-full` remains available for full LLDB sessions.
[profile.test]
debug = "line-tables-only"
