[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognia-laya-guard"
version = "0.1.0"
description = "Local System-1 guardrail decisions for Cognia, via the laya checkpoint."
requires-python = ">=3.10"
# Mirror of plugin.json `pythonDependencies` so `uv run --project` resolves the
# same environment the host installs.
dependencies = [
    "laya==0.3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["layaguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
