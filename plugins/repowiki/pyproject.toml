[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognia-repowiki"
version = "0.1.0"
description = "Repository wiki generation for Cognia, vendored from RepoWiki (MIT)."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "aiosqlite>=0.20.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["repowiki"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
