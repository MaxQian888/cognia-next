[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "cognia-repowiki"
version = "0.1.0"
description = "Repository wiki generation for Cognia, vendored from RepoWiki (MIT)."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.5",
    "aiosqlite>=0.22.1",
    "networkx>=3.4.2",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["repowiki"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
