<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cognia → Codex App control prototype</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #080b10;
        color: #edf1f7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 15% -10%, #173253 0, transparent 35%), #080b10;
      }
      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 60px;
      }
      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 4vw, 50px);
        letter-spacing: -0.045em;
      }
      h2 {
        margin: 0 0 14px;
        font-size: 15px;
        color: #aeb9c9;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      p {
        margin: 0;
        color: #9ca9ba;
      }
      .badge {
        border: 1px solid #2d3948;
        background: #111821;
        padding: 8px 12px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .badge.ok {
        color: #78e2a4;
        border-color: #275c3d;
        background: #10251a;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(360px, 0.85fr);
        gap: 16px;
      }
      .card {
        border: 1px solid #202b38;
        background: rgba(14, 19, 27, 0.9);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.25);
      }
      .stack {
        display: grid;
        gap: 12px;
      }
      textarea,
      input {
        width: 100%;
        border: 1px solid #2a3746;
        background: #090d13;
        color: #edf1f7;
        border-radius: 12px;
        padding: 12px 14px;
        font: inherit;
      }
      textarea {
        min-height: 120px;
        resize: vertical;
      }
      button {
        border: 1px solid #334156;
        background: #172130;
        color: #edf1f7;
        padding: 10px 14px;
        border-radius: 11px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #202d40;
      }
      button.primary {
        background: #eaf2ff;
        color: #09101a;
        border-color: transparent;
        font-weight: 700;
      }
      button.browser {
        background: #193a62;
        border-color: #2f6da8;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
      }
      .facts {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
      }
      .fact {
        background: #0a0f16;
        border: 1px solid #1e2a37;
        border-radius: 12px;
        padding: 12px;
        min-width: 0;
      }
      .fact b {
        display: block;
        color: #8b9aaf;
        font-size: 11px;
        text-transform: uppercase;
        margin-bottom: 5px;
      }
      .fact span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .list {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .chip {
        font-size: 12px;
        border: 1px solid #283647;
        background: #101720;
        padding: 6px 9px;
        border-radius: 999px;
      }
      .chip.on {
        color: #77dda1;
        border-color: #275a3b;
      }
      .events {
        height: 540px;
        overflow: auto;
        border: 1px solid #202b38;
        background: #05080c;
        border-radius: 13px;
        padding: 10px;
        font:
          12px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .event {
        border-bottom: 1px solid #121a24;
        padding: 9px 6px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .event strong {
        color: #7eb8ff;
      }
      .event.request strong {
        color: #ffca78;
      }
      .pending {
        border: 1px solid #674f28;
        background: #211a10;
        padding: 12px;
        border-radius: 12px;
      }
      .pending pre {
        white-space: pre-wrap;
        max-height: 180px;
        overflow: auto;
      }
      .muted {
        font-size: 12px;
        color: #738197;
      }
      @media (max-width: 850px) {
        .grid {
          grid-template-columns: 1fr;
        }
        header {
          align-items: flex-start;
          flex-direction: column;
        }
        .facts {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Cognia → local Codex App</h1>
          <p>Disposable control-plane prototype · local Codex runtime · SSE event mirror</p>
        </div>
        <div id="connection" class="badge">Connecting…</div>
      </header>
      <div class="grid">
        <section class="stack">
          <div class="card stack">
            <h2>Live host</h2>
            <div class="facts">
              <div class="fact"><b>Runtime</b><span id="runtime">—</span></div>
              <div class="fact"><b>Thread</b><span id="thread">—</span></div>
              <div class="fact"><b>Browser skill</b><span id="browser-skill">—</span></div>
            </div>
            <div>
              <p class="muted">Installed plugins visible through the running App</p>
              <div id="plugins" class="list"></div>
            </div>
            <div>
              <p class="muted">MCP servers and tool counts</p>
              <div id="mcp" class="list"></div>
            </div>
          </div>
          <div class="card stack">
            <h2>Start or steer a local task</h2>
            <textarea id="prompt">
Inspect this repository and report the current branch and one relevant architecture document. Do not change files.</textarea>
            <div class="actions">
              <button id="send" class="primary">Start / send</button>
              <button id="browser" class="browser">Run Browser Use smoke test</button>
              <button id="open">Open task in Codex App</button>
              <button id="handoff">Release + hand off to App</button>
              <button id="interrupt">Interrupt</button>
              <button id="refresh">Refresh capabilities</button>
            </div>
          </div>
          <div id="pending" class="stack"></div>
        </section>
        <section class="card">
          <h2>Codex event stream</h2>
          <div id="events" class="events"></div>
        </section>
      </div>
    </main>
    <script>
      const $ = (selector) => document.querySelector(selector)
      let status
      const events = $("#events")

      function addEvent(event) {
        const row = document.createElement("div")
        row.className = `event ${event.method === "server/request" ? "request" : ""}`
        const serialized = JSON.stringify(event.params ?? {}, null, 2)
        const bounded =
          serialized.length > 12000 ? `${serialized.slice(0, 12000)}\n… [truncated]` : serialized
        row.innerHTML = `<strong>${event.seq ?? "·"} ${event.method}</strong>\n${escapeHtml(bounded)}`
        events.prepend(row)
        while (events.children.length > 160) events.lastChild.remove()
        if (event.method === "server/request") renderPending(event.params)
        if (["bridge/thread-selected", "turn/started", "turn/completed"].includes(event.method))
          loadStatus()
      }

      function escapeHtml(value) {
        return value.replace(
          /[&<>"']/g,
          (character) =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[character]
        )
      }

      function pluginRows(capabilities) {
        return (
          capabilities?.plugins?.data?.marketplaces?.flatMap(
            (marketplace) => marketplace.plugins ?? []
          ) ?? []
        )
      }

      function renderStatus(next) {
        status = next
        $("#connection").textContent = next.connected
          ? "Connected to local Codex runtime"
          : "Disconnected"
        $("#connection").classList.toggle("ok", next.connected)
        $("#runtime").textContent =
          `${next.serverInfo?.userAgent ?? "unknown"} · ${next.connectionMode}`
        $("#thread").textContent = next.threadId ?? "none"
        $("#browser-skill").textContent = next.browserSkill?.enabled
          ? "visible + enabled"
          : "not visible"
        const installed = pluginRows(next.capabilities).filter((plugin) => plugin.installed)
        $("#plugins").innerHTML =
          installed
            .map(
              (plugin) =>
                `<span class="chip ${plugin.enabled ? "on" : ""}">${escapeHtml(plugin.name)} · ${plugin.enabled ? "enabled" : "off"}</span>`
            )
            .join("") || "<span class=muted>none</span>"
        const servers = next.capabilities?.mcp?.data?.data ?? []
        $("#mcp").innerHTML =
          servers
            .map(
              (server) =>
                `<span class="chip on">${escapeHtml(server.name)} · ${Object.keys(server.tools ?? {}).length} tools</span>`
            )
            .join("") || "<span class=muted>none</span>"
        $("#pending").innerHTML = ""
        for (const request of next.pendingServerRequests ?? []) renderPending(request)
      }

      function renderPending(request) {
        const id = String(request.id)
        if (document.getElementById(`request-${CSS.escape(id)}`)) return
        const panel = document.createElement("div")
        panel.id = `request-${id}`
        panel.className = "pending"
        panel.innerHTML = `<strong>${escapeHtml(request.method)}</strong><pre>${escapeHtml(JSON.stringify(request.params ?? {}, null, 2))}</pre><div class="actions"><button data-decision="accept">Accept</button><button data-decision="decline">Decline</button></div>`
        panel.querySelector('[data-decision="accept"]').onclick = () => respond(request, "accept")
        panel.querySelector('[data-decision="decline"]').onclick = () => respond(request, "decline")
        $("#pending").append(panel)
      }

      async function respond(request, decision) {
        let result
        if (request.method.includes("approval"))
          result = { decision: decision === "accept" ? "accept" : "decline" }
        else if (request.method === "item/tool/requestUserInput") result = { answers: {} }
        else if (request.method === "mcpServer/elicitation/request")
          result = { action: decision, content: null, _meta: null }
        else result = decision === "accept" ? {} : { error: "declined by Web operator" }
        await api("/api/respond", { id: request.id, result })
        document.getElementById(`request-${CSS.escape(String(request.id))}`)?.remove()
      }

      async function api(path, input) {
        const response = await fetch(
          path,
          input === undefined
            ? undefined
            : {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(input),
              }
        )
        const value = await response.json()
        if (!response.ok) throw new Error(value.error ?? response.statusText)
        return value
      }

      async function loadStatus() {
        try {
          renderStatus(await api("/api/status"))
        } catch (error) {
          $("#connection").textContent = error.message
        }
      }

      async function busy(button, action) {
        button.disabled = true
        try {
          await action()
        } catch (error) {
          addEvent({ method: "web/error", params: { message: error.message } })
        } finally {
          button.disabled = false
          await loadStatus()
        }
      }

      $("#send").onclick = () =>
        busy($("#send"), () => api("/api/turn", { prompt: $("#prompt").value }))
      $("#browser").onclick = () => busy($("#browser"), () => api("/api/browser-smoke", {}))
      $("#open").onclick = () => busy($("#open"), () => api("/api/open-in-app", {}))
      $("#handoff").onclick = () => busy($("#handoff"), () => api("/api/handoff", {}))
      $("#interrupt").onclick = () => busy($("#interrupt"), () => api("/api/interrupt", {}))
      $("#refresh").onclick = () => busy($("#refresh"), () => api("/api/refresh", {}))

      const source = new EventSource("/api/events")
      source.addEventListener("snapshot", (message) => JSON.parse(message.data).forEach(addEvent))
      source.addEventListener("codex", (message) => addEvent(JSON.parse(message.data)))
      source.onerror = () => {
        $("#connection").textContent = "Event stream reconnecting…"
      }
      loadStatus()
    </script>
  </body>
</html>
