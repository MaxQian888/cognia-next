<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"locale","type":"enum","label":"Locale","default":"en","options":[{"value":"en","label":"English"},{"value":"zh","label":"中文"}]},
    {"id":"seam","type":"string","label":"Seam shot","default":"recordings/hero/en/seam.mp4"},
    {"id":"reproduce","type":"string","label":"Reproduce shot","default":"recordings/hero/en/reproduce.mp4"},
    {"id":"fix","type":"string","label":"Fix shot","default":"recordings/hero/en/fix.mp4"},
    {"id":"halt","type":"string","label":"Halt shot","default":"recordings/hero/en/halt.mp4"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=1000" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- Per-locale beat times and focus rectangles, written by web/scripts/record-product.mjs. -->
    <script src="recordings/timing.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1600px;
        height: 1000px;
        overflow: hidden;
        background: #0c1115;
      }
      #root {
        position: relative;
        width: 1600px;
        height: 1000px;
        overflow: hidden;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: #0c1115;
      }
      .shot {
        position: absolute;
        left: 0;
        top: 0;
        width: 1600px;
        height: 1000px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <!--
      The hero loop (STORYBOARD frames 11–14): four shots of the same recording, no text — it
      plays beside the homepage headline, which carries the words. The first and last shots are
      the same held approval frame at the same camera, so the loop point is invisible.
      Each shot is its own short cut (web/scripts/record-product.mjs → heroShots), played from
      zero: a clip's media offset is read before scripts run, so it cannot follow the timing.
    -->
    <div
      id="root"
      data-composition-id="hero-loop"
      data-start="0"
      data-duration="10"
      data-width="1600"
      data-height="1000"
    >
      <div id="ground"></div>
      <video id="shot-seam" class="shot clip" src="recordings/hero/en/seam.mp4" data-var-src="seam" data-start="0" data-duration="0.9" data-track-index="1" muted playsinline></video>
      <video id="shot-reproduce" class="shot clip" src="recordings/hero/en/reproduce.mp4" data-var-src="reproduce" data-start="0.5" data-duration="2.9" data-track-index="2" muted playsinline></video>
      <video id="shot-fix" class="shot clip" src="recordings/hero/en/fix.mp4" data-var-src="fix" data-start="3" data-duration="3.6" data-track-index="3" muted playsinline></video>
      <video id="shot-halt" class="shot clip" src="recordings/hero/en/halt.mp4" data-var-src="halt" data-start="6.2" data-duration="3.8" data-track-index="4" muted playsinline></video>
    </div>

    <script>
      const vars = window.__hyperframes ? window.__hyperframes.getVariables() : {}
      const locale = vars.locale === "zh" ? "zh" : "en"
      const timing = window.__cogniaFootageTiming && window.__cogniaFootageTiming[locale]
      if (!timing) throw new Error(`recordings/timing.js has no timing for ${locale}; run record-product.mjs`)

      const W = 1600
      const H = 1000
      const k = W / timing.viewport.width
      const MAX_SCALE = { reproduce: 1.35, fix: 1.45, approval: 1.2 }
      function camera(b, grow = 1) {
        const f = timing.beats[b].focus
        const cx = (f.x + f.w / 2) * k
        const cy = (f.y + f.h / 2) * k
        const fit = Math.min(W / (f.w * k * 1.2), H / (f.h * k * 1.3))
        const s = Math.max(1, Math.min(MAX_SCALE[b], fit)) * grow
        const clamp = (v, lim) => Math.max(-lim, Math.min(lim, v))
        return {
          scale: s,
          x: clamp(-s * (cx - W / 2), (s - 1) * (W / 2)),
          y: clamp(-s * (cy - H / 2), (s - 1) * (H / 2)),
        }
      }

      const tl = gsap.timeline({ paused: true })
      const origin = { transformOrigin: "50% 50%" }
      // The seam camera: the halt's resting framing, shared by the first and last frames.
      const seam = camera("approval", 1.04)

      tl.set("#shot-seam", { ...origin, ...seam }, 0)

      tl.fromTo("#shot-reproduce", { ...origin, ...camera("reproduce"), opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.inOut" }, 0.5)
      tl.to("#shot-reproduce", { ...camera("reproduce", 1.05), duration: 2.9, ease: "none" }, 0.5)

      tl.fromTo("#shot-fix", { ...origin, ...camera("fix"), opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.inOut" }, 3.0)
      tl.to("#shot-fix", { ...camera("fix", 1.05), duration: 3.6, ease: "none" }, 3.0)

      // The halt pushes from its plain framing onto the seam framing and holds there.
      tl.fromTo("#shot-halt", { ...origin, ...camera("approval"), opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.inOut" }, 6.2)
      tl.to("#shot-halt", { ...seam, duration: 2.6, ease: "power2.inOut" }, 6.2)

      window.__timelines["hero-loop"] = tl
    </script>
  </body>
</html>
