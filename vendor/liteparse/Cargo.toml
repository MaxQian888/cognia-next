[package]
edition = "2024"
name = "liteparse"
version = "2.15.1"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fast, lightweight PDF and document parsing with spatial text extraction"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/run-llama/liteparse"
resolver = "2"

[features]
default = ["tesseract"]
oar-ocr = ["dep:oar-ocr"]
oar-ocr-auto-download = [
    "oar-ocr",
    "oar-ocr/auto-download",
]
oar-ocr-coreml = [
    "oar-ocr",
    "oar-ocr/coreml",
]
oar-ocr-cuda = [
    "oar-ocr",
    "oar-ocr/cuda",
]
oar-ocr-directml = [
    "oar-ocr",
    "oar-ocr/directml",
]
oar-ocr-openvino = [
    "oar-ocr",
    "oar-ocr/openvino",
]
oar-ocr-tensorrt = [
    "oar-ocr",
    "oar-ocr/tensorrt",
]
oar-ocr-webgpu = [
    "oar-ocr",
    "oar-ocr/webgpu",
]
tesseract = ["dep:tesseract-rs"]

[lib]
name = "liteparse"
path = "src/lib.rs"

[[bin]]
name = "lit"
path = "src/main.rs"

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"

[[test]]
name = "stages_compose"
path = "tests/stages_compose.rs"

