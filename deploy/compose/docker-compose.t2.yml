# T2 topology override (ADR-0059 D5/D9): split execution plane. This is also
# the always-on host's composition (ADR-0224 A8): work runs in containers
# from the sandbox pool, not in the server's own process.
#
#   docker compose -f docker-compose.yml -f docker-compose.t2.yml \
#     --profile server up -d
#
# cognia-server + the brain stay in the main container (the bridge couples
# them tightly). External agents run in per-agent cognia-runner containers
# (ExecBackend::Container, feature `container-exec`) or, with the sandbox
# pool on, in the project's own image with the agent bundle injected
# (ADR-0183); built-in agent turns run their shell tools in a per-task pool
# container. The pool execs into its own containers: the retained workspace
# runtime's agent connection, the port relay and the service bridge.
#
# The server never touches the raw Docker socket. It reaches the daemon
# through cognia-docker-proxy (crates/cognia-docker-proxy), which reads
# request bodies, not just URLs:
#   - a container is created only with this deployment's labels
#     (cognia.owner, cognia.deployment = COGNIA_INSTANCE);
#   - it mounts only the workspaces volume and this deployment's agent bundle
#     volumes (plus tmpfs), never a host path;
#   - no privileged mode, no host network, PID, IPC, UTS, user or cgroup
#     namespace, no devices, only the five capabilities the agent supervisor
#     adds back, no unconfined security profile;
#   - start/stop/exec/remove reach only containers carrying those labels, and
#     lists only ever show them;
#   - image builds, networks, swarm, secrets and archive uploads are refused.
# Devcontainer builds (ADR-0186) need the build API and so do not run through
# this proxy. Rootless Docker is recommended for the daemon itself.

services:
  docker-proxy:
    profiles: [server]
    image: ${COGNIA_DOCKER_PROXY_IMAGE:-ghcr.io/maxqian888/cognia-docker-proxy:latest}
    environment:
      COGNIA_DOCKER_PROXY_LISTEN: tcp://0.0.0.0:2375
      COGNIA_DOCKER_PROXY_UPSTREAM: unix:///var/run/docker.sock
      # Both must match cognia-server's: they are the labels and the volume
      # the proxy admits.
      COGNIA_DEPLOYMENT_ID: ${COGNIA_INSTANCE:-cognia}
      COGNIA_WORKSPACES_VOLUME: ${COGNIA_INSTANCE:-cognia}_workspaces
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Root only for the socket's owner permission (see deploy/docker/Dockerfile.docker-proxy);
    # everything else a root process could use is taken away.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  cognia-server:
    depends_on:
      docker-proxy:
        condition: service_started
    environment:
      COGNIA_EXEC_BACKEND: container
      COGNIA_RUNNER_IMAGE: ${COGNIA_RUNNER_IMAGE:-ghcr.io/maxqian888/cognia-runner:latest}
      # Agent bundle for project runtime environments (ADR-0183). Blank means
      # none; read only while the sandbox pool is on, and only a digest-pinned
      # bundle admits sandboxes.
      COGNIA_AGENT_BUNDLE_IMAGE: ${COGNIA_AGENT_BUNDLE_IMAGE:-}
      COGNIA_AGENT_BUNDLE_RETAINED_IMAGES: ${COGNIA_AGENT_BUNDLE_RETAINED_IMAGES:-}
      # The deployment switch for runtime environment sandboxes when no
      # baseline file is mounted (docker-compose.runtime-environment.yml).
      # On by default (ADR-0224 A8): dispatched work runs in a container per
      # task. Sandboxes start only once COGNIA_AGENT_BUNDLE_IMAGE names a
      # digest-pinned bundle; until then a run that does not require
      # isolation falls back to the server process. Set it to false to keep
      # every run in the server process.
      COGNIA_SANDBOX_POOL_ENABLED: ${COGNIA_SANDBOX_POOL_ENABLED:-true}
      DOCKER_HOST: tcp://docker-proxy:2375
      # Workspaces live on a named volume shared with the runners. BOTH vars
      # matter: COGNIA_WORKSPACES_DIR is where cognia-server sees the tree;
      # COGNIA_WORKSPACES_VOLUME tells the backend to mount runner workspaces
      # as subpaths of that VOLUME (volume + subpath) instead of bind-mounting
      # a host path — the /workspaces path only exists inside this container,
      # so a host bind would hand every runner an empty directory.
      COGNIA_WORKSPACES_DIR: /workspaces
      COGNIA_WORKSPACES_VOLUME: ${COGNIA_INSTANCE:-cognia}_workspaces
      # A task's working copies live on the same volume (ADR-0224 A8), so the
      # container its tools run in can mount the copy the task runs on. Under
      # the data directory they would sit on another volume no runner sees.
      COGNIA_TASK_WORKSPACE_EXECUTION_ROOT: /workspaces/.cognia-task-workspaces
      # ADR-0085 hard gate. Both this server flag and each user's local
      # experiment toggle must be true before `browser` is advertised.
      COGNIA_REMOTE_BROWSER_ENABLED: ${COGNIA_REMOTE_BROWSER_ENABLED:-false}
      COGNIA_WORKSPACE_RUNTIME_URL_TEMPLATE: http://workspace-runtime-{workspace_id}:27910
      COGNIA_WORKSPACE_RUNTIME_SECRET_DIR: /runtime-secrets
      COGNIA_WORKSPACE_RUNTIME_WORKSPACES: ${COGNIA_WORKSPACE_RUNTIME_WORKSPACES:-default}
    volumes:
      - cognia_workspaces:/workspaces
      - cognia_workspace_default:/workspaces/default
      - cognia_runtime_secrets:/runtime-secrets:ro

  workspace-runtime-default:
    profiles: [remote-browser]
    image: ${COGNIA_WORKSPACE_RUNTIME_IMAGE:-ghcr.io/maxqian888/cognia-workspace-runtime:latest}
    build:
      context: ../../
      dockerfile: services/workspace-runtime/Dockerfile
    environment:
      COGNIA_WORKSPACE_ID: default
      # No `:?` here: compose interpolates the whole file before it filters
      # profiles, so a required marker made the documented T2 command fail
      # even with the remote-browser profile off. The runtime itself refuses
      # to start on a secret shorter than 32 characters (src/main.mjs).
      COGNIA_WORKSPACE_RUNTIME_SECRET: ${COGNIA_WORKSPACE_RUNTIME_SECRET:-}
    volumes:
      - cognia_workspace_default:/workspace
      - cognia_browser_profiles_default:/profiles
      - cognia_runtime_secrets:/runtime-secrets
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H 'Authorization: Bearer '$$COGNIA_WORKSPACE_RUNTIME_SECRET http://localhost:27910/v1/health >/dev/null",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    shm_size: 1gb
    restart: unless-stopped

volumes:
  cognia_workspaces:
    # Explicit name so COGNIA_WORKSPACES_VOLUME above matches it byte for byte
    # (compose would otherwise prefix the key with the project name). Both
    # derive from COGNIA_INSTANCE, so a second instance on the same daemon
    # gets its own workspaces volume instead of sharing this one. Using
    # `docker compose -p` alone does NOT rename it: set COGNIA_INSTANCE.
    name: ${COGNIA_INSTANCE:-cognia}_workspaces
  cognia_workspace_default:
  cognia_browser_profiles_default:
  cognia_runtime_secrets:
