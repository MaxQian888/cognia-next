# T2 topology override (ADR-0059 D5/D9): split execution plane.
#
#   docker compose -f docker-compose.yml -f docker-compose.t2.yml \
#     --profile server up -d
#
# cognia-server + the brain stay in the main container (the bridge couples
# them tightly); external agents move to per-workspace cognia-runner
# containers spawned via ExecBackend::Container (R13, feature
# `container-exec`). The backend talks to Docker through a locked-down
# socket proxy — never the raw socket: only container lifecycle + exec are
# reachable, so a compromised server process cannot mount the host or
# escalate via the Docker API surface.

services:
  docker-socket-proxy:
    profiles: [server]
    image: tecnativa/docker-socket-proxy:0.3
    environment:
      # Default-deny; allow exactly what ExecBackend::Container needs.
      CONTAINERS: "1" # create/inspect/start/stop
      EXEC: "1" # exec agent processes into runners
      POST: "1" # mutating verbs for the two above
      IMAGES: "1" # resolve the runner image
      # Everything else (volumes, networks, swarm, host info) stays denied.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  cognia-server:
    depends_on:
      docker-socket-proxy:
        condition: service_started
    environment:
      COGNIA_EXEC_BACKEND: container
      COGNIA_RUNNER_IMAGE: ${COGNIA_RUNNER_IMAGE:-ghcr.io/maxqian888/cognia-runner:latest}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # Workspaces live on a named volume shared with the runners.
      COGNIA_WORKSPACES_DIR: /workspaces
    volumes:
      - cognia_workspaces:/workspaces

volumes:
  cognia_workspaces:
