services:
  caddy:
    image: ${CADDY_IMAGE:?set a digest-pinned CADDY_IMAGE}
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    pids_limit: 128
    cpus: 1.0
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5", compress: "true" }
