# DORMANT — narrow RBAC for the future k8s exec backend (R13 follow-up):
# the server may create/inspect runner pods and exec into them — nothing else.
# The shipped ExecBackend::Container speaks the Docker API only (bollard;
# `exec_backend_from_env` accepts `container` | `local-process`), so this
# ServiceAccount is deliberately NOT attached to the StatefulSet yet — the
# pod runs as `default` with zero API grants. Add `serviceAccountName:
# cognia-server` to cognia-server.yaml in the same change that lands the
# k8s flavor of the backend, never before.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cognia-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cognia-runner-exec
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods/exec, pods/attach]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cognia-runner-exec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cognia-runner-exec
subjects:
  - kind: ServiceAccount
    name: cognia-server
