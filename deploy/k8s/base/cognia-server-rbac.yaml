# Narrow RBAC for the k8s exec backend (ADR-0059 R13, `k8s-exec` feature):
# the server may create/inspect runner pods and attach to them — nothing
# else. Attached via `serviceAccountName: cognia-server` in
# cognia-server.yaml; the backend itself activates only when the tenant
# overlay sets `execBackend=kubernetes` (see tenant-template/).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cognia-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cognia-runner-exec
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods/exec, pods/attach]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cognia-runner-exec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cognia-runner-exec
subjects:
  - kind: ServiceAccount
    name: cognia-server
