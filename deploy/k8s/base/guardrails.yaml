# Tenant guardrails: default-deny east-west traffic + resource ceilings.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # Same-namespace traffic only (the ingress controller reaches
    # cognia-server via a namespaced allow rule in the tenant overlay).
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              cognia.dev/ingress-access: "true"
  egress:
    # DNS + any external endpoint (agents call provider APIs); tighten per
    # tenant policy in the overlay if outbound should be restricted.
    - {}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-limits
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
