# gVisor RuntimeClass (ADR-0059 T3). Nodes must run containerd with the
# runsc shim installed; this object only names the handler.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
# Kata Containers alternative — pick ONE per cluster policy.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
