packages:
  # The repo root is listed so Changesets can version the app as a single
  # unit (its version lives in the root package.json). pnpm still excludes the
  # root from recursive commands unless --include-workspace-root is passed.
  - .
  - docs
  - web
  - mobile
  - cli
  - browser-extension
  - packages/*
  - services/workspace-runtime

# fake-timers only restores a global on uninstall if it was an OWN property at
# install time. On Node >= 26 that check reads false for the timer globals, so
# uninstall DELETED setTimeout & friends and every suite that ran after a
# useFakeTimers()/useRealTimers() cycle in the same worker died with
# "setTimeout is not defined". The patch restores whatever it captured.
# Test-infra only — nothing ships to users, hence no changeset.
patchedDependencies:
  "@sinonjs/fake-timers@15.4.0": patches/@sinonjs__fake-timers@15.4.0.patch

# Security floors for transitive dependencies whose direct parents currently
# declare broader ranges or have not yet published a compatible patch release.
overrides:
  "@babel/runtime": "^7.28.4"
  "@hono/node-server": "^2.0.5"
  adm-zip: "^0.6.0"
  # brace-expansion v5 changed its CommonJS export from a callable function to
  # `{ expand }`. A graph-wide override therefore crashes the still-supported
  # minimatch 3/5/9 consumers before ESLint can load. Pin the latest maintenance
  # line compatible with each parent API instead.
  "minimatch@3.1.5>brace-expansion": "1.1.18"
  "minimatch@5.1.9>brace-expansion": "2.1.4"
  "minimatch@9.0.9>brace-expansion": "2.1.4"
  "minimatch@10.2.6>brace-expansion": "5.0.9"
  mermaid: "11.16.1"
  pdfjs-dist: "6.2.108"
  shell-quote: "1.10.0"
  tmp: "0.2.7"
  dompurify: "^3.4.12"
  esbuild: "^0.28.1"
  postcss: "^8.5.10"
  sharp: "^0.35.3"
  tar: "^7.5.19"
  undici: "^7.28.0"
  uuid: "^11.1.1"
  valibot: "^1.4.2"
  vite-tsconfig-paths: "^6.1.1"

  # Single-copy floors for the AI SDK family. Six workspace packages declare these
  # as peers with a bare `*` (`packages/{provider-core,provider-embedding,rag,
  # memory,web-search,agent-config-types}`). A `*` is resolved ONCE and then frozen
  # in the lockfile, so when the root pin later moved forward those packages stayed
  # on whatever was newest the day their entry was written — leaving two copies of
  # every one of these in the store.
  #
  # That is not merely wasteful: `tsc` loads both, and two copies of `ai` collide
  # on its global `AI_SDK_TELEMETRY_INTEGRATIONS` declaration (TS2403), which broke
  # the packed-SDK type-check in `scripts/plugin/test-sdk-package.mjs`.
  #
  # These override the whole graph — including third-party consumers — onto the
  # `catalog:` block below, which the root package.json also references, so there
  # is exactly one place to bump. (`$name` does the same job but pnpm 11
  # deprecates it in favour of catalogs.)
  ai: "catalog:"
  "@ai-sdk/provider": "catalog:"
  "@ai-sdk/openai": "catalog:"
  "@ai-sdk/anthropic": "catalog:"
  "@ai-sdk/google": "catalog:"
  "@ai-sdk/mistral": "catalog:"
  "@ai-sdk/cohere": "catalog:"
  "@ai-sdk/amazon-bedrock": "catalog:"

# One version per AI SDK package, for the catalog references above and in the
# root package.json. This block is the single source of truth for the family.
catalog:
  ai: "7.0.59"
  "@ai-sdk/provider": "4.0.7"
  "@ai-sdk/openai": "4.0.37"
  "@ai-sdk/anthropic": "4.0.37"
  "@ai-sdk/google": "4.0.40"
  "@ai-sdk/mistral": "4.0.28"
  "@ai-sdk/cohere": "4.0.26"
  "@ai-sdk/amazon-bedrock": "5.0.51"

# pnpm 11 blocks lifecycle scripts by default (ERR_PNPM_IGNORED_BUILDS).
# Explicitly approve packages whose postinstall/install/preinstall scripts are
# required for correct operation (native addons, platform binaries). Deny
# packages whose scripts are informational or unnecessary at install time.
allowBuilds:
  "@parcel/watcher": true
  # WXT's postinstall generates the .wxt/ type surface the extension
  # workspace compiles against; without it `tsc` there sees no entrypoints.
  wxt: true
  "@swc/core": true
  core-js: false
  core-js-pure: false
  esbuild: true
  node-pty: true
  onnxruntime-node: true
  protobufjs: true
  # Pulled in transitively by WXT's publishing toolchain. Its install script
  # only compiles a native fallback for a Node 0.10-era `spawnSync` shim that
  # every supported Node already has built in.
  spawn-sync: false
  tesseract.js: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@ai-sdk/fireworks@3.0.22"
  - "@ai-sdk/gateway@4.0.37"
  - "@ai-sdk/react@4.0.51"
  - "@hookform/resolvers@5.7.1"
  - "@lezer/css@1.3.5"
  - "@types/semver@7.8.0"
  - ai@7.0.48
  - get-tsconfig@4.14.1
  - tsx@4.23.3

# `pnpm audit` is a BLOCKING gate (CI_CD.md, supply-chain group), so every entry
# here has to name the advisory and say why no safe upgrade exists. The
# `audit:deps` script mirrors these ids as `--ignore` flags because JSON cannot
# carry the reason, and `scripts/ci/workflow-contract.test.mjs` keeps the two
# lists in step and fails when an id here has no justification above it.
auditConfig:
  ignoreGhsas:
    # image-size <=2.0.2: two infinite-loop DoS advisories, one in the ICNS
    # parser and one in the JXL/HEIF parsers. Reached only through
    # `@storybook/nextjs` and `@storybook/nextjs-vite >
    # vite-plugin-storybook-nextjs`, both devDependencies that parse local story
    # assets and never ship in the app, the desktop bundle or the mobile bundle.
    # Storybook 10.5 pins the vulnerable range transitively, so the only upgrade
    # is a graph-wide override replacing the copy Storybook's own build expects.
    # reviewAfter: 2026-11-30 (re-check when Storybook 11 lands)
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
