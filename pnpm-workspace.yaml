packages:
  # The repo root is listed so Changesets can version the app as a single
  # unit (its version lives in the root package.json). pnpm still excludes the
  # root from recursive commands unless --include-workspace-root is passed.
  - .
  - docs
  - web
  - mobile
  - cli
  - browser-extension
  - packages/*
  - services/workspace-runtime

# fake-timers only restores a global on uninstall if it was an OWN property at
# install time. On Node >= 26 that check reads false for the timer globals, so
# uninstall DELETED setTimeout & friends and every suite that ran after a
# useFakeTimers()/useRealTimers() cycle in the same worker died with
# "setTimeout is not defined". The patch restores whatever it captured.
# Test-infra only — nothing ships to users, hence no changeset.
patchedDependencies:
  "@sinonjs/fake-timers@15.4.0": patches/@sinonjs__fake-timers@15.4.0.patch

# Security floors for transitive dependencies whose direct parents currently
# declare broader ranges or have not yet published a compatible patch release.
overrides:
  "@babel/runtime": "^7.28.4"
  "@hono/node-server": "^2.0.5"
  adm-zip: "^0.6.0"
  # brace-expansion v5 changed its CommonJS export from a callable function to
  # `{ expand }`. A graph-wide override therefore crashes the still-supported
  # minimatch 3/5/9 consumers before ESLint can load. Pin the latest maintenance
  # line compatible with each parent API instead.
  "minimatch@3.1.5>brace-expansion": "1.1.16"
  "minimatch@5.1.9>brace-expansion": "2.1.2"
  "minimatch@9.0.9>brace-expansion": "2.1.2"
  "minimatch@10.2.5>brace-expansion": "5.0.8"
  dompurify: "^3.4.12"
  esbuild: "^0.28.1"
  postcss: "^8.5.10"
  sharp: "^0.35.3"
  tar: "^7.5.19"
  undici: "^7.28.0"
  uuid: "^11.1.1"
  valibot: "^1.4.2"
  vite-tsconfig-paths: "^6.1.1"

# pnpm 11 blocks lifecycle scripts by default (ERR_PNPM_IGNORED_BUILDS).
# Explicitly approve packages whose postinstall/install/preinstall scripts are
# required for correct operation (native addons, platform binaries). Deny
# packages whose scripts are informational or unnecessary at install time.
allowBuilds:
  "@parcel/watcher": true
  # WXT's postinstall generates the .wxt/ type surface the extension
  # workspace compiles against; without it `tsc` there sees no entrypoints.
  wxt: true
  "@swc/core": true
  core-js: false
  core-js-pure: false
  esbuild: true
  node-pty: true
  onnxruntime-node: true
  protobufjs: true
  # Pulled in transitively by WXT's publishing toolchain. Its install script
  # only compiles a native fallback for a Node 0.10-era `spawnSync` shim that
  # every supported Node already has built in.
  spawn-sync: false
  tesseract.js: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@ai-sdk/fireworks@3.0.22"
  - "@ai-sdk/gateway@4.0.37"
  - "@ai-sdk/react@4.0.51"
  - "@hookform/resolvers@5.7.1"
  - "@lezer/css@1.3.5"
  - "@types/semver@7.8.0"
  - ai@7.0.48
  - get-tsconfig@4.14.1
  - tsx@4.23.3
