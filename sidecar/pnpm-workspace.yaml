# The sidecar is installed with --ignore-workspace, so pnpm does not inherit
# the repository root's build policy. Keep every dependency script decision
# explicit here: pnpm 11 fails installs when an encountered build is undecided.
allowBuilds:
  "@ast-grep/cli": false
  better-sqlite3: true
  # Optional msgpackr acceleration; keep the portable JavaScript decoder.
  msgpackr-extract: false
  node-pty: true
  protobufjs: false
minimumReleaseAgeExclude:
  - "@opencode/client@2.0.18"
  - "@opencode/protocol@2.0.18"
  - "@opencode/schema@2.0.18"
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.283"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.283"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.283"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.283"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.283"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.283"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.283"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.283"
  - "@anthropic-ai/claude-agent-sdk@0.3.283"
  - "@ai-sdk/gateway@4.0.96 || 4.0.104"
  - "@ai-sdk/otel@1.0.118 || 1.0.128"
  - ai@7.0.118 || 7.0.128
  - "@ai-sdk/amazon-bedrock@5.0.106"
  - "@ai-sdk/anthropic@4.0.72"
  - "@ai-sdk/azure@4.0.92"
  - "@ai-sdk/cohere@4.0.55"
  - "@ai-sdk/deepseek@3.0.59"
  - "@ai-sdk/google@4.0.88"
  - "@ai-sdk/mcp@2.0.67"
  - "@ai-sdk/mistral@4.0.57"
  - "@ai-sdk/openai@4.0.84"
  - "@ai-sdk/provider-utils@5.0.54"
  - "@ai-sdk/provider@4.0.22"
