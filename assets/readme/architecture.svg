<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740"
     role="img" aria-labelledby="title desc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
  <title id="title">How Cognia is built</title>
  <desc id="desc">One static export feeds browser, Tauri desktop, and Capacitor mobile. The desktop hosts a Rust core connected to a Node agent sidecar. Mobile connects to the Rust core over LAN/WAN. Signaling and encrypted sharing deploy independently.</desc>
  <rect x="0" y="0" width="1200" height="740" rx="24" fill="#101B30" stroke="none"/>
  <text x="56" y="65" font-size="38" font-weight="650" fill="#F3F6FF" text-anchor="start">One interface. Three ways in.</text>
  <rect x="56" y="103" width="1088" height="89" rx="18" fill="#192840" stroke="none"/>
  <text x="600" y="145" font-size="30" font-weight="650" fill="#F3F6FF" text-anchor="middle">Next.js static export → out/</text>
  <text x="600" y="176" font-size="22" font-weight="400" fill="#A8B8D1" text-anchor="middle">Shared interface · shared translations · shared business logic</text>
  <path d="M600 192v32M238 252v-28h724v28M600 224v28" fill="none" stroke="#50658A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="56" y="252" width="344" height="97" rx="18" fill="#192840" stroke="none"/>
  <text x="228" y="293" font-size="30" font-weight="650" fill="#F3F6FF" text-anchor="middle">Browser</text>
  <text x="228" y="326" font-size="23" font-weight="400" fill="#A8B8D1" text-anchor="middle">Web interface</text>
  <rect x="428" y="252" width="344" height="97" rx="18" fill="#192840" stroke="none"/>
  <text x="600" y="293" font-size="30" font-weight="650" fill="#F3F6FF" text-anchor="middle">Desktop</text>
  <text x="600" y="326" font-size="23" font-weight="400" fill="#A8B8D1" text-anchor="middle">Tauri shell</text>
  <rect x="800" y="252" width="344" height="97" rx="18" fill="#192840" stroke="none"/>
  <text x="972" y="293" font-size="30" font-weight="650" fill="#F3F6FF" text-anchor="middle">Mobile</text>
  <text x="972" y="326" font-size="23" font-weight="400" fill="#A8B8D1" text-anchor="middle">Capacitor shell</text>
  <path d="M600 349v81" fill="none" stroke="#74E2D5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M972 349v36H700v45" fill="none" stroke="#A5B7FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="966" y="400" font-size="21" font-weight="400" fill="#A5B7FF" text-anchor="start">LAN / WAN</text>
  <rect x="56" y="430" width="668" height="124" rx="18" fill="#192840" stroke="none"/>
  <text x="84" y="472" font-size="30" font-weight="650" fill="#F3F6FF" text-anchor="start">Rust core</text>
  <text x="84" y="509" font-size="24" font-weight="400" fill="#A8B8D1" text-anchor="start">HTTP · scheduler · vector store</text>
  <text x="84" y="538" font-size="24" font-weight="400" fill="#A8B8D1" text-anchor="start">Automation · OCR · MCP server</text>
  <rect x="752" y="430" width="392" height="124" rx="18" fill="#192840" stroke="none"/>
  <text x="780" y="472" font-size="30" font-weight="650" fill="#F3F6FF" text-anchor="start">Node sidecar</text>
  <text x="780" y="510" font-size="24" font-weight="400" fill="#A8B8D1" text-anchor="start">Claude Agent SDK</text>
  <path d="M724 486h28m-8-8 8 8-8 8" fill="none" stroke="#A8B8D1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="56" y="614" font-size="22" font-weight="600" fill="#74E2D5" text-anchor="start">INDEPENDENT SERVICES</text>
  <text x="56" y="660" font-size="27" font-weight="550" fill="#F3F6FF" text-anchor="start">WebRTC signaling</text>
  <text x="644" y="660" font-size="27" font-weight="550" fill="#F3F6FF" text-anchor="start">Encrypted share links</text>
  <text x="56" y="696" font-size="23" font-weight="400" fill="#A8B8D1" text-anchor="start">Device rendezvous</text>
  <text x="644" y="696" font-size="23" font-weight="400" fill="#A8B8D1" text-anchor="start">Share server + viewer</text>
</svg>
