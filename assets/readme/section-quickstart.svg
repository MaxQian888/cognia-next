  <circle cx="60" cy="48" r="19" fill="#0C1526" stroke="url(#qsNum)" stroke-width="1.6"/>
  <text x="60" y="53" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#8FD0FF">01</text>
  <line x1="88" y1="26" x2="88" y2="70" stroke="#233150"/>
