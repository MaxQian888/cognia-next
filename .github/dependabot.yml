# Dependabot configuration file
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # JavaScript/TypeScript dependencies (npm/pnpm)
  #
  # The public-repo runner pool is shared with trunk and human PRs.
  # Minor and patch updates therefore
  # land as two grouped PRs per week (runtime vs tooling); only semver-major
  # updates, which need individual review anyway, arrive one per PR. The
  # cooldown lets a fresh release age before it is proposed, which filters out
  # yanked or compromised versions. Security updates ignore both settings.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "npm"
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # One shared Cargo.lock: propose one reviewable batch instead of competing
  # Tauri/general/individual PRs that each compile the same native graph.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "rust"]
    groups:
      cargo-dependencies:
        patterns: ["*"]
    ignore:
      # windows 0.62 uses windows-core 0.62 and windows-future 0.3 types.
      # Upgrade the Windows family together in a dedicated migration.
      - dependency-name: "windows"
        versions: ["0.100"]
      - dependency-name: "windows-future"
        versions: ["0.100"]
      # ocrs 0.13.1 exposes rten-imageproc 0.26 types. Wait for a matching ocrs.
      - dependency-name: "rten"
        versions: ["0.27"]
      - dependency-name: "rten-imageproc"
        versions: ["0.27"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Action majors belong in the same weekly review batch; workflow tests
      # validate the complete proposed configuration before merge.
      github-actions:
        patterns:
          - "*"
