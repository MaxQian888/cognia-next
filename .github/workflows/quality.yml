name: Code Quality

# ============================================================================
# Deterministic quality gates — derived, not hand-written
# ============================================================================
# The gate list lives in ONE place: `scripts/gates/check-all.mjs`. This
# workflow does not restate it. The `prepare` job asks that file for its group
# manifest and the `gates` job fans out one runner per group.
#
# Why derived: the previous version of this workflow was a single job with 25
# hand-written sequential steps. Two things went wrong with that shape.
#
#   1. Drift. `check:all` (the local aggregate) and this file were two
#      hand-maintained copies of the same list, and they diverged — four gates
#      ran only locally, nine only in CI, and `build:packages` /
#      `lint:claude-md` ran nowhere at all. `pnpm gates:registry` now fails the
#      build if any verification-shaped script is wired to nothing.
#
#   2. Truncation. With no `continue-on-error`, the first red gate stopped the
#      other 24. Finding out what is actually broken took one 30–50 minute run
#      per failure. Groups run in parallel with `fail-fast: false`, so one run
#      returns the COMPLETE list.
#
# Adding a gate: add it to REGISTRY in scripts/gates/check-all.mjs. Nothing
# here needs to change — including for a brand-new group, which becomes a new
# matrix entry automatically.
# ============================================================================

on:
  workflow_call:
    inputs:
      quality-mode:
        type: string
        default: auto
        description: auto selects affected gates on PRs and validated trunk pushes
  workflow_dispatch:
    inputs:
      quality-mode:
        type: choice
        options: [full, incremental, auto]
        default: full
        description: Quality selection mode

concurrency:
  # PRs cancel superseded runs. Trunk pushes never cancel a run in progress:
  # trunk runs are the only writers of the Rust, lint-result and compiled
  # package caches every PR restores, and a burst of pushes would otherwise
  # leave dev with no completed signal at all. GitHub keeps only the newest
  # pending trunk run.
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Gate Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      actions: read

    outputs:
      groups: ${{ steps.manifest.outputs.groups }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # No pnpm install here on purpose: check-all.mjs imports nothing outside
      # node: builtins, so the manifest is available in seconds rather than
      # after a full dependency install.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - name: Test Git change planning
        run: node --test scripts/ci/change-plan.test.mjs

      - name: Resolve committed changes
        env:
          REQUESTED_MODE: ${{ inputs.quality-mode || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/change-plan.mjs --output .cache/ci/changes.json

      - name: Read the gate group manifest
        id: manifest
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, writeFileSync } from 'node:fs';
          import { readChangePlan } from './scripts/ci/change-plan.mjs';
          import { buildQualityPlan } from './scripts/gates/check-all.mjs';
          const plan = buildQualityPlan(readChangePlan('.cache/ci/changes.json'));
          appendFileSync(process.env.GITHUB_OUTPUT, `groups=${JSON.stringify(plan.include)}\n`);
          writeFileSync('.cache/ci/quality-plan.json', JSON.stringify(plan, null, 2));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Quality plan\nMode: ${plan.mode}\n\n${plan.selected.length} selected gates, ${plan.skipped.length} skipped gates.\n\nBase: ${plan.base}\nHead: ${plan.head}\n\nSee quality-change-plan for selection reasons.\n`);
          NODE

      - name: Publish immutable Quality change plan
        uses: actions/upload-artifact@v7
        with:
          name: quality-change-plan
          path: .cache/ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  gates:
    name: Gates (${{ matrix.group }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    strategy:
      # Never stop sibling groups because one failed — the whole point is to
      # surface every failure in a single run.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.groups) }}

    steps:
      # Execution consumes the same HEAD-bound manifest as the matrix planner.
      # Gate bodies still inspect their complete input domains.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download Quality change plan
        uses: actions/download-artifact@v8
        with:
          name: quality-change-plan
          path: .cache/ci/

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Setup Python
        if: matrix.python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Bun for release bundle tests
        if: matrix.group == 'gate-tests'
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Setup uv
        if: matrix.python
        uses: astral-sh/setup-uv@v10.3.3

      # `components:` is not optional here — dtolnay/rust-toolchain installs
      # the minimal profile, which ships neither clippy nor rustfmt.
      - name: Setup Rust toolchain
        if: matrix.rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        if: matrix.rust
        uses: Swatinem/rust-cache@v2
        with:
          # Matrix lanes compile different dependency sets. The default job key
          # is identical for every lane; immutable caches cannot merge writers.
          key: quality-${{ matrix.group }}
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' }}
          workspaces: ". -> target"
          cache-on-failure: true

      # cargo-deny is not a rustup component; without it the `rust:deny` gate
      # reports as advisory-failed and the supply-chain scan never runs.
      - name: Install cargo-deny
        if: matrix.group == 'supply-chain' && contains(matrix.scripts, 'rust:deny')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # ADR-0068 C2 — restore the incremental-typecheck state so `pnpm
      # typecheck` on a small PR re-checks only what changed. *.tsbuildinfo is
      # gitignored, so without this cache every CI typecheck is a cold full
      # program check. The buildinfo is advisory: stale or missing simply
      # falls back to a full check.
      - name: Cache TypeScript incremental state
        if: matrix.group == 'types'
        uses: actions/cache@v6
        with:
          path: |
            .cache/typecheck/
            .cache/typescript/
          key: ${{ runner.os }}-${{ runner.arch }}-node26-tsbuildinfo-${{ hashFiles('**/pnpm-lock.yaml', '**/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node26-tsbuildinfo-${{ hashFiles('**/pnpm-lock.yaml', '**/tsconfig*.json') }}-

      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-

      - name: Restore compiled workspace prerequisites cache
        id: prereq-cache
        if: github.event_name == 'pull_request' && matrix.group == 'plugin-sdk'
        uses: actions/cache/restore@v6
        with:
          path: |
            packages/*/dist/
            sidecar/webclone/dist/
          key: ${{ runner.os }}-${{ runner.arch }}-node26-workspace-dist-${{ hashFiles('packages/**', '!packages/*/dist/**', '!packages/*/node_modules/**', 'sidecar/src/**', 'sidecar/webclone/**', '!sidecar/webclone/dist/**', '!sidecar/webclone/node_modules/**', 'types/**', 'scripts/build/**', 'pnpm-lock.yaml', 'tsconfig*.json') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install audit search dependency
        if: matrix.group == 'audit'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep

      # Only Rust-backed groups link the desktop stack. Audit-only jobs should
      # not download GTK/WebKit and their transitive system dependencies.
      - name: Install gate system dependencies
        if: matrix.rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ripgrep \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # The artifacts group already starts with build:packages in the registry.
      # SDK consumers need that prerequisite before their separate build gates.
      # PRs reuse the exact output trunk's test planner saved for the same
      # sources (see test.yml `jest-plan`); any miss builds from scratch.
      - name: Build workspace package prerequisites
        if: matrix.group == 'plugin-sdk' && steps.prereq-cache.outputs.cache-hit != 'true'
        run: pnpm build:packages

      - name: Prepare the plugin Node runtime
        if: matrix.group == 'artifacts'
        run: pnpm plugin-node:prepare

      # Bundle tests exercise both release bundlers against the real engine,
      # whose dependencies and compiled analyzer are outside the workspace.
      - name: Build webclone for release bundle tests
        if: matrix.group == 'gate-tests'
        run: pnpm sidecar:webclone:build

      - name: Install the Python plugin SDK
        if: matrix.python
        run: python -m pip install -e "plugin-sdk/python[dev]"

      # ESLint and Prettier results are cached per file content
      # (`--cache-strategy content`; mtimes are meaningless on a fresh
      # checkout). Only PRs restore: the trunk run stays a cold, authoritative
      # pass and is the only writer, so cross-file state that a per-file
      # cache cannot see (typed sidecar rules, config drift) is re-proven on
      # every trunk push and never published from an unmerged branch.
      - name: Resolve lint result cache identity
        id: lint-cache-key
        if: matrix.group == 'lint' || matrix.group == 'format'
        env:
          # Typed sidecar rules also read workspace sources and imported JSON.
          # Hash that closure so a PR cannot reuse stale cross-file diagnostics.
          CACHE_PREFIX: ${{ runner.os }}-${{ runner.arch }}-node26-${{ matrix.group }}-results-v2-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', 'sidecar/**/package.json', 'sidecar/**/pnpm-lock.yaml', 'sidecar/**/package-lock.json', 'packages/*/package.json', '**/eslint.config.*', '**/.prettier*', '**/tsconfig*.json', '!**/node_modules/**', '!**/dist/**', '!**/.next/**', '!**/.cache/**') }}-${{ matrix.group == 'lint' && hashFiles('sidecar/src/**', 'sidecar/codex-app-control/**', 'sidecar/test-support/**', 'sidecar/*.mjs', 'sidecar/webclone/src/**', 'packages/*/src/**', 'lib/**', 'types/**', '!**/node_modules/**', '!**/dist/**', '!**/.cache/**') || 'format' }}-
        run: |
          printf 'prefix=%s\nkey=%s%s\n' "$CACHE_PREFIX" "$CACHE_PREFIX" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Restore lint result cache
        id: lint-result-cache
        if: (github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master'))) && (matrix.group == 'lint' || matrix.group == 'format')
        uses: actions/cache/restore@v6
        with:
          # Trunk checks only whether this immutable key already exists.
          lookup-only: ${{ github.event_name != 'pull_request' }}
          path: .cache/${{ matrix.group == 'lint' && 'eslint' || 'prettier' }}
          key: ${{ steps.lint-cache-key.outputs.key }}
          restore-keys: ${{ steps.lint-cache-key.outputs.prefix }}

      # check-all.mjs runs every gate in the group, continues past failures,
      # writes a ✓/✗ table to the job summary, and exits non-zero if any
      # blocking gate failed.
      - name: Run gate group
        id: gates
        run: node scripts/gates/check-all.mjs --change-plan .cache/ci/changes.json --group ${{ matrix.group }}

      - name: Save lint result cache
        # A completed lint/format failure still yields reusable per-file results.
        # Preserve its failing gate while excluding crashes and cancelled runs.
        if: ${{ !cancelled() && steps.gates.outputs.lint-cache-ready == 'true' && steps.lint-result-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master') && (matrix.group == 'lint' || matrix.group == 'format') }}
        uses: actions/cache/save@v6
        with:
          path: .cache/${{ matrix.group == 'lint' && 'eslint' || 'prettier' }}
          key: ${{ steps.lint-cache-key.outputs.key }}
