name: Code Quality

# ============================================================================
# Code Quality & Security Checks
# ============================================================================
# Runs ESLint, TypeScript type checking, and security audits.
# This workflow works OUT-OF-THE-BOX without requiring any secrets.
# ============================================================================

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Display CI/CD Configuration
        shell: bash
        run: |
          echo "## 🔧 CI/CD Configuration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Optional Features Status:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "⚪ All optional integrations are **DISABLED** by default" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Optional features (currently disabled):" >> "$GITHUB_STEP_SUMMARY"
          echo "- Codecov integration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vercel deployments" >> "$GITHUB_STEP_SUMMARY"
          echo "- macOS code signing" >> "$GITHUB_STEP_SUMMARY"
          echo "- Windows code signing" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ℹ️ To enable optional features:" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Add the required secrets to your GitHub repository" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Uncomment the relevant sections in the workflow files" >> "$GITHUB_STEP_SUMMARY"
          echo "3. See \`CI_CD.md\` for detailed setup instructions" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ADR-0068 C2 — restore the incremental-typecheck state so `pnpm
      # typecheck` on a small PR re-checks only what changed. *.tsbuildinfo is
      # gitignored, so without this cache every CI typecheck is a cold full
      # program check. The buildinfo is advisory: stale or missing simply
      # falls back to a full check. Same key shape as the Next.js build cache
      # in test.yml (lockfile hash + source hash, lockfile-only restore key).
      - name: Cache TypeScript incremental state
        uses: actions/cache@v5
        with:
          path: |
            tsconfig.tsbuildinfo
            tsconfig.build.tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting (Prettier)
        run: pnpm format:check

      - name: TypeScript type checking
        run: pnpm typecheck

      - name: Plugin extension slot audit
        run: pnpm audit:slots

      - name: Plugin silent-failure flag audit (ADR 0016 T4)
        run: pnpm audit:silent-flags

      - name: PII boundary audit
        run: pnpm audit:pii-boundaries

      - name: Plugin SDK WIT contract sync check
        run: pnpm lint:plugin-sdk-wit

      - name: Plugin contract generation freshness
        run: node scripts/plugin/generate-contract.mjs --check

      - name: Plugin author import boundary
        run: node scripts/plugin/check-author-imports.mjs

      - name: Standalone plugin SDK build and package consumer
        run: |
          pnpm --dir packages/plugin-sdk build
          pnpm --dir packages/plugin-sdk pack:test
          node scripts/plugin/test-author-scaffold.mjs

      - name: Python plugin SDK contract suite
        run: |
          python -m pip install -e "plugin-sdk/python[dev]"
          python -m pytest plugin-sdk/python/tests

      - name: Rust plugin runtime security suite
        run: cargo test --locked -p cognia-plugin-runtime

      - name: i18n lint (key parity + hardcoded-string baseline + key existence)
        run: pnpm lint:i18n

      - name: i18n generated-bundle freshness
        run: pnpm i18n:build:check

      - name: Tauri command-name parity audit
        run: pnpm audit:command-parity

      - name: E2E governance audit
        run: pnpm audit:e2e-governance

      - name: Static-export node-builtin guard
        run: pnpm lint:static-export

      - name: Config mirror sync check (companion port)
        run: pnpm config:sync:check

      - name: Gate script unit tests
        run: |
          pnpm audit:command-parity:test
          pnpm lint:static-export:test
          pnpm config:sync:test
          pnpm audit:silent-flags:test
          pnpm audit:pii-boundaries:test
          pnpm audit:e2e-governance:test
          node --test scripts/plugin/check-author-imports.test.mjs scripts/plugin/generate-contract.test.mjs scripts/plugin/test-sdk-package.test.mjs scripts/plugin/test-author-scaffold.test.mjs scripts/plugin/node-plugin-host.test.mjs scripts/build/prepare-plugin-node.test.mjs

      - name: Security audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for outdated dependencies
        run: pnpm outdated
        continue-on-error: true
