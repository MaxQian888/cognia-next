name: Code Quality

# ============================================================================
# Deterministic quality gates — derived, not hand-written
# ============================================================================
# The gate list lives in ONE place: `scripts/gates/check-all.mjs`. This
# workflow does not restate it. The `prepare` job asks that file for its group
# manifest and the `gates` job fans out one runner per group.
#
# Why derived: the previous version of this workflow was a single job with 25
# hand-written sequential steps. Two things went wrong with that shape.
#
#   1. Drift. `check:all` (the local aggregate) and this file were two
#      hand-maintained copies of the same list, and they diverged — four gates
#      ran only locally, nine only in CI, and `build:packages` /
#      `lint:claude-md` ran nowhere at all. `pnpm gates:registry` now fails the
#      build if any verification-shaped script is wired to nothing.
#
#   2. Truncation. With no `continue-on-error`, the first red gate stopped the
#      other 24. Finding out what is actually broken took one 30–50 minute run
#      per failure. Groups run in parallel with `fail-fast: false`, so one run
#      returns the COMPLETE list.
#
# Adding a gate: add it to REGISTRY in scripts/gates/check-all.mjs. Nothing
# here needs to change — including for a brand-new group, which becomes a new
# matrix entry automatically.
# ============================================================================

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  # PRs cancel superseded runs. Trunk pushes never cancel a run in progress:
  # trunk runs are the only writers of the Rust, lint-result and compiled
  # package caches every PR restores, and a burst of pushes would otherwise
  # leave dev with no completed signal at all. GitHub keeps only the newest
  # pending trunk run.
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Gate Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    outputs:
      groups: ${{ steps.manifest.outputs.groups }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # No pnpm install here on purpose: check-all.mjs imports nothing outside
      # node: builtins, so the manifest is available in seconds rather than
      # after a full dependency install.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - name: Read the gate group manifest
        id: manifest
        run: |
          groups="$(node scripts/gates/check-all.mjs --list-groups --json)"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "Gate groups: $groups"

  gates:
    name: Gates (${{ matrix.group }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    strategy:
      # Never stop sibling groups because one failed — the whole point is to
      # surface every failure in a single run.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.groups) }}

    steps:
      # Gates inspect tracked files and the current index; they do not diff
      # against an ancestor. Base-aware test selection owns its separate fetch.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Setup Python
        if: matrix.python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Bun for release bundle tests
        if: matrix.group == 'gate-tests'
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Setup uv
        if: matrix.python
        uses: astral-sh/setup-uv@v10.2.0

      # `components:` is not optional here — dtolnay/rust-toolchain installs
      # the minimal profile, which ships neither clippy nor rustfmt.
      - name: Setup Rust toolchain
        if: matrix.rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        if: matrix.rust
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' }}
          workspaces: ". -> target"

      # cargo-deny is not a rustup component; without it the `rust:deny` gate
      # reports as advisory-failed and the supply-chain scan never runs.
      - name: Install cargo-deny
        if: matrix.group == 'supply-chain'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # ADR-0068 C2 — restore the incremental-typecheck state so `pnpm
      # typecheck` on a small PR re-checks only what changed. *.tsbuildinfo is
      # gitignored, so without this cache every CI typecheck is a cold full
      # program check. The buildinfo is advisory: stale or missing simply
      # falls back to a full check.
      - name: Cache TypeScript incremental state
        if: matrix.group == 'types'
        uses: actions/cache@v6
        with:
          path: |
            tsconfig.tsbuildinfo
            tsconfig.build.tsbuildinfo
          key: ${{ runner.os }}-${{ runner.arch }}-node26-tsbuildinfo-${{ hashFiles('**/pnpm-lock.yaml', '**/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node26-tsbuildinfo-${{ hashFiles('**/pnpm-lock.yaml', '**/tsconfig*.json') }}-

      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-

      - name: Restore compiled workspace prerequisites cache
        id: prereq-cache
        if: github.event_name == 'pull_request' && matrix.group == 'plugin-sdk'
        uses: actions/cache/restore@v6
        with:
          path: |
            packages/*/dist/
            sidecar/webclone/dist/
          key: ${{ runner.os }}-${{ runner.arch }}-node26-workspace-dist-${{ hashFiles('packages/**', '!packages/*/dist/**', '!packages/*/node_modules/**', 'sidecar/src/**', 'sidecar/webclone/**', '!sidecar/webclone/dist/**', '!sidecar/webclone/node_modules/**', 'types/**', 'scripts/build/**', 'pnpm-lock.yaml', 'tsconfig*.json') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # Knip loads standalone Worker configs; their plugin imports must resolve
      # even though these packages intentionally sit outside the root workspace.
      - name: Install standalone Worker dependencies
        if: matrix.group == 'types'
        run: |
          pnpm --dir services/share-server/worker install --frozen-lockfile --prefer-offline
          pnpm --dir services/update-server/worker install --frozen-lockfile --prefer-offline

      - name: Install audit search dependency
        if: matrix.group == 'audit'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep

      # Only Rust-backed groups link the desktop stack. Audit-only jobs should
      # not download GTK/WebKit and their transitive system dependencies.
      - name: Install gate system dependencies
        if: matrix.rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ripgrep \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # The artifacts group already starts with build:packages in the registry.
      # SDK consumers need that prerequisite before their separate build gates.
      # PRs reuse the exact output trunk's test planner saved for the same
      # sources (see test.yml `jest-plan`); any miss builds from scratch.
      - name: Build workspace package prerequisites
        if: matrix.group == 'plugin-sdk' && steps.prereq-cache.outputs.cache-hit != 'true'
        run: pnpm build:packages

      - name: Prepare the plugin Node runtime
        if: matrix.group == 'artifacts'
        run: pnpm plugin-node:prepare

      # Bundle tests exercise both release bundlers against the real engine,
      # whose dependencies and compiled analyzer are outside the workspace.
      - name: Build webclone for release bundle tests
        if: matrix.group == 'gate-tests'
        run: pnpm sidecar:webclone:build

      - name: Install the Python plugin SDK
        if: matrix.python
        run: python -m pip install -e "plugin-sdk/python[dev]"

      # ESLint and Prettier results are cached per file content
      # (`--cache-strategy content`; mtimes are meaningless on a fresh
      # checkout). Only PRs restore: the trunk run stays a cold, authoritative
      # pass and is the only writer, so cross-file state that a per-file
      # cache cannot see (typed sidecar rules, config drift) is re-proven on
      # every trunk push and never published from an unmerged branch.
      - name: Restore lint result cache
        if: github.event_name == 'pull_request' && (matrix.group == 'lint' || matrix.group == 'format')
        uses: actions/cache/restore@v6
        with:
          path: .cache/${{ matrix.group == 'lint' && 'eslint' || 'prettier' }}
          key: ${{ runner.os }}-node26-${{ matrix.group }}-results-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs', '.prettierrc.json', '.prettierignore', 'tsconfig.json', 'sidecar/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node26-${{ matrix.group }}-results-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs', '.prettierrc.json', '.prettierignore', 'tsconfig.json', 'sidecar/tsconfig.json') }}-

      # check-all.mjs runs every gate in the group, continues past failures,
      # writes a ✓/✗ table to the job summary, and exits non-zero if any
      # blocking gate failed.
      - name: Run gate group
        run: node scripts/gates/check-all.mjs --group ${{ matrix.group }}

      - name: Save lint result cache
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master') && (matrix.group == 'lint' || matrix.group == 'format')
        uses: actions/cache/save@v6
        with:
          path: .cache/${{ matrix.group == 'lint' && 'eslint' || 'prettier' }}
          key: ${{ runner.os }}-node26-${{ matrix.group }}-results-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs', '.prettierrc.json', '.prettierignore', 'tsconfig.json', 'sidecar/tsconfig.json') }}-${{ github.sha }}
