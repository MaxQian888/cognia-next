name: Code Quality

# ============================================================================
# Deterministic quality gates — derived, not hand-written
# ============================================================================
# The gate list lives in ONE place: `scripts/gates/check-all.mjs`. This
# workflow does not restate it. The `prepare` job asks that file for its group
# manifest and the `gates` job fans out one runner per group.
#
# Why derived: the previous version of this workflow was a single job with 25
# hand-written sequential steps. Two things went wrong with that shape.
#
#   1. Drift. `check:all` (the local aggregate) and this file were two
#      hand-maintained copies of the same list, and they diverged — four gates
#      ran only locally, nine only in CI, and `build:packages` /
#      `lint:claude-md` ran nowhere at all. `pnpm gates:registry` now fails the
#      build if any verification-shaped script is wired to nothing.
#
#   2. Truncation. With no `continue-on-error`, the first red gate stopped the
#      other 24. Finding out what is actually broken took one 30–50 minute run
#      per failure. Groups run in parallel with `fail-fast: false`, so one run
#      returns the COMPLETE list.
#
# Adding a gate: add it to REGISTRY in scripts/gates/check-all.mjs. Nothing
# here needs to change — including for a brand-new group, which becomes a new
# matrix entry automatically.
# ============================================================================

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Gate Matrix
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      groups: ${{ steps.manifest.outputs.groups }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # No pnpm install here on purpose: check-all.mjs imports nothing outside
      # node: builtins, so the manifest is available in seconds rather than
      # after a full dependency install.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.x

      - name: Read the gate group manifest
        id: manifest
        run: |
          groups="$(node scripts/gates/check-all.mjs --list-groups --json)"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "Gate groups: $groups"

  gates:
    name: Gates (${{ matrix.group }})
    needs: prepare
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      # Never stop sibling groups because one failed — the whole point is to
      # surface every failure in a single run.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.groups) }}

    steps:
      # Full history: several gates diff against git (lint-i18n --staged
      # semantics, the static-export scanner's file listing, command parity).
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: "pnpm"

      - name: Setup Python
        if: matrix.python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # `components:` is not optional here — dtolnay/rust-toolchain installs
      # the minimal profile, which ships neither clippy nor rustfmt.
      - name: Setup Rust toolchain
        if: matrix.rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        if: matrix.rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # cargo-deny is not a rustup component; without it the `rust:deny` gate
      # reports as advisory-failed and the supply-chain scan never runs.
      - name: Install cargo-deny
        if: matrix.group == 'supply-chain'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # ADR-0068 C2 — restore the incremental-typecheck state so `pnpm
      # typecheck` on a small PR re-checks only what changed. *.tsbuildinfo is
      # gitignored, so without this cache every CI typecheck is a cold full
      # program check. The buildinfo is advisory: stale or missing simply
      # falls back to a full check.
      - name: Cache TypeScript incremental state
        if: matrix.group == 'types'
        uses: actions/cache@v5
        with:
          path: |
            tsconfig.tsbuildinfo
            tsconfig.build.tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Python plugin SDK
        if: matrix.python
        run: python -m pip install -e "plugin-sdk/python[dev]"

      # check-all.mjs runs every gate in the group, continues past failures,
      # writes a ✓/✗ table to the job summary, and exits non-zero if any
      # blocking gate failed.
      - name: Run gate group
        run: node scripts/gates/check-all.mjs --group ${{ matrix.group }}
