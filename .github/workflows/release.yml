name: Release

# ============================================================================
# GitHub Release Creation
# ============================================================================
# Creates a GitHub release when a version tag is pushed.
# Triggers on tags matching v* (e.g., v1.0.0, v2.1.0-beta).
#
# This workflow:
# 1. Runs quality checks and tests
# 2. Builds Tauri desktop apps for all platforms via tauri-action, which also
#    creates the draft GitHub release and uploads installers + the updater
#    signatures (*.sig) and latest.json manifest the in-app updater consumes.
# 3. Builds and verifies a signed Android APK before desktop release publication.
# 4. Archives a signed iOS build and uploads it to App Store Connect/TestFlight.
#
# `secrets: inherit` forwards updater signing plus Developer ID/notarization
# credentials to the reusable build-tauri workflow. Tagged macOS jobs fail
# closed if any required release credential is missing or inconsistent. See
# src-tauri/UPDATER.md for setup.
# ============================================================================

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run quality checks first
  quality:
    name: Quality Check
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/quality.yml

  # Run tests
  test:
    name: Test Suite
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/test.yml

  build-android:
    name: Build signed Android release
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm version:sync:check
      - run: node --test scripts/sync/version-sync.test.mjs mobile/scripts/android-release.test.mjs
      - name: Validate tag and prepare release signing
        id: android-signing
        run: node mobile/scripts/android-release.mjs preflight
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
      - name: Build offline release APK
        run: pnpm mobile:build:android --release
      - name: Sign and verify Android artifact
        run: node mobile/scripts/android-release.mjs package
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.android-signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
      - name: Preserve release crash mapping
        run: cp mobile/android/app/build/outputs/mapping/release/mapping.txt dist/mobile/android-mapping.txt
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        env:
          SIGNING_DIRECTORY: ${{ steps.android-signing.outputs.signing_directory }}
        run: |
          if [[ -n "$SIGNING_DIRECTORY" && "$SIGNING_DIRECTORY" == "$RUNNER_TEMP"/cognia-android-signing-* ]]; then
            rm -rf -- "$SIGNING_DIRECTORY"
          fi

  build-ios:
    name: Build and upload iOS release
    needs: [quality, test]
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_PLATFORM: mobile
      COGNIA_MOBILE_DEV: "0"
      NODE_OPTIONS: --max-old-space-size=16384
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml
      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm version:sync:check
      - run: node --test scripts/sync/version-sync.test.mjs mobile/scripts/ios-release.test.mjs
      - name: Require App Store Connect upload credentials
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          node -e 'for (const key of ["APPSTORE_ISSUER_ID", "APPSTORE_API_KEY_ID", "APPSTORE_API_PRIVATE_KEY"]) { if (!process.env[key]?.trim()) throw new Error("Missing " + key) }'
      - name: Build offline iOS assets
        run: |
          pnpm mobile:prepare
          pnpm exec next build --webpack
          pnpm --filter mobile run sync:ios
      - name: Validate iOS distribution signing
        id: ios-signing
        run: node mobile/scripts/ios-release.mjs preflight
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_SIGNING_CERT_SHA256: ${{ secrets.IOS_SIGNING_CERT_SHA256 }}
      - name: Archive and verify iOS release
        id: ios-package
        run: node mobile/scripts/ios-release.mjs package
        env:
          IOS_SIGNING_DIRECTORY: ${{ steps.ios-signing.outputs.signing_directory }}
      - name: Preserve verified iOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: dist/ios/
          if-no-files-found: error
          retention-days: 30
      - name: Upload verified IPA to App Store Connect
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ios-package.outputs.ipa_path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          backend: AppStoreAPI
          # The action polls by build number only, which repeats across marketing versions.
          # Confirm upload here; check this version's processing status in App Store Connect.
          wait-for-processing: "false"
      - name: Clean up iOS signing
        if: always()
        run: node mobile/scripts/ios-release.mjs cleanup
        env:
          IOS_SIGNING_DIRECTORY: ${{ steps.ios-signing.outputs.signing_directory }}

  # Build Tauri apps for all platforms AND publish the draft release with
  # signed updater artifacts + latest.json (tauri-action owns release creation
  # because the manifest needs the uploaded asset URLs).
  build-tauri:
    name: Build Tauri
    needs: [quality, test, build-android, build-ios]
    # The write scope lives on the CALLER, not inside build-tauri.yml: a
    # reusable workflow cannot request more than its caller holds, and the
    # other caller (ci.yml) runs read-only. tauri-action needs `contents:
    # write` to create the release and upload the installers, `.sig` files
    # and latest.json.
    permissions:
      contents: write
    uses: ./.github/workflows/build-tauri.yml
    with:
      tagName: ${{ github.ref_name }}
      androidArtifact: android-release
    secrets: inherit

  publish-agent-hosts:
    name: Publish Agent host (${{ matrix.target }})
    needs: [quality, test, build-tauri]
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
            package: agent-host-darwin-arm64
            artifact: cognia-agent-macos-arm64
            archive: tar.gz
          - runner: ubuntu-latest
            target: linux-x64
            package: agent-host-linux-x64
            artifact: cognia-agent-linux-x64
            archive: tar.gz
          - runner: windows-latest
            target: win32-x64
            package: agent-host-win32-x64
            artifact: cognia-agent-win-x64
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # Use rust-toolchain.toml before rust-cache computes its compiler hash.
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      # Tag caches are isolated from other tags. Nightly warms this shared key
      # on the default branch; releases only restore that trusted dependency cache.
      # A new compiler pin or cache miss falls back to the normal Cargo build.
      - name: Restore release native helper dependencies
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: agent-host-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}
          workspaces: ". -> target"
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: false
          save-if: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0
      - id: release
        name: Check whether this version is unpublished
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/${{ matrix.package }}/package.json').version")
          if npm view "@cognia/${{ matrix.package }}@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-

      - run: pnpm install --frozen-lockfile --prefer-offline
      - if: matrix.target == 'darwin-arm64'
        name: Require Developer ID release signing
        run: node scripts/ci/require-macos-release-signing.mjs
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - if: matrix.target == 'darwin-arm64'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Prepare built-in plugins before compiling the host
        run: node scripts/build/build-browser-builtin-plugins.mjs
      - run: pnpm cli:build:binary -- --target ${{ matrix.target }} --variant all --archive
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.target == 'darwin-arm64' && secrets.APPLE_SIGNING_IDENTITY || '' }}
      - if: matrix.target == 'darwin-arm64'
        name: Notarize full and slim CLI layouts
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent cli/dist/bin/cognia-agent-macos-arm64 "$RUNNER_TEMP/cognia-agent-full.zip"
          ditto -c -k --keepParent cli/dist/bin/cognia-agent-macos-arm64-slim "$RUNNER_TEMP/cognia-agent-slim.zip"
          xcrun notarytool submit "$RUNNER_TEMP/cognia-agent-full.zip" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun notarytool submit "$RUNNER_TEMP/cognia-agent-slim.zip" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
      - run: pnpm cli:smoke:bun -- ${{ matrix.target }} --variant=all
      - name: Upload full and slim standalone archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          "cli/dist/bin/${{ matrix.artifact }}.${{ matrix.archive }}"
          "cli/dist/bin/${{ matrix.artifact }}-slim.${{ matrix.archive }}"
          "cli/dist/bin/${{ matrix.artifact }}-size-report.json"
          --clobber
      # Reruns still produce and certify the local payload, even when this npm
      # version already exists. The SDK consumer needs these exact release bytes.
      - run: pnpm agent:host:package -- ${{ matrix.target }}
      - run: pnpm --dir packages/agent build
      - run: pnpm agent:host:smoke -- ${{ matrix.target }}
      - name: Seal SDK host prerequisites
        if: matrix.target == 'linux-x64'
        run: node scripts/ci/release-agent-host.mjs prepare
      - name: Publish SDK host prerequisites
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: release-agent-host-linux-x64-${{ github.sha }}
          path: .cache/release-agent-host/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
      - if: steps.release.outputs.publish == 'true'
        run: pnpm --dir packages/${{ matrix.package }} publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ADR-0224 A1 / ADR-0235 P3: the always-on host archives, one per catalog
  # `archive` target in scripts/release/update-catalog.mjs. Each builds on a
  # runner of its own platform and architecture: the brain ships this
  # install's native addons. Linux builds on Ubuntu 22.04, the glibc 2.35
  # floor the remote installer probes for, and the packager refuses any ELF
  # file that needs a newer glibc. The archives are attached to the release;
  # the signed update catalog lists them only once the offline signer adds
  # their entries (`pnpm update:catalog host-entries --archive …`).
  publish-host-archives:
    name: Publish host archive (${{ matrix.target }})
    needs: [quality, test, build-tauri]
    permissions:
      contents: write
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - if: runner.os == 'Linux'
        name: Install the server's system libraries
        # The same libraries Dockerfile.cognia-server's build stage installs:
        # screen capture (PipeWire, GBM, EGL, Wayland), xkbcommon, OpenSSL,
        # and libclang for bindgen.
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          pkg-config libssl-dev libpipewire-0.3-dev libgbm-dev libegl-dev
          libwayland-dev libxkbcommon-dev libclang-dev binutils xz-utils
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml
      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - if: runner.os == 'macOS'
        name: Require Developer ID release signing
        run: node scripts/ci/require-macos-release-signing.mjs
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - if: runner.os == 'macOS'
        name: Store the notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: xcrun notarytool store-credentials cognia-host --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
      - name: Prepare built-in plugins before compiling the host
        run: node scripts/build/build-browser-builtin-plugins.mjs
      # webclone, the code-graph grammars, the VS Code extension host and the
      # native helpers the brain layout copies in.
      - run: pnpm cli:release:prepare
      - name: Build and package the host archive
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: |
          args=(--target "${{ matrix.target }}")
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            args+=(--sign "$APPLE_SIGNING_IDENTITY" --notarize cognia-host)
          fi
          NODE_OPTIONS=--max-old-space-size=8192 node scripts/build/package-host-archive.mjs "${args[@]}"
      # Boot the unpacked archive the way its service runs it, with its own
      # Node, and wait until /readyz reports the brain and sidecar ready.
      - name: Smoke the unpacked archive
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          name="cognia-host-$version-${{ matrix.target }}"
          smoke="$RUNNER_TEMP/host-smoke"
          mkdir -p "$smoke/data"
          tar -xzf "dist/host/$name.tar.gz" -C "$smoke"
          root="$smoke/$name"
          export COGNIA_DATA_DIR="$smoke/data"
          export COGNIA_BRAIN_ENTRY="$root/brain/cli.mjs"
          export COGNIA_SIDECAR_SCRIPT="$root/brain/sidecar/claude-host.mjs"
          export NODE_ENV=production
          export PATH="$root/node/bin:$PATH"
          "$root/bin/cognia-server" init
          "$root/bin/cognia-server" serve --bind-loopback --no-mdns --port 28777 > "$smoke/serve.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            if curl -skf https://127.0.0.1:28777/readyz; then
              kill "$pid"
              exit 0
            fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done
          curl -sk https://127.0.0.1:28777/readyz || true
          cat "$smoke/serve.log"
          kill "$pid" 2>/dev/null || true
          exit 1
      - name: Attach the host archive to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          name="cognia-host-$version-${{ matrix.target }}"
          gh release upload "$GITHUB_REF_NAME" "dist/host/$name.tar.gz" "dist/host/$name.tar.gz.sha256" --clobber
          {
            echo "Host archive \`$name.tar.gz\`: \`$(cut -d' ' -f1 "dist/host/$name.tar.gz.sha256")\`"
            echo
            echo "Catalog entry (offline signer): \`pnpm update:catalog host-entries --version $version --channel <channel> --target ${{ matrix.target }} --archive $name.tar.gz --url https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$name.tar.gz --out <entries.json>\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-agent-sdk:
    name: Publish Agent SDK
    needs: publish-agent-hosts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - id: release
        name: Check whether this version is unpublished
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/agent/package.json').version")
          if npm view "@cognia/agent@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-

      - if: steps.release.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Locate SDK host prerequisites
        id: host-artifact
        if: steps.release.outputs.publish == 'true'
        run: node scripts/ci/release-agent-host.mjs select
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Download SDK host prerequisites
        if: steps.release.outputs.publish == 'true' && steps.host-artifact.outputs.id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.host-artifact.outputs.id }}
          path: .cache/release-agent-host/
          digest-mismatch: error
      - name: Verify and restore SDK host prerequisites
        if: steps.release.outputs.publish == 'true' && steps.host-artifact.outputs.id != ''
        run: node scripts/ci/release-agent-host.mjs restore
      # Only a successfully enumerated absence takes this path. API, download,
      # provenance, integrity, and smoke failures remain blocking failures.
      - name: Install fallback Bun compiler
        if: steps.release.outputs.publish == 'true' && steps.host-artifact.outputs.id == ''
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install fallback Rust toolchain
        if: steps.release.outputs.publish == 'true' && steps.host-artifact.outputs.id == ''
        run: rustup show active-toolchain
      - name: Restore fallback native helper dependencies
        if: steps.release.outputs.publish == 'true' && steps.host-artifact.outputs.id == ''
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          shared-key: agent-host-release-v1-${{ runner.os }}-${{ runner.arch }}-linux-x64
          workspaces: ". -> target"
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: false
          save-if: false
      - name: Build missing SDK host prerequisites
        if: steps.release.outputs.publish == 'true' && steps.host-artifact.outputs.id == ''
        run: |
          node scripts/build/build-browser-builtin-plugins.mjs
          pnpm cli:build:binary -- --target linux-x64 --variant full
          pnpm cli:smoke:bun -- linux-x64 --variant=full
          pnpm agent:host:package -- linux-x64
      - name: Prepare Node RPC smoke prerequisites
        if: steps.release.outputs.publish == 'true'
        run: |
          node scripts/ci/release-agent-host.mjs env
          pnpm sidecar:webclone:build
          node scripts/build/build-browser-builtin-plugins.mjs
      - if: steps.release.outputs.publish == 'true'
        run: pnpm agent:sdk:smoke
      - if: steps.release.outputs.publish == 'true'
        run: pnpm --dir packages/agent pack:test --require-host
      - if: steps.release.outputs.publish == 'true'
        run: pnpm --dir packages/agent publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
