name: CI Report

# ============================================================================
# Stage two of a two-stage reporting pipeline
# ============================================================================
# The main pipeline produces artifacts; this workflow reads them and writes
# the result somewhere a human will see it.
#
# WHY A SEPARATE WORKFLOW. `ci.yml` runs with the repository's read-only
# default token, and a `workflow_call`ed workflow may not request more scope
# than its caller holds. Asking for `pull-requests: write` inside test.yml is
# what once made GitHub refuse to compile the entire pipeline. A
# `workflow_run` workflow runs in the BASE repository's context with its own
# permissions, which is the supported way to comment on a PR — including PRs
# from forks and from Dependabot, whose tokens are read-only and cannot be
# escalated at all.
#
# Failing to produce a report must never look like a passing build, so this
# workflow reports the triggering run's own conclusion and every gate job
# additionally writes its own GITHUB_STEP_SUMMARY, which needs no token and
# no second stage.
# ============================================================================

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write

concurrency:
  group: report-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  report:
    name: Publish CI Report
    runs-on: ubuntu-latest

    steps:
      # The report scripts come from the BASE repository, never from the PR
      # head. A fork PR must not be able to change what runs with a write
      # token — that is the whole reason this stage is separate.
      - name: Checkout base repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.x

      - name: Download this run's artifacts
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts
        continue-on-error: true

      # Baseline for the trend: the newest successful run of the same
      # workflow on the trunk branch. Nothing is persisted anywhere — no
      # metrics branch, no committed snapshot — so there is nothing to drift.
      - name: Locate the baseline run on the trunk branch
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list \
            --workflow "CI/CD Pipeline" \
            --branch "${{ github.event.repository.default_branch }}" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Baseline run: ${run_id:-<none>}"

      - name: Download the baseline artifacts
        if: steps.baseline.outputs.run_id != ''
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          path: baseline
        continue-on-error: true

      - name: Build the report
        run: |
          node scripts/ci/report/build-report.mjs \
            --jest-dir artifacts \
            --playwright-json artifacts/playwright-json/report.json \
            --base-playwright-json baseline/playwright-json/report.json \
            --coverage artifacts/coverage-report/coverage-final.json \
            --base-coverage baseline/coverage-report/coverage-final.json \
            --bundle artifacts/bundle-size/bundle-size.json \
            --base-bundle baseline/bundle-size/bundle-size.json \
            --sha "${{ github.event.workflow_run.head_sha }}" \
            --run-url "${{ github.event.workflow_run.html_url }}" \
            --conclusion "${{ github.event.workflow_run.conclusion }}" \
            --out report.md

      # `workflow_run` carries the PR only for same-repo branches; for forks
      # the array is empty, so fall back to a search by head SHA.
      - name: Resolve the pull request number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="${{ github.event.workflow_run.pull_requests[0].number }}"
          if [ -z "$number" ]; then
            number="$(gh pr list --search "${{ github.event.workflow_run.head_sha }}" \
              --state open --limit 1 --json number --jq '.[0].number // empty')"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Pull request: ${number:-<none, push build>}"

      - name: Upsert the pull-request comment
        if: steps.pr.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/report/pr-comment.mjs --pr "${{ steps.pr.outputs.number }}" --body-file report.md

      - name: Publish the report to this job's summary
        if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"
