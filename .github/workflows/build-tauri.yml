name: Build Tauri

# ============================================================================
# Tauri Desktop Application Build
# ============================================================================
# Builds the Tauri desktop application for Windows, macOS, and Linux via the
# official `tauri-apps/tauri-action`.
#
# When called WITH a `tagName` (from release.yml on a `v*` tag), tauri-action
# creates/updates a PUBLISHED GitHub release (releaseDraft: false) and uploads
# each platform's installers PLUS the updater signatures (`*.sig`) and the
# assembled `latest.json` manifest that the in-app updater endpoint serves.
# Publishing immediately is required: `releases/latest` only resolves to a
# published release, so a draft would keep the updater endpoint 404'ing. When
# called via workflow_dispatch (no tag), it just builds — a config / compile
# sanity check.
#
# REQUIRED SECRETS for signed updater artifacts (see src-tauri/UPDATER.md):
#   - TAURI_SIGNING_PRIVATE_KEY           Base64 of the updater private key.
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD  Its password ("" if none).
# `bundle.createUpdaterArtifacts: true` in tauri.conf.json makes the build sign
# the bundles; without these secrets a tagged build FAILS by design (an unsigned
# release would be un-updatable). Pass them through with `secrets: inherit`.
#
# OPTIONAL authenticated OS signing (Apple Developer ID / Windows Authenticode)
# stays disabled. macOS still receives the ad-hoc identity configured in
# tauri.conf.json so Apple Silicon accepts Internet-downloaded bundles.
# ============================================================================

on:
  workflow_call:
    inputs:
      tagName:
        description: "Release tag to publish a draft release for (omit to build only)."
        type: string
        required: false
        default: ""
  workflow_dispatch:

jobs:
  build-tauri:
    name: Build Tauri App (${{ matrix.platform }})

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - platform: macos-latest
            target: x86_64-apple-darwin
            arch: x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            arch: arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri-action runs `pnpm build` (beforeBuildCommand) → `tauri build`,
      # signs the updater bundles with TAURI_SIGNING_PRIVATE_KEY, and — when a
      # tagName is supplied — creates the draft release with installers, `.sig`
      # files, and the `latest.json` updater manifest (includeUpdaterJson).
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ inputs.tagName }}
          releaseName: ${{ inputs.tagName }}
          # Publish immediately (NOT a draft): the updater endpoint points at
          # `releases/latest/download/latest.json`, and GitHub resolves
          # `releases/latest` only to a PUBLISHED, non-prerelease release — a
          # draft would leave the endpoint 404'ing until someone manually hits
          # Publish. quality + test gate this build in release.yml, so the
          # bundles are already vetted by the time tauri-action publishes.
          releaseDraft: false
          includeUpdaterJson: true
