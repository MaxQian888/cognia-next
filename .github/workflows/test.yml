name: Test Suite

# ============================================================================
# Test Suite & Build Verification
# ============================================================================
# Job graph:
#   test (jest, 4 coverage shards) ─┐
#                                   ├─ coverage-merge (merge maps + enforce
#   sidecar (node --test suites)    │   thresholds + publish junit)
#   build (plain static export, bundle size)
#   build-e2e (NEXT_PUBLIC_E2E=1 export) ─ e2e (Playwright shards, static
#                                            server) ─ e2e-report (merge blobs)
#
# Jest shards run with --coverageThreshold='{}' because a shard only sees
# partial coverage for files whose tests landed on another shard; the real
# gate is scripts/test/merge-coverage.mjs in coverage-merge, which applies
# scripts/test/coverage-thresholds.json (the same file jest.config.ts uses)
# with Jest's exact glob/path/global semantics.
#
# E2E runs against the prebuilt static export (PLAYWRIGHT_STATIC=1 →
# scripts/e2e/serve-out.mjs) instead of `pnpm dev`, so specs never pay
# Turbopack's per-route compilation. NEXT_PUBLIC_E2E must be present at BUILD
# time for the export (build-e2e job) — it is dead-code-eliminated otherwise.
#
# This workflow works OUT-OF-THE-BOX without requiring any secrets.
#
# OPTIONAL: Codecov Integration (commented out by default)
#   - CODECOV_TOKEN: Token from codecov.io
# ============================================================================

# The nightly schedule lives in nightly.yml, NOT here. `schedule` only fires
# from the repository's default branch, so a cron declared in a workflow that
# is primarily `workflow_call`ed silently never runs when the default branch
# carries an older copy of this file — which is exactly what happened. The
# `e2e-tauri` / `e2e-ios-weekly` jobs below still gate on `github.event_name`,
# which a reusable workflow inherits from its caller's trigger.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Jest (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Thresholds are intentionally disabled per shard (see header comment);
      # the json reporter emits the raw istanbul map for the merge job.
      - name: Run Jest shard with coverage
        run: >-
          pnpm exec jest --coverage --shard=${{ matrix.shard }}/4
          --coverageReporters=json --coverageThreshold='{}'
        env:
          JEST_COVERAGE: "1"
          JEST_JUNIT_OUTPUT_NAME: junit-shard-${{ matrix.shard }}.xml

      - name: Upload shard coverage + junit
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jest-shard-${{ matrix.shard }}
          path: |
            coverage/coverage-final.json
            coverage/junit-shard-${{ matrix.shard }}.xml
          retention-days: 7

  coverage-merge:
    name: Coverage Merge & Gate
    runs-on: ubuntu-latest
    needs: test
    if: always()

    # Read-only on purpose: this workflow is `workflow_call`ed from ci.yml,
    # which holds only the repo-default read token (and Dependabot PRs get a
    # read-only token that `permissions:` cannot escalate). Requesting
    # `pull-requests: write` / `checks: write` here made GitHub refuse to
    # compile the whole pipeline — 22/22 startup_failure. Test results are
    # published via artifacts + the job summary instead.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The merge/threshold tooling itself gates this job — run its own
      # node --test suites first so a broken script fails loudly, not by
      # silently passing a bad merge.
      - name: Test the coverage tooling
        run: pnpm test:coverage:merge:test && pnpm test:coverage:changed:test && pnpm e2e:serve:test

      - name: Download shard artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: jest-shard-*
          path: shards/

      # Skip the gate when a shard failed — its coverage map is incomplete
      # and thresholds would report phantom regressions on top of the real
      # test failure the shard job already surfaced.
      - name: Merge shard coverage and enforce thresholds
        if: needs.test.result == 'success'
        run: node scripts/test/merge-coverage.mjs --check --out coverage shards/jest-shard-*/

      - name: Merge shard coverage (report only — shards failed)
        if: needs.test.result != 'success'
        run: node scripts/test/merge-coverage.mjs --out coverage shards/jest-shard-*/

      - name: Generate coverage summary
        if: always()
        run: |
          {
            echo "## Test Coverage Summary"
            echo ""
            echo '```'
            tail -n 10 coverage/lcov-report/index.html \
              | grep -oP '(?<=<div class="pad1">).*?(?=</div>)' \
              | head -1 \
              || echo "Coverage report generated"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Optional: Upload coverage to Codecov (requires CODECOV_TOKEN secret)
      # Uncomment the following steps to enable Codecov integration:
      #
      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v4
      #   env:
      #     CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      #   if: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/master') && env.CODECOV_TOKEN != '' }}
      #   with:
      #     token: ${{ env.CODECOV_TOKEN }}
      #     files: ./coverage/lcov.info
      #     flags: unittests
      #     name: codecov-umbrella
      #     fail_ci_if_error: false
      #   continue-on-error: true

      # Advisory: prints which layered floors have grown enough headroom to be
      # raised. It never writes — CI does not commit to the repository, and
      # raising a floor is a promise about the project, not a measurement.
      - name: Recommend coverage floor raises
        if: needs.test.result == 'success'
        run: node scripts/test/coverage-ratchet.mjs --coverage coverage/coverage-final.json
        continue-on-error: true

      - name: Upload merged coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # The incremental half of the coverage story. The merged threshold gate
  # above enforces the LAYERED floors in scripts/test/coverage-thresholds.json
  # (global lines sits at 25) — that is what the repo can actually hold today.
  # This job enforces CLAUDE.md's real rule, 90%, on the files a change
  # touches, so the layered floors ratchet upward instead of being a ceiling.
  #
  # Pull requests only, deliberately: on a direct push to `dev` the base ref
  # IS the commit under test, so the changed-file set is empty and the gate
  # would be theatre. Direct pushes are still covered by the merged gate.
  coverage-changed:
    name: Coverage Gate (changed files)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      # Full history so `git merge-base HEAD <base>` can resolve.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--base` is always explicit here: the script's default (origin/dev)
      # serves local runs, but CI must gate against the branch the PR actually
      # targets.
      - name: Enforce 90% coverage on changed files
        run: node scripts/test/coverage-changed.mjs --base "origin/${{ github.base_ref }}" --strict

  sidecar:
    name: Sidecar Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install sidecar dependencies
        run: pnpm sidecars:install

      - name: Run sidecar tests (Claude + VS Code ext host)
        run: pnpm sidecars:test

  build:
    name: Build Verification
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: "pnpm"

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js application
        run: pnpm build

      # Structured, not `du -sh`: report.yml downloads this same artifact from
      # the trunk branch's last successful run and diffs against it. The old
      # step printed a human-readable string nothing could compare, and wrote
      # its "baseline" into `.github/size-snapshot/`, a directory that does
      # not exist — under `continue-on-error`, so no baseline was ever made.
      - name: Measure bundle size
        run: node scripts/ci/report/bundle.mjs out bundle-size.json

      - name: Upload bundle measurement
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle-size
          path: bundle-size.json
          retention-days: 30

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build
          path: out/
          retention-days: 7

  build-e2e:
    name: Build E2E Static Export
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: "pnpm"

      # Separate cache key from the plain verification build — the E2E flag
      # changes the compiled output, so the two builds must not share
      # incremental state.
      - name: Cache Next.js build (E2E)
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_E2E must be present at BUILD time so ExposeTestGlobals
      # (window.__cognia* seed/reset bridges every spec depends on) is
      # compiled into the export — it is dead-code-eliminated otherwise.
      - name: Build Next.js static export (E2E)
        run: pnpm test:e2e:build

      - name: Upload E2E build
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build-e2e
          path: out/
          retention-days: 3

  e2e:
    name: E2E ${{ matrix.project }} (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: build-e2e
    timeout-minutes: 30

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - mobile-pixel-7
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Download E2E static export
        uses: actions/download-artifact@v7
        with:
          name: nextjs-build-e2e
          path: out/

      # PLAYWRIGHT_STATIC=1 serves the downloaded export via
      # scripts/e2e/serve-out.mjs — no Turbopack, no per-route compiles.
      # Blob reporter feeds the e2e-report merge job.
      - name: Run PR Playwright gate (${{ matrix.project }} ${{ matrix.shard }}/2)
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec playwright test --project=${{ matrix.project }}
          --grep "@smoke|@critical|@a11y|@visual"
          --shard=${{ matrix.shard }}/2 --reporter=blob,list
        env:
          CI: "true"
          PLAYWRIGHT_STATIC: "1"

      - name: Run full Playwright suite (${{ matrix.project }} ${{ matrix.shard }}/2)
        if: github.event_name != 'pull_request'
        run: >-
          pnpm exec playwright test --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}/2 --reporter=blob,list
        env:
          CI: "true"
          PLAYWRIGHT_STATIC: "1"

      - name: Upload blob report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-blob-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

      - name: Upload Playwright trace + screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  e2e-report:
    name: E2E Merged Report
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v7
        with:
          pattern: e2e-blob-*
          path: all-blob-reports/
          merge-multiple: true

      - name: Merge into HTML report + annotations
        run: pnpm exec playwright merge-reports --reporter html,github ./all-blob-reports

      # The blob reports carry per-attempt results, which is the only place a
      # flake is visible: `retries: 1` means a test that fails once and then
      # passes is reported green and vanishes. The JSON render is what
      # report.yml reads to surface those.
      - name: Merge into a machine-readable JSON report
        if: always()
        run: |
          mkdir -p playwright-json
          PLAYWRIGHT_JSON_OUTPUT_NAME=playwright-json/report.json \
            pnpm exec playwright merge-reports --reporter json ./all-blob-reports

      - name: Upload merged Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload merged Playwright JSON report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-json
          path: playwright-json/
          retention-days: 14

  e2e-ios-weekly:
    name: E2E iOS (Weekly)
    runs-on: macos-14
    needs: build-e2e
    timeout-minutes: 45
    # Run on schedule + manual dispatch; the workflow_call parent decides
    # whether to fan this out via its own schedule.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright (chromium + webkit)
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Download E2E static export
        uses: actions/download-artifact@v7
        with:
          name: nextjs-build-e2e
          path: out/
      - name: Run Playwright mobile-iphone-13 project
        run: pnpm exec playwright test --project=mobile-iphone-13 tests/e2e/mobile/
        env:
          CI: "true"
          PLAYWRIGHT_STATIC: "1"
          PLAYWRIGHT_MOBILE_IOS: "1"
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-mobile-iphone-13
          path: playwright-report/
          retention-days: 14

  e2e-cross-browser:
    name: E2E ${{ matrix.project }} Critical (Weekly)
    runs-on: ubuntu-latest
    needs: build-e2e
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        project: [firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright ${{ matrix.project }}
        run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - name: Download E2E static export
        uses: actions/download-artifact@v7
        with:
          name: nextjs-build-e2e
          path: out/
      - name: Run critical browser journeys
        run: >-
          pnpm exec playwright test --project=${{ matrix.project }}
          --grep "@smoke|@critical"
        env:
          CI: "true"
          PLAYWRIGHT_STATIC: "1"
          PLAYWRIGHT_CROSS_BROWSER: "1"
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

  e2e-tauri:
    name: E2E Tauri (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    # Runs nightly (schedule) and on manual dispatch. Avoids paying the cargo
    # build cost on every PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read

    # NEXT_PUBLIC_E2E must be present at BUILD time so `ExposeTestGlobals`
    # (window.__cognia* seed/reset bridges every tauri spec depends on) is
    # compiled into the bundle — not just at Playwright run time.
    env:
      NEXT_PUBLIC_E2E: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: "pnpm"
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # This job pays for a full `tauri build --debug` below, so it needs the
      # cargo cache as much as the two cargo-test jobs do.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # NOTE: tauri-driver is intentionally NOT installed — the launch helper
      # (tests/e2e/helpers/tauri-cdp-launch.ts) connects to WebView2 directly
      # over the Chrome DevTools Protocol and never spawns tauri-driver.
      - name: Build Tauri debug binary
        run: pnpm tauri build --debug --no-bundle
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright tauri project
        run: pnpm exec playwright test --project=tauri tests/e2e/tauri/
        env:
          CI: "true"
          NEXT_PUBLIC_E2E: "1"
          PLAYWRIGHT_TAURI: "1"
          # PLAYWRIGHT_TAURI_BIN deliberately unset: the launcher's default
          # (target/debug/cognia-next.exe) must stay exercised by CI, or a
          # wrong default silently rots (it shipped broken for two months
          # because this override was the only path that ever ran).
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-tauri
          path: playwright-report/
          retention-days: 14

  cargo-test-windows:
    name: Rust Tests (Windows)
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: "pnpm"
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # `tauri::generate_context!()` needs the static export (../out) to exist
      # at compile time, so produce it before compiling the Rust crate.
      - name: Build Next.js static export
        run: pnpm build
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  cargo-test-workspace:
    name: Rust Tests (workspace)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      # Every workspace member EXCEPT `cognia-next` (the src-tauri crate),
      # which is covered by `cargo-test-windows` above — its
      # `tauri::generate_context!()` needs the Next.js static export to exist
      # at compile time, so it cannot run without first paying for `pnpm
      # build`. Nothing else in the workspace needs a Node toolchain.
      #
      # This job replaced a `-p cognia-cli`-only step. Testing one package
      # meant ~1800 tests across the other 22 crates — cognia-automation, -subscription,
      # -connectors, -git, -scheduling, -gateway, -vector and the rest — had
      # never been part of the CI design at all, on top of never having run.
      - name: Run Rust tests (all crates except src-tauri)
        run: cargo test --locked --workspace --exclude cognia-next
