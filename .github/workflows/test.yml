          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-next-v2-mobile-android-${{ hashFiles('pnpm-lock.yaml', 'sidecar/pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts', 'tsconfig.json', 'tsconfig.build.json', 'postcss.config.mjs', 'pnpm-workspace.yaml') }}-

      - name: Restore compiled workspace prerequisites
