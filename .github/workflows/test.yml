name: Test Suite

# ============================================================================
# Test Suite & Build Verification
# ============================================================================
# Job graph:
#   jest-plan (exact diff + affected runtimes + immutable suite assignment)
#   test (PR: <=8 shards, no coverage; full: <=64 coverage shards) ─┐
#                                   ├─ coverage-merge (merge maps + enforce
#   sidecar (node --test suites)    │   thresholds + publish junit)
#   build (plain static export, bundle size)
#   build-e2e (NEXT_PUBLIC_E2E=1 export) ─ e2e (Playwright shards, static
#                                            server) ─ e2e-report (merge blobs)
#
# Jest shards run with --coverageThreshold='{}' because a shard only sees
# partial coverage for files whose tests landed on another shard; the real
# gate is scripts/test/merge-coverage.mjs in coverage-merge, which applies
# scripts/test/coverage-thresholds.json (the same file jest.config.ts uses)
# with Jest's exact glob/path/global semantics.
#
# E2E runs against the prebuilt static export (PLAYWRIGHT_STATIC=1 →
# scripts/e2e/serve-out.mjs) instead of `pnpm dev`, so specs never pay
# Turbopack's per-route compilation. NEXT_PUBLIC_E2E must be present at BUILD
# time for the export (build-e2e job) — it is dead-code-eliminated otherwise.
#
# This workflow works OUT-OF-THE-BOX without requiring any secrets.
#
# OPTIONAL: Codecov Integration (commented out by default)
#   - CODECOV_TOKEN: Token from codecov.io
# ============================================================================

# The nightly schedule lives in nightly.yml, NOT here. `schedule` only fires
# from the repository's default branch, so a cron declared in a workflow that
# is primarily `workflow_call`ed silently never runs when the default branch
# carries an older copy of this file — which is exactly what happened. The
# `e2e-tauri` / `e2e-ios-weekly` jobs below still gate on `github.event_name`,
# which a reusable workflow inherits from its caller's trigger.
on:
  workflow_call:
    inputs:
      test-mode:
        type: string
        default: auto
        description: auto selects incremental PR tests and full tests otherwise
  workflow_dispatch:
    inputs:
      test-mode:
        type: choice
        options: [full, incremental, auto]
        default: full
        description: Test selection mode

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest-plan:
    name: Plan affected tests and runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      has-tests: ${{ steps.plan.outputs.has-tests }}
      impacts: ${{ steps.plan.outputs.impacts }}
    env:
      npm_config_prefer_offline: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml
      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build Jest runtime prerequisites once
        run: |
          pnpm build:packages
          pnpm sidecar:webclone:build
      - name: Restore Jest suite timing history
        uses: actions/cache/restore@v6
        with:
          path: .cache/jest/timings.json
          key: ${{ runner.os }}-jest-timings-${{ hashFiles('pnpm-lock.yaml', 'jest.config.ts', 'scripts/test/jest-timing-sequencer.cjs') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-jest-timings-${{ hashFiles('pnpm-lock.yaml', 'jest.config.ts', 'scripts/test/jest-timing-sequencer.cjs') }}-
      - name: Test incremental planner
        run: node --test scripts/test/coverage-changed.test.mjs scripts/test/jest-timing-sequencer.test.mjs scripts/ci/workflow-contract.test.mjs
      - name: Freeze exact test plan
        id: plan
        env:
          REQUESTED_MODE: ${{ inputs.test-mode || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mode="$REQUESTED_MODE"
          if [ "$mode" = auto ]; then
            if [ "$EVENT_NAME" = pull_request ]; then mode=incremental; else mode=full; fi
          fi
          base="$GITHUB_SHA"
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE_SHA"
            git fetch --no-tags --depth=1 origin "$base"
          elif [ "$mode" = incremental ]; then
            base="$(git rev-parse HEAD^)"
          fi
          node scripts/test/coverage-changed.mjs --plan --base "$base" --head "$GITHUB_SHA" --mode "$mode" --output .cache/jest/plan.json > /tmp/jest-plan.json
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const plan = JSON.parse(readFileSync('.cache/jest/plan.json', 'utf8'));
          for (const [key, value] of Object.entries({mode: plan.mode, matrix: JSON.stringify(plan.matrix), 'has-tests': plan.suiteCount > 0, 'native-helpers': plan.testFiles.some(file => ['cli/src/cli/coding-loop.bundle.test.ts', 'cli/src/runtime/sandbox/os-sandbox-exec.test.ts'].includes(file)), impacts: JSON.stringify(plan.impacts)})) {
            appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Test plan\nMode: ${plan.mode}\n\n${plan.changedFiles.length} changed paths → ${plan.suiteCount} suites / ${plan.shardCount} shards.\n\nBase: ${plan.base}\nHead: ${plan.head}\n\nCoverage is collected only in full mode.\n`);
          NODE
      - name: Setup Rust for selected native integration tests
        if: steps.plan.outputs.native-helpers == 'true'
        uses: dtolnay/rust-toolchain@1.96.1
      - name: Cache Jest native helpers
        if: steps.plan.outputs.native-helpers == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: jest-native-helpers
      - name: Build selected Jest native helpers once
        if: steps.plan.outputs.native-helpers == 'true'
        run: |
          cargo build --locked -p cognia-exec-sandbox --bin cognia-sandbox-exec --bin cognia-external-agent-launcher -j 2
          tar -cf .cache/jest/native-helpers.tar target/debug/cognia-sandbox-exec target/debug/cognia-external-agent-launcher
      - name: Publish immutable test plan
        uses: actions/upload-artifact@v7
        with:
          name: jest-test-plan
          path: .cache/jest/plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Publish built Jest prerequisites
        if: steps.plan.outputs.has-tests == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: jest-runtime-prerequisites
          include-hidden-files: true
          path: |
            packages/*/dist/
            sidecar/webclone/dist/
            .cache/jest/native-helpers.tar
          if-no-files-found: error
          retention-days: 1

  test:
    needs: jest-plan
    if: needs.jest-plan.outputs.has-tests == 'true'
    name: Jest (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ needs.jest-plan.outputs.mode == 'incremental' && 4 || 8 }}
      matrix: ${{ fromJSON(needs.jest-plan.outputs.matrix) }}
    env:
      npm_config_prefer_offline: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml
      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-
      # Restore before postinstall so linked-package freshness checks can
      # reuse compiled output while retaining all installation scripts.
      - name: Download built Jest prerequisites
        uses: actions/download-artifact@v8
        with:
          name: jest-runtime-prerequisites
          path: .
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install standalone engine dependencies
        run: pnpm sidecar:webclone:install
      - name: Download frozen Jest test plan
        uses: actions/download-artifact@v8
        with:
          name: jest-test-plan
          path: .cache/jest/
      - name: Install source contract and selected native prerequisites
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          packages=(ripgrep)
          native_helpers=false
          if node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const plan = JSON.parse(readFileSync('.cache/jest/plan.json', 'utf8'));
          const shard = plan.shards.find(entry => entry.shard === Number(process.env.SHARD));
          if (!shard) throw new Error(`Unknown shard: ${process.env.SHARD}`);
          process.exit(shard.testFiles.some(file => ['cli/src/cli/coding-loop.bundle.test.ts', 'cli/src/runtime/sandbox/os-sandbox-exec.test.ts'].includes(file)) ? 0 : 1);
          NODE
          then
            tar -xf .cache/jest/native-helpers.tar
            packages+=(bubblewrap apparmor)
            native_helpers=true
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          if [ "$native_helpers" = true ]; then
            # Ubuntu 24.04 requires an application-specific userns allowance.
            # Keep the host restriction enabled; bwrap still applies the actual
            # filesystem/network sandbox exercised by the kernel integration tests.
            sudo tee /etc/apparmor.d/cognia-ci-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/cognia-ci-bwrap
            /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true
          fi
      # The planner assigns every selected suite exactly once. Full mode keeps
      # --maxWorkers=2 and the existing merged coverage thresholds.
      - name: Run Jest planned shard
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          MODE: ${{ needs.jest-plan.outputs.mode }}
          SHARD: ${{ matrix.shard }}
          JEST_JUNIT_OUTPUT_NAME: junit-shard-${{ matrix.shard }}.xml
          JEST_TIMING_OUTPUT: coverage/jest-timings.json
        run: |
          args=()
          if [ "$MODE" = full ]; then args+=(--coverage); fi
          node scripts/test/coverage-changed.mjs --run-plan .cache/jest/plan.json --shard "$SHARD" "${args[@]}"
      - name: Upload shard results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jest-shard-${{ matrix.shard }}
          path: |
            coverage/coverage-final.json
            coverage/junit-shard-*.xml
            coverage/jest-timings.json
          retention-days: 7

  coverage-merge:
    name: Coverage Merge & Gate
    runs-on: ubuntu-latest
    needs: [jest-plan, test]
    if: always() && !cancelled() && needs.jest-plan.outputs.mode == 'full' && needs.test.result != 'skipped'

    # Read-only on purpose: this workflow is `workflow_call`ed from ci.yml,
    # which holds only the repo-default read token (and Dependabot PRs get a
    # read-only token that `permissions:` cannot escalate). Requesting
    # `pull-requests: write` / `checks: write` here made GitHub refuse to
    # compile the whole pipeline — 22/22 startup_failure. Test results are
    # published via artifacts + the job summary instead.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml

      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # The merge/threshold tooling itself gates this job — run its own
      # node --test suites first so a broken script fails loudly, not by
      # silently passing a bad merge.
      - name: Test the coverage tooling
        run: >-
          pnpm test:coverage:merge:test &&
          pnpm test:coverage:changed:test &&
          node --test scripts/test/jest-timing-sequencer.test.mjs &&
          pnpm e2e:serve:test

      - name: Download shard artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: jest-shard-*
          path: shards/

      - name: Merge Jest suite timing history
        if: needs.test.result == 'success'
        run: >-
          node scripts/test/merge-jest-timings.mjs
          --out .cache/jest/timings.json
          shards/jest-shard-*/jest-timings.json

      - name: Save Jest suite timing history
        if: needs.test.result == 'success'
        uses: actions/cache/save@v6
        with:
          path: .cache/jest/timings.json
          key: ${{ runner.os }}-jest-timings-${{ hashFiles('pnpm-lock.yaml', 'jest.config.ts', 'scripts/test/jest-timing-sequencer.cjs') }}-${{ github.run_id }}

      # Skip the gate when a shard failed — its coverage map is incomplete
      # and thresholds would report phantom regressions on top of the real
      # test failure the shard job already surfaced.
      - name: Merge shard coverage and enforce thresholds
        if: needs.test.result == 'success'
        run: node scripts/test/merge-coverage.mjs --check --out coverage shards/jest-shard-*/

      - name: Merge shard coverage (report only — shards failed)
        if: needs.test.result != 'success'
        run: node scripts/test/merge-coverage.mjs --out coverage shards/jest-shard-*/

      - name: Generate coverage summary
        if: always()
        run: |
          {
            echo "## Test Coverage Summary"
            echo ""
            echo '```'
            tail -n 10 coverage/lcov-report/index.html \
              | grep -oP '(?<=<div class="pad1">).*?(?=</div>)' \
              | head -1 \
              || echo "Coverage report generated"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Optional: Upload coverage to Codecov (requires CODECOV_TOKEN secret)
      # Uncomment the following steps to enable Codecov integration:
      #
      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v4
      #   env:
      #     CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      #   if: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/master') && env.CODECOV_TOKEN != '' }}
      #   with:
      #     token: ${{ env.CODECOV_TOKEN }}
      #     files: ./coverage/lcov.info
      #     flags: unittests
      #     name: codecov-umbrella
      #     fail_ci_if_error: false
      #   continue-on-error: true

      # Advisory: prints which layered floors have grown enough headroom to be
      # raised. It never writes — CI does not commit to the repository, and
      # raising a floor is a promise about the project, not a measurement.
      - name: Recommend coverage floor raises
        if: needs.test.result == 'success'
        run: node scripts/test/coverage-ratchet.mjs --coverage coverage/coverage-final.json
        continue-on-error: true

      - name: Upload merged coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # Full-mode PRs additionally enforce the existing 90% changed-file floor.
  # Default PRs run affected tests without collecting coverage. The merged
  # full-mode gate above enforces scripts/test/coverage-thresholds.json.
  #
  # Pull requests only, deliberately: on a direct push to `dev` the base ref
  # IS the commit under test, so the changed-file set is empty and the gate
  # would be theatre. Direct pushes are still covered by the merged gate.
  coverage-changed:
    name: Coverage Gate (changed files)
    needs: [jest-plan, test, coverage-merge]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.jest-plan.outputs.mode == 'full' && needs.test.result == 'success'

    permissions:
      contents: read

    steps:
      # Full history so `git merge-base HEAD <base>` can resolve.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml

      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Download complete coverage map
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage/

      # Reuse the complete, bounded-shard result instead of launching another
      # unbounded V8 coverage process for all transitively related tests.
      # `--base` is always explicit here: the script's default (origin/dev)
      # serves local runs, but CI must gate against the branch the PR actually
      # targets.
      - name: Enforce 90% coverage on changed files
        run: node scripts/test/coverage-changed.mjs --base "origin/${{ github.base_ref }}" --strict --coverage-map coverage/coverage-final.json

  # ADR-0090's compatibility contract is executable, not documentary. Keep it
  # in a dedicated job because it builds and launches the real headless server
  # plus the Agent SDK sidecar and is materially heavier than unit tests.
  conformance:
    needs: jest-plan
    if: fromJSON(needs.jest-plan.outputs.impacts).gateway
    name: Agent gateway conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true
      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
      - name: Build sidecars
        run: pnpm sidecars:install && pnpm sidecars:build
      - name: Build the conformance server
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[],"externalBin":[]}}'
        run: pnpm conformance:prepare
      - name: Run the conformance suite
        run: pnpm test:conformance

  docs-build:
    needs: jest-plan
    if: fromJSON(needs.jest-plan.outputs.impacts).docs
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml
      - name: Cache Next.js compilation (docs)
        uses: actions/cache@v6
        with:
          path: docs/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node26-next-v2-docs-ci-${{ hashFiles('pnpm-lock.yaml', 'sidecar/pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts', 'tsconfig.json', 'tsconfig.build.json', 'postcss.config.mjs', 'pnpm-workspace.yaml', 'docs/next.config.ts', 'docs/tsconfig.json', 'docs/postcss.config.mjs') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-next-v2-docs-ci-${{ hashFiles('pnpm-lock.yaml', 'sidecar/pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts', 'tsconfig.json', 'tsconfig.build.json', 'postcss.config.mjs', 'pnpm-workspace.yaml', 'docs/next.config.ts', 'docs/tsconfig.json', 'docs/postcss.config.mjs') }}-

      - name: Restore compiled workspace prerequisites
        if: needs.jest-plan.outputs.has-tests == 'true'
        uses: actions/download-artifact@v8
        with:
          name: jest-runtime-prerequisites
          path: .

      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build documentation
        run: pnpm docs:build

  web-build:
    needs: jest-plan
    if: fromJSON(needs.jest-plan.outputs.impacts).web
    name: Marketing site build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml
      - name: Cache Next.js compilation (web)
        uses: actions/cache@v6
        with:
          path: web/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node26-next-v2-web-ci-${{ hashFiles('pnpm-lock.yaml', 'sidecar/pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts', 'tsconfig.json', 'tsconfig.build.json', 'postcss.config.mjs', 'pnpm-workspace.yaml', 'web/next.config.ts', 'web/tsconfig.json', 'web/postcss.config.mjs') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-next-v2-web-ci-${{ hashFiles('pnpm-lock.yaml', 'sidecar/pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts', 'tsconfig.json', 'tsconfig.build.json', 'postcss.config.mjs', 'pnpm-workspace.yaml', 'web/next.config.ts', 'web/tsconfig.json', 'web/postcss.config.mjs') }}-

      - name: Restore compiled workspace prerequisites
        if: needs.jest-plan.outputs.has-tests == 'true'
        uses: actions/download-artifact@v8
        with:
          name: jest-runtime-prerequisites
          path: .

      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
