  mobile-ios-build:
    needs: jest-plan
    name: iOS native build (nightly)
    runs-on: macos-14
    timeout-minutes: 90
    if: fromJSON(needs.jest-plan.outputs.impacts).mobile && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js 26.x
