      - name: Cache Next.js compilation (mobile)
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node26-next-v2-mobile-ios-${{ hashFiles('pnpm-lock.yaml', 'sidecar/pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts', 'tsconfig.json', 'tsconfig.build.json', 'postcss.config.mjs', 'pnpm-workspace.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-next-v2-mobile-ios-${{ hashFiles('pnpm-lock.yaml', 'sidecar/pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts', 'tsconfig.json', 'tsconfig.build.json', 'postcss.config.mjs', 'pnpm-workspace.yaml') }}-

      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
