          build

  deepseek-runtime:
    needs: jest-plan
    if: fromJSON(needs.jest-plan.outputs.impacts).deepseekRuntime
    name: DeepSeek Runtime Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Cache isolated runtime downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node26-deepseek-${{ hashFiles('runtime/deepseek-harness/package.json') }}
          restore-keys: ${{ runner.os }}-node26-deepseek-
      - name: Install isolated runtime
        env:
          DSH_TEST_ROOT: ${{ runner.temp }}/cognia-deepseek-runtime
        run: |
          echo "DSH_TEST_ROOT=$DSH_TEST_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$DSH_TEST_ROOT"
          cp runtime/deepseek-harness/* "$DSH_TEST_ROOT/"
          npm install --prefix "$DSH_TEST_ROOT" --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Run launcher and service smoke suites
        working-directory: ${{ env.DSH_TEST_ROOT }}
        run: node --test launcher.test.mjs launcher.smoke.test.mjs services.smoke.test.mjs

  sidecar:
    needs: jest-plan
    if: fromJSON(needs.jest-plan.outputs.impacts).sidecar
    name: Sidecar Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml

      - name: Restore compiled workspace prerequisites
        if: needs.jest-plan.outputs.has-tests == 'true'
        uses: actions/download-artifact@v8
        with:
          name: jest-runtime-prerequisites
          path: .

      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install sidecar dependencies
        run: pnpm sidecars:install

      - name: Build sidecars
        run: pnpm sidecars:build

      - name: Run sidecar tests (Claude + VS Code ext host)
        run: pnpm sidecars:test

      - name: Run live sidecar tests (real host + SDK subprocess, mock server)
        run: pnpm sidecar:test:live

  build:
    needs: jest-plan
    if: fromJSON(needs.jest-plan.outputs.impacts).productionBuild
    name: Build Verification
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml

      - name: Cache Next.js compilation (desktop)
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node26-next-v2-desktop-production-${{ hashFiles('pnpm-lock.yaml', 'sidecar/pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts', 'tsconfig.json', 'tsconfig.build.json', 'postcss.config.mjs', 'pnpm-workspace.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-next-v2-desktop-production-${{ hashFiles('pnpm-lock.yaml', 'sidecar/pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts', 'tsconfig.json', 'tsconfig.build.json', 'postcss.config.mjs', 'pnpm-workspace.yaml') }}-

      - name: Restore compiled workspace prerequisites
        if: needs.jest-plan.outputs.has-tests == 'true'
        uses: actions/download-artifact@v8
        with:
          name: jest-runtime-prerequisites
          path: .

      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Next.js application
        run: pnpm build

      - name: Verify the Tauri frontend artifact
        run: pnpm tauri:frontend:check

      # Structured, not `du -sh`: report.yml downloads this same artifact from
      # the trunk branch's last successful run and diffs against it. The old
      # step printed a human-readable string nothing could compare, and wrote
      # its "baseline" into `.github/size-snapshot/`, a directory that does
      # not exist — under `continue-on-error`, so no baseline was ever made.
      - name: Measure bundle size
        run: node scripts/ci/report/bundle.mjs out bundle-size.json

      - name: Upload bundle measurement
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle-size
          path: bundle-size.json
          retention-days: 30

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build
          path: out/
          retention-days: 7

  build-e2e:
    needs: jest-plan
    if: fromJSON(needs.jest-plan.outputs.impacts).frontend
    name: Build E2E Static Export
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml

      # Separate cache key from the plain verification build — the E2E flag
      # changes the compiled output, so the two builds must not share
      # incremental state.
      - name: Cache Next.js compilation (desktop)
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node26-next-v2-desktop-e2e-${{ hashFiles('pnpm-lock.yaml', 'sidecar/pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts', 'tsconfig.json', 'tsconfig.build.json', 'postcss.config.mjs', 'pnpm-workspace.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-next-v2-desktop-e2e-${{ hashFiles('pnpm-lock.yaml', 'sidecar/pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts', 'tsconfig.json', 'tsconfig.build.json', 'postcss.config.mjs', 'pnpm-workspace.yaml') }}-

      - name: Restore compiled workspace prerequisites
        if: needs.jest-plan.outputs.has-tests == 'true'
        uses: actions/download-artifact@v8
        with:
          name: jest-runtime-prerequisites
          path: .

      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # NEXT_PUBLIC_E2E must be present at BUILD time so ExposeTestGlobals
      # (window.__cognia* seed/reset bridges every spec depends on) is
      # compiled into the export — it is dead-code-eliminated otherwise.
      - name: Build Next.js static export (E2E)
        run: pnpm test:e2e:build

      - name: Upload E2E build
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build-e2e
          path: out/
          retention-days: 3

  e2e:
    name: E2E ${{ matrix.project }} (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: build-e2e
    timeout-minutes: 30

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - mobile-pixel-7
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml

      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Download E2E static export
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build-e2e
          path: out/

      # PLAYWRIGHT_STATIC=1 serves the downloaded export via
      # scripts/e2e/serve-out.mjs — no Turbopack, no per-route compiles.
      # Blob reporter feeds the e2e-report merge job.
      - name: Run PR Playwright gate (${{ matrix.project }} ${{ matrix.shard }}/2)
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec playwright test --project=${{ matrix.project }}
          --grep "@smoke|@critical|@a11y|@visual"
          --shard=${{ matrix.shard }}/2 --reporter=blob,list
        env:
          CI: "true"
          PLAYWRIGHT_STATIC: "1"

      - name: Run full Playwright suite (${{ matrix.project }} ${{ matrix.shard }}/2)
        if: github.event_name != 'pull_request'
        run: >-
          pnpm exec playwright test --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}/2 --reporter=blob,list
        env:
          CI: "true"
          PLAYWRIGHT_STATIC: "1"

      - name: Upload blob report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-blob-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
          # Blob reports already contain traces, screenshots, and videos. These
          # payloads are pre-compressed, so avoid duplicating them and spending
          # CPU trying to recompress the archive.
          compression-level: 0

  # The browser extension's own lane. A separate job rather than a row in the
  # `e2e` matrix above, because it shares none of that job's setup: it needs no
  # static export, no dev server and no mock fleet — it needs `wxt build` and a
  # full Chromium, and it launches its own persistent context per test. Wiring
  # it into the matrix would make a 15-second suite wait on `build-e2e` and
  # then download an export it never opens.
  e2e-browser-extension:
    needs: jest-plan
    if: fromJSON(needs.jest-plan.outputs.impacts).browserExtension
    name: E2E browser extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml

      - name: Restore compiled workspace prerequisites
        if: needs.jest-plan.outputs.has-tests == 'true'
        uses: actions/download-artifact@v8
        with:
          name: jest-runtime-prerequisites
          path: .

      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # `chromium`, not `chromium-headless-shell`. The fixture launches with
      # `channel: "chromium"` because the headless shell has no extension
      # support at all, and the failure mode is a context that simply never
      # reports a service worker.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Runs in full on pull requests too, unlike the sharded suite above: the
      # whole lane is ~15s, so there is nothing to gain by tagging a subset and
      # a regression caught here is one that ships to a store.
      - name: Run the browser extension E2E lane
        run: pnpm run test:e2e:browser-ext
        env:
          CI: "true"

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-browser-extension-report
          path: playwright-report/
          retention-days: 7

  e2e-report:
    name: E2E Merged Report
    runs-on: ubuntu-latest
    needs: e2e
    if: always() && !cancelled() && needs.e2e.result != 'skipped'
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml

      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-blob-*
          path: all-blob-reports/
          merge-multiple: true

      # The blob reports carry per-attempt results, which is the only place a
      # flake is visible. Render HTML, annotations, and JSON in one traversal.
      - name: Merge Playwright reports
        run: |
          mkdir -p playwright-json
          PLAYWRIGHT_JSON_OUTPUT_NAME=playwright-json/report.json \
            pnpm exec playwright merge-reports --reporter html,github,json ./all-blob-reports

      - name: Upload merged Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          compression-level: 0

      - name: Upload merged Playwright JSON report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-json
          path: playwright-json/
          retention-days: 14

  e2e-ios-weekly:
    name: E2E iOS (Weekly)
    runs-on: macos-14
    needs: build-e2e
    timeout-minutes: 45
    # Run on schedule + manual dispatch; the workflow_call parent decides
    # whether to fan this out via its own schedule.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml
      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Playwright (chromium + webkit)
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Download E2E static export
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build-e2e
          path: out/
      - name: Run Playwright mobile-iphone-13 project
        run: pnpm exec playwright test --project=mobile-iphone-13 tests/e2e/mobile/
        env:
          CI: "true"
          PLAYWRIGHT_STATIC: "1"
          PLAYWRIGHT_MOBILE_IOS: "1"
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-mobile-iphone-13
          path: playwright-report/
          retention-days: 14

  e2e-cross-browser:
    name: E2E ${{ matrix.project }} Critical (Weekly)
    runs-on: ubuntu-latest
    needs: build-e2e
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

