          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Playwright ${{ matrix.project }}
        run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - name: Download E2E static export
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build-e2e
          path: out/
      - name: Run critical browser journeys
        run: >-
          pnpm exec playwright test --project=${{ matrix.project }}
          --grep "@smoke|@critical"
        env:
          CI: "true"
          PLAYWRIGHT_STATIC: "1"
          PLAYWRIGHT_CROSS_BROWSER: "1"
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

  e2e-tauri:
    needs: jest-plan
    name: E2E Tauri (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    # Runs nightly (schedule) and on manual dispatch. Avoids paying the cargo
    # build cost on every PR.
    if: fromJSON(needs.jest-plan.outputs.impacts).rust && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read

    # NEXT_PUBLIC_E2E must be present at BUILD time so `ExposeTestGlobals`
    # (window.__cognia* seed/reset bridges every tauri spec depends on) is
    # compiled into the bundle — not just at Playwright run time.
    env:
      NEXT_PUBLIC_E2E: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # This job pays for a full `tauri build --debug` below, so it needs the
      # cargo cache as much as the two cargo-test jobs do.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Cache Next.js compilation (tauri)
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node26-next-v2-tauri-e2e-${{ hashFiles('pnpm-lock.yaml', 'sidecar/pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts', 'tsconfig.json', 'tsconfig.build.json', 'postcss.config.mjs', 'pnpm-workspace.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-next-v2-tauri-e2e-${{ hashFiles('pnpm-lock.yaml', 'sidecar/pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts', 'tsconfig.json', 'tsconfig.build.json', 'postcss.config.mjs', 'pnpm-workspace.yaml') }}-

      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      # NOTE: tauri-driver is intentionally NOT installed — the launch helper
      # (tests/e2e/helpers/tauri-cdp-launch.ts) connects to WebView2 directly
      # over the Chrome DevTools Protocol and never spawns tauri-driver.
      - name: Build Tauri debug binary
        run: pnpm tauri build --debug --no-bundle
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright tauri project
        run: pnpm exec playwright test --project=tauri tests/e2e/tauri/
        env:
          CI: "true"
          NEXT_PUBLIC_E2E: "1"
          PLAYWRIGHT_TAURI: "1"
          # PLAYWRIGHT_TAURI_BIN deliberately unset: the launcher's default
          # (target/debug/cognia-next.exe) must stay exercised by CI, or a
          # wrong default silently rots (it shipped broken for two months
          # because this override was the only path that ever ran).
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-tauri
          path: playwright-report/
          retention-days: 14

  cargo-test-windows:
    if: fromJSON(needs.jest-plan.outputs.impacts).rust
    name: Rust Tests (Windows)
    runs-on: windows-latest
    needs: [jest-plan, build]

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # src-tauri is a member of the root Cargo workspace and writes to the
          # root target/, not src-tauri/target/.
          workspaces: ". -> target"
          cache-on-failure: true
      # `tauri::generate_context!()` only needs ../out at compile time. Reuse
      # the already-gated Linux build instead of installing Node and rebuilding
      # the entire frontend on Windows.
      - name: Download Next.js static export
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build
          path: out/
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  cargo-test-workspace:
    needs: jest-plan
    if: fromJSON(needs.jest-plan.outputs.impacts).rust
    name: Rust Tests (workspace)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libglib2.0-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true
      # Every workspace member EXCEPT `cognia-next` (the src-tauri crate),
      # which is covered by `cargo-test-windows` above — its
      # `tauri::generate_context!()` needs the Next.js static export to exist
      # at compile time, so it cannot run without first paying for `pnpm
      # build`. Nothing else in the workspace needs a Node toolchain.
      #
      # This job replaced a `-p cognia-cli`-only step. Testing one package
      # meant ~1800 tests across the other 22 crates — cognia-automation, -subscription,
      # -connectors, -git, -scheduling, -gateway, -vector and the rest — had
      # never been part of the CI design at all, on top of never having run.
      #
      # ADR-0196: a library crate's `#[tauri::command]` shells sit behind its
      # `tauri-host` feature, which is off by default and enabled only by
      # src-tauri — excluded here. So the tests run with every standard
      # `tauri-host` turned on (what those crates' old defaults compiled), and
      # a separate check proves each crate still builds Tauri-free.
      - name: Run Rust tests (all crates except src-tauri)
        run: cargo test --locked --workspace --exclude cognia-next --no-fail-fast --features "$(node scripts/gates/check-rust-architecture.mjs --print-ci-features)"
      - name: Check the default (Tauri-free) feature set compiles
        run: cargo check --locked --workspace --exclude cognia-next --all-targets

  postgres-rls:
    needs: jest-plan
    if: fromJSON(needs.jest-plan.outputs.impacts).postgres
    name: PostgreSQL RLS & tenant integrity
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true
      - name: Create least-privilege application role
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1
          -c "CREATE ROLE cognia_rls_app LOGIN PASSWORD 'cognia_rls_app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;"
      - name: Run real PostgreSQL RLS matrix
        env:
          COLLAB_RLS_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          COLLAB_RLS_APP_DATABASE_URL: postgresql://cognia_rls_app:cognia_rls_app@127.0.0.1:5432/postgres?sslmode=disable
        run: cargo test --locked -p cognia-collab-server --test postgres_rls -- --ignored

  cargo-test-diagnostic-server:
    needs: jest-plan
    if: fromJSON(needs.jest-plan.outputs.impacts).diagnostic
    name: Rust Tests (diagnostic-server)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # `services/diagnostic-server` is a standalone Cargo project with its own
    # lockfile — exactly like `sidecar/`, and for the same reason: it ships as
    # its own container, not inside the desktop app. `cargo test --workspace`
    # above cannot see it, so without this job its tests never run anywhere.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "services/diagnostic-server -> target"
      - name: Run Rust tests
        working-directory: services/diagnostic-server
        run: cargo test --locked
