name: Deploy

# ============================================================================
# Real, opt-in deployments for the app repository's sites (ADR-0059 P0.6 / D8,
# ADR-0092): the docs site and the marketing website, each a static export on
# its own Cloudflare Pages project.
#
# The cloud services (signaling, share, status, identity, sync Workers and the
# Fly.io twins) deploy from cognia-labs/cognia-services.
#
# Safety model (forks stay green with zero configuration):
#   1. Trigger is manual (workflow_dispatch) or an explicit workflow_call.
#   2. The repo variable DEPLOY_ENABLED must be the string "true".
#   3. Each platform job additionally requires its secret to be present.
#   Any gate failing → the job is skipped (green), never red.
#
# Configuration lives in GitHub Environments `staging` and `production`, both
# holding the SAME names so the workflow reads one set:
#   secrets:  CLOUDFLARE_API_TOKEN
#   variables: CLOUDFLARE_ACCOUNT_ID, CF_DOCS_PAGES_PROJECT, CF_WEB_PAGES_PROJECT,
#              DOCS_SITE_URL, WEB_SITE_URL
# `production` should carry protection rules (required reviewers) — configured
# in Settings → Environments, documented in docs/development/CI_CD.md.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options: [staging, production]
        default: staging
      target:
        description: "What to deploy"
        required: true
        type: choice
        options:
          - all
          - docs
        default: all
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment (staging or production)"
        required: true
        type: string
      target:
        description: "What to deploy"
        required: false
        type: string
        default: all

concurrency:
  group: deploy-${{ inputs.environment }}
  # Never cancel a mid-flight deploy — a second dispatch queues behind it.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Gate (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      enabled: ${{ steps.g.outputs.enabled }}
      has_cf: ${{ steps.g.outputs.has_cf }}
    steps:
      - id: g
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          {
            echo "enabled=${DEPLOY_ENABLED:-false}"
            echo "has_cf=${HAS_CF}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy gate — ${{ inputs.environment }}"
            echo ""
            echo "| Check | Value |"
            echo "| --- | --- |"
            echo "| DEPLOY_ENABLED | \`${DEPLOY_ENABLED:-unset}\` |"
            echo "| CLOUDFLARE_API_TOKEN present | \`${HAS_CF}\` |"
            echo "| target | \`${{ inputs.target }}\` |"
            echo ""
            echo "Jobs whose gate is false are skipped (green)."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-docs:
    name: Pages — docs
    needs: gate
    # ADR-0059 P0.6 / D8: the docs site is a static export (docs/out) hosted
    # on Cloudflare Pages. Requires a Pages project named by the
    # CF_DOCS_PAGES_PROJECT environment variable (create once with
    # `wrangler pages project create <name>`).
    if: >
      needs.gate.outputs.enabled == 'true' && needs.gate.outputs.has_cf == 'true' &&
      contains(fromJSON('["all","docs"]'), inputs.target)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml

      - name: Cache Next.js compilation (docs)
        uses: actions/cache@v6
        with:
          path: docs/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node26-next-v2-docs-deploy-${{ inputs.environment }}-${{ vars.DOCS_SITE_URL }}-${{ vars.WEB_SITE_URL }}-${{ hashFiles('pnpm-lock.yaml', 'sidecar/pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts', 'tsconfig.json', 'tsconfig.build.json', 'postcss.config.mjs', 'pnpm-workspace.yaml', 'docs/next.config.ts', 'docs/tsconfig.json', 'docs/postcss.config.mjs') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-next-v2-docs-deploy-${{ inputs.environment }}-${{ vars.DOCS_SITE_URL }}-${{ vars.WEB_SITE_URL }}-${{ hashFiles('pnpm-lock.yaml', 'sidecar/pnpm-lock.yaml') }}-${{ hashFiles('next.config.ts', 'tsconfig.json', 'tsconfig.build.json', 'postcss.config.mjs', 'pnpm-workspace.yaml', 'docs/next.config.ts', 'docs/tsconfig.json', 'docs/postcss.config.mjs') }}-

      - name: Cache standalone npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node26-npm-${{ hashFiles('sidecar/vscode-ext-host/package-lock.json', 'sidecar/webclone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node26-npm-

      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline
        working-directory: docs

      - name: Build static export
        run: pnpm build
        working-directory: docs
        env:
          # Bakes the canonical origin into sitemap.xml, robots.txt, hreflang
          # alternates, OpenGraph tags and the /llms.txt family — a static
          # export has no request to infer an origin from. Unset falls back to
          # Cloudflare's own CF_PAGES_URL, then to the dev origin.
          NEXT_PUBLIC_DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
          # The landing page's "Website" link. Unset omits the link rather
          # than pointing a published page at localhost.
          NEXT_PUBLIC_WEB_SITE_URL: ${{ vars.WEB_SITE_URL }}

      - name: Guard Pages project variable
        env:
          PROJECT: ${{ vars.CF_DOCS_PAGES_PROJECT }}
        run: |
          if [ -z "$PROJECT" ]; then
            echo "::error::CF_DOCS_PAGES_PROJECT environment variable is not set"
            exit 1
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy docs/out --project-name "${{ vars.CF_DOCS_PAGES_PROJECT }}"
            --branch "${{ inputs.environment == 'production' && 'main' || 'staging' }}"

  summary:
    name: Summary
    needs: [gate, deploy-docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Render result table
        run: |
          {
            echo "## Deploy results — ${{ inputs.environment }} (target: ${{ inputs.target }})"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Pages — docs | ${{ needs.deploy-docs.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on any failed deploy
        if: contains(needs.*.result, 'failure')
        run: exit 1
