name: Images

# ============================================================================
# GHCR container images (ADR-0059 P0.2 / W6 / D9):
#   ghcr.io/<owner>/cognia-signaling      services/signaling-server
#   ghcr.io/<owner>/cognia-share          services/share-server
#   ghcr.io/<owner>/cognia-runner        deploy/runner (external agent CLIs)
#   ghcr.io/<owner>/cognia-agent-bundle  deploy/bundle (ADR-0183: CLIs injected into user images)
#   ghcr.io/<owner>/cognia-workspace-runtime services/workspace-runtime
#   ghcr.io/<owner>/cognia-diagnostics    services/diagnostic-server
#   ghcr.io/<owner>/cognia-collab         Dockerfile.collab-server
#   ghcr.io/<owner>/cognia-server        Dockerfile.cognia-server (slim/full)
#   ghcr.io/<owner>/cognia-web           deploy/compose/Dockerfile.web (static export + Caddy)
#   ghcr.io/<owner>/cognia-deploy-agent  Dockerfile.deploy-agent
#   ghcr.io/<owner>/cognia-ops-controller Dockerfile.ops-controller
#   ghcr.io/<owner>/cognia-docker-proxy  Dockerfile.docker-proxy (ADR-0224 A8)
#   ghcr.io/<owner>/cognia-managed-desktop crates/cognia-automation/src/cua_sandbox/image (ADR-0228)
#
# Publish happens on version tags (and manual dispatch with push=true).
# PRs touching the container inputs get a compile check instead:
#   - the two service images + runner build without pushing (gha cache)
#   - cognia-server builds the `check` stage — cargo check over the cooked
#     cargo-chef deps layer, no codegen/link — because a full release build of
#     the whole tauri graph is 45–90 min cold.
#
# Cache strategy: the small images use the GHA cache; cognia-server uses a
# REGISTRY cache ref (ghcr.io/<owner>/cognia-server:buildcache) because its
# cooked deps layer alone would blow through the shared 10 GB GHA budget.
# PR builds only read the cache (`cache-from`), never write it, so a fork PR
# can't poison what trunk/tag builds consume.
# ============================================================================

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to GHCR"
        type: boolean
        default: false
  pull_request:
    paths:
      - "Dockerfile.cognia-server"
      - "Dockerfile.deploy-agent"
      - "Dockerfile.ops-controller"
      - "Dockerfile.collab-server"
      - "Dockerfile.docker-proxy"
      - ".dockerignore"
      - "deploy/runner/**"
      # The agent bundle: its Dockerfile, pins, npm lock and smoke script, the
      # script that stages it, and the runtime catalog its pins are checked
      # against. cognia-sandboxd itself is under crates/** below.
      - "deploy/bundle/**"
      - "scripts/build/bundle-agent-versions.mjs"
      - "scripts/build/managed-desktop-release*.mjs"
      - "scripts/build/managed-desktop-context*.mjs"
      - "protocol/external-agent-runtimes.json"
      - "services/signaling-server/Dockerfile"
      - "services/share-server/Dockerfile"
      - "services/workspace-runtime/**"
      # The web image is the static export + Caddyfile; the compose `tls`
      # profile and the production override both pull it from GHCR.
      - "deploy/compose/Dockerfile.web"
      - "deploy/compose/Caddyfile"
      # The whole crate, not just its Dockerfile: the build context is the
      # service directory, so a source or migration change is an image change.
      - "services/diagnostic-server/**"
      - "lib/browser/overlay.injected.js"
      - ".github/workflows/images.yml"
      # cognia-server compile inputs: the `check` stage COPYs these, so a PR
      # touching them can break the image build without touching any
      # Dockerfile (this exact gap shipped a broken tauri.conf.json resource
      # once — sidecar/webclone/* landed unvalidated).
      - "src-tauri/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "services/signaling-server/core/**"
      - "plugins/computer-use/rust/**"
      - "sidecar/package.json"
      - "sidecar/*.mjs"
      - "sidecar/src/**"
      - "sidecar/vscode-ext-host/package.json"
      - "sidecar/webclone/package.json"
      - "hooks/builtin/**"
      - "docs/api/*.openapi.yaml"
      - "lib/browser/overlay.injected.js"
      - "cli/src/serve/fixtures/**"

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  # Lowercase owner once — GHCR requires lowercase repository paths.
  vars:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.o.outputs.owner }}
      should_push: ${{ steps.o.outputs.should_push }}
    steps:
      - id: o
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.push }}" = "true" ]; then
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          fi

  fast-images:
    if: ${{ false }}
    name: ${{ matrix.name }}
    needs: vars
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cognia-signaling
            context: services/signaling-server
            file: services/signaling-server/Dockerfile
          - name: cognia-share
            context: services/share-server
            file: services/share-server/Dockerfile
          - name: cognia-runner
            context: deploy/runner
            file: deploy/runner/Dockerfile
          - name: cognia-workspace-runtime
            context: .
            file: services/workspace-runtime/Dockerfile
          - name: cognia-diagnostics
            context: services/diagnostic-server
            file: services/diagnostic-server/Dockerfile
          - name: cognia-collab
            context: .
            file: Dockerfile.collab-server
          - name: cognia-deploy-agent
            context: .
            file: Dockerfile.deploy-agent
          - name: cognia-ops-controller
            context: .
            file: Dockerfile.ops-controller
          # ADR-0224 A8: the always-on host's body-inspecting Docker API proxy.
          - name: cognia-docker-proxy
            context: .
            file: Dockerfile.docker-proxy
          # Same-origin Web front door: Next.js static export served by Caddy.
          # Root context so the export sees the whole workspace; .dockerignore
          # keeps node_modules/out/target off the daemon.
          - name: cognia-web
            context: .
            file: deploy/compose/Dockerfile.web
    steps:
      - uses: actions/checkout@v7

      # The runner image lands with the Phase 3 artifacts; until its Dockerfile
      # exists this matrix entry no-ops instead of failing the whole workflow.
      - name: Check context exists
        id: ctx
        run: |
          if [ -f "${{ matrix.file }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.file }} not present — skipping ${{ matrix.name }}"
          fi

      # The web export peaks at ~17 GB RSS (webpack holds the compilation
      # through page finalization), past the 16 GB runner; without more swap
      # the build dies with ENOMEM after every page has rendered. /mnt is the
      # runner's large scratch disk.
      - name: Grow swap for the web export
        if: steps.ctx.outputs.present == 'true' && matrix.name == 'cognia-web'
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: docker/setup-buildx-action@v4
        if: steps.ctx.outputs.present == 'true'

      - uses: docker/login-action@v4
        if: steps.ctx.outputs.present == 'true' && needs.vars.outputs.should_push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.ctx.outputs.present == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.vars.outputs.owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        if: steps.ctx.outputs.present == 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ needs.vars.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,scope={0},mode=max', matrix.name) || '' }}

  # ADR-0228: the same Images publication gate owns the desktop release.
  # This publishes an image, never an E2B template or billed desktop. Provider
  # qualification requires separate user credentials and explicit consent.
  managed-desktop-image:
    if: ${{ inputs.push }}
    name: cognia-managed-desktop (amd64)
    needs: vars
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Verify managed desktop release contract
        run: node --test scripts/build/managed-desktop-release.test.mjs scripts/build/managed-desktop-context.test.mjs

      - name: Verify confined source import fixtures
        run: python3 -m unittest crates/cognia-automation/src/cua_sandbox/managed/handoff_guest_test.py

      - name: Build the mandatory Linux guest guard
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          df -h /
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release -p cognia-desktop-guest --target x86_64-unknown-linux-musl
          node scripts/build/managed-desktop-context.mjs target/x86_64-unknown-linux-musl/release/cognia-desktop-guest "$RUNNER_TEMP/managed-desktop-image"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: needs.vars.outputs.should_push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.vars.outputs.owner }}/cognia-managed-desktop
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Build pinned computer-server image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/managed-desktop-image
          file: ${{ runner.temp }}/managed-desktop-image/Dockerfile
          platforms: linux/amd64
          push: ${{ needs.vars.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cognia-managed-desktop-amd64
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=cognia-managed-desktop-amd64,mode=max' || '' }}

      - name: Record the published desktop release
        if: needs.vars.outputs.should_push == 'true'
        env:
          IMAGE: ghcr.io/${{ needs.vars.outputs.owner }}/cognia-managed-desktop
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          node scripts/build/managed-desktop-release.mjs --image "$IMAGE" --digest "$DIGEST" --output "$RUNNER_TEMP/managed-desktop-release/managed-desktop-release.json"

      - uses: actions/upload-artifact@v7
        if: needs.vars.outputs.should_push == 'true'
        with:
          name: managed-desktop-release
          path: ${{ runner.temp }}/managed-desktop-release/managed-desktop-release.json
          if-no-files-found: error
          retention-days: 90

  desktop-host-check:
    if: ${{ !inputs.push }}
    name: Managed desktop Host compile (no Rust tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Host build dependencies
        run: |
          df -h /
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev libpipewire-0.3-dev libgbm-dev librsvg2-dev libssl-dev libxdo-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libasound2-dev
      - name: Compile only the changed Host library
        env:
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_DEV_DEBUG: 0
        run: |
          df -h /
          cargo check --locked -p cognia-automation --no-default-features --lib

  desktop-native-operator:
    name: Native managed desktop operator (no Rust tests)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build native Host operator
        env:
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_DEV_DEBUG: 0
        run: |
          df -h /
          cargo build --locked -p cognia-companion-rpc --bin managed-desktop-operator
      - uses: actions/upload-artifact@v7
        with:
          name: managed-desktop-operator-macos
          path: target/debug/managed-desktop-operator
          if-no-files-found: error
          retention-days: 7

  # ADR-0183: build and smoke each architecture natively, once. PRs load the
  # result locally; publishing runs stage untagged digests and smoke those exact
  # images. Release tags are assembled only after BOTH native smoke jobs pass.
  # Multi-GB layers use architecture-scoped registry caches; PRs only read.
  agent-bundle:
    if: ${{ false }}
    name: cognia-agent-bundle (${{ matrix.arch }})
    needs: vars
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Check bundle pins
        run: node scripts/build/bundle-agent-versions.mjs check

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: needs.vars.outputs.should_push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.vars.outputs.owner }}/cognia-agent-bundle
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build native bundle once
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/bundle/Dockerfile
          platforms: ${{ matrix.platform }}
          # type=docker loads the single native platform for local PR smoke.
          # Publish by digest only: no release tag can point at an untested image.
          outputs: ${{ needs.vars.outputs.should_push == 'true' && 'type=image,push-by-digest=true,name-canonical=true,push=true' || 'type=docker' }}
          tags: ${{ needs.vars.outputs.should_push == 'true' && format('ghcr.io/{0}/cognia-agent-bundle', needs.vars.outputs.owner) || 'cognia-agent-bundle:smoke' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUNDLE_RELEASE_TAG=${{ github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/${{ needs.vars.outputs.owner }}/cognia-agent-bundle:buildcache-${{ matrix.arch }}
          cache-to: ${{ needs.vars.outputs.should_push == 'true' && format('type=registry,ref=ghcr.io/{0}/cognia-agent-bundle:buildcache-{1},mode=max', needs.vars.outputs.owner, matrix.arch) || '' }}

      - name: Smoke against user images
        env:
          SHOULD_PUSH: ${{ needs.vars.outputs.should_push }}
          IMAGE: ghcr.io/${{ needs.vars.outputs.owner }}/cognia-agent-bundle
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          bundle=cognia-agent-bundle:smoke
          if [ "$SHOULD_PUSH" = true ]; then
            docker pull "$IMAGE@$DIGEST"
            bundle="$IMAGE@$DIGEST"
          fi
          sh deploy/bundle/smoke.sh "$bundle"

      - name: Record tested platform digest
        if: needs.vars.outputs.should_push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/agent-bundle-digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/agent-bundle-digests/$ARCH.txt"

      - uses: actions/upload-artifact@v7
        if: needs.vars.outputs.should_push == 'true'
        with:
          name: agent-bundle-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/agent-bundle-digests/${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

  agent-bundle-manifest:
    if: ${{ false }}
    name: cognia-agent-bundle (publish manifest)
    needs: [vars, agent-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: agent-bundle-digest-*
          path: ${{ runner.temp }}/agent-bundle-digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.vars.outputs.owner }}/cognia-agent-bundle
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Assemble tested multi-platform manifest
        env:
          IMAGE: ghcr.io/${{ needs.vars.outputs.owner }}/cognia-agent-bundle
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST_DIR: ${{ runner.temp }}/agent-bundle-digests
        run: |
          digests=()
          for arch in amd64 arm64; do
            digest=$(cat "$DIGEST_DIR/$arch.txt")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid tested digest for $arch"
              exit 1
            fi
            digests+=("$IMAGE@$digest")
          done
          tags=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then tags+=(--tag "$tag"); fi
          done <<< "$TAGS"
          [ "${#tags[@]}" -gt 0 ]
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"

  cognia-server-check:
    if: ${{ false }}
    name: cognia-server (cargo check in Docker)
    needs: vars
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Same-repository PRs can read the private registry cache with their
      # read-only token. Forks use anonymous access; an absent or inaccessible
      # cache falls back to a cold build, without granting package write access.
      - uses: docker/login-action@v4
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cognia-server
          target: check
          push: false
          cache-from: type=registry,ref=ghcr.io/${{ needs.vars.outputs.owner }}/cognia-server:buildcache

  # Both variants in ONE job. They share every Rust and brain stage (slim is
  # full minus the agent CLIs), and BuildKit builds a shared stage once per
  # builder: full first, then slim reuses all of it from the local cache. Two
  # matrix jobs compiled the whole Rust graph twice on two runners and raced
  # on the one registry cache ref.
  cognia-server-image:
    if: ${{ false }}
    name: cognia-server (full + slim)
    needs: vars
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-full
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.vars.outputs.owner }}/cognia-server
          flavor: |
            suffix=-full,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - id: meta-slim
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.vars.outputs.owner }}/cognia-server
          flavor: |
            suffix=-slim,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Full is the superset, so its mode=max export holds every stage slim
      # needs too; slim exports nothing, or it would overwrite the ref with a
      # subset. `ignore-error` keeps a registry hiccup from failing a good build.
      - id: build-full
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cognia-server
          target: runtime-full
          push: ${{ needs.vars.outputs.should_push == 'true' }}
          tags: ${{ steps.meta-full.outputs.tags }}
          labels: ${{ steps.meta-full.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ needs.vars.outputs.owner }}/cognia-server:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ needs.vars.outputs.owner }}/cognia-server:buildcache,mode=max,ignore-error=true

      - id: build-slim
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cognia-server
          target: runtime-slim
          push: ${{ needs.vars.outputs.should_push == 'true' }}
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ needs.vars.outputs.owner }}/cognia-server:buildcache

      # ADR-0224 A10: a Compose host updates by digest, never by tag. The
      # offline catalog signer needs the exact digest this run pushed
      # (`pnpm update:catalog host-entries --target oci-amd64 --digest …`).
      - name: Record the pushed digests
        if: needs.vars.outputs.should_push == 'true'
        env:
          IMAGE: ghcr.io/${{ needs.vars.outputs.owner }}/cognia-server
          FULL_DIGEST: ${{ steps.build-full.outputs.digest }}
          SLIM_DIGEST: ${{ steps.build-slim.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/cognia-server-digest"
          for variant in full slim; do
            if [ "$variant" = full ]; then digest="$FULL_DIGEST"; else digest="$SLIM_DIGEST"; fi
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::build-push-action reported no digest for $variant"
              exit 1
            fi
            printf '%s\n' "$digest" > "$RUNNER_TEMP/cognia-server-digest/$variant.txt"
            echo "cognia-server ($variant, amd64): \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload the full digest
        if: needs.vars.outputs.should_push == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cognia-server-digest-full
          path: ${{ runner.temp }}/cognia-server-digest/full.txt

      - name: Upload the slim digest
        if: needs.vars.outputs.should_push == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cognia-server-digest-slim
          path: ${{ runner.temp }}/cognia-server-digest/slim.txt
