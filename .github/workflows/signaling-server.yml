name: Signaling Server

# ============================================================================
# signaling-server (Rust) — test + coverage gate
# ============================================================================
# The standalone WebRTC signaling rendezvous (ADR-0021) is a separate Cargo
# crate, not part of the pnpm workspace, so the Node test workflow never ran
# it. This workflow runs its unit + integration tests and enforces a >=90%
# line-coverage gate via cargo-llvm-cov.
# ============================================================================

on:
  push:
    branches: [master, dev]
    paths:
      - "services/signaling-server/**"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/signaling-server.yml"
  pull_request:
    paths:
      - "services/signaling-server/**"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/signaling-server.yml"
  workflow_dispatch:

concurrency:
  group: signaling-server-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/signaling-server

jobs:
  test:
    name: Test + Coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add llvm-tools-preview clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "services/signaling-server -> target"
          key: signaling-server-native

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Clippy (deny warnings)
        # `--workspace` covers the shared `core/` crate (the Worker is excluded
        # from the workspace and built in the separate `worker` job below).
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test with coverage (>=90% lines)
        run: cargo llvm-cov --workspace --all-targets --fail-under-lines 90 --summary-only

      - name: Coverage summary
        if: always()
        run: |
          echo "## signaling-server coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Cloudflare Worker build (ADR-0021). Excluded from the workspace above
  # because it targets wasm32 with Worker-only deps. The FFI glue (Durable
  # Object handlers) isn't host-measurable, so it is type-checked + linted on
  # the wasm target here rather than covered by the >=90% line gate; the relay
  # decision logic it relies on lives in `core/` and is covered above.
  # ==========================================================================
  worker:
    name: Worker (wasm typecheck)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: services/signaling-server/worker

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pinned Rust toolchain (wasm32)
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
          rustup component add clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "services/signaling-server/worker -> target"
          key: signaling-server-wasm32-unknown-unknown

      - name: Clippy (wasm, deny warnings)
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Check (wasm)
        run: cargo check --target wasm32-unknown-unknown

      # `wrangler deploy` runs `worker-build --release` (wrangler.toml [build])
      # and serves build/worker/shim.mjs — verify that exact artifact builds so
      # a deploy can't be the first place the packaging breaks (ADR-0059 P0.3).
      - name: Install worker-build
        uses: taiki-e/install-action@v2
        with:
          tool: worker-build@0.8.7

      - name: Build worker artifact
        run: worker-build --release

      - name: Verify worker artifact
        run: |
          test -s build/worker/shim.mjs
          test -s build/index.js
          test -s build/index_bg.wasm
