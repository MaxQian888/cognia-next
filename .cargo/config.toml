[build]
rustflags = ["--cfg", "tokio_unstable"]

# macOS local dev: sign the freshly-built `cognia-next` with a stable
# self-signed identity so the login keychain (service com.cognia.platforms)
# recognizes it across rebuilds and stops re-prompting for the password.
# See src-tauri/scripts/dev-codesign.sh; one-time setup: `pnpm dev:sign:setup`.
#
# The shim is cwd-agnostic — tauri runs cargo from `src-tauri`, plain cargo from
# the repo root — and a no-op when the signer script is missing (CI / Linux /
# other machines), so committing it is safe. Only fires on `cargo run`/`tauri
# dev`, never on `cargo build`/`tauri build`.
[target.aarch64-apple-darwin]
runner = ["/bin/sh", "-c", 'for s in src-tauri/scripts/dev-codesign.sh scripts/dev-codesign.sh; do [ -x "$s" ] && exec "$s" "$@"; done; exec "$@"', "dev-codesign-shim"]
