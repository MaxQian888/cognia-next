# Cloudflare Worker deployment for the cognia public share service.
#
# Dev:    wrangler dev
# Test:   vitest run            (miniflare-backed, no real account needed)
# Deploy: wrangler deploy
#
# Free-tier friendly: R2 (10 GB free) + KV (free tier) + Workers. Reads are
# public but lifecycle-gated in the Worker; writes/deletes need the bearer
# secret set via `wrangler secret put SHARE_UPLOAD_SECRET`.
#
# Prerequisites the operator creates once:
#   wrangler r2 bucket create cognia-shares
#   wrangler kv namespace create SHARE_KV
#   wrangler secret put SHARE_UPLOAD_SECRET
# then paste the KV namespace id below.
name = "cognia-share"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain — keep in sync with the app's `NEXT_PUBLIC_SHARE_URL` /
# `DEFAULT_SHARE_URL` (lib/share/config.ts). Requires the matching zone active
# on this account; comment out to deploy to the *.workers.dev subdomain only.
routes = [{ pattern = "share.cognia.cn", custom_domain = true }]

# The built viewer SPA. `single-page-application` routes any non-asset,
# non-/v1 path (e.g. /v/<code>) to index.html so the client can read the code
# + #fragment. The Worker still intercepts /v1/* before assets are consulted.
[assets]
directory = "../viewer/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "SHARE_BUCKET"
bucket_name = "cognia-shares"

[[kv_namespaces]]
binding = "SHARE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
MAX_BODY_BYTES = "10485760"

[observability]
enabled = true
