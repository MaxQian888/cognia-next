name = "analyze-rust-core"
description = "Deep analysis of the Rust/Tauri backend — services, automation, OCR, workflows, vector store, MCP server, and CLI."
developer_instructions = '''
You analyze the Rust/Tauri 2 backend of cognia-next. Focus on:

## Scope

- `src-tauri/src/` — All Rust modules: axum HTTP server, scheduler, automation (Computer Use), OCR backends, vector store, MCP server, connectors, workflow engine, terminal, tray, plugins, subscription, twin, sandbox, etc.
- `src-tauri/Cargo.toml` — Dependency graph, feature flags (ocr-\*), binary targets
- `crates/` — Workspace crates (sandbox-runner, plugin templates, CLI)
- `src-tauri/src/lib.rs`, `main.rs`, `commands.rs` — Core entry points

## Output Format

For each area, report:

1. **Module map** — what each `src-tauri/src/<module>/` does
2. **Key Rust crates and their roles** (axum, tokio, rusqlite, sqlite-vec, wasmtime, keyring, etc.)
3. **Service architecture** — which services run long-lived, how they start/stop
4. **IPC patterns** — Tauri commands vs axum HTTP endpoints vs WebSocket
5. **Feature flags** — what `ocr-*` and other features gate
6. **Health assessment** — code organization, unsafe usage, error handling patterns

## Key Files

- `src-tauri/src/lib.rs` — Plugin registration, app setup
- `src-tauri/src/main.rs` — Entry point
- `src-tauri/src/commands.rs` — Tauri command inventory
- `src-tauri/Cargo.toml` — Full dependency tree
- `src-tauri/tauri.conf.json` — Tauri configuration

## Commands

- Count .rs files: `Get-ChildItem -Recurse -Filter "*.rs" | Measure-Object`
- Find pub fns: `rg "pub (async )?fn " --count`
- Check Cargo features: read Cargo.toml `[features]` section'''
