[package]
name = "react-quick-starter"
version = "0.1.0"
description = "React + Tauri 16/2.9 quick-starter desktop application"
authors = ["AstroAir <astro_air@126.com>"]
license = "MIT"
repository = "https://github.com/AstroAir/react-quick-starter"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"

# Native logging — fern dispatch chain mirrors records into the OS-native
# platform logger; chrono for ISO-8601 timestamps in readiness payloads;
# once_cell for the global readiness state behind a Mutex.
fern = "0.7"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
thiserror = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "net"] }
dirs = "5"
ignore = "0.4"

# System scheduler — async-trait abstraction over Windows Task Scheduler /
# launchd / systemd, plus a sqlite-backed metadata store for recovery.
async-trait = "0.1"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }

gray_matter = { version = "0.2", default-features = false, features = ["yaml"] }
wait-timeout = "0.2"
regex = "1"
toml_edit = { version = "0.22", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false }
bytes = "1"

# TTS support — provider key vault, Edge-TTS WebSocket bridge, and HTTP proxy.
keyring = "3"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-native-roots", "connect"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-cli = "2"

# Platform-native logging backends.
[target."cfg(target_os = \"windows\")".dependencies]
eventlog = "0.3"

[target."cfg(target_os = \"macos\")".dependencies]
oslog = "0.2"

[target."cfg(target_os = \"linux\")".dependencies]
libsystemd = "0.7"
syslog = "7"

[dev-dependencies]
# Unit tests for the scheduler metadata store create temp sqlite DBs.
tempfile = "3"
