[package]
name = "cognia-next"
version = "0.1.0"
description = "cognia-next — AI-powered desktop application built with Next.js 16 + Tauri 2"
authors = ["AstroAir <astro_air@126.com>"]
license.workspace = true
publish.workspace = true
repository = "https://github.com/MaxQian888/cognia-next"
edition.workspace = true
# Rust 1.95 is required by oar-ocr 0.9.x, which is now part of the standard
# desktop build through the default `ocr-paddle` feature.
rust-version.workspace = true
# PP-OCRv6 ships through oar-ocr 0.9.x, whose supported toolchain floor is
# Rust 1.95. Keep this crate and rust-toolchain.toml aligned.
default-run = "cognia-next"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
# Desktop binaries consume the Rust library directly. Mobile ships through the
# Capacitor workspace (`mobile/`), so producing Tauri's mobile `staticlib` and
# `cdylib` artifacts here only added a multi-gigabyte archive to every rebuild.
crate-type = ["rlib"]

# Headless cognia-server binary (Phase D / ADR-0014).
[[bin]]
name = "cognia-server"
path = "src/bin/cognia-server.rs"

# ADR-0028 Phase 4.2 / Phase 13 — Windows sandbox setup binary.
# UAC-elevated. Creates the two synthetic users and installs per-SID
# Firewall rules. `--uninstall` cleans up; called by the WiX/NSIS
# uninstall hook.
[[bin]]
name = "cognia-sandbox-setup"
path = "src/bin/cognia-sandbox-setup.rs"
required-features = []

# ADR-0028 Phase 4 — the Windows sandbox runner moved to its own workspace
# member crate (`crates/cognia-sandbox-runner`) so the security-sensitive
# restricted-token + low-integrity + Job Object code builds/checks in
# isolation (`cargo check -p cognia-sandbox-runner`) instead of recompiling the
# whole Tauri tree. It still emits `cognia-sandbox-runner.exe` into the shared
# workspace `target/`, so bundling is unchanged.

# ADR-0020 follow-up — screen-off Computer Use virtual-display driver
# installer. UAC-elevated (launched via Start-Process -Verb RunAs by the
# renderer's `virtual_display_setup` command). `pnputil /add-driver` the
# bundled, Microsoft-signed parsec-vdd payload; writes a success marker.
[[bin]]
name = "cognia-vdd-setup"
path = "src/bin/cognia-vdd-setup.rs"
required-features = []

# ADR-0021 — WebRTC pair-test harness (`pnpm webrtc:pair`). A headless desktop
# answerer that drives the PRODUCTION signaling client + webrtc-rs peer against
# a real browser `RTCPeerConnection` through a real signaling server. Gated
# behind the `webrtc-harness` feature so normal desktop/release builds never
# compile it.
[[bin]]
name = "cognia-webrtc-peer"
path = "src/bin/cognia-webrtc-peer.rs"
required-features = ["webrtc-harness"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
# ADR-0175 B4: wire types derive their own JSON Schema so the published output
# contract cannot disagree with the struct that fills it, and
# `companion_api::output_registry` generates a `Derived` row from the type.
schemars.workspace = true
# Shared signaling wire protocol (ADR-0021). Single source of truth for the
# frame/envelope types, also consumed by the standalone signaling-server and
# its Cloudflare Worker. The desktop peer (companion_api::signaling) keeps its
# own HMAC/replay logic but reuses these structs to prevent wire-format drift.
cognia-signaling-core = { path = "../services/signaling-server/core" }
# ADR-0067 — foundation utilities (fs_atomic). Re-aliased as `crate::fs_atomic`.
cognia-core = { path = "../crates/cognia-core", features = ["rt"] }
# ADR-0067 Tier B prep — secret_store/keyring_secrets/api_key foundation.
# Re-aliased as crate::{secret_store,api_key}; keyring_secrets keeps an
# app-side facade for its command shells. The `test-inmemory` feature is
# enabled from [dev-dependencies] so unit tests never touch the OS keyring.
cognia-secrets = { path = "../crates/cognia-secrets" }
# ADR-0067 Tier B prep — proxy_config foundation (state + detection + WSS
# dialer); `proxy_config/` stays as an app-side facade for the command shells.
cognia-net = { path = "../crates/cognia-net" }
# ADR-0196 P2 — the balance-script sandbox; `provider_diagnostics.rs` keeps the
# three command shells and re-exports the crate.
cognia-provider-diagnostics = { path = "../crates/cognia-provider-diagnostics" }
# ADR-0196 P4 — the companion transport leaves: TLS identity, mDNS/mesh
# discovery, the cloudflared tunnel, reachability/signaling config and the
# WebRTC peer, envelope and framing. `companion_api` re-exports each module at
# its old path.
cognia-companion-connectivity = { path = "../crates/cognia-companion-connectivity" }
# ADR-0196 P4 — the companion's event bus, push delivery, store bridges and
# remote execution contexts. `tauri-host` adds the two Tauri adapters
# (`register_tauri_event`, `WebViewBridgeTransport`); `companion_api`
# re-exports each module at its old path.
cognia-companion-bus = { path = "../crates/cognia-companion-bus", features = ["tauri-host"] }
# ADR-0196 P6g — Chromium cookie import; `browser/cookie_import` keeps the
# command shells, the macOS keychain adapter and the WebKit sink.
cognia-browser-cookies = { path = "../crates/cognia-browser-cookies" }
# ADR-0196 P6b — Codex App dispatch; `codex_app_dispatch.rs` keeps the command
# shells and the `AppHandle`-backed `CodexAppHost`.
cognia-codex-app = { path = "../crates/cognia-codex-app" }
# Native local-video metadata, frame extraction, trimming, and analysis.
cognia-media = { path = "../crates/cognia-media", features = ["tauri-host"] }
# ADR-0067 Tier B — integrated terminal subsystem (portable-pty). Re-aliased
# as `crate::terminal`; commands referenced from generate_handler!.
cognia-terminal = { path = "../crates/cognia-terminal", features = ["tauri-host"] }
# Background-job supervisor — the non-interactive sibling of cognia-terminal.
# Owns `bash(run_in_background)` and scheduled-task background work.
cognia-jobs = { path = "../crates/cognia-jobs" }
# ADR-0067 Tier C — `desktop-host` carries the crash/logging/telemetry cluster
# that moved out of this crate; it is off by default there so cognia-cli stays
# lean. The move also took `fern`, `tracing-subscriber`, `crash-handler`,
# `minidumper`, the four OpenTelemetry crates and the per-OS log sinks
# (`oslog`/`eventlog`/`syslog`/`libsystemd`) out of this manifest.
cognia-observability = { path = "../crates/cognia-observability", features = ["desktop-host"] }
# The Rust CODE that uses `tauri-plugin-log` moved into cognia-observability
# with it, but this declaration must STAY: `tauri-build` harvests plugin
# permission sets from the app crate's DIRECT dependencies, and
# `capabilities/default.json` asks for `log:default`. Dropping it fails the
# build with `Permission log:default not found`.
tauri-plugin-log = "2"
cognia-headless-contract = { path = "../crates/cognia-headless-contract" }
# ADR-0175. The single error document on every companion plane.
cognia-problem = { path = "../crates/cognia-problem", features = ["axum"] }
# ADR-0067 Tier B — subscription vault/providers (ADR-0025); `subscription/`
# stays as an app-side facade holding the top-level command surface.
cognia-subscription = { path = "../crates/cognia-subscription", features = ["tauri-host"] }
# ADR-0067 Tier B — Platform Connectors (matrix E2EE stack). Re-aliased as
# `crate::connectors`; the BusEventEmitter impl stays in companion_api.
cognia-connectors = { path = "../crates/cognia-connectors", features = ["tauri-host"] }
# ADR-0067 Tier B — plugin runtime (wasmtime/cranelift). Re-aliased as
# `crate::plugin_api`; the vscode LSP host's sidecar-dir resolver is
# registered from run().
cognia-plugin-runtime = { path = "../crates/cognia-plugin-runtime", features = ["tauri-host"] }
# ADR-0067 follow-up — skills subsystem. Re-aliased as `crate::skills`.
cognia-skills = { path = "../crates/cognia-skills", features = ["tauri-host"] }
# ADR-0067 follow-up — TTS subsystem. Re-aliased as `crate::tts`.
cognia-tts = { path = "../crates/cognia-tts", features = ["tauri-host"] }
# ADR-0067 follow-up — remote-control LAN API. Re-aliased as
# `crate::remote_control`.
# ADR-0067 follow-up — local OpenAI-compatible gateway. Re-aliased as
# `crate::gateway`.
cognia-gateway = { path = "../crates/cognia-gateway", features = ["tauri-host"] }
# ADR-0067 follow-up — CCSwitch provider-relay switcher. Re-aliased as
# `crate::ccswitch`.
cognia-ccswitch = { path = "../crates/cognia-ccswitch", features = ["tauri-host"] }
# ADR-0067 follow-up — embedded MCP server. Re-aliased as `crate::mcp_server`.
cognia-mcp-server = { path = "../crates/cognia-mcp-server", features = ["tauri-host"] }
# ADR-0067 follow-up — external agent exec backends (bollard/kube isolated
# behind the crate's own features; see [features] forwarding below).
# Re-aliased as `crate::external_agent`.
cognia-external-agent = { path = "../crates/cognia-external-agent", features = ["tauri-host"] }
# ADR-0182/0183 — runtime environment sandboxes. Linked unconditionally so the
# boot seam decides in every build: a deployment that enabled the pool must
# never boot into a binary that silently ignores the switch. The Docker driver
# itself needs the `docker` feature, forwarded from `container-exec` below.
cognia-sandbox-pool = { path = "../crates/cognia-sandbox-pool" }
# The companion API serves the tenant catalog, the approvals and the probe
# cache out of the same store admission uses (ADR-0182).
# `registry`: `environment_image_inspect` reads image metadata here, on the Host,
# which is the metadata reader the sandbox-pool crate defers to.
cognia-environment = { path = "../crates/cognia-environment", default-features = false, features = ["store", "registry"] }
# ADR-0067 Phase 5 — Computer Use automation + execution sandbox cluster. Owns
# uiautomation/enigo/xcap/accessibility/seccompiler; re-aliased as
# crate::{automation,sandbox,cua_sandbox}. windows/core-graphics/core-foundation/
# libc stay below (shared with pet_window/fleet/scheduler/etc.).
cognia-automation = { path = "../crates/cognia-automation", features = ["tauri-host"] }
# ADR-0067 Phase 1 — process-global span instrumentation registry, extracted
# from `perf/{span,registry}.rs` so the Tier-A leaf crates (cognia-git,
# cognia-vector, cognia-ocr) can instrument without depending on the whole app.
# `perf/mod.rs` re-exports its symbols so `crate::perf::guard` call sites are
# unchanged, and the perf panel reads its shared global `REGISTRY`.
cognia-instrument = { path = "../crates/cognia-instrument" }
# ADR-0067 Phase 2 — Source Control subsystem (ADR-0038), extracted so the
# git2/vendored-libgit2 C compile isolates. Re-aliased as `crate::git` in
# lib.rs; its `commands::git_*` are referenced from `generate_handler!`.
cognia-git = { path = "../crates/cognia-git", features = ["tauri-host"] }
# ADR-0176. The shared bare-mirror object cache. This crate owns the
# credential policy and the git runner that `github/workspace.rs` used to
# carry itself; the app now only points the cache root at the data dir.
cognia-git-mirror = { path = "../crates/cognia-git-mirror" }
cognia-task-workspace = { path = "../crates/cognia-task-workspace" }
# ADR-0067 Tier C — multi-agent MCP config IO (owns `toml_edit`).
cognia-agents = { path = "../crates/cognia-agents", features = ["tauri-host"] }
# ADR-0067 Tier C — confined filesystem surface (owns `gray_matter`, `ignore`).
cognia-files = { path = "../crates/cognia-files", features = ["tauri-host"] }
# ADR-0067 Tier C — SQLite mirrors of renderer-side agent state. Tauri-free
# on purpose: the headless `cognia-server` bin links it directly.
cognia-agent-state = { path = "../crates/cognia-agent-state" }
# ADR-0149 — identity primitives. Default features only: the app validates
# `usr_…` / `org_…` before persisting them and resolves membership, but never
# mints grants, so it does not link the `grants` HMAC machinery.
cognia-tenant-auth = { path = "../crates/cognia-tenant-auth" }
log.workspace = true
# `unstable` unlocks the built-in multi-webview API (`Window::add_child`,
# `Manager::get_webview`) that powers the embedded in-app browser pane
# (`src-tauri/src/browser/embedded.rs`). Pinned exactly because unstable APIs
# may shift across minor versions.
tauri = { workspace = true, features = ["macos-private-api", "macos-proxy", "tray-icon", "image-png", "unstable"] }

# Timestamps across the app shell (companion, headless, perf, subscription…)
# and process-global lazies (claude, codeserver, companion, fleet, perf…).
# The native logging stack that first brought these in moved to
# `crates/cognia-observability` (ADR-0067 Tier C).
chrono = { workspace = true, features = ["serde"] }
once_cell.workspace = true
# `tracing` spans in `claude` and `companion_api`. The structured subscriber
# itself lives in `crates/cognia-observability`.
tracing.workspace = true
# Process and host metrics for the perf panel and the fleet host rows
# (`perf/`, `fleet/`). Only the `system` feature is needed; disabling the
# defaults drops disk/network/component/multithread to keep it lean.
sysinfo = { workspace = true, features = ["system"] }
thiserror.workspace = true
# `anyhow` is already pulled in as a transitive; expose it directly so
# `cli_bridge` (and similar small modules) can use Result<T> + Context
# without inventing a per-module error enum.
anyhow.workspace = true
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-os = "2"
# `tauri-plugin-shell` powers the host-managed cloudflared companion tunnel.
# Scope-locked to the `cloudflared` binary in `tauri.conf.json`.
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
# `persisted-scope` transparently saves and restores the `fs` / `asset` plugin
# scope grants across app restarts — so once a user picks a folder via the
# dialog plugin, that grant survives a relaunch without re-prompting.
# Backend-only; no JS surface and no capability entry needed.
tauri-plugin-persisted-scope = "2"
# Chunked upload + download with progress events. Used by the renderer to push
# attachments through the connector outbound runner without hand-rolled
# multipart streaming. See `lib/tauri/upload.ts`.
tauri-plugin-upload = "2"
# Window positioner — exposes `moveWindow(Position)` for tray-anchored panels
# and standard placements (TopRight, Center, etc.). See `lib/tauri/positioner.ts`.
tauri-plugin-positioner = "2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "net", "signal"] }
dirs.workspace = true
# ADR-0067 Tier C — `ignore` moved to `crates/cognia-files` with the
# workspace-search walker; no `src-tauri/src` file references it.

# Object-safe async traits in `companion_api`, `claude`, `recorder_window` and
# `codex_app_dispatch`. (The system scheduler that first needed it is now
# `crates/cognia-scheduling`.)
async-trait.workspace = true
parking_lot.workspace = true
# ADR-0059 R13 — bollard (docker) and kube moved to
# `crates/cognia-external-agent` (ADR-0067); the `container-exec` / `k8s-exec`
# features below forward to that crate's own features.
rusqlite = { workspace = true, features = ["backup", "bundled"] }
# ADR-0067 Tier B — the Matrix E2EE stack (`matrix-sdk-crypto` /
# `matrix-sdk-sqlite` / `ruma`) moved to `crates/cognia-connectors`; these
# declarations outlived the move and kept the stack in app_lib's dep graph.
# ADR-0067 Phase 4 — the native (sqlite-vec) + cloud (qdrant/…) vector store
# lives in `crates/cognia-vector`, which owns the `sqlite-vec` + `qdrant-client`
# deps. Re-aliased as `crate::vector` in lib.rs; the app installs a keyring-backed
# `CredentialStore` at boot so the crate never touches `secret_store` directly.
cognia-vector = { path = "../crates/cognia-vector", features = ["tauri-host"] }

# ADR-0067 Tier C — `gray_matter` moved to `crates/cognia-files` with the
# slash-command / skill front-matter parsing; no `src-tauri/src` file
# references it.
wait-timeout.workspace = true
# ADR-0067 Tier B — `portable-pty` moved to `crates/cognia-terminal` together
# with `src-tauri/src/terminal/` (the path this comment named no longer exists).
# System font enumeration for the appearance / terminal font pickers
# (`src-tauri/src/fonts.rs`). Pure-Rust — loads the OS font set and reports
# each face's monospaced flag so the terminal picker can show only
# fixed-pitch families. The webview can't do this (WKWebView has no Local
# Font Access API).
fontdb = "0.24"
regex.workspace = true
toml_edit = { workspace = true, features = ["serde"] }
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream", "socks", "http2", "multipart", "form"] }
# `tokio-socks` / `tokio-rustls` were direct declarations no `src-tauri/src`
# file ever named; reqwest's `socks` / `rustls` features pull them transitively.
rustls = { workspace = true, features = ["ring", "std"] }
futures-util = { workspace = true }
# ADR-0067 Tier C — `rquickjs` moved to `crates/cognia-net` with
# `provider_diagnostics`, its only user; no `src-tauri/src` file references it.
bytes.workspace = true

# Vector cloud backends (ADR-0022, qdrant/milvus/pinecone/chroma/weaviate) moved
# to `crates/cognia-vector` (ADR-0067 Phase 4).

# TTS support — provider key vault, Edge-TTS WebSocket bridge, and HTTP proxy.
# keyring v3 has NO default features: without an explicit platform backend it
# silently falls back to an in-process *mock* store (writes succeed but never
# touch the OS keyring and evaporate on restart). That made every connector /
# subscription / TTS secret non-persistent — e.g. the Lark App ID vanished
# after restart, breaking the bot-identity probe and the long-connection
# handshake (private-chat bot went dead). The real OS backend is wired per
# target below (windows-native / apple-native / sync-secret-service); the base
# entry stays default-free so Android/iOS fall back to mock intentionally.
keyring = { version = "4", default-features = false }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots", "connect"] }
uuid = { workspace = true, features = ["v4", "v7"] }
base64.workspace = true
# ADR-0067 Tier B — `prost` (the Feishu/Lark `pbbp2.Frame` codec) moved to
# `crates/cognia-connectors` with `lark_ws.rs`; the path this comment named no
# longer exists.

# ADR-0067 Phase 6 — scheduler + workflow + timing (and the `cron` expression
# parser) live in `crates/cognia-scheduling`; re-aliased as
# crate::{scheduler,workflow}.
cognia-scheduling = { path = "../crates/cognia-scheduling", features = ["tauri-host"] }

# HTTP listeners in the app shell (companion API, codeserver relay, CLI
# bridge): axum for the routers, subtle for constant-time token comparison in
# the codeserver relay, tower-http for body-size limits.
axum = { workspace = true, features = ["macros", "multipart", "ws"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# axum-server (M2.9) — TLS termination for the companion API. `tls-rustls`
# pulls in rustls + ring; matches the project's existing tokio-rustls path.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
subtle.workspace = true
tower = { workspace = true, features = ["util", "limit", "timeout"] }
tower-http = { workspace = true, features = ["limit", "trace", "cors"] }
hmac.workspace = true
sha1 = "0.11"
sha2.workspace = true
p256 = { version = "0.14", features = ["ecdsa", "ecdh"] }
argon2 = "0.5"
ed25519-dalek.workspace = true
hex.workspace = true
url.workspace = true
aes-gcm = { workspace = true, features = ["aes"] }
rand.workspace = true
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
serde_urlencoded = "0.7"

# Local IP detection — used by `companion_issue_pair_jwt` to render the
# QR-encoded LAN URL when the companion server is bound to 0.0.0.0.
# Falls back to loopback if no usable interface is present (e.g., headless
# CI). Pure-Rust, MIT-licensed, no transitive system deps.
local-ip-address = "0.6"

# `notify` watches imported agent-session directories
# (`session_import_watch.rs`); `flate2` + `tar` read and write the gzipped
# tarballs in `codeserver`, `headless` backups and `cli_bridge`. (The plugin
# runtime that first brought them in is now `crates/cognia-plugin-runtime`.)
notify.workspace = true
flate2.workspace = true
tar.workspace = true
# Auto-cleanup temp dirs at runtime (`companion_api/rpc/media.rs`,
# `cli_bridge`, `codeserver`); most other uses are unit tests.
tempfile.workspace = true
# Zip archives in `cli_bridge` (plugin bundles the `cognia plugin build` CLI
# emits) and `codeserver`. Pure-Rust, no system zlib dep.
zip = { workspace = true, features = ["deflate", "bzip2"] }

# ADR-0067 Tier B — the WASM plugin runtime (ADR-0013) moved to
# `crates/cognia-plugin-runtime`, which owns `wasmtime`/`wasmtime-wasi`/
# `wasmparser` and pins its own version. These declarations outlived the move:
# no `src-tauri/src` file referenced them, and a stale pin here built a SECOND
# wasmtime + cranelift-codegen alongside the crate's own.

# CLI argument parsing for the cognia-server binary (Phase D follow-up).
# `derive` gives us the `#[derive(Parser)]` macro; `std` keeps default
# features (env / wrap_help / etc.). Pulling clap is cheap compared to
# maintaining a hand-rolled parser as the subcommand surface grows.
clap = { workspace = true, features = ["derive"] }

# ADR-0067 Phase 5 — `xcap` (screenshot) + the UIA/a11y crates moved to
# `crates/cognia-automation`.
dial9-tokio-telemetry = "0.3"

# WebRTC stack (ADR-0021) — the current 0.20 API uses a runtime-agnostic
# PeerConnection builder, one event-handler object per connection, and polled
# DataChannel events. The desktop side of the WAN transport acts as the peer
# counterpart of every mobile client in its rendezvous room. Keep the minimum
# on the patched 0.20.2 release; Cargo may take compatible 0.20.x fixes.
webrtc = "0.20.2"

# ADR-0067 Phase 3 — native OCR subsystem (ADR-0024) lives in `crates/cognia-ocr`.
# The optional ocrs/rten/rten-imageproc/oar-ocr/ort/image deps and the 5 `ocr-*`
# features moved there; the `[features]` block below forwards them. Re-aliased as
# `crate::ocr` in lib.rs; `ort`'s copy-dylibs still stages the onnxruntime DLL
# into the shared target dir, so bundling is unchanged. The dev-profile
# `[profile.dev.package.rten]` opt-level=3 override lives at the workspace root.
cognia-ocr = { path = "../crates/cognia-ocr", features = ["tauri-host"] }

# Native PDF parsing with per-item bounding boxes (PDFium via pdfium-sys,
# which downloads a prebuilt PDFium at build time and loads it through
# `libloading` at runtime). `default-features = false` drops liteparse's
# bundled Tesseract build — scanned PDFs go through the ADR-0024 OCR
# subsystem instead.
liteparse      = { version = "2", default-features = false, optional = true }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-cli = "2"

# Native hard-crash capture (ADR — crash-report subsystem). `crash-handler`
# installs the platform exception handler (Windows SEH / Unix signals / macOS
# Mach ports); `minidumper` writes the minidump out-of-process from a sibling
# monitor. Desktop-only — mobile shells (Capacitor) never compile this crate,
# and the code is additionally `#[cfg(desktop)]`-gated in `crash::monitor`.

# Platform-native logging backends + UI automation back-ends.
[target."cfg(target_os = \"windows\")".dependencies]
# Real OS credential store (Windows Credential Manager) — see the keyring
# note in [dependencies]. Without this feature keyring uses the mock store.
keyring = { version = "4", features = ["windows-native-keyring-store"] }
# ADR-0067 Phase 5 — `uiautomation` moved to `crates/cognia-automation`.
# Direct windows-rs dep for SendInput/MOUSEEVENTF_WHEEL/GetSystemMetrics calls
# that aren't exposed publicly through `uiautomation::inputs`. Version pinned
# to match uiautomation's own transitive `windows = 0.62.2` to avoid duplicate
# trees. Feature set is the minimum needed for the input + window-metrics work
# in `automation/platform/uia/input.rs`.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # Screen-off Computer Use (virtual display): parsec-vdd device IOCTLs +
    # display-topology set-primary/restore + system-sleep keepalive.
    "Win32_Storage_FileSystem",        # CreateFileW, FILE_SHARE_*, OPEN_EXISTING
    "Win32_System_IO",                 # DeviceIoControl, OVERLAPPED, GetOverlappedResult
    "Win32_System_Threading",          # CreateEventW, WaitForSingleObject
    "Win32_System_Power",              # SetThreadExecutionState, ES_*
    "Win32_Devices_Display",           # (reserved) QueryDisplayConfig family
    "Win32_Graphics_Gdi",              # ChangeDisplaySettingsExW, EnumDisplay*, DEVMODEW
    # Desktop-pet window perching (pet_window/surfaces.rs): DwmGetWindowAttribute
    # + DWMWA_CLOAKED to skip virtual-desktop / UWP ghost windows during
    # EnumWindows surface enumeration.
    "Win32_Graphics_Dwm",
] }

[target."cfg(target_os = \"macos\")".dependencies]
block2 = "0.6"
# Real OS credential store (macOS/iOS Keychain) — see the keyring note in
# [dependencies]. Without this feature keyring uses the mock store.
keyring = { version = "4", features = ["apple-native-keyring-store"] }
# ADR-0067 Phase 5 — `enigo` and the skill-recorder CGEventTap hook moved to
# `crates/cognia-automation`. `core-graphics` / `core-foundation` stay: the pet
# overlay (`pet_window/surfaces.rs`) and `power_assertion.rs` use them directly.
# `core-graphics-types` was named only for the moved event-tap FFI.
core-graphics = "0.25"
core-foundation = "0.10"
# Non-activating NSPanel conversion for the desktop-pet overlay + popup windows
# (pet_window/macos_panel.rs): floats over all Spaces + full-screen apps and
# never steals foreground focus. macOS-only; pulls objc2* transitively. Cargo.lock
# pins the resolved v2.1 commit for reproducibility.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
# NSScreen.safeAreaInsets for the fleet island placement
# (fleet/island_window.rs): the island anchors to the FULL monitor frame (the
# work area / visibleFrame shrinks and grows with menu-bar visibility, so a
# fullscreen Space would strand the strip below a phantom menu bar) and needs
# the notch height to pad content below the camera housing. Both crates are
# already in the lock transitively (wry / tauri-nspanel); naming them adds no
# new versions.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSScreen"] }
objc2-foundation = { version = "0.3.2", features = [
  "NSArray",
  "NSDate",
  "NSDictionary",
  "NSHTTPCookie",
  "NSString",
] }
objc2-web-kit = { version = "0.3.2", features = [
  "WKHTTPCookieStore",
  "WKWebView",
  "WKWebViewConfiguration",
  "WKWebsiteDataStore",
  "block2",
] }
# ADR-0067 Phase 5 — the macOS Accessibility (AX) element tree (ADR-0020) and
# the raw `core-foundation-sys` C types it needed moved to
# `crates/cognia-automation` with `accessibility` + `accessibility-sys`.

[target."cfg(unix)".dependencies]
# Direct syscalls for the execution sandbox (ADR-0028): `setrlimit` for the
# CPU / address-space caps applied via `Command::pre_exec` on the Linux
# `bwrap` and macOS `sandbox-exec` backends (`sandbox/limits.rs`).
libc.workspace = true

[target."cfg(target_os = \"linux\")".dependencies]
# Real OS credential store (freedesktop Secret Service over D-Bus) — see the
# keyring note in [dependencies]. `crypto-rust` encrypts the D-Bus session
# transfer with RustCrypto so no system OpenSSL is needed at build time.
# Chosen over `linux-native` (kernel keyutils) because keyutils is wiped on
# reboot, which would lose stored bot credentials.
keyring = { version = "4", features = ["zbus-secret-service-keyring-store"] }
# ADR-0067 Phase 5 — `enigo` (atspi input sim) + `seccompiler` (bwrap seccomp
# filter) moved to `crates/cognia-automation`.

[dev-dependencies]
# Keep app_lib's own test suite hermetic: the secret store's file+keyring
# global becomes in-memory when tests build (dev-dep feature unification);
# production builds never see the feature.
cognia-secrets = { path = "../crates/cognia-secrets", features = ["test-inmemory"] }
# `sync_bridge::pending_count`, which `ws_bridge`'s tests read across the crate
# boundary.
cognia-companion-bus = { path = "../crates/cognia-companion-bus", features = ["test-support"] }
# HTTP mock server for connectors::http_client and attachments tests.
# (`tempfile` is in `[dependencies]` for runtime plugin staging and is
# transitively available in unit tests, so it isn't re-declared here.)
wiremock.workspace = true
# Test certificates for the `account_auth::cloud_deployment` pinning tests.
# (The companion listener's own certificate is minted in
# `cognia-companion-connectivity`.)
rcgen.workspace = true

# ADR-0024 — standard desktop builds include PaddleOCR; other native OCR
# bindings remain explicit opt-ins. Placeholder registrations keep the
# dispatch table dense without making an unavailable backend routable.
[features]
default = ["ocr-paddle"]
# Lightweight desktop flavor: do not bundle Node.js. Tauri setup resolves and
# validates one system Node.js >= 26 executable for every app-owned JS child.
system-node-runtime = []
# Explicit opt-in for the authenticated loopback agent debugging surface.
# Never enable this in release packaging: it intentionally exposes raw
# renderer evaluation and window capture to the per-launch CLI bridge token.
agent-debug = []
# ADR-0021 — compiles the `cognia-webrtc-peer` harness binary. Off by default
# so the extra bin never enters normal builds; enabled only by `pnpm webrtc:pair`.
webrtc-harness = []
# ADR-0073 — native OTLP trace/metric export is deliberately opt-in so the
# OpenTelemetry dependency graph does not slow normal desktop development.
otel-export = ["cognia-observability/otel-export"]
# Cross-platform Tesseract via the local `tesseract` CLI. The feature links
# no native library; runtime availability depends on the executable being
# installed on PATH or packaged by the app shell.
# ADR-0067 Phase 3 — these forward to the extracted `cognia-ocr` crate, which
# owns the real ocrs/rten/oar-ocr/ort/image optional deps.
ocr-tesseract = ["cognia-ocr/ocr-tesseract", "cognia-observability/ocr-tesseract"]
# Windows.Media.Ocr — requires MSIX package identity; see `tauri.conf.json`.
ocr-windows = ["cognia-ocr/ocr-windows", "cognia-observability/ocr-windows"]
# Apple Vision needs no feature — `cognia-ocr` wires Vision.framework
# in-process whenever the target is macOS.
# Pure-Rust OCR via `ocrs` + RTen. Models downloaded on first use.
ocr-ocrs = ["cognia-ocr/ocr-ocrs", "cognia-observability/ocr-ocrs"]
# PaddleOCR PP-OCRv6 via `oar-ocr` + ONNX Runtime (ships an onnxruntime DLL).
ocr-paddle = ["cognia-ocr/ocr-paddle", "cognia-observability/ocr-paddle"]
# ADR-0059 R13 — ExecBackend::Container for per-workspace runner containers
# (T2 topology). Off desktop builds: only the headless `cognia-server` image
# enables it, so the Docker client never enters the Tauri binary.
# Also arms the ADR-0183 Docker sandbox driver: both flavors talk to the same
# daemon through the same seam, so a build that can run legacy runners is
# exactly the build that can run runtime environment sandboxes.
container-exec = [
  "cognia-external-agent/container-exec",
  "cognia-sandbox-pool/docker",
]
# ADR-0059 R13 (T3) — kubernetes flavor of the exec backend: runner Pods with
# attached stdio, PVC-subPath workspace mounts. In-cluster only; enabled in
# the headless image alongside `container-exec`.
k8s-exec = ["cognia-external-agent/k8s-exec"]
workspace-runtime-exec = ["cognia-external-agent/workspace-runtime-exec"]
# Native PDF parsing with bounding boxes via `liteparse` (PDFium). Needs
# network at build time (pdfium-sys downloads a prebuilt PDFium); the
# PDFium dynamic library must ship next to the executable — see
# `src/parse/mod.rs`. Default builds compile an `unsupported` stub.
parse-liteparse = ["dep:liteparse"]

# RTen is mandatory `--release` per upstream README — without opt-level=3
# even smoke tests crawl. The override now lives in the workspace root
# Cargo.toml (cargo ignores `[profile.*]` blocks in workspace members).

[lints]
workspace = true
