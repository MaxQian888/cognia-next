[package]
name = "react-quick-starter"
version = "0.1.0"
description = "React + Tauri 16/2.9 quick-starter desktop application"
authors = ["AstroAir <astro_air@126.com>"]
license = "MIT"
repository = "https://github.com/AstroAir/react-quick-starter"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.0", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"

# Native logging — fern dispatch chain mirrors records into the OS-native
# platform logger; chrono for ISO-8601 timestamps in readiness payloads;
# once_cell for the global readiness state behind a Mutex.
fern = "0.7"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
thiserror = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "net"] }
dirs = "6"
ignore = "0.4"

# System scheduler — async-trait abstraction over Windows Task Scheduler /
# launchd / systemd, plus a sqlite-backed metadata store for recovery.
async-trait = "0.1"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
# Native vector store backend — sqlite-vec FFI is loaded as a SQLite
# auto-extension before any connection opens (mirrors the pattern in the
# crate's own integration test). The crate itself has no rusqlite dep, so
# its only constraint is that the host SQLite supports loadable extensions
# (the `bundled` feature does).
sqlite-vec = "0.1"

gray_matter = { version = "0.2", default-features = false, features = ["yaml"] }
wait-timeout = "0.2"
regex = "1"
toml_edit = { version = "0.22", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "socks"] }
tokio-socks = "0.5"
tokio-rustls = "0.26"
rustls-pki-types = "1"
webpki-roots = "0.26"
futures-util = { version = "0.3", default-features = false }
bytes = "1"

# TTS support — provider key vault, Edge-TTS WebSocket bridge, and HTTP proxy.
keyring = "3"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-native-roots", "connect"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

# Workflow cron daemon — `cron` is just the expression parser; we drive
# firing via a small tokio loop in `src-tauri/src/workflow/triggers/cron_daemon.rs`
# rather than pull in `tokio-cron-scheduler` (which is heavier and has its
# own runtime semantics that conflict with our existing scheduler module).
cron = "0.12"

# MCP HTTP server — axum for the inbound listener, subtle for constant-time
# bearer-token comparison, tower-http for body-size limits.
axum = { version = "0.8", features = ["macros", "ws"] }
subtle = "2"
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.6", features = ["limit", "trace", "cors"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
url = "2"
aes-gcm = { version = "0.10", features = ["aes"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rand = "0.8"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-cli = "2"

# Platform-native logging backends.
[target."cfg(target_os = \"windows\")".dependencies]
eventlog = "0.3"

[target."cfg(target_os = \"macos\")".dependencies]
oslog = "0.2"

[target."cfg(target_os = \"linux\")".dependencies]
libsystemd = "0.7"
syslog = "7"

[dev-dependencies]
# Unit tests for the scheduler + vector subsystems create temp sqlite DBs.
tempfile = "3"
# HTTP mock server for connectors::http_client and attachments tests.
wiremock = "0.6"
