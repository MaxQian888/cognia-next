[package]
name = "cognia-next"
version = "0.1.0"
description = "cognia-next — AI-powered desktop application built with Next.js 16 + Tauri 2"
authors = ["AstroAir <astro_air@126.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/MaxQian888/cognia-next"
edition = "2021"
# 1.89.0 floor — driven by transitive deps in the workspace Cargo.lock
# (`metrique 0.1.25` is the highest). `clap_lex 1.1.0` needs 1.85
# (edition2024) and `oar-ocr` (gated by `ocr-paddle`) needs 1.84.1; the
# workspace toolchain pin in `rust-toolchain.toml` reflects the floor.
rust-version = "1.89.0"
# NOTE: the workspace toolchain pin (`rust-toolchain.toml`) lives at 1.93.0
# to match the lockfile resolver context. `rust-version` here documents the
# minimum any consumer needs to build this crate — 1.89.0 is the floor from
# transitive deps; bumping the pin doesn't change this MSRV claim.
default-run = "cognia-next"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Headless cognia-server binary (Phase D / ADR-0014).
[[bin]]
name = "cognia-server"
path = "src/bin/cognia-server.rs"

# ADR-0028 Phase 4.2 / Phase 13 — Windows sandbox setup binary.
# UAC-elevated. Creates the two synthetic users and installs per-SID
# Firewall rules. `--uninstall` cleans up; called by the WiX/NSIS
# uninstall hook.
[[bin]]
name = "cognia-sandbox-setup"
path = "src/bin/cognia-sandbox-setup.rs"
required-features = []

# ADR-0028 Phase 4 — the Windows sandbox runner moved to its own workspace
# member crate (`crates/cognia-sandbox-runner`) so the security-sensitive
# restricted-token + low-integrity + Job Object code builds/checks in
# isolation (`cargo check -p cognia-sandbox-runner`) instead of recompiling the
# whole Tauri tree. It still emits `cognia-sandbox-runner.exe` into the shared
# workspace `target/`, so bundling is unchanged.

# ADR-0020 follow-up — screen-off Computer Use virtual-display driver
# installer. UAC-elevated (launched via Start-Process -Verb RunAs by the
# renderer's `virtual_display_setup` command). `pnputil /add-driver` the
# bundled, Microsoft-signed parsec-vdd payload; writes a success marker.
[[bin]]
name = "cognia-vdd-setup"
path = "src/bin/cognia-vdd-setup.rs"
required-features = []

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# Shared signaling wire protocol (ADR-0021). Single source of truth for the
# frame/envelope types, also consumed by the standalone signaling-server and
# its Cloudflare Worker. The desktop peer (companion_api::signaling) keeps its
# own HMAC/replay logic but reuses these structs to prevent wire-format drift.
cognia-signaling-core = { path = "../services/signaling-server/core" }
# ADR-0067 — foundation utilities (fs_atomic). Re-aliased as `crate::fs_atomic`.
cognia-core = { path = "../crates/cognia-core" }
# ADR-0067 Tier B prep — secret_store/keyring_secrets/api_key foundation.
# Re-aliased as crate::{secret_store,api_key}; keyring_secrets keeps an
# app-side facade for its command shells. The `test-inmemory` feature is
# enabled from [dev-dependencies] so unit tests never touch the OS keyring.
cognia-secrets = { path = "../crates/cognia-secrets" }
# ADR-0067 Tier B prep — proxy_config foundation (state + detection + WSS
# dialer); `proxy_config/` stays as an app-side facade for the command shells.
cognia-net = { path = "../crates/cognia-net" }
# ADR-0067 Tier B — integrated terminal subsystem (portable-pty). Re-aliased
# as `crate::terminal`; commands referenced from generate_handler!.
cognia-terminal = { path = "../crates/cognia-terminal" }
# ADR-0067 Tier B — subscription vault/providers (ADR-0025); `subscription/`
# stays as an app-side facade holding the top-level command surface.
cognia-subscription = { path = "../crates/cognia-subscription" }
# ADR-0067 Tier B — Platform Connectors (matrix E2EE stack). Re-aliased as
# `crate::connectors`; the BusEventEmitter impl stays in companion_api.
cognia-connectors = { path = "../crates/cognia-connectors" }
# ADR-0067 Tier B — plugin runtime (wasmtime/cranelift). Re-aliased as
# `crate::plugin_api`; the vscode LSP host's sidecar-dir resolver is
# registered from run().
cognia-plugin-runtime = { path = "../crates/cognia-plugin-runtime" }
# ADR-0067 follow-up — skills subsystem. Re-aliased as `crate::skills`.
cognia-skills = { path = "../crates/cognia-skills" }
# ADR-0067 follow-up — TTS subsystem. Re-aliased as `crate::tts`.
cognia-tts = { path = "../crates/cognia-tts" }
# ADR-0067 follow-up — remote-control LAN API. Re-aliased as
# `crate::remote_control`.
cognia-remote-control = { path = "../crates/cognia-remote-control" }
# ADR-0067 follow-up — local OpenAI-compatible gateway. Re-aliased as
# `crate::gateway`.
cognia-gateway = { path = "../crates/cognia-gateway" }
# ADR-0067 follow-up — CCSwitch provider-relay switcher. Re-aliased as
# `crate::ccswitch`.
cognia-ccswitch = { path = "../crates/cognia-ccswitch" }
# ADR-0067 follow-up — embedded MCP server. Re-aliased as `crate::mcp_server`.
cognia-mcp-server = { path = "../crates/cognia-mcp-server" }
# ADR-0067 follow-up — external agent exec backends (bollard/kube isolated
# behind the crate's own features; see [features] forwarding below).
# Re-aliased as `crate::external_agent`.
cognia-external-agent = { path = "../crates/cognia-external-agent" }
# ADR-0067 Phase 5 — Computer Use automation + execution sandbox cluster. Owns
# uiautomation/enigo/xcap/accessibility/seccompiler; re-aliased as
# crate::{automation,sandbox,cua_sandbox}. windows/core-graphics/core-foundation/
# libc stay below (shared with pet_window/fleet/scheduler/etc.).
cognia-automation = { path = "../crates/cognia-automation" }
# ADR-0067 Phase 1 — process-global span instrumentation registry, extracted
# from `perf/{span,registry}.rs` so the Tier-A leaf crates (cognia-git,
# cognia-vector, cognia-ocr) can instrument without depending on the whole app.
# `perf/mod.rs` re-exports its symbols so `crate::perf::guard` call sites are
# unchanged, and the perf panel reads its shared global `REGISTRY`.
cognia-instrument = { path = "../crates/cognia-instrument" }
# ADR-0067 Phase 2 — Source Control subsystem (ADR-0038), extracted so the
# git2/vendored-libgit2 C compile isolates. Re-aliased as `crate::git` in
# lib.rs; its `commands::git_*` are referenced from `generate_handler!`.
cognia-git = { path = "../crates/cognia-git" }
log = "0.4"
# `unstable` unlocks the built-in multi-webview API (`Window::add_child`,
# `Manager::get_webview`) that powers the embedded in-app browser pane
# (`src-tauri/src/browser/embedded.rs`). Pinned exactly because unstable APIs
# may shift across minor versions.
tauri = { version = "=2.11.1", features = ["macos-private-api", "tray-icon", "image-png", "unstable"] }
tauri-plugin-log = "2"

# Native logging — fern dispatch chain mirrors records into the OS-native
# platform logger; chrono for ISO-8601 timestamps in readiness payloads;
# once_cell for the global readiness state behind a Mutex.
fern = "0.7"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
# Structured tracing layer (separate native subscriber; tauri-plugin-log keeps
# ownership of the global `log` logger — we never call LogTracer::init). Emits
# JSON to cognia-structured.log, gated by a runtime-mutable per-target filter.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
# Crash-report System Details (OS version / memory / CPU). Pinned to 0.33 —
# the latest line bumped its MSRV to 1.95, above our 1.93 toolchain pin
# (`rust-toolchain.toml`). Only the `system` feature is needed; disabling the
# defaults drops disk/network/component/multithread to keep it lean.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
thiserror = "2"
# `anyhow` is already pulled in as a transitive; expose it directly so
# `cli_bridge` (and similar small modules) can use Result<T> + Context
# without inventing a per-module error enum.
anyhow = "1"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
# `tauri-plugin-shell` powers cloudflared tunnel spawn for the
# GitHub Delivery one-click webhook receiver (`lib/github/cloudflared-tauri.ts`).
# Scope-locked to the `cloudflared` binary in `tauri.conf.json`.
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
# `persisted-scope` transparently saves and restores the `fs` / `asset` plugin
# scope grants across app restarts — so once a user picks a folder via the
# dialog plugin, that grant survives a relaunch without re-prompting.
# Backend-only; no JS surface and no capability entry needed.
tauri-plugin-persisted-scope = "2"
# Chunked upload + download with progress events. Used by the renderer to push
# attachments through the connector outbound runner without hand-rolled
# multipart streaming. See `lib/tauri/upload.ts`.
tauri-plugin-upload = "2"
# Window positioner — exposes `moveWindow(Position)` for tray-anchored panels
# and standard placements (TopRight, Center, etc.). See `lib/tauri/positioner.ts`.
tauri-plugin-positioner = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "net", "signal"] }
dirs = "6"
# `directories` (separate from `dirs`) gives us the per-platform config_dir
# the CLI bridge writes its endpoint file into. Used only by `cli_bridge`.
directories = "5"
ignore = "0.4"

# System scheduler — async-trait abstraction over Windows Task Scheduler /
# launchd / systemd, plus a sqlite-backed metadata store for recovery.
async-trait = "0.1"
parking_lot = "0.12"
# ADR-0059 R13 — bollard (docker) and kube moved to
# `crates/cognia-external-agent` (ADR-0067); the `container-exec` / `k8s-exec`
rusqlite = { version = "0.37", features = ["bundled"] }
matrix-sdk-crypto = { version = "0.18.0", default-features = false }
matrix-sdk-sqlite = { version = "0.18.0", default-features = false, features = ["crypto-store", "bundled"] }
ruma = { version = "0.16.0", features = ["client-api-c", "events", "rand"] }
# ADR-0067 Phase 4 — the native (sqlite-vec) + cloud (qdrant/…) vector store
# lives in `crates/cognia-vector`, which owns the `sqlite-vec` + `qdrant-client`
# deps. Re-aliased as `crate::vector` in lib.rs; the app installs a keyring-backed
# `CredentialStore` at boot so the crate never touches `secret_store` directly.
cognia-vector = { path = "../crates/cognia-vector" }

gray_matter = { version = "0.3", default-features = false, features = ["yaml"] }
wait-timeout = "0.2"
# Cross-platform PTY backend for the integrated terminal (`src-tauri/src/terminal/`).
# Uses ConPTY on Windows (Win10 1809+), forkpty on macOS/Linux. wezterm's
# upstream of choice — accept its known ConPTY quirks (resize artifacts,
# Alt-key duplication) for v1 and patch downstream if hit.
portable-pty = "0.8"
# System font enumeration for the appearance / terminal font pickers
# (`src-tauri/src/fonts.rs`). Pure-Rust — loads the OS font set and reports
# each face's monospaced flag so the terminal picker can show only
# fixed-pitch families. The webview can't do this (WKWebView has no Local
# Font Access API).
fontdb = "0.18"
regex = "1"
toml_edit = { version = "0.22", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "socks", "http2", "multipart"] }
opentelemetry = { version = "0.32", optional = true, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", optional = true, features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", optional = true, default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-rustls"] }
tracing-opentelemetry = { version = "0.33", optional = true }
tokio-socks = "0.5"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures-util = { version = "0.3", default-features = false }
bytes = "1"

# Vector cloud backends (ADR-0022, qdrant/milvus/pinecone/chroma/weaviate) moved
# to `crates/cognia-vector` (ADR-0067 Phase 4).

# TTS support — provider key vault, Edge-TTS WebSocket bridge, and HTTP proxy.
# keyring v3 has NO default features: without an explicit platform backend it
# silently falls back to an in-process *mock* store (writes succeed but never
# touch the OS keyring and evaporate on restart). That made every connector /
# subscription / TTS secret non-persistent — e.g. the Lark App ID vanished
# after restart, breaking the bot-identity probe and the long-connection
# handshake (private-chat bot went dead). The real OS backend is wired per
# target below (windows-native / apple-native / sync-secret-service); the base
# entry stays default-free so Android/iOS fall back to mock intentionally.
keyring = { version = "3", default-features = false }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-native-roots", "connect"] }
uuid = { version = "1", features = ["v4", "v7"] }
base64 = "0.22"
# Feishu/Lark long-connection wire protocol — the WS transport exchanges
# protobuf-framed `pbbp2.Frame` messages (not JSON). `prost` decodes/encodes
# them via `#[derive(Message)]`, so no `.proto`/`protoc`/build.rs is needed.
# See `src-tauri/src/connectors/lark_ws.rs`.
prost = "0.13"

# ADR-0067 Phase 6 — scheduler + workflow + timing (and the `cron` expression
# parser) live in `crates/cognia-scheduling`; re-aliased as
# crate::{scheduler,workflow,timing}.
cognia-scheduling = { path = "../crates/cognia-scheduling" }

# MCP HTTP server — axum for the inbound listener, subtle for constant-time
# bearer-token comparison, tower-http for body-size limits.
axum = { version = "0.8", features = ["macros", "ws"] }
# axum-server (M2.9) — TLS termination for the companion API. `tls-rustls`
# pulls in rustls + ring; matches the project's existing tokio-rustls path.
axum-server = { version = "0.8", features = ["tls-rustls"] }
subtle = "2"
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.6", features = ["limit", "trace", "cors"] }
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
argon2 = "0.5"
ed25519-dalek = "2"
hex = "0.4"
url = "2"
aes-gcm = { version = "0.10", features = ["aes"] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
pbkdf2 = "0.13"
psl = "2.1"
rand = "0.8"
jsonwebtoken = "9"
serde_urlencoded = "0.7"

# Local IP detection — used by `companion_issue_pair_jwt` to render the
# QR-encoded LAN URL when the companion server is bound to 0.0.0.0.
# Falls back to loopback if no usable interface is present (e.g., headless
# CI). Pure-Rust, MIT-licensed, no transitive system deps.
local-ip-address = "0.6"

# Twin code-repo importer (ADR-0003 / next.config.ts node-only purge) —
# walks a local git repo from Rust instead of `simple-git`. We only ever
# `Repository::open` a path the user picked via the file dialog, so the
# default `https` / `ssh` features (which pull OpenSSL + libssh2) are off.
# `vendored-libgit2` ships libgit2's C source inside `libgit2-sys` so
# developer machines don't need a system install — critical on Windows
# where libgit2 isn't typically present.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }

# Companion TLS (Wave 1.4 / M2.8) — self-signed certificate generation +
# SHA-256 SubjectPublicKeyInfo fingerprint computation. The mobile client
# pins the fingerprint via the QR pair payload, so the cert chain is never
# validated by hostname; this avoids needing a real CA.
rcgen = "0.13"
time = { version = "0.3", features = ["std"] }

# mDNS (Wave 1.5 / M2.9) — service advertisement for `_cognia._tcp.local.`
# so the mobile app can pick the desktop server out of the LAN without
# manual baseUrl entry.
mdns-sd = "0.13"

# Cloudflared launcher (Wave 1.6) — runs the cloudflared subprocess and
# parses the trycloudflare URL out of stderr. We use std::process via
# tokio::process; no extra crate is required.

# Plugin runtime — filesystem watcher (T3b, ADR 0016) and tarball backup
# (T3c). `notify` is the canonical pure-Rust filesystem watcher; `flate2` +
# `tar` form a minimal gzipped-tar pair for plugin backup snapshots.
notify = "6"
flate2 = "1"
tar = "0.4"
# Temp-dir staging for WASM plugin installs (M2.2/M2.3). Used by
# `src-tauri/src/plugin_api/wasm/installer.rs` to extract zip bundles and
# clone git repos into auto-cleanup directories before they're moved into
# place. Also remains in `[dev-dependencies]` for tests that don't depend
# on the runtime install path.
tempfile = "3"
# WASM plugin bundle extraction (M2.2) — .zip is the canonical bundle format
# the `cognia plugin build` CLI emits. Pure-Rust, no system zlib dep.
zip = { version = "2", default-features = false, features = ["deflate", "bzip2"] }

# WASM plugin runtime (ADR 0013) — wasmtime 26 with the component-model
# feature on by default. `wasmtime-wasi` provides the WASI Preview 2
# interfaces we host (clocks/random/io/cli/filesystem). `wasmparser` is used
# to scan for the embedded `cognia:api-version` custom section before the
# component is compiled. wasmtime 26 is the last release before the major
# version churn around the Pulley interpreter; pinning to 26 keeps us on a
# stable wit-bindgen surface (0.34) until we revisit ABI in v0.2.
# Re-verified 2026-05-18: latest is 44.0.1 — ABI revisit per ADR-0013 still pending.
wasmtime = { version = "26", default-features = false, features = ["runtime", "cranelift", "component-model", "async"] }
wasmtime-wasi = "26"
wasmparser = "0.221"

# CLI argument parsing for the cognia-server binary (Phase D follow-up).
# `derive` gives us the `#[derive(Parser)]` macro; `std` keeps default
# features (env / wrap_help / etc.). Pulling clap is cheap compared to
# maintaining a hand-rolled parser as the subcommand surface grows.
clap = { version = "4", features = ["derive"] }

# ADR-0067 Phase 5 — `xcap` (screenshot) + the UIA/a11y crates moved to
# `crates/cognia-automation`.
dial9-tokio-telemetry = "0.3"

# WebRTC stack (ADR-0021) — full ICE/DTLS/SCTP suite that integrates with
# the existing tokio runtime. The desktop side of the WAN transport acts
# as the "peer" counterpart of every mobile client in its rendezvous room;
# `webrtc-rs` is the only mature pure-Rust crate that ships the full
# data-channel stack out of the box. Pinned to 0.17 (re-verified 2026-05-18:
# latest stable is 0.17.1) — the 0.20.x alpha line is still experimenting
# with runtime flexibility (Tokio/Smol) and not yet ready for production.
# Heavy compile cost (~50 transitive deps) is acceptable for the
# connectivity win.
webrtc = "0.17"

# ADR-0067 Phase 3 — native OCR subsystem (ADR-0024) lives in `crates/cognia-ocr`.
# The optional ocrs/rten/rten-imageproc/oar-ocr/ort/image deps and the 5 `ocr-*`
# features moved there; the `[features]` block below forwards them. Re-aliased as
# `crate::ocr` in lib.rs; `ort`'s copy-dylibs still stages the onnxruntime DLL
# into the shared target dir, so bundling is unchanged. The dev-profile
# `[profile.dev.package.rten]` opt-level=3 override lives at the workspace root.
cognia-ocr = { path = "../crates/cognia-ocr" }

# Native PDF parsing with per-item bounding boxes (PDFium via pdfium-sys,
# which downloads a prebuilt PDFium at build time and loads it through
# `libloading` at runtime). `default-features = false` drops liteparse's
# bundled Tesseract build — scanned PDFs go through the ADR-0024 OCR
# subsystem instead.
liteparse      = { version = "2", default-features = false, optional = true }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-cli = "2"

# Native hard-crash capture (ADR — crash-report subsystem). `crash-handler`
# installs the platform exception handler (Windows SEH / Unix signals / macOS
# Mach ports); `minidumper` writes the minidump out-of-process from a sibling
# monitor. Desktop-only — mobile shells (Capacitor) never compile this crate,
# and the code is additionally `#[cfg(desktop)]`-gated in `crash::monitor`.
crash-handler = "0.7"
minidumper = "0.10"

# Platform-native logging backends + UI automation back-ends.
[target."cfg(target_os = \"windows\")".dependencies]
# Real OS credential store (Windows Credential Manager) — see the keyring
# note in [dependencies]. Without this feature keyring uses the mock store.
keyring = { version = "3", features = ["windows-native"] }
eventlog = "0.3"
# ADR-0067 Phase 5 — `uiautomation` moved to `crates/cognia-automation`.
# Direct windows-rs dep for SendInput/MOUSEEVENTF_WHEEL/GetSystemMetrics calls
# that aren't exposed publicly through `uiautomation::inputs`. Version pinned
# to match uiautomation's own transitive `windows = 0.62.2` to avoid duplicate
# trees. Feature set is the minimum needed for the input + window-metrics work
# in `automation/platform/uia/input.rs`.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # Screen-off Computer Use (virtual display): parsec-vdd device IOCTLs +
    # display-topology set-primary/restore + system-sleep keepalive.
    "Win32_Storage_FileSystem",        # CreateFileW, FILE_SHARE_*, OPEN_EXISTING
    "Win32_System_IO",                 # DeviceIoControl, OVERLAPPED, GetOverlappedResult
    "Win32_System_Threading",          # CreateEventW, WaitForSingleObject
    "Win32_System_Power",              # SetThreadExecutionState, ES_*
    "Win32_Devices_Display",           # (reserved) QueryDisplayConfig family
    "Win32_Graphics_Gdi",              # ChangeDisplaySettingsExW, EnumDisplay*, DEVMODEW
    # Desktop-pet window perching (pet_window/surfaces.rs): DwmGetWindowAttribute
    # + DWMWA_CLOAKED to skip virtual-desktop / UWP ghost windows during
    # EnumWindows surface enumeration.
    "Win32_Graphics_Dwm",
] }

[target."cfg(target_os = \"macos\")".dependencies]
block2 = "0.6"
# Real OS credential store (macOS/iOS Keychain) — see the keyring note in
# [dependencies]. Without this feature keyring uses the mock store.
keyring = { version = "3", features = ["apple-native"] }
oslog = "0.2"
# ADR-0067 Phase 5 — `enigo` moved to `crates/cognia-automation`.
# CGEventTap-based global input capture for the skill recorder
# (`automation/record/hook_mac.rs`) — the macOS counterpart to the Windows
# low-level hook. `enigo` already pulls both transitively, so naming them as
# direct deps keeps the event-tap FFI explicit without adding a new version to
# the lock.
core-graphics = "0.25"
core-graphics-types = "0.2"
core-foundation = "0.10"
# Non-activating NSPanel conversion for the desktop-pet overlay + popup windows
# (pet_window/macos_panel.rs): floats over all Spaces + full-screen apps and
# never steals foreground focus. macOS-only; pulls objc2* transitively. Cargo.lock
# pins the resolved v2.1 commit for reproducibility.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
# NSScreen.safeAreaInsets for the fleet island placement
# (fleet/island_window.rs): the island anchors to the FULL monitor frame (the
# work area / visibleFrame shrinks and grows with menu-bar visibility, so a
# fullscreen Space would strand the strip below a phantom menu bar) and needs
# the notch height to pad content below the camera housing. Both crates are
# already in the lock transitively (wry / tauri-nspanel); naming them adds no
# new versions.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSScreen"] }
objc2-foundation = { version = "0.3.2", features = [
  "NSArray",
  "NSDate",
  "NSDictionary",
  "NSHTTPCookie",
  "NSString",
] }
objc2-web-kit = { version = "0.3.2", features = [
  "WKHTTPCookieStore",
  "WKWebView",
  "WKWebViewConfiguration",
  "WKWebsiteDataStore",
  "block2",
] }
# macOS Accessibility (AX) element tree — backs the bounded `read_tree` / `find`
# Computer Use surface (ADR-0020 cross-platform subset, ax/mod.rs + ax/raw.rs).
# The high-level `accessibility` crate covers reading role/title/children; the
# raw `-sys` crates below back the three things it can't do but a useful tree
# needs (all verified against Chrome / VS Code): activating lazy web-content
# a11y on Chromium/WebKit/Electron apps, resolving the focused/main window, and
# reading element geometry (AXPosition/AXSize). The whole graph shares one
# `core-foundation-sys` (0.8), so the raw `*Ref` C types are interchangeable;
# only `accessibility`'s core-foundation-0.9 `TCFType` methods
# (`as_concrete_TypeRef` / `wrap_under_create_rule`) need that version, imported
# under an alias in `ax/raw.rs` and never leaking into the rest of the app
# (which is on core-foundation 0.10).
# ADR-0067 Phase 5 — `accessibility` + `accessibility-sys` moved to
# `crates/cognia-automation`. The lower-level CF crates stay (shared).
core-foundation-sys = "0.8"
core-foundation-0-9 = { package = "core-foundation", version = "0.9" }

[target."cfg(unix)".dependencies]
# Direct syscalls for the execution sandbox (ADR-0028): `setrlimit` for the
# CPU / address-space caps applied via `Command::pre_exec` on the Linux
# `bwrap` and macOS `sandbox-exec` backends (`sandbox/limits.rs`).
libc = "0.2"

[target."cfg(target_os = \"linux\")".dependencies]
# Real OS credential store (freedesktop Secret Service over D-Bus) — see the
# keyring note in [dependencies]. `crypto-rust` encrypts the D-Bus session
# transfer with RustCrypto so no system OpenSSL is needed at build time.
# Chosen over `linux-native` (kernel keyutils) because keyutils is wiped on
# reboot, which would lose stored bot credentials.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
libsystemd = "0.7"
syslog = "7"
# ADR-0067 Phase 5 — `enigo` (atspi input sim) + `seccompiler` (bwrap seccomp
# filter) moved to `crates/cognia-automation`.

[dev-dependencies]
# Keep app_lib's own test suite hermetic: the secret store's file+keyring
# global becomes in-memory when tests build (dev-dep feature unification);
# production builds never see the feature.
cognia-secrets = { path = "../crates/cognia-secrets", features = ["test-inmemory"] }
# HTTP mock server for connectors::http_client and attachments tests.
# (`tempfile` is in `[dependencies]` for runtime plugin staging and is
# transitively available in unit tests, so it isn't re-declared here.)
wiremock = "0.6"
# Percent-encoding helper for the ws_terminal integration test — small
# (~200 LOC), no transitive deps. Only needed in test builds.
urlencoding = "2"

# ADR-0024 — OCR backend opt-in features. The default build ships
# placeholder backends so the dispatch table compiles everywhere; each
# feature flag links a real binding for one platform.
[features]
default = []
# ADR-0073 — native OTLP trace/metric export is deliberately opt-in so the
# OpenTelemetry dependency graph does not slow normal desktop development.
otel-export = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
]
# Cross-platform Tesseract via the local `tesseract` CLI. The feature links
# no native library; runtime availability depends on the executable being
# installed on PATH or packaged by the app shell.
# ADR-0067 Phase 3 — these forward to the extracted `cognia-ocr` crate, which
# owns the real ocrs/rten/oar-ocr/ort/image optional deps.
ocr-tesseract = ["cognia-ocr/ocr-tesseract"]
# Windows.Media.Ocr — requires MSIX package identity; see `tauri.conf.json`.
ocr-windows = ["cognia-ocr/ocr-windows"]
# Apple Vision needs no feature — `cognia-ocr` wires Vision.framework
# in-process whenever the target is macOS.
# Pure-Rust OCR via `ocrs` + RTen. Models downloaded on first use.
ocr-ocrs = ["cognia-ocr/ocr-ocrs"]
# PaddleOCR PP-OCRv5 via `oar-ocr` + ONNX Runtime (ships an onnxruntime DLL).
ocr-paddle = ["cognia-ocr/ocr-paddle"]
# ADR-0059 R13 — ExecBackend::Container for per-workspace runner containers
# (T2 topology). Off desktop builds: only the headless `cognia-server` image
# enables it, so the Docker client never enters the Tauri binary.
container-exec = ["cognia-external-agent/container-exec"]
# ADR-0059 R13 (T3) — kubernetes flavor of the exec backend: runner Pods with
# attached stdio, PVC-subPath workspace mounts. In-cluster only; enabled in
# the headless image alongside `container-exec`.
k8s-exec = ["cognia-external-agent/k8s-exec"]
# Native PDF parsing with bounding boxes via `liteparse` (PDFium). Needs
# network at build time (pdfium-sys downloads a prebuilt PDFium); the
# PDFium dynamic library must ship next to the executable — see
# `src/parse/mod.rs`. Default builds compile an `unsupported` stub.
parse-liteparse = ["dep:liteparse"]

# RTen is mandatory `--release` per upstream README — without opt-level=3
# even smoke tests crawl. The override now lives in the workspace root
# Cargo.toml (cargo ignores `[profile.*]` blocks in workspace members).
