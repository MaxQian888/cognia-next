[[permission]]
identifier = "allow-island-app-commands"
description = """
Window-shape commands for the task control island overlay.

Deliberately does NOT include any fleet_* business command. The island holds no
business permissions: it emits typed intents over island://action-intent and the
main window re-validates and executes them. Everything left here only resizes,
tucks or reveals the island's own window.
"""
commands.allow = [
  "island_resize",
  "island_set_tucked",
  "reveal_island_window",
]
