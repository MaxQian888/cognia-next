[[permission]]
identifier = "allow-pet-app-commands"
description = "Enables only the application commands required by the trusted local desktop-pet overlay and popup windows."
commands.allow = [
  "close_pet_popup",
  "close_pet_window",
  "open_pet_popup",
  "pet_popup_resize",
  "pet_window_get_position",
  "pet_window_get_cursor_position",
  "pet_window_get_surfaces",
  "pet_window_get_work_area",
  "pet_window_set_ignore_cursor_events",
  "pet_window_set_position",
  "reveal_pet_window",
  "show_main_window",
]
