# Cloudflare Worker deployment for the cognia public share service.
#
# Dev:    wrangler dev
# Test:   vitest run            (miniflare-backed, no real account needed)
# Deploy: wrangler deploy
#
# Free-tier friendly: R2 (10 GB free) + KV (free tier) + Workers. Reads are
# public but lifecycle-gated in the Worker; writes/deletes need the bearer
# secret set via `wrangler secret put SHARE_UPLOAD_SECRET`.
#
# Prerequisites the operator creates once:
#   wrangler r2 bucket create cognia-shares
#   wrangler kv namespace create SHARE_KV
#   wrangler secret put SHARE_UPLOAD_SECRET
# then paste the KV namespace id below.
name = "cognia-share"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Path-scoped route so the Worker owns only the JSON API under
# `share.cognia.cn/v1/*`, while Cloudflare Pages serves the viewer (the app's
# own `/share/view` static export) on the rest of the host. Worker routes take
# precedence over a Pages project on the same hostname. Path patterns can't use
# `custom_domain = true`; bind via `zone_name` instead. Keep the host in sync
# with the app's `NEXT_PUBLIC_SHARE_URL` / `DEFAULT_SHARE_URL`
# (lib/share/config.ts). Comment out to deploy to the *.workers.dev subdomain.
routes = [{ pattern = "share.cognia.cn/v1/*", zone_name = "cognia.cn" }]

[[r2_buckets]]
binding = "SHARE_BUCKET"
bucket_name = "cognia-shares"

[[kv_namespaces]]
binding = "SHARE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
MAX_BODY_BYTES = "10485760"

[observability]
enabled = true

# ── Staging (ADR-0059 P0.1) ─────────────────────────────────────────────────
# `wrangler deploy --env staging` → a separate worker on *.workers.dev (no
# route). Named envs do not inherit vars or bindings, so they are repeated.
# One-time provisioning for staging:
#   wrangler r2 bucket create cognia-shares-staging
#   wrangler kv namespace create SHARE_KV --env staging   (paste id via CI var)
#   wrangler secret put SHARE_UPLOAD_SECRET --env staging
# The deploy workflow seds REPLACE_WITH_KV_NAMESPACE_ID from the
# environment-scoped CF_SHARE_KV_NAMESPACE_ID variable, so staging and
# production each inject their own namespace id.
[env.staging]
name = "cognia-share-staging"

[[env.staging.r2_buckets]]
binding = "SHARE_BUCKET"
bucket_name = "cognia-shares-staging"

[[env.staging.kv_namespaces]]
binding = "SHARE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[env.staging.vars]
MAX_BODY_BYTES = "10485760"
