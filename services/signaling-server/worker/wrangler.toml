# Cloudflare Worker deployment for the cognia signaling rendezvous (ADR-0021).
#
# Build:   worker-build --release   (produces build/worker/shim.mjs)
# Dev:     wrangler dev
# Deploy:  wrangler deploy
#
# Durable Objects are available on the Workers Free plan when SQLite-backed
# (`new_sqlite_classes`), which is why the migration below uses it even though
# the relay keeps no SQL rows — per-connection state lives on WebSocket
# attachments.
#
# Per-IP connection limiting works in two layers:
#   1. In-DO, per-room: the RoomDurableObject caps how many sockets one
#      `cf-connecting-ip` may hold in a single room (SIGNALING_MAX_CONN_PER_IP_PER_ROOM).
#   2. Global, per-IP: a DO only sees its own room, so cross-room flooding is
#      the edge's job. Add a Cloudflare Rate Limiting rule (Security → WAF →
#      Rate limiting rules) on this Worker, e.g.:
#        - When incoming requests match:  URI Path equals "/v2/signaling"
#        - Rate:  60 requests per 1 minute, counting by  IP
#        - Action:  Block (or Managed Challenge)
#      This mirrors the axum server's `ip_limits.rs` (50/IP process-wide).
name = "cognia-signaling"
main = "build/worker/shim.mjs"
compatibility_date = "2026-07-29"

# Custom domain — THE single place to set the deploy hostname. Keep it in sync
# with the app's signaling URL (the `NEXT_PUBLIC_SIGNALING_URL` build var, or
# the `DEFAULT_SIGNALING_URL` fallback in lib/signaling/types.ts). On `wrangler
# deploy` this provisions the hostname + route automatically — it REQUIRES the
# matching zone (here `cognia.cn`) to be active on this Cloudflare account.
# Change it to your own domain, or leave it commented to deploy to the
# `*.workers.dev` subdomain only.
#
# MUST stay a TOP-LEVEL key (above the [vars] table) — a `routes` placed under
# [vars] is parsed as an env var `vars.routes`, not a deploy trigger.
#
# NOTE: `*.workers.dev` is SNI-blocked from mainland China (GFW resets the TLS
# handshake), so a custom domain on your own zone is required for CN clients.
routes = [{ pattern = "signaling.cognia.cn", custom_domain = true }]

# Room admission + abuse controls. Read by RoomDurableObject (room.rs) and the
# router (lib.rs); shared verbatim with the axum server's env vars via
# cognia-signaling-core::policy. Override per-deployment as needed.
[vars]
# Signaling v2 has exactly one mobile and one desktop role. A newer valid
# session atomically replaces the old socket for its role.
SIGNALING_MAX_PEERS_PER_ROOM = "2"
# Max desktop peers per room (the home server). A second desktop is rejected
# with `role_taken`.
SIGNALING_MAX_DESKTOPS = "1"
# Max concurrent sockets one IP may hold in a single room. Kept at the room cap
# by default (home desktop + mobile often share one public IP); the global
# per-IP defense is the edge Rate Limiting rule documented above.
SIGNALING_MAX_CONN_PER_IP_PER_ROOM = "4"
# Comma-separated WebSocket Origin allowlist. Empty = allow all (native clients
# send no Origin and are always allowed). Set to your web + mobile origins to
# refuse cross-origin browser connections, e.g.
# "https://app.cognia.cn,capacitor://localhost,https://localhost".
SIGNALING_ALLOWED_ORIGINS = ""
# 1-in-N Analytics Engine sampling for hot events (relay + per-frame
# rejections) so a flood can't amplify AE writes. State changes are unsampled.
AE_SAMPLE_N = "10"

[build]
command = "worker-build --release"

[durable_objects]
bindings = [{ name = "ROOM", class_name = "RoomDurableObject" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[observability]
enabled = true

# Per-event metrics → Workers Analytics Engine (the Cloudflare-native
# replacement for the axum server's Prometheus `/metrics`). The DO writes one
# data point per event (see `RoomDurableObject::record`); writes are
# best-effort, so removing this binding degrades cleanly to the `console_log!`
# breadcrumbs. Query via the AE SQL API.
#
# FREE-PLAN: Analytics Engine requires the Workers Paid plan, so the binding is
# commented out. The DO's `record()` no-ops when the binding is absent — the
# relay is unaffected; use `wrangler tail` for the `console_log!` breadcrumbs.
# Uncomment after upgrading to Workers Paid.
# [[analytics_engine_datasets]]
# binding = "METRICS"

# ── Staging (ADR-0059 P0.1) ─────────────────────────────────────────────────
# `wrangler deploy --env staging` → a separate worker on *.workers.dev (no
# custom-domain route, so it never fights the production hostname). Named envs
# do not inherit vars or bindings, so both are repeated here; [[migrations]]
# is top-level and applies to every env.
[env.staging]
name = "cognia-signaling-staging"

[env.staging.vars]
SIGNALING_MAX_PEERS_PER_ROOM = "2"
SIGNALING_MAX_DESKTOPS = "1"
SIGNALING_MAX_CONN_PER_IP_PER_ROOM = "4"
SIGNALING_ALLOWED_ORIGINS = ""
AE_SAMPLE_N = "10"

[env.staging.durable_objects]
bindings = [{ name = "ROOM", class_name = "RoomDurableObject" }]
