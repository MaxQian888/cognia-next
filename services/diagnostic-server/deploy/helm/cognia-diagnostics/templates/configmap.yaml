apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cognia-diagnostics.fullname" . }}
  labels:
    {{- include "cognia-diagnostics.labels" . | nindent 4 }}
data:
  DIAGNOSTIC_BIND: "0.0.0.0:8080"
  DATABASE_MAX_CONNECTIONS: {{ .Values.config.databaseMaxConnections | quote }}
  {{- if .Values.config.s3Endpoint }}
  S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  {{- end }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  S3_REGION: {{ .Values.config.s3Region | quote }}
  OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  OIDC_AUDIENCE: {{ .Values.config.oidcAudience | quote }}
  OIDC_PUBLIC_KEY_PEM: {{ .Values.config.oidcPublicKeyPem | quote }}
  KMS_ENDPOINT: {{ .Values.config.kmsEndpoint | quote }}
  KMS_REGION: {{ .Values.config.kmsRegion | quote }}
  KMS_KEY_ID: {{ .Values.config.kmsKeyId | quote }}
  PROCESSING_ENABLED: {{ .Values.config.processingEnabled | quote }}
  PROCESSING_BATCH_SIZE: {{ .Values.config.processingBatchSize | quote }}
  PROCESSING_INTERVAL_MS: {{ .Values.config.processingIntervalMs | quote }}
  MINIDUMP_STACKWALK_TIMEOUT_SECONDS: {{ .Values.config.minidumpStackwalkTimeoutSeconds | quote }}
  PROCESSING_TEMP_DIR: /var/lib/cognia/diagnostics/tmp
  RUST_LOG: cognia_diagnostic_server=info,tower_http=info
