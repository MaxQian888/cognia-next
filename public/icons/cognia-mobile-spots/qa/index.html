    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cognia companion icon inventory</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px;
        font:
          14px system-ui,
          sans-serif;
        background: #f4f6fb;
        color: #172443;
      }
      header {
        max-width: 1400px;
        margin: auto auto 24px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 8px;
      }
      p {
        color: #5e6b85;
        line-height: 1.6;
      }
      nav {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      button,
      input,
      select {
        font: inherit;
        border: 1px solid #c6cfe0;
        border-radius: 8px;
        padding: 9px;
        background: #fff;
        color: #172443;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #39c6ff;
        outline-offset: 2px;
      }
      main {
        --size: 160px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
        max-width: 1400px;
        margin: auto;
      }
      figure {
        margin: 0;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 12px;
        border-radius: 12px;
        background: #fff;
        border: 1px solid #dce3ef;
      }
      figure img {
        width: var(--size);
        height: var(--size);
        object-fit: contain;
      }
      figcaption {
        font-size: 12px;
        text-align: center;
        margin-top: 10px;
        color: #43516b;
        overflow-wrap: anywhere;
      }
      body[data-background="dark"] figure {
        background: #0b1638;
        border-color: #214d9c;
      }
      body[data-background="dark"] figcaption {
        color: #d9e7ff;
      }
      body[data-background="magenta"] figure {
        background: #ff00aa;
        border-color: #b00077;
      }
      body[data-background="magenta"] figcaption {
        color: #170021;
      }
      figure[hidden] {
        display: none;
      }
      @media (max-width: 600px) {
        body {
          padding: 16px;
        }
        main {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }
        figure img {
          max-width: 100%;
        }
      }
    </style>
  </head>

        ><label
          >Size
          <select aria-label="Icon preview size">
            <option>48</option>
            <option>64</option>
            <option>96</option>
            <option selected>160</option>
          </select></label
        ><output aria-live="polite">81 icons</output>
      </nav>

    <script>
      const figures = [...document.querySelectorAll("figure")]
      document.querySelector("input").addEventListener("input", (e) => {
        const value = e.target.value.toLowerCase()
        figures.forEach((f) => (f.hidden = !f.dataset.name.includes(value)))
        document.querySelector("output").value = figures.filter((f) => !f.hidden).length + " icons"
      })
      document
        .querySelectorAll("[data-bg]")
        .forEach((b) =>
          b.addEventListener("click", () => (document.body.dataset.background = b.dataset.bg))
        )
      document
        .querySelector("select")
        .addEventListener("change", (e) =>
          document.querySelector("main").style.setProperty("--size", e.target.value + "px")
        )
    </script>
