<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Cognia — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        background: #ffffff;
        color: #0a0a0a;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0a;
          color: #fafafa;
        }
      }
      main {
        max-width: 22rem;
        padding: 2rem;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        margin-bottom: 1.25rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.5rem;
        font-size: 0.875rem;
        line-height: 1.6;
        opacity: 0.72;
      }
      button {
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        padding: 0.55rem 1.1rem;
        border: 1px solid currentColor;
        border-radius: 0.5rem;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Cognia" width="64" height="64" />
      <!-- Bilingual by necessity: this page is a static public asset with no
           i18n runtime, so the locale pick is a three-line script below. -->
      <div id="en">
        <h1>You&rsquo;re offline</h1>
        <p>Cognia can&rsquo;t reach the server right now. Check your connection and try again.</p>
      </div>
      <div id="zh" hidden>
        <h1>当前离线</h1>
        <p>Cognia 暂时无法连接服务器。请检查网络后重试。</p>
      </div>
      <button type="button" onclick="location.reload()">
        <span id="retry-en">Try again</span><span id="retry-zh" hidden>重试</span>
      </button>
    </main>
    <script>
      if (navigator.language && navigator.language.toLowerCase().indexOf("zh") === 0) {
        document.getElementById("en").hidden = true
        document.getElementById("zh").hidden = false
        document.getElementById("retry-en").hidden = true
        document.getElementById("retry-zh").hidden = false
        document.documentElement.lang = "zh-CN"
      }
    </script>
  </body>
</html>
