<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publishing an article · Swimlane</title>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   var(--paper);
      --color-ink:     var(--ink);
      --color-muted:   var(--muted);
      --color-accent:  var(--accent);
      --font-sans:     system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
      --font-serif:    Georgia, Times New Roman, serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%;  display: block; }
  </style>
  <meta name="cognia-renderer" content="diagram-design-v1">
  <style id="cognia-diagram-theme">:root{--paper:var(--background,#f5f5f5);--paper-2:var(--card,#ececec);--ink:var(--foreground,#2d3142);--muted:var(--muted-foreground,#4f5d75);--soft:var(--muted-foreground,#7a8399);--rule:var(--border,rgba(45,49,66,.14));--rule-solid:var(--border,#bfc0c0);--accent:var(--primary,#eb6c36);--accent-ink:var(--primary-foreground,#fff);--accent-tint:color-mix(in srgb,var(--primary,#eb6c36) 10%,transparent);--link:var(--info,#2e5aa8);--series-1:var(--chart-1,#7c8f6f);--series-2:var(--chart-2,#5e7a9b);--series-3:var(--chart-3,#b8915a);--series-4:var(--chart-4,#9c6b50);--series-5:var(--chart-5,#6e6479)}svg{display:block;width:100%;max-width:100%;height:auto}</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Diagram Design</p>
    <h1>Publishing an article</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg">
      <title>Diagram Design standard example</title>
      <desc>Responsive standard example for the Diagram Design skill.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--ink) 10%, transparent)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="var(--paper)"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Lane dividers -->
        <line x1="40" y1="80" x2="960" y2="80" stroke="color-mix(in srgb, var(--ink) 22%, transparent)" stroke-width="1"/>
        <line x1="40" y1="160" x2="960" y2="160" stroke="color-mix(in srgb, var(--ink) 10%, transparent)" stroke-width="1"/>
        <line x1="40" y1="240" x2="960" y2="240" stroke="color-mix(in srgb, var(--ink) 10%, transparent)" stroke-width="1"/>
        <line x1="40" y1="320" x2="960" y2="320" stroke="color-mix(in srgb, var(--ink) 10%, transparent)" stroke-width="1"/>
        <line x1="40" y1="400" x2="960" y2="400" stroke="color-mix(in srgb, var(--ink) 22%, transparent)" stroke-width="1"/>

        <!-- Actor column divider -->
        <line x1="160" y1="80" x2="160" y2="400" stroke="color-mix(in srgb, var(--ink) 22%, transparent)" stroke-width="1"/>

        <!-- Lane labels -->
        <text x="60" y="124" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" letter-spacing="0.18em">AUTHOR</text>
        <text x="60" y="204" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" letter-spacing="0.18em">REVIEWER</text>
        <text x="60" y="284" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" letter-spacing="0.18em">EDITOR</text>
        <text x="60" y="364" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" letter-spacing="0.18em">CI / CD</text>

        <!-- Arrows (drawn first) -->
        <!-- 1. Draft → Open PR (within Author) -->
        <line x1="300" y1="120" x2="340" y2="120" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 2. Open PR → Review (Author → Reviewer handoff, diagonal down-right) -->
        <line x1="460" y1="144" x2="500" y2="176" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 3. Review → Polish (Reviewer → Editor, vertical down) -->
        <line x1="570" y1="224" x2="570" y2="256" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- 4. Polish → Approve (within Editor) -->
        <line x1="640" y1="280" x2="680" y2="280" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 5. Approve → Build (Editor → CI/CD, coral handoff) -->
        <line x1="750" y1="304" x2="720" y2="336" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- 6. Build → Deploy (within CI/CD) -->
        <line x1="760" y1="360" x2="800" y2="360" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="452" y="140" width="60" height="12" rx="2" fill="var(--paper)"/>
        <text x="482" y="150" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">HANDOFF</text>

        <rect x="548" y="228" width="52" height="12" rx="2" fill="var(--paper-2)"/>
        <text x="574" y="238" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">REVISE</text>

        <rect x="712" y="308" width="80" height="12" rx="2" fill="var(--paper)"/>
        <text x="752" y="318" fill="var(--accent)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">DEPLOY TRIGGER</text>

        <!-- Steps -->
        <!-- Author: Draft MDX -->
        <rect x="180" y="96" width="120" height="48" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <text x="240" y="118" fill="var(--ink)" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Draft MDX</text>
        <text x="240" y="132" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle">src/content/…</text>

        <!-- Author: Open PR -->
        <rect x="340" y="96" width="120" height="48" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <text x="400" y="118" fill="var(--ink)" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Open PR</text>
        <text x="400" y="132" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle">gh pr create</text>

        <!-- Reviewer: Review content -->
        <rect x="500" y="176" width="140" height="48" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <text x="570" y="198" fill="var(--ink)" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Review content</text>
        <text x="570" y="212" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle">fact-check · voice</text>

        <!-- Editor: Polish copy -->
        <rect x="500" y="256" width="140" height="48" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <text x="570" y="278" fill="var(--ink)" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Polish copy</text>
        <text x="570" y="292" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle">style · line edits</text>

        <!-- Editor: Approve merge -->
        <rect x="680" y="256" width="140" height="48" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <text x="750" y="278" fill="var(--ink)" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Approve merge</text>
        <text x="750" y="292" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle">squash · main</text>

        <!-- CI/CD: Build -->
        <rect x="680" y="336" width="80" height="48" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <text x="720" y="358" fill="var(--ink)" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Build</text>
        <text x="720" y="372" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle">astro build</text>

        <!-- CI/CD: Deploy (coral focal) -->
        <rect x="800" y="336" width="120" height="48" rx="6" fill="color-mix(in srgb, var(--accent) 8%, transparent)" stroke="var(--accent)" stroke-width="1"/>
        <text x="860" y="358" fill="var(--ink)" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Deploy</text>
        <text x="860" y="372" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle">cloudflare pages</text>

        <!-- Legend -->
        <line x1="40" y1="428" x2="960" y2="428" stroke="color-mix(in srgb, var(--ink) 10%, transparent)" stroke-width="0.8"/>
        <text x="40" y="444" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="460" width="14" height="10" rx="2" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <text x="60" y="468" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Step</text>

        <rect x="132" y="460" width="14" height="10" rx="2" fill="color-mix(in srgb, var(--accent) 8%, transparent)" stroke="var(--accent)" stroke-width="1"/>
        <text x="152" y="468" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Focal outcome</text>

        <line x1="268" y1="466" x2="296" y2="466" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="304" y="468" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Within-lane step</text>

        <line x1="444" y1="466" x2="472" y2="466" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="480" y="468" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Revision loop</text>

        <line x1="608" y1="466" x2="636" y2="466" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="644" y="468" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Critical handoff</text>
      </svg>
  </div>
</body>
</html>
