<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content site · Architecture</title>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   var(--paper);
      --color-ink:     var(--ink);
      --color-muted:   var(--muted);
      --color-accent:  var(--accent);
      --font-sans:     system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
      --font-serif:    Georgia, Times New Roman, serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%;  display: block; }
  </style>
  <meta name="cognia-renderer" content="diagram-design-v1">
  <style id="cognia-diagram-theme">:root{--paper:var(--background,#f5f5f5);--paper-2:var(--card,#ececec);--ink:var(--foreground,#2d3142);--muted:var(--muted-foreground,#4f5d75);--soft:var(--muted-foreground,#7a8399);--rule:var(--border,rgba(45,49,66,.14));--rule-solid:var(--border,#bfc0c0);--accent:var(--primary,#eb6c36);--accent-ink:var(--primary-foreground,#fff);--accent-tint:color-mix(in srgb,var(--primary,#eb6c36) 10%,transparent);--link:var(--info,#2e5aa8);--series-1:var(--chart-1,#7c8f6f);--series-2:var(--chart-2,#5e7a9b);--series-3:var(--chart-3,#b8915a);--series-4:var(--chart-4,#9c6b50);--series-5:var(--chart-5,#6e6479)}svg{display:block;width:100%;max-width:100%;height:auto}</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Content site in production</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg">
      <title>Diagram Design standard example</title>
      <desc>Responsive standard example for the Diagram Design skill.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--ink) 10%, transparent)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--link)"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="var(--paper)"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Zone: Content services (drawn before arrows and nodes) -->
        <rect x="616" y="128" width="164" height="272" rx="8"
              fill="color-mix(in srgb, var(--ink) 2%, transparent)" stroke="color-mix(in srgb, var(--ink) 10%, transparent)" stroke-width="0.8"/>
        <rect x="672" y="132" width="52" height="12" rx="2" fill="var(--paper)"/>
        <text x="698" y="141" fill="color-mix(in srgb, var(--ink) 40%, transparent)" font-size="7" font-family="ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">CONTENT</text>

        <!-- Arrows first (behind boxes) -->
        <line x1="168" y1="272" x2="220" y2="272" stroke="var(--link)" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="364" y1="272" x2="416" y2="272" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Exit Astro top→enter MDX bottom; exit Astro bottom→enter CMS top -->
        <path d="M 496,240 H 692 Q 700,240 700,232 V 224"
              fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 496,304 H 692 Q 700,304 700,312 V 320"
              fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Dashed return: Cloudflare→Reader (cached HTML — same orthogonal rules as solid) -->
        <path d="M 220,288 H 168" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="172" y="252" width="48" height="12" rx="2" fill="var(--paper)"/>
        <text x="196" y="262" fill="var(--link)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

        <rect x="172" y="278" width="32" height="12" rx="2" fill="var(--paper)"/>
        <text x="188" y="287" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RESP</text>

        <rect x="368" y="252" width="48" height="12" rx="2" fill="var(--paper)"/>
        <text x="392" y="262" fill="var(--accent)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SSR</text>

        <rect x="564" y="234" width="60" height="12" rx="2" fill="var(--paper)"/>
        <text x="594" y="243" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">READ MDX</text>

        <rect x="568" y="298" width="44" height="12" rx="2" fill="var(--paper)"/>
        <text x="590" y="307" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">QUERY</text>

        <!-- Node: Reader -->
        <rect x="40" y="240" width="128" height="64" rx="6" fill="var(--paper)"/>
        <rect x="40" y="240" width="128" height="64" rx="6" fill="color-mix(in srgb, var(--muted) 10%, transparent)" stroke="var(--soft)" stroke-width="1"/>
        <rect x="48" y="248" width="28" height="12" rx="2" fill="transparent" stroke="color-mix(in srgb, var(--soft) 40%, transparent)" stroke-width="0.8"/>
        <text x="62" y="257" fill="var(--soft)" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="104" y="276" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Reader</text>
        <text x="104" y="292" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">Browser</text>

        <!-- Node: Cloudflare -->
        <rect x="220" y="240" width="144" height="64" rx="6" fill="var(--paper)"/>
        <rect x="220" y="240" width="144" height="64" rx="6" fill="color-mix(in srgb, var(--ink) 3%, transparent)" stroke="color-mix(in srgb, var(--ink) 30%, transparent)" stroke-width="1"/>
        <rect x="228" y="248" width="32" height="12" rx="2" fill="transparent" stroke="color-mix(in srgb, var(--ink) 22%, transparent)" stroke-width="0.8"/>
        <text x="244" y="257" fill="var(--soft)" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
        <text x="356" y="300" fill="color-mix(in srgb, var(--ink) 6%, transparent)" font-size="32" font-weight="600" font-family="ui-monospace, monospace" text-anchor="end">01</text>
        <text x="292" y="276" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Cloudflare</text>
        <text x="292" y="292" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">Pages · cache</text>

        <!-- Node: Astro (focal coral) -->
        <rect x="416" y="240" width="160" height="64" rx="6" fill="var(--paper)"/>
        <rect x="416" y="240" width="160" height="64" rx="6" fill="color-mix(in srgb, var(--accent) 8%, transparent)" stroke="var(--accent)" stroke-width="1"/>
        <rect x="424" y="248" width="32" height="12" rx="2" fill="transparent" stroke="color-mix(in srgb, var(--accent) 50%, transparent)" stroke-width="0.8"/>
        <text x="440" y="257" fill="var(--accent)" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ORIG</text>
        <text x="568" y="300" fill="color-mix(in srgb, var(--accent) 10%, transparent)" font-size="32" font-weight="600" font-family="ui-monospace, monospace" text-anchor="end">02</text>
        <text x="496" y="276" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Astro Origin</text>
        <text x="496" y="292" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">SSR + MDX</text>

        <!-- Node: MDX Bundle -->
        <rect x="628" y="160" width="144" height="64" rx="6" fill="var(--paper)"/>
        <rect x="628" y="160" width="144" height="64" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <rect x="636" y="168" width="32" height="12" rx="2" fill="transparent" stroke="color-mix(in srgb, var(--ink) 40%, transparent)" stroke-width="0.8"/>
        <text x="652" y="177" fill="var(--ink)" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BUN</text>
        <text x="700" y="196" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">MDX Bundle</text>
        <text x="700" y="212" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">src/content/*.mdx</text>

        <!-- Node: Content CMS -->
        <rect x="628" y="320" width="144" height="64" rx="6" fill="var(--paper)"/>
        <rect x="628" y="320" width="144" height="64" rx="6" fill="color-mix(in srgb, var(--ink) 5%, transparent)" stroke="var(--muted)" stroke-width="1"/>
        <rect x="636" y="328" width="28" height="12" rx="2" fill="transparent" stroke="color-mix(in srgb, var(--muted) 50%, transparent)" stroke-width="0.8"/>
        <text x="650" y="337" fill="var(--muted)" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CMS</text>
        <text x="700" y="356" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Content CMS</text>
        <text x="700" y="372" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">assets · og images</text>

        <!-- Legend strip -->
        <line x1="40" y1="404" x2="960" y2="404" stroke="color-mix(in srgb, var(--ink) 10%, transparent)" stroke-width="0.8"/>
        <text x="40" y="420" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="436" width="14" height="10" rx="2" fill="color-mix(in srgb, var(--accent) 8%, transparent)" stroke="var(--accent)" stroke-width="1"/>
        <text x="60" y="444" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Focal / origin</text>

        <rect x="180" y="436" width="14" height="10" rx="2" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <text x="200" y="444" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Backend / bundle</text>

        <rect x="340" y="436" width="14" height="10" rx="2" fill="color-mix(in srgb, var(--ink) 5%, transparent)" stroke="var(--muted)" stroke-width="1"/>
        <text x="360" y="444" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Store</text>

        <rect x="436" y="436" width="14" height="10" rx="2" fill="color-mix(in srgb, var(--ink) 3%, transparent)" stroke="color-mix(in srgb, var(--ink) 30%, transparent)" stroke-width="1"/>
        <text x="456" y="444" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Cloud</text>

        <rect x="528" y="436" width="14" height="10" rx="2" fill="color-mix(in srgb, var(--muted) 10%, transparent)" stroke="var(--soft)" stroke-width="1"/>
        <text x="548" y="444" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">External</text>

        <line x1="636" y1="442" x2="664" y2="442" stroke="var(--link)" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="672" y="444" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">HTTP request</text>

        <line x1="784" y1="442" x2="812" y2="442" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="820" y="444" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Primary flow</text>

        <line x1="900" y1="442" x2="928" y2="442" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="936" y="444" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Return / async</text>
      </svg>
  </div>
</body>
</html>
