<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content pyramid · what compounds</title>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   var(--paper);
      --color-ink:     var(--ink);
      --color-muted:   var(--muted);
      --color-accent:  var(--accent);
      --font-sans:     system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
      --font-serif:    Georgia, Times New Roman, serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%;  display: block; }
  </style>
  <meta name="cognia-renderer" content="diagram-design-v1">
  <style id="cognia-diagram-theme">:root{--paper:var(--background,#f5f5f5);--paper-2:var(--card,#ececec);--ink:var(--foreground,#2d3142);--muted:var(--muted-foreground,#4f5d75);--soft:var(--muted-foreground,#7a8399);--rule:var(--border,rgba(45,49,66,.14));--rule-solid:var(--border,#bfc0c0);--accent:var(--primary,#eb6c36);--accent-ink:var(--primary-foreground,#fff);--accent-tint:color-mix(in srgb,var(--primary,#eb6c36) 10%,transparent);--link:var(--info,#2e5aa8);--series-1:var(--chart-1,#7c8f6f);--series-2:var(--chart-2,#5e7a9b);--series-3:var(--chart-3,#b8915a);--series-4:var(--chart-4,#9c6b50);--series-5:var(--chart-5,#6e6479)}svg{display:block;width:100%;max-width:100%;height:auto}</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Pyramid · Diagram Design</p>
    <h1>Content pyramid · what compounds</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
      <title>Diagram Design standard example</title>
      <desc>Responsive standard example for the Diagram Design skill.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--ink) 10%, transparent)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="var(--paper)"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Left axis: direction of rarity -->
        <line x1="100" y1="40" x2="100" y2="320" stroke="color-mix(in srgb, var(--ink) 30%, transparent)" stroke-width="1"/>
        <polygon points="96,40 104,40 100,28" fill="color-mix(in srgb, var(--ink) 45%, transparent)"/>
        <text x="80" y="216" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.18em" text-anchor="middle" transform="rotate(-90 80 216)">RARER · FEWER · COMPOUNDS ↑</text>

        <!-- Base layer: Short posts -->
        <polygon points="244,280 756,280 820,344 180,344" fill="var(--paper-2)" stroke="color-mix(in srgb, var(--ink) 12%, transparent)" stroke-width="1"/>
        <text x="500" y="308" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Short posts</text>
        <text x="500" y="324" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">daily · ~200 words</text>
        <text x="836" y="316" fill="var(--soft)" font-size="9" font-family="ui-monospace, monospace" letter-spacing="0.08em">~240/yr</text>

        <!-- L3: Essays -->
        <polygon points="308,216 692,216 756,280 244,280" fill="var(--paper-2)" stroke="color-mix(in srgb, var(--ink) 12%, transparent)" stroke-width="1"/>
        <text x="500" y="244" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Essays</text>
        <text x="500" y="260" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">weekly · 800–1,500 words</text>
        <text x="776" y="252" fill="var(--soft)" font-size="9" font-family="ui-monospace, monospace" letter-spacing="0.08em">~48/yr</text>

        <!-- L2: Long-form guides -->
        <polygon points="372,152 628,152 692,216 308,216" fill="var(--paper-2)" stroke="color-mix(in srgb, var(--ink) 12%, transparent)" stroke-width="1"/>
        <text x="500" y="180" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Long-form guides</text>
        <text x="500" y="196" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">quarterly · 4,000+ words</text>
        <text x="716" y="188" fill="var(--soft)" font-size="9" font-family="ui-monospace, monospace" letter-spacing="0.08em">~4/yr</text>

        <!-- Apex: Flagship book — CORAL FOCAL (true pyramid peak — single triangle, consistent slope with layers below) -->
        <polygon points="500,24 628,152 372,152" fill="color-mix(in srgb, var(--accent) 8%, transparent)" stroke="var(--accent)" stroke-width="1"/>
        <text x="500" y="120" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Flagship book</text>
        <text x="500" y="136" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">every 3–5 years</text>
        <text x="656" y="112" fill="var(--accent)" font-size="9" font-family="ui-monospace, monospace" letter-spacing="0.08em">the apex</text>

        <!-- Footnote under pyramid -->
        <text x="500" y="384" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif" text-anchor="middle" font-style="italic">The base funds the apex. The apex defines the base.</text>

        <!-- Legend -->
        <line x1="40" y1="436" x2="960" y2="436" stroke="color-mix(in srgb, var(--ink) 10%, transparent)" stroke-width="0.8"/>
        <text x="40" y="452" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="464" width="16" height="12" fill="color-mix(in srgb, var(--accent) 8%, transparent)" stroke="var(--accent)" stroke-width="1"/>
        <text x="64" y="474" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Apex — rarest, highest leverage</text>

        <rect x="280" y="464" width="16" height="12" fill="var(--paper-2)" stroke="color-mix(in srgb, var(--ink) 25%, transparent)" stroke-width="1"/>
        <text x="304" y="474" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Supporting layer — the volume work</text>

        <text x="560" y="474" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif" font-style="italic">Layer width is honest: narrower = rarer shipping cadence.</text>
      </svg>
  </div>
</body>
</html>
