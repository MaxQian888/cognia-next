<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Should you write this as a skill?</title>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   var(--paper);
      --color-ink:     var(--ink);
      --color-muted:   var(--muted);
      --color-accent:  var(--accent);
      --font-sans:     system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
      --font-serif:    Georgia, Times New Roman, serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%;  display: block; }
  </style>
  <meta name="cognia-renderer" content="diagram-design-v1">
  <style id="cognia-diagram-theme">:root{--paper:var(--background,#f5f5f5);--paper-2:var(--card,#ececec);--ink:var(--foreground,#2d3142);--muted:var(--muted-foreground,#4f5d75);--soft:var(--muted-foreground,#7a8399);--rule:var(--border,rgba(45,49,66,.14));--rule-solid:var(--border,#bfc0c0);--accent:var(--primary,#eb6c36);--accent-ink:var(--primary-foreground,#fff);--accent-tint:color-mix(in srgb,var(--primary,#eb6c36) 10%,transparent);--link:var(--info,#2e5aa8);--series-1:var(--chart-1,#7c8f6f);--series-2:var(--chart-2,#5e7a9b);--series-3:var(--chart-3,#b8915a);--series-4:var(--chart-4,#9c6b50);--series-5:var(--chart-5,#6e6479)}svg{display:block;width:100%;max-width:100%;height:auto}</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Should you write this as a skill?</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
      <title>Diagram Design standard example</title>
      <desc>Responsive standard example for the Diagram Design skill.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--ink) 10%, transparent)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="var(--paper)"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <!-- Start → Step -->
        <line x1="500" y1="88" x2="500" y2="120" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Step → Diamond 1 -->
        <line x1="500" y1="168" x2="500" y2="192" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond 1 "NO" right -->
        <line x1="600" y1="240" x2="720" y2="240" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond 1 "YES" down -->
        <line x1="500" y1="288" x2="500" y2="328" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond 2 "NO" right -->
        <line x1="600" y1="376" x2="720" y2="376" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond 2 "YES" down (coral — happy path) -->
        <line x1="500" y1="424" x2="500" y2="464" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Arrow labels -->
        <rect x="644" y="230" width="24" height="12" rx="2" fill="var(--paper)"/>
        <text x="656" y="239" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="484" y="298" width="32" height="12" rx="2" fill="var(--paper)"/>
        <text x="500" y="307" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="644" y="366" width="24" height="12" rx="2" fill="var(--paper)"/>
        <text x="656" y="375" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="484" y="434" width="32" height="12" rx="2" fill="var(--paper)"/>
        <text x="500" y="443" fill="var(--accent)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <!-- Start oval -->
        <rect x="420" y="40" width="160" height="48" rx="24" fill="color-mix(in srgb, var(--ink) 3%, transparent)" stroke="color-mix(in srgb, var(--ink) 30%, transparent)" stroke-width="1"/>
        <text x="500" y="68" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">New workflow</text>

        <!-- Rectangle: Step -->
        <rect x="420" y="120" width="160" height="48" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <text x="500" y="148" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Do it manually once</text>

        <!-- Diamond 1: Repeated >3 times? -->
        <polygon points="500,192 600,240 500,288 400,240" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <text x="500" y="238" fill="var(--ink)" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Will you repeat</text>
        <text x="500" y="252" fill="var(--ink)" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">it >3 times?</text>

        <!-- End oval: One-off -->
        <rect x="720" y="216" width="160" height="48" rx="24" fill="color-mix(in srgb, var(--ink) 3%, transparent)" stroke="color-mix(in srgb, var(--ink) 30%, transparent)" stroke-width="1"/>
        <text x="800" y="240" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">One-off</text>
        <text x="800" y="254" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">keep manual</text>

        <!-- Diamond 2: Reusable across projects? -->
        <polygon points="500,328 600,376 500,424 400,376" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <text x="500" y="374" fill="var(--ink)" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Reusable across</text>
        <text x="500" y="388" fill="var(--ink)" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">projects?</text>

        <!-- End oval: CLAUDE.md note -->
        <rect x="720" y="352" width="160" height="48" rx="24" fill="color-mix(in srgb, var(--ink) 3%, transparent)" stroke="color-mix(in srgb, var(--ink) 30%, transparent)" stroke-width="1"/>
        <text x="800" y="376" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">CLAUDE.md note</text>
        <text x="800" y="390" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">project-scoped</text>

        <!-- End oval: Write a skill (coral focal) -->
        <rect x="420" y="464" width="160" height="56" rx="28" fill="color-mix(in srgb, var(--accent) 8%, transparent)" stroke="var(--accent)" stroke-width="1"/>
        <text x="500" y="492" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Write a skill</text>
        <text x="500" y="508" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">reusable + assets</text>

        <!-- Legend -->
        <line x1="40" y1="540" x2="960" y2="540" stroke="color-mix(in srgb, var(--ink) 10%, transparent)" stroke-width="0.8"/>
        <text x="40" y="556" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="572" width="24" height="12" rx="6" fill="color-mix(in srgb, var(--ink) 3%, transparent)" stroke="color-mix(in srgb, var(--ink) 30%, transparent)" stroke-width="1"/>
        <text x="72" y="582" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Start / end (oval)</text>

        <rect x="220" y="572" width="24" height="12" rx="2" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <text x="252" y="582" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Step (rectangle)</text>

        <polygon points="412,578 424,572 436,578 424,584" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <text x="448" y="582" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Decision (diamond)</text>

        <line x1="604" y1="580" x2="632" y2="580" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="640" y="582" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Happy path</text>

        <line x1="768" y1="580" x2="796" y2="580" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="804" y="582" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Branch</text>
      </svg>
  </div>
</body>
</html>
