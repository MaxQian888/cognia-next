<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article lifecycle · State machine</title>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   var(--paper);
      --color-ink:     var(--ink);
      --color-muted:   var(--muted);
      --color-accent:  var(--accent);
      --font-sans:     system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
      --font-serif:    Georgia, Times New Roman, serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%;  display: block; }
  </style>
  <meta name="cognia-renderer" content="diagram-design-v1">
  <style id="cognia-diagram-theme">:root{--paper:var(--background,#f5f5f5);--paper-2:var(--card,#ececec);--ink:var(--foreground,#2d3142);--muted:var(--muted-foreground,#4f5d75);--soft:var(--muted-foreground,#7a8399);--rule:var(--border,rgba(45,49,66,.14));--rule-solid:var(--border,#bfc0c0);--accent:var(--primary,#eb6c36);--accent-ink:var(--primary-foreground,#fff);--accent-tint:color-mix(in srgb,var(--primary,#eb6c36) 10%,transparent);--link:var(--info,#2e5aa8);--series-1:var(--chart-1,#7c8f6f);--series-2:var(--chart-2,#5e7a9b);--series-3:var(--chart-3,#b8915a);--series-4:var(--chart-4,#9c6b50);--series-5:var(--chart-5,#6e6479)}svg{display:block;width:100%;max-width:100%;height:auto}</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Diagram Design</p>
    <h1>Article lifecycle</h1>

    <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg">
      <title>Diagram Design standard example</title>
      <desc>Responsive standard example for the Diagram Design skill.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--ink) 10%, transparent)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="var(--paper)"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Transitions (drawn first) -->
        <!-- Start → Draft -->
        <line x1="68" y1="200" x2="120" y2="200" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Draft → In Review -->
        <line x1="280" y1="200" x2="340" y2="200" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- In Review → Published (coral — happy path) -->
        <line x1="500" y1="200" x2="560" y2="200" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Published → Archived (down) -->
        <line x1="640" y1="240" x2="640" y2="300" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Archived → End (down) -->
        <line x1="640" y1="400" x2="640" y2="432" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- In Review → Draft (curved back up-and-left) -->
        <path d="M 420 160 C 420 96, 200 96, 200 160" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Transition labels -->
        <rect x="172" y="184" width="48" height="12" rx="2" fill="var(--paper)"/>
        <text x="196" y="194" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CREATE</text>

        <rect x="288" y="184" width="48" height="12" rx="2" fill="var(--paper)"/>
        <text x="312" y="194" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SUBMIT</text>

        <rect x="500" y="184" width="60" height="12" rx="2" fill="var(--paper)"/>
        <text x="530" y="194" fill="var(--accent)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APPROVE</text>

        <rect x="612" y="264" width="56" height="12" rx="2" fill="var(--paper)"/>
        <text x="640" y="274" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXPIRE</text>

        <rect x="620" y="416" width="40" height="12" rx="2" fill="var(--paper)"/>
        <text x="640" y="426" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PURGE</text>

        <!-- Reject label on curved path -->
        <rect x="276" y="92" width="80" height="12" rx="2" fill="var(--paper)"/>
        <text x="316" y="102" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">REJECT · REVISE</text>

        <!-- Start dot (filled ink) -->
        <circle cx="60" cy="200" r="6" fill="var(--ink)"/>

        <!-- State: Draft -->
        <rect x="120" y="160" width="160" height="80" rx="8" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <rect x="128" y="168" width="40" height="12" rx="2" fill="transparent" stroke="color-mix(in srgb, var(--ink) 40%, transparent)" stroke-width="0.8"/>
        <text x="148" y="177" fill="var(--ink)" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="200" y="208" fill="var(--ink)" font-size="14" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Draft</text>
        <text x="200" y="224" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">unpublished</text>

        <!-- State: In Review -->
        <rect x="340" y="160" width="160" height="80" rx="8" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <rect x="348" y="168" width="40" height="12" rx="2" fill="transparent" stroke="color-mix(in srgb, var(--ink) 40%, transparent)" stroke-width="0.8"/>
        <text x="368" y="177" fill="var(--ink)" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="420" y="208" fill="var(--ink)" font-size="14" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">In Review</text>
        <text x="420" y="224" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">awaiting approval</text>

        <!-- State: Published (focal coral) -->
        <rect x="560" y="160" width="160" height="80" rx="8" fill="color-mix(in srgb, var(--accent) 8%, transparent)" stroke="var(--accent)" stroke-width="1"/>
        <rect x="568" y="168" width="40" height="12" rx="2" fill="transparent" stroke="color-mix(in srgb, var(--accent) 50%, transparent)" stroke-width="0.8"/>
        <text x="588" y="177" fill="var(--accent)" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="640" y="208" fill="var(--ink)" font-size="14" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Published</text>
        <text x="640" y="224" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">live on site</text>

        <!-- State: Archived -->
        <rect x="560" y="300" width="160" height="100" rx="8" fill="color-mix(in srgb, var(--ink) 5%, transparent)" stroke="var(--muted)" stroke-width="1"/>
        <rect x="568" y="308" width="40" height="12" rx="2" fill="transparent" stroke="color-mix(in srgb, var(--muted) 50%, transparent)" stroke-width="0.8"/>
        <text x="588" y="317" fill="var(--muted)" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="640" y="348" fill="var(--ink)" font-size="14" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Archived</text>
        <text x="640" y="364" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">noindex · hidden</text>
        <text x="640" y="382" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">redirect retained</text>

        <!-- End ring dot -->
        <circle cx="640" cy="440" r="8" fill="none" stroke="var(--ink)" stroke-width="1"/>
        <circle cx="640" cy="440" r="5" fill="var(--ink)"/>
      </svg>
  </div>
</body>
</html>
