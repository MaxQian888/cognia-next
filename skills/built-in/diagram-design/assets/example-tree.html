<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code skill taxonomy · Tree</title>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   var(--paper);
      --color-ink:     var(--ink);
      --color-muted:   var(--muted);
      --color-accent:  var(--accent);
      --font-sans:     system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
      --font-serif:    Georgia, Times New Roman, serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%;  display: block; }
  </style>
  <meta name="cognia-renderer" content="diagram-design-v1">
  <style id="cognia-diagram-theme">:root{--paper:var(--background,#f5f5f5);--paper-2:var(--card,#ececec);--ink:var(--foreground,#2d3142);--muted:var(--muted-foreground,#4f5d75);--soft:var(--muted-foreground,#7a8399);--rule:var(--border,rgba(45,49,66,.14));--rule-solid:var(--border,#bfc0c0);--accent:var(--primary,#eb6c36);--accent-ink:var(--primary-foreground,#fff);--accent-tint:color-mix(in srgb,var(--primary,#eb6c36) 10%,transparent);--link:var(--info,#2e5aa8);--series-1:var(--chart-1,#7c8f6f);--series-2:var(--chart-2,#5e7a9b);--series-3:var(--chart-3,#b8915a);--series-4:var(--chart-4,#9c6b50);--series-5:var(--chart-5,#6e6479)}svg{display:block;width:100%;max-width:100%;height:auto}</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · Diagram Design</p>
    <h1>Claude Code skill taxonomy</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg">
      <title>Diagram Design standard example</title>
      <desc>Responsive standard example for the Diagram Design skill.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--ink) 10%, transparent)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="var(--paper)"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Tier tags (left margin) -->
        <text x="40" y="108" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.18em">TIER 0 · ROOT</text>
        <text x="40" y="224" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.18em" text-anchor="start">TIER 1</text>
        <text x="40" y="324" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.18em" text-anchor="start">TIER 2</text>

        <!-- Connectors drawn first (behind nodes) -->
        <!-- Root → Tier 1 bus -->
        <path d="M 500 128 L 500 168 L 220 168 L 220 208" fill="none" stroke="var(--muted)" stroke-width="1"/>
        <path d="M 500 168 L 500 208" fill="none" stroke="var(--muted)" stroke-width="1"/>
        <path d="M 500 168 L 780 168 L 780 208" fill="none" stroke="var(--muted)" stroke-width="1"/>

        <!-- Design → leaves -->
        <path d="M 220 256 L 220 296 L 140 296 L 140 336" fill="none" stroke="var(--muted)" stroke-width="1"/>
        <path d="M 220 296 L 300 296 L 300 336" fill="none" stroke="var(--muted)" stroke-width="1"/>

        <!-- Engineering → leaves -->
        <path d="M 500 256 L 500 296 L 480 296 L 480 336" fill="none" stroke="var(--muted)" stroke-width="1"/>
        <path d="M 500 296 L 660 296 L 660 336" fill="none" stroke="var(--muted)" stroke-width="1"/>

        <!-- Research → single leaf -->
        <path d="M 780 256 L 780 296 L 840 296 L 840 336" fill="none" stroke="var(--muted)" stroke-width="1"/>

        <!-- Root node: Skills (coral focal) -->
        <rect x="420" y="80" width="160" height="48" rx="6" fill="var(--paper)"/>
        <rect x="420" y="80" width="160" height="48" rx="6" fill="color-mix(in srgb, var(--accent) 8%, transparent)" stroke="var(--accent)" stroke-width="1"/>
        <rect x="428" y="88" width="32" height="12" rx="2" fill="transparent" stroke="color-mix(in srgb, var(--accent) 50%, transparent)" stroke-width="0.8"/>
        <text x="444" y="97" fill="var(--accent)" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ROOT</text>
        <text x="500" y="118" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Skills</text>

        <!-- Tier 1: Design -->
        <rect x="140" y="208" width="160" height="48" rx="6" fill="var(--paper)"/>
        <rect x="140" y="208" width="160" height="48" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <rect x="148" y="216" width="28" height="12" rx="2" fill="transparent" stroke="color-mix(in srgb, var(--ink) 40%, transparent)" stroke-width="0.8"/>
        <text x="162" y="225" fill="var(--ink)" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CAT</text>
        <text x="220" y="240" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Design</text>
        <text x="220" y="252" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">ui · visual · ux</text>

        <!-- Tier 1: Engineering -->
        <rect x="420" y="208" width="160" height="48" rx="6" fill="var(--paper)"/>
        <rect x="420" y="208" width="160" height="48" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <rect x="428" y="216" width="28" height="12" rx="2" fill="transparent" stroke="color-mix(in srgb, var(--ink) 40%, transparent)" stroke-width="0.8"/>
        <text x="442" y="225" fill="var(--ink)" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CAT</text>
        <text x="500" y="240" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Engineering</text>
        <text x="500" y="252" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">ship · review · test</text>

        <!-- Tier 1: Research -->
        <rect x="700" y="208" width="160" height="48" rx="6" fill="var(--paper)"/>
        <rect x="700" y="208" width="160" height="48" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <rect x="708" y="216" width="28" height="12" rx="2" fill="transparent" stroke="color-mix(in srgb, var(--ink) 40%, transparent)" stroke-width="0.8"/>
        <text x="722" y="225" fill="var(--ink)" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CAT</text>
        <text x="780" y="240" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Research</text>
        <text x="780" y="252" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">investigate · analyze</text>

        <!-- Tier 2: polish -->
        <rect x="60" y="336" width="160" height="48" rx="6" fill="var(--paper)"/>
        <rect x="60" y="336" width="160" height="48" rx="6" fill="color-mix(in srgb, var(--ink) 5%, transparent)" stroke="var(--muted)" stroke-width="0.8"/>
        <text x="140" y="360" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">polish</text>
        <text x="140" y="372" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">align · space · rhythm</text>

        <!-- Tier 2: critique -->
        <rect x="220" y="336" width="160" height="48" rx="6" fill="var(--paper)"/>
        <rect x="220" y="336" width="160" height="48" rx="6" fill="color-mix(in srgb, var(--ink) 5%, transparent)" stroke="var(--muted)" stroke-width="0.8"/>
        <text x="300" y="360" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">critique</text>
        <text x="300" y="372" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">hierarchy · density</text>

        <!-- Tier 2: review -->
        <rect x="400" y="336" width="160" height="48" rx="6" fill="var(--paper)"/>
        <rect x="400" y="336" width="160" height="48" rx="6" fill="color-mix(in srgb, var(--ink) 5%, transparent)" stroke="var(--muted)" stroke-width="0.8"/>
        <text x="480" y="360" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">review</text>
        <text x="480" y="372" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">pre-land diff · sql</text>

        <!-- Tier 2: ship -->
        <rect x="580" y="336" width="160" height="48" rx="6" fill="var(--paper)"/>
        <rect x="580" y="336" width="160" height="48" rx="6" fill="color-mix(in srgb, var(--ink) 5%, transparent)" stroke="var(--muted)" stroke-width="0.8"/>
        <text x="660" y="360" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">ship</text>
        <text x="660" y="372" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">merge · deploy · verify</text>

        <!-- Tier 2: investigate -->
        <rect x="760" y="336" width="160" height="48" rx="6" fill="var(--paper)"/>
        <rect x="760" y="336" width="160" height="48" rx="6" fill="color-mix(in srgb, var(--ink) 5%, transparent)" stroke="var(--muted)" stroke-width="0.8"/>
        <text x="840" y="360" fill="var(--ink)" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">investigate</text>
        <text x="840" y="372" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">root cause · evidence</text>

        <!-- Legend strip -->
        <line x1="40" y1="412" x2="960" y2="412" stroke="color-mix(in srgb, var(--ink) 10%, transparent)" stroke-width="0.8"/>
        <text x="40" y="428" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="444" width="14" height="10" rx="2" fill="color-mix(in srgb, var(--accent) 8%, transparent)" stroke="var(--accent)" stroke-width="1"/>
        <text x="60" y="452" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Root · focal</text>

        <rect x="180" y="444" width="14" height="10" rx="2" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
        <text x="200" y="452" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Category branch</text>

        <rect x="340" y="444" width="14" height="10" rx="2" fill="color-mix(in srgb, var(--ink) 5%, transparent)" stroke="var(--muted)" stroke-width="0.8"/>
        <text x="360" y="452" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif">Leaf skill</text>

        <text x="500" y="452" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif" font-style="italic">Orthogonal connectors only. Coral marks the root — every branch descends from one idea.</text>
      </svg>
  </div>
</body>
</html>
