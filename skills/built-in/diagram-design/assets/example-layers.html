<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI app stack · Layer hierarchy</title>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   var(--paper);
      --color-ink:     var(--ink);
      --color-muted:   var(--muted);
      --color-accent:  var(--accent);
      --font-sans:     system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
      --font-serif:    Georgia, Times New Roman, serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%;  display: block; }
  </style>
  <meta name="cognia-renderer" content="diagram-design-v1">
  <style id="cognia-diagram-theme">:root{--paper:var(--background,#f5f5f5);--paper-2:var(--card,#ececec);--ink:var(--foreground,#2d3142);--muted:var(--muted-foreground,#4f5d75);--soft:var(--muted-foreground,#7a8399);--rule:var(--border,rgba(45,49,66,.14));--rule-solid:var(--border,#bfc0c0);--accent:var(--primary,#eb6c36);--accent-ink:var(--primary-foreground,#fff);--accent-tint:color-mix(in srgb,var(--primary,#eb6c36) 10%,transparent);--link:var(--info,#2e5aa8);--series-1:var(--chart-1,#7c8f6f);--series-2:var(--chart-2,#5e7a9b);--series-3:var(--chart-3,#b8915a);--series-4:var(--chart-4,#9c6b50);--series-5:var(--chart-5,#6e6479)}svg{display:block;width:100%;max-width:100%;height:auto}</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · Diagram Design</p>
    <h1>AI app stack · Where the work actually happens</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
      <title>Diagram Design standard example</title>
      <desc>Responsive standard example for the Diagram Design skill.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--ink) 10%, transparent)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="var(--paper)"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Direction column (left margin) -->
        <text x="60" y="68" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.18em">ABSTRACTION</text>
        <line x1="80" y1="80" x2="80" y2="400" stroke="color-mix(in srgb, var(--ink) 30%, transparent)" stroke-width="1"/>
        <polygon points="76,80 84,80 80,72" fill="var(--muted)"/>
        <text x="60" y="416" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.18em">SILICON</text>

        <!-- Stack container hairlines (top + bottom edges) -->
        <line x1="120" y1="80" x2="960" y2="80" stroke="color-mix(in srgb, var(--ink) 12%, transparent)" stroke-width="1"/>
        <line x1="120" y1="400" x2="960" y2="400" stroke="color-mix(in srgb, var(--ink) 12%, transparent)" stroke-width="1"/>

        <!-- L5 — UI (top layer, near-white fill) -->
        <rect x="120" y="80" width="840" height="64" fill="var(--paper-2)"/>
        <line x1="120" y1="144" x2="960" y2="144" stroke="color-mix(in srgb, var(--ink) 12%, transparent)" stroke-width="1"/>
        <text x="140" y="116" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.14em">L5</text>
        <text x="260" y="118" fill="var(--ink)" font-size="16" font-weight="600" font-family="system-ui, sans-serif">UI surface</text>
        <text x="940" y="118" fill="var(--muted)" font-size="10" font-family="ui-monospace, monospace" text-anchor="end" letter-spacing="0.08em">chat, editor, canvas</text>

        <!-- L4 — Agent harness (FOCAL, coral tint + coral stroke) -->
        <rect x="120" y="144" width="840" height="64" fill="color-mix(in srgb, var(--accent) 8%, transparent)"/>
        <rect x="120" y="144" width="840" height="64" fill="none" stroke="var(--accent)" stroke-width="1"/>
        <text x="140" y="180" fill="var(--accent)" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.14em" font-weight="600">L4</text>
        <text x="260" y="182" fill="var(--ink)" font-size="16" font-weight="600" font-family="system-ui, sans-serif">Agent harness</text>
        <text x="940" y="182" fill="var(--accent)" font-size="10" font-family="ui-monospace, monospace" text-anchor="end" letter-spacing="0.08em">tools, memory, loop</text>

        <!-- L3 — Prompt layer -->
        <rect x="120" y="208" width="840" height="64" fill="var(--paper)"/>
        <line x1="120" y1="272" x2="960" y2="272" stroke="color-mix(in srgb, var(--ink) 12%, transparent)" stroke-width="1"/>
        <text x="140" y="244" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.14em">L3</text>
        <text x="260" y="246" fill="var(--ink)" font-size="16" font-weight="600" font-family="system-ui, sans-serif">Prompt layer</text>
        <text x="940" y="246" fill="var(--muted)" font-size="10" font-family="ui-monospace, monospace" text-anchor="end" letter-spacing="0.08em">system, few-shot, caching</text>

        <!-- L2 — SDK -->
        <rect x="120" y="272" width="840" height="64" fill="var(--paper-2)"/>
        <line x1="120" y1="336" x2="960" y2="336" stroke="color-mix(in srgb, var(--ink) 12%, transparent)" stroke-width="1"/>
        <text x="140" y="308" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.14em">L2</text>
        <text x="260" y="310" fill="var(--ink)" font-size="16" font-weight="600" font-family="system-ui, sans-serif">SDK / client</text>
        <text x="940" y="310" fill="var(--muted)" font-size="10" font-family="ui-monospace, monospace" text-anchor="end" letter-spacing="0.08em">auth, retries, streaming</text>

        <!-- L1 — Model -->
        <rect x="120" y="336" width="840" height="64" fill="var(--paper-2)"/>
        <text x="140" y="372" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.14em">L1</text>
        <text x="260" y="374" fill="var(--ink)" font-size="16" font-weight="600" font-family="system-ui, sans-serif">Model weights</text>
        <text x="940" y="374" fill="var(--muted)" font-size="10" font-family="ui-monospace, monospace" text-anchor="end" letter-spacing="0.08em">opus, sonnet, haiku</text>

        <!-- Caption -->
        <text x="120" y="456" fill="var(--muted)" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.18em">FOCAL LAYER</text>
        <text x="240" y="456" fill="var(--muted)" font-size="8.5" font-family="system-ui, sans-serif" font-style="italic">The harness is where most product differentiation actually lives — tools, memory, and the loop that stitches model calls into useful work.</text>
      </svg>
  </div>
</body>
</html>
