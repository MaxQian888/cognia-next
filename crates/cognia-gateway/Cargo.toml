# ADR-0067 follow-up — OpenAI-compatible local API gateway (chat/responses/
# embeddings surface, API-key store, keyed rate limiting, execute/translate
# pipeline) extracted from app_lib's `gateway/` module. Re-aliased as
# `crate::gateway`. Reuses cognia-net's inbound policy primitives.
[package]
name = "cognia-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Local OpenAI-compatible API gateway — api keys, rate limiting, execute/translate pipeline."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_gateway"
path = "src/lib.rs"

[[bench]]
name = "gateway_e2e"
harness = false

[features]
# The Tauri host adapter + #[tauri::command] surface. Off by default
# (ADR-0196): only `src-tauri` enables it. `cognia-server` paths and the
# crate's own tests are host-neutral (ADR-0090 Phase 2).
default = []
tauri-host = ["dep:tauri"]
# ADR-0188 (Router + Fusion): compiles the Run API's scripted test brain
# (`brain_bridge::RecordingBrainBridge`) for OTHER crates' tests. Enable it only
# from a `[dev-dependencies]` entry; this crate's own tests get it via
# `cfg(test)`, and no production build carries it.
test-support = []

[dependencies]
cognia-secrets = { path = "../cognia-secrets" }
cognia-net = { path = "../cognia-net" }
cognia-instrument = { path = "../cognia-instrument" }
tauri = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml_edit = { workspace = true, features = ["serde"] }
axum = { workspace = true, features = ["macros", "ws"] }
tower-http = { workspace = true, features = ["limit", "trace", "cors"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream", "socks", "http2", "multipart"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
futures-util = { workspace = true }
bytes.workspace = true
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "v7"] }
parking_lot.workspace = true
log.workspace = true
thiserror.workspace = true
subtle.workspace = true
rand.workspace = true

[dev-dependencies]
cognia-secrets = { path = "../cognia-secrets", features = ["test-inmemory"] }
tower = { workspace = true, features = ["util", "limit", "timeout"] }
# `test-util` gives tests a paused clock, so the SSE idle-timeout test can
# assert the real STREAM_IDLE_TIMEOUT instead of a stand-in short duration.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
