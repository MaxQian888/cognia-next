# ADR-0067 follow-up — OpenAI-compatible local API gateway (chat/responses/
# embeddings surface, API-key store, keyed rate limiting, execute/translate
# pipeline) extracted from app_lib's `gateway/` module. Re-aliased as
# `crate::gateway`. Reuses cognia-net's inbound policy primitives.
[package]
name = "cognia-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
description = "Local OpenAI-compatible API gateway — api keys, rate limiting, execute/translate pipeline."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "cognia_gateway"
path = "src/lib.rs"

[features]
# The Tauri host adapter + #[tauri::command] surface. On by default so the
# desktop build is unchanged; `cognia-server` paths and the crate's own
# integration tests also build with `--no-default-features` (host-neutral,
# ADR-0090 Phase 2).
default = ["tauri-host"]
tauri-host = ["dep:tauri"]

[dependencies]
cognia-secrets = { path = "../cognia-secrets" }
cognia-net = { path = "../cognia-net" }
cognia-instrument = { path = "../cognia-instrument" }
tauri = { version = "=2.11.5", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.8", features = ["macros", "ws"] }
tower-http = { version = "0.7", features = ["limit", "trace", "cors"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "socks", "http2", "multipart"] }
futures-util = { version = "0.3", default-features = false }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7"] }
parking_lot = "0.12"
log = "0.4"
thiserror = "2"
subtle = "2"
rand = "0.10"

[dev-dependencies]
cognia-secrets = { path = "../cognia-secrets", features = ["test-inmemory"] }
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
# `test-util` gives tests a paused clock, so the SSE idle-timeout test can
# assert the real STREAM_IDLE_TIMEOUT instead of a stand-in short duration.
tokio = { version = "1", features = ["test-util"] }
