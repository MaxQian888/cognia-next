# ADR-0028 Phase 4 — non-elevated Windows sandbox runner.
#
# Standalone workspace member so `cargo check -p cognia-sandbox-runner`
# compiles the shared execution contract and Win32 launcher without the Tauri
# tree. The desktop backend (`crates/cognia-exec-sandbox/src/windows.rs`)
# spawns `cognia-sandbox-runner.exe --protocol-v2` with JSON on stdin.
[package]
name = "cognia-sandbox-runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Non-elevated Windows sandbox runner — restricted token + low integrity + Job Object."
license.workspace = true
publish.workspace = true

# The contract and the launch plan are a library so the security-relevant
# decisions — limits, the child's environment, what confinement is on offer —
# can be tested on any host, not only on Windows.
[lib]
name = "cognia_sandbox_runner"
path = "src/lib.rs"

[[bin]]
name = "cognia-sandbox-runner"
path = "src/main.rs"

[dependencies]
cognia-exec-sandbox = { path = "../cognia-exec-sandbox" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# Real Win32 sandbox primitives. Version pinned to the workspace's existing
# `windows` (0.62.2, from the uiautomation/automation deps) so the lockfile and
# feature-unified build stay single-version.
[target."cfg(target_os = \"windows\")".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
] }

[lints]
workspace = true
