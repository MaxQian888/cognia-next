# ADR-0183 — the in-sandbox supervisor.
#
# One static (musl) binary shipped inside the agent bundle image. Step ① modes:
# `install` stages bundle trees into the injection volume, `probe` inspects the
# user image the agent is about to run in, `init-agent` is the reaping PID 1
# that runs one agent as the declared user. Step ② adds `serve`.
#
# A library too: the probe report and bundle manifest types are what the
# container drivers read back (ADR-0183 "Injection"), and linking them must not
# pull a network stack. Keep this crate free of cognia-net / cognia-environment
# (both drag reqwest in); `cli` is the only feature with more than std, serde
# and libc behind it.
[package]
name = "cognia-sandboxd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "In-sandbox supervisor: bundle staging, image probe and the agent init process."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_sandboxd"
path = "src/lib.rs"

[[bin]]
name = "cognia-sandboxd"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"], optional = true }
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
signal-hook = "0.4"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
