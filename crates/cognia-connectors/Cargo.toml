# ADR-0067 Tier B — Platform Connectors subsystem (ADR-0009/0025/0036)
# extracted from app_lib's `connectors/` module. Isolates the Matrix E2EE
# stack (matrix-sdk-crypto + matrix-sdk-sqlite + ruma). The one upward edge
# (companion EventBus webhook emitter) is inverted through the crate's own
# `axum_app::EventEmitter` trait — the `BusEventEmitter` impl lives app-side
# in `companion_api::server`.
[package]
name = "cognia-connectors"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Platform Connectors — inbound webhook/WS server, credential keyring, outbound HTTP/WS clients, Matrix E2EE (ADR-0009)."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_connectors"
path = "src/lib.rs"

[features]
# ADR-0196 — the Tauri command shells that take `State`/`AppHandle` and the
# `AppHandleEmitter` that forwards server events to the renderer. Off by
# default so the connectors build and test Tauri-free; only `src-tauri`
# enables it.
default = []
tauri-host = ["dep:tauri"]

[dependencies]
cognia-secrets = { path = "../cognia-secrets" }
cognia-net = { path = "../cognia-net" }
cognia-instrument = { path = "../cognia-instrument" }
tauri = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
axum = { workspace = true, features = ["macros", "ws"] }
tower-http = { workspace = true, features = ["limit", "trace", "cors"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots", "connect"] }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream", "socks", "http2", "multipart"] }
bytes.workspace = true
base64.workspace = true
hex.workspace = true
url.workspace = true
serde_urlencoded = "0.7"
flate2.workspace = true
dirs.workspace = true
uuid = { workspace = true, features = ["v4", "v7"] }
chrono = { workspace = true, features = ["serde"] }
once_cell.workspace = true
parking_lot.workspace = true
log.workspace = true
thiserror.workspace = true
rand.workspace = true
# Signature verification / payload crypto per platform adapter.
hmac.workspace = true
sha1 = "0.11"
sha2.workspace = true
ed25519-dalek.workspace = true
subtle.workspace = true
aes = "0.9"
# CBC mode + Pkcs7/NoPadding for the Lark/WeChat payload decryptors; pulls
# cipher's block-padding feature that `aes::cipher::block_padding` needs.
cbc = { version = "0.2", features = ["alloc"] }
aes-gcm = { workspace = true, features = ["aes"] }
prost = "0.14"
# Matrix E2EE stack — the heavy dependency this crate isolates.
matrix-sdk-crypto = { version = "0.18.0", default-features = false }
matrix-sdk-sqlite = { version = "0.18.0", default-features = false, features = ["crypto-store", "bundled"] }
ruma = { version = "0.16.0", features = ["client-api-c", "events", "rand"] }

[dev-dependencies]
cognia-secrets = { path = "../cognia-secrets", features = ["test-inmemory"] }
# Router unit tests drive the axum app through tower::ServiceExt.
tower = { workspace = true, features = ["util", "limit", "timeout"] }
# HTTP mock server for http_client / attachments / media_upload tests.
wiremock.workspace = true
tempfile.workspace = true

[lints]
workspace = true
