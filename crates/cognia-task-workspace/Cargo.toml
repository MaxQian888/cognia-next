[package]
name = "cognia-task-workspace"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
description = "Task-scoped isolated workspace, resource ledger, and reversible apply service."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "cognia_task_workspace"
path = "src/lib.rs"

[[bin]]
name = "cognia-task-workspace-worker"
path = "src/bin/cognia-task-workspace-worker.rs"

[dependencies]
base64 = "0.22"
flate2 = "1"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
hex = "0.4"
ignore = "0.4"
notify = "6"
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
tempfile = "3"
