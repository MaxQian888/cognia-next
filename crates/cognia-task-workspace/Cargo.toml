[package]
name = "cognia-task-workspace"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Task-scoped isolated workspace, resource ledger, and reversible apply service."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_task_workspace"
path = "src/lib.rs"

[[bin]]
name = "cognia-task-workspace-worker"
path = "src/bin/cognia-task-workspace-worker.rs"

[dependencies]
base64.workspace = true
# ADR-0067 Phase 1 span registry. Provisioning is the hot path this crate is
# judged on, and it had no timing at all: `cognia_instrument::guard` writes
# into the same process-global registry the `/performance` panel reads, so a
# span added here shows up next to `git.exec` with no extra plumbing.
cognia-instrument = { path = "../cognia-instrument" }
# ADR-0176. The bare-mirror cache this crate used to own outright. It moved
# to a leaf so `cognia-git` could reach it too, and is re-exported from
# `lib.rs` under the same `mirror_*` names.
cognia-git-mirror = { path = "../cognia-git-mirror" }
# ADR-0175 B4. The wire types this crate answers with derive their own JSON
# Schema, and `wire_schema::closed_object` states the two things schemars
# leaves looser than the enforced output contract.
cognia-problem = { path = "../cognia-problem" }
flate2.workspace = true
git2 = { workspace = true, features = ["vendored-libgit2"] }
hex.workspace = true
ignore.workspace = true
notify.workspace = true
parking_lot.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v4", "v7"] }

# Copy-on-write clones for `include` provisioning (`copyfile(COPYFILE_CLONE)` on
# macOS, the `FICLONE` ioctl on Linux). Already in the lock via rusqlite/git2;
# named here so this crate may call it directly. Unix-only: Windows has no
# equivalent that `fs::copy` does not already reach (ReFS block cloning is not
# exposed through a stable API).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
