# ADR-0067 Tier C — the local SQLite mirrors of renderer-side agent state,
# extracted from `app_lib`.
#
# All three modules had ZERO `crate::` edges and, deliberately, NO tauri
# dependency: `bin/cognia-server.rs` consumes `provider_profiles` and
# `agent_session_store` directly, and Batch 4's `cognia-agent-protocols` will
# path-dep this crate for the ACP session registry. The Tauri-facing shells
# (`session_import`'s one command, and the whole `session_import_watch` event
# emitter) stay app-side so that stays true.
[package]
name = "cognia-agent-state"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "SQLite-backed agent session, provider-profile and session-import state for cognia."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_agent_state"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# `backup` for the store snapshot path, `bundled` so no system SQLite is
# required. Must match src-tauri verbatim or cargo builds a second libsqlite3.
rusqlite = { workspace = true, features = ["backup", "bundled"] }
parking_lot.workspace = true
once_cell.workspace = true
# `sync` for the provider-profile version watch channel; `rt` for the session
# store's `spawn_blocking` retention sweep.
tokio = { workspace = true, features = ["rt", "sync"] }
log.workspace = true
# Per-OS roots when probing for an OpenCode database.
dirs.workspace = true
chrono = { workspace = true, features = ["serde"] }
thiserror.workspace = true
# Routing-snapshot + credential types and the static-header policy check.
cognia-gateway = { path = "../cognia-gateway" }

[lints]
workspace = true
