# ADR-0235 — installs, repairs, re-pairs and uninstalls a full headless Cognia
# Host on a machine the desktop reaches through a remote shell (a VS Code
# tunnel first, SSH later). It drives the existing owners — the signed update
# catalog, `cognia-server stage`, `service install|status|uninstall` and
# `pair --json` — and adds only the remote-shell seam and the consent-gated
# sequence around them. Service layer, beside `cognia-deploy-agent`.
[package]
name = "cognia-host-installer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Bootstrap a headless Cognia Host over a remote shell."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_host_installer"
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
# The catalog verifier takes a `DateTime<Utc>`.
chrono = { workspace = true, features = ["std"] }
# The status report the remote binary prints, the data-dir default `install`
# uses and the local archive digest.
cognia-host-service = { path = "../cognia-host-service" }
# Release selection and the verified download, exactly as self-update does it.
cognia-update-catalog = { path = "../cognia-update-catalog", features = ["client"] }
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "time"] }
# The pair invitation is an owner credential: wiped when dropped.
zeroize = "1"

[dev-dependencies]
cognia-host-service = { path = "../cognia-host-service", features = ["test-support"] }
cognia-update-catalog = { path = "../cognia-update-catalog", features = ["client", "test-support"] }
hex.workspace = true
parking_lot.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
