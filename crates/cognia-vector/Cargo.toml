# ADR-0067 Phase 4 — native + cloud vector store (ADR-0004/0022/0023),
# extracted from `app_lib`'s `vector/` module. Isolates `qdrant-client` and the
# bundled-sqlite (`rusqlite` + `sqlite-vec`) C compile. Credential persistence is
# inverted through the `CredentialStore` trait (installed at app boot) so this
# crate does not depend on `secret_store`/`keyring_secrets`.
[package]
name = "cognia-vector"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Native (sqlite-vec) + cloud vector store backends behind a unified command surface."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_vector"
path = "src/lib.rs"

[features]
# ADR-0196 — the Tauri command shells in `commands` (they all take `State`).
# Off by default so the crate builds and tests Tauri-free; `src-tauri`
# turns it on.
default = []
tauri-host = ["dep:tauri"]

[dependencies]
cognia-instrument = { path = "../cognia-instrument" }
cognia-net = { path = "../cognia-net" }
tauri = { workspace = true, optional = true }
log.workspace = true
# VectorBackend + the 5 cloud backends are `#[async_trait]` (dyn-dispatched
# through VectorRegistry), so this must be a direct dep, not transitive.
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream", "socks", "http2", "multipart"] }
rusqlite = { workspace = true, features = ["bundled"] }
sqlite-vec = "0.1"
qdrant-client = { version = "1.19", default-features = false, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
chrono = { workspace = true, features = ["serde"] }
parking_lot.workspace = true
once_cell.workspace = true

[dev-dependencies]
tempfile.workspace = true
# HTTP mock server for the cloud backend tests (chroma/milvus/pinecone/weaviate).
wiremock.workspace = true
urlencoding = "2"

[lints]
workspace = true
