[package]
name = "cognia-observability"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Marker features — they compile no code. `crash::system_info` reports which
# OCR backends were linked into the binary, and after ADR-0067 Tier C that
# report lives here while the real features live in `cognia-ocr`. `src-tauri`
# enables both halves under one feature name, so the report stays truthful
# instead of silently listing nothing. (`cognia-ocr` declares two of these as
# markers too — the CLI-based backends link no crate.)
ocr-tesseract = []
ocr-windows = []
ocr-ocrs = []
ocr-paddle = []
# ADR-0067 Tier C — the desktop crash/logging/telemetry host (`crash`,
# `logging`, `telemetry`). OFF by default: `cognia-cli` links this crate only
# for `diagnostic_package` / `diagnostic_submit`, and it is a deliberately lean
# binary (ureq over reqwest, no tokio, no tracing). `src-tauri` turns it on.
desktop-host = [
  "tracing-host",
  "dep:tauri",
  "dep:tauri-plugin-log",
  "dep:tauri-plugin-opener",
  "dep:fern",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:sysinfo",
  "dep:reqwest",
  "dep:once_cell",
  "dep:base64",
  "dep:url",
  "dep:tempfile",
  "dep:cognia-core",
  "dep:cognia-instrument",
  "dep:cognia-net",
  "dep:cognia-secrets",
  "dep:crash-handler",
  "dep:minidumper",
  "dep:eventlog",
  "dep:oslog",
  "dep:libsystemd",
  "dep:syslog",
]
# ADR-0196 E3b — the tauri-free slice of the host the companion core and the
# headless server need on their own: W3C trace-context propagation
# (`trace_context`). `desktop-host` implies it.
tracing-host = ["dep:tracing"]
# ADR-0073 — native OTLP trace/metric export stays opt-in so the OpenTelemetry
# graph does not slow normal desktop development. `src-tauri` forwards its own
# `otel-export` here. Implies `desktop-host`: the only consumer is `telemetry`.
otel-export = [
  "desktop-host",
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
]

[dependencies]
chrono = { workspace = true, features = ["serde"] }
# ADR-0067 Tier C — `recovery_runtime` moved in from `app_lib`: `dirs` for the
# diagnostics data dir, `log` for the non-fatal persistence warnings.
dirs.workspace = true
log.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
zip = { workspace = true, features = ["deflate"] }
zstd = "0.13"

# --- ADR-0067 Tier C: the `desktop-host` cluster (all optional) ---
tauri = { workspace = true, features = ["macos-private-api", "macos-proxy", "tray-icon", "image-png", "unstable"], optional = true }
tauri-plugin-log = { version = "2", optional = true }
tauri-plugin-opener = { workspace = true, optional = true }
fern = { version = "0.7", optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "registry"], optional = true }
sysinfo = { workspace = true, features = ["system"], optional = true }
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream", "socks", "http2", "multipart", "form"], optional = true }
once_cell = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
url = { workspace = true, optional = true }
# `crash::submit` stages a package in a TempDir at runtime — not a dev-only dep.
tempfile = { workspace = true, optional = true }
# `Installed` for the crash reporter's screen-capture slot, which the desktop
# app fills from `cognia-automation` (this crate used to link all of it).
cognia-core = { path = "../cognia-core", optional = true }
# Telemetry feeds the metrics registry.
cognia-instrument = { path = "../cognia-instrument", optional = true }
# `proxy_config` for outbound uploads, `secret_store` for the telemetry token.
cognia-net = { path = "../cognia-net", optional = true }
cognia-secrets = { path = "../cognia-secrets", optional = true }
# --- ADR-0073 OTLP export (optional, see [features]) ---
opentelemetry = { version = "0.32", optional = true, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", optional = true, features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", optional = true, default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-client"] }
tracing-opentelemetry = { version = "0.33", optional = true }

# The out-of-process minidump monitor. Gated exactly as in src-tauri; the
# `#[cfg(...)]` in `crash/monitor.rs` mirrors this predicate (it used to read
# `#[cfg(desktop)]`, which only tauri-build emits).
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
crash-handler = { version = "0.8", optional = true }
minidumper = { version = "0.11", optional = true }

[target."cfg(target_os = \"windows\")".dependencies]
eventlog = { version = "0.4", optional = true }

[target."cfg(target_os = \"macos\")".dependencies]
oslog = { version = "0.2", optional = true }

[target."cfg(target_os = \"linux\")".dependencies]
libsystemd = { version = "0.7", optional = true }
syslog = { version = "7", optional = true }

[dev-dependencies]
# `telemetry`'s OTLP export tests stand up a loopback TCP listener. tokio is
# test-only here: the production paths use `tauri::async_runtime`.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "net"] }
tempfile.workspace = true

[lints]
workspace = true
