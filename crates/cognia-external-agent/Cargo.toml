# ADR-0067 follow-up — external agent exec backends (local process groups,
# docker containers via bollard, kubernetes runner pods) extracted from
# app_lib's `external_agent/` module. Isolates the optional bollard/kube
# stacks. Re-aliased as `crate::external_agent`; the companion EventBus
# emitter impl (BusAgentEmitter) stays app-side in companion_api::rpc.
[package]
name = "cognia-external-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "External agent exec backends — local process, container (bollard), kubernetes (kube)."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_external_agent"
path = "src/lib.rs"

[features]
# The #[tauri::command] surface and the AppHandle-bound DSH path helpers. Off
# by default (ADR-0196): a library crate links Tauri only when asked, and only
# `src-tauri` asks. The exec backends build Tauri-free for the in-sandbox
# supervisor (`cognia-sandboxd`, ADR-0183) and the headless server.
default = []
tauri-host = ["dep:tauri"]
# Docker flavor of the exec backend (headless server image).
container-exec = ["dep:bollard"]
# Kubernetes flavor (runner Pods); enabled alongside container-exec in the
# headless image.
k8s-exec = ["dep:kube", "dep:k8s-openapi"]
workspace-runtime-exec = ["dep:reqwest", "dep:cognia-net"]
# The in-memory daemon and event recorder, for crates that build on the
# container seam (`cognia-sandbox-pool`'s Docker driver) and test against it.
test-support = []

[dependencies]
cognia-exec-sandbox = { path = "../cognia-exec-sandbox" }
tauri = { workspace = true, optional = true }
url.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
# sha2 0.11's digest output does not implement LowerHex; `hex` renders it.
hex.workspace = true
tempfile.workspace = true
# Raw stdout framing (`pi-rpc`) ships undecoded chunks to the renderer as
# base64 — the same encoding the Node backend's raw mode uses.
base64.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
log.workspace = true
futures-util = { workspace = true }
# `fs` is used by workspace_runtime_backend; it used to arrive only through
# tauri's feature unification, which `--no-default-features` removes.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "sync", "time", "io-util", "fs"] }
bollard = { version = "0.21", optional = true }
kube = { version = "4", default-features = false, features = ["client", "ws", "runtime", "rustls-tls"], optional = true }
k8s-openapi = { version = "0.28", features = ["v1_32"], optional = true }
reqwest = { workspace = true, features = ["json", "rustls-no-provider"], optional = true }
# Shared proxy policy (ADR-0067). Optional and feature-gated so the crate
# still builds without the workspace-runtime backend.
cognia-net = { path = "../cognia-net", optional = true }

[target.'cfg(unix)'.dependencies]
# Process-group kills for the local backend.
libc.workspace = true

[lints]
workspace = true
