# ADR-0067 Phase 6 — system scheduler + visual workflow engine + timing/cron
# triggers (ADR-0002 / ADR-0011). Extracted from app_lib's scheduler/ +
# workflow/ + timing/ modules (one cyclic cluster, ~10k LOC). Isolates the
# `cron` expression parser; rusqlite stays shared in src-tauri too. Re-aliased
# as crate::{scheduler,workflow,timing}.
[package]
name = "cognia-scheduling"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "System scheduler + visual workflow engine + cron/timing triggers (ADR-0002 / ADR-0011)."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_scheduling"
path = "src/lib.rs"

[features]
# ADR-0196 — the Tauri command shells (all take `State`) and the
# `AppHandle`-bound event emitters. Off by default so the scheduler and
# workflow engine build and test Tauri-free; only `src-tauri` enables it.
default = []
tauri-host = ["dep:tauri"]

[dependencies]
# `rt::spawn` starts the alarm/cron/file-watch loops on the app runtime.
cognia-core = { path = "../cognia-core", features = ["rt"] }
cognia-secrets = { path = "../cognia-secrets" }
# The page envelope desktop list commands answer (ADR-0175 B3).
cognia-problem = { path = "../cognia-problem" }
tauri = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "sync", "time"] }
cron = "0.17"
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
chrono = { workspace = true, features = ["serde"] }
chrono-tz = "0.10"
uuid = { workspace = true, features = ["v4", "v7"] }
parking_lot.workspace = true
once_cell.workspace = true
regex.workspace = true
log.workspace = true
# `trigger.file.watch`: the native watcher, and the gitignore matcher that
# keeps build output from firing it. Both are already workspace-wide (cognia-git
# pairs them the same way).
notify.workspace = true
ignore.workspace = true
async-trait.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream", "socks", "http2", "multipart"] }
# Workflow webhook-trigger HTTP surface + HMAC signature verification.
axum = { workspace = true, features = ["macros", "ws"] }
tower-http = { workspace = true, features = ["limit", "trace", "cors"] }
hmac.workspace = true
sha2.workspace = true
base64.workspace = true

# scheduler/macos.rs (launchd plists under ~/Library/LaunchAgents) — macOS only,
# so the Windows-side extraction pass couldn't compile this file.
[target.'cfg(target_os = "macos")'.dependencies]
dirs.workspace = true
libc.workspace = true

[dev-dependencies]
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tempfile.workspace = true
cognia-secrets = { path = "../cognia-secrets", features = ["test-inmemory"] }

[lints]
workspace = true
