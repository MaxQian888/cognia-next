# ADR-0067 Phase 6 — system scheduler + visual workflow engine + timing/cron
# triggers (ADR-0002 / ADR-0011). Extracted from app_lib's scheduler/ +
# workflow/ + timing/ modules (one cyclic cluster, ~10k LOC). Isolates the
# `cron` expression parser; rusqlite stays shared in src-tauri too. Re-aliased
# as crate::{scheduler,workflow,timing}.
[package]
name = "cognia-scheduling"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
description = "System scheduler + visual workflow engine + cron/timing triggers (ADR-0002 / ADR-0011)."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "cognia_scheduling"
path = "src/lib.rs"

[dependencies]
cognia-core = { path = "../cognia-core" }
cognia-secrets = { path = "../cognia-secrets" }
tauri = { version = "=2.11.5" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "sync", "time"] }
cron = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v7"] }
parking_lot = "0.12"
once_cell = "1"
regex = "1"
log = "0.4"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "socks", "http2", "multipart"] }
# Workflow webhook-trigger HTTP surface + HMAC signature verification.
axum = { version = "0.8", features = ["macros", "ws"] }
tower-http = { version = "0.7", features = ["limit", "trace", "cors"] }
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"

# scheduler/macos.rs (launchd plists under ~/Library/LaunchAgents) — macOS only,
# so the Windows-side extraction pass couldn't compile this file.
[target.'cfg(target_os = "macos")'.dependencies]
dirs = "6"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
cognia-secrets = { path = "../cognia-secrets", features = ["test-inmemory"] }
