# RFC 8785 (JSON Canonicalization Scheme), the Rust twin of
# `lib/plugin/character-pack/canonical-json.ts`.
#
# Extracted from `cognia-cli` (where it signed Character Packs) so every Rust
# component that digests JSON the brain also digests agrees with it byte for
# byte: the CLI's pack signatures and `cognia-environment`'s EnvironmentSpec
# digests (ADR-0182). A leaf with no Cognia dependencies, like
# cognia-instrument.
[package]
name = "cognia-canonical-json"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "RFC 8785 JSON canonicalization shared with the TypeScript implementation."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_canonical_json"
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
