# ADR-0067 Tier-B prep — the secrets foundation extracted from app_lib:
# `secret_store` (single-keychain encrypted store), `keyring_secrets`
# (namespaced string secrets on top of it) and `api_key` (in-process Anthropic
# provider env store). Kept separate from `cognia-core` on purpose: this crate
# pulls keyring + aes-gcm, and folding those into core would put them on the
# critical path of every extracted crate's check loop.
#
# The `test-inmemory` feature replaces the file+keyring-backed process global
# with the in-memory store. `#[cfg(test)]` only applies when THIS crate is the
# test target, so dependent crates (app_lib, cognia-subscription, …) must turn
# the feature on from their [dev-dependencies] to keep their own test suites
# hermetic — otherwise their tests would hit the real OS keyring.
[package]
name = "cognia-secrets"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Encrypted single-keychain secret store + provider env state shared across cognia subsystem crates."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_secrets"
path = "src/lib.rs"

[features]
# In-memory secret store + stubbed legacy keyring, for dependents' tests.
test-inmemory = []

[dependencies]
cognia-core = { path = "../cognia-core" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
aes-gcm = { workspace = true, features = ["aes"] }
parking_lot.workspace = true
rand.workspace = true
hex.workspace = true
dirs.workspace = true
log.workspace = true
keyring = { version = "4", default-features = false }
# `rt` + `rt-multi-thread`: readiness waits use `block_in_place` on runtime
# workers so an async command waiting for initialization never starves the
# executor (see `secret_store::wait_blocking`).
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread"] }

# Real OS credential store backends — same platform matrix as src-tauri.
# Without these features keyring silently uses its mock store.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4", features = ["windows-native-keyring-store"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4", features = ["apple-native-keyring-store"] }
security-framework-sys = "2.17"

[target.'cfg(target_os = "linux")'.dependencies]
# `crypto-rust` encrypts the D-Bus session transfer with RustCrypto so no
# system OpenSSL is needed at build time. Chosen over `linux-native` (kernel
# keyutils) because keyutils is wiped on reboot.
keyring = { version = "4", features = ["zbus-secret-service-keyring-store"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
