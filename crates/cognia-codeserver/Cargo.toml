[package]
name = "cognia-codeserver"
version = "0.1.0"
description = "Managed IDE runtime and authenticated code-server relays"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
tauri-host = ["dep:tauri"]

[dependencies]
cognia-core = { path = "../cognia-core" }
cognia-net = { path = "../cognia-net" }
cognia-agents = { path = "../cognia-agents" }
cognia-sidecar = { path = "../cognia-sidecar" }
cognia-companion-security = { path = "../cognia-companion-security" }
cognia-companion-connectivity = { path = "../cognia-companion-connectivity" }
cognia-companion-bus = { path = "../cognia-companion-bus" }
tauri = { workspace = true, optional = true }
anyhow.workspace = true
thiserror.workspace = true
subtle.workspace = true
tempfile.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
ed25519-dalek.workspace = true
flate2.workspace = true
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
log.workspace = true
once_cell.workspace = true
p256 = { version = "0.14", features = ["ecdsa", "ecdh"] }
rand.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream", "socks", "http2"] }
rustls = { workspace = true, features = ["ring", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "net"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots", "connect"] }
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
zip = { workspace = true, features = ["deflate", "bzip2"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
cognia-companion = { path = "../cognia-companion", features = ["test-support"] }
cognia-secrets = { path = "../cognia-secrets", features = ["test-inmemory"] }
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
