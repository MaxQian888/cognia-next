# Background-job supervisor: the ONE owner of non-interactive long-running
# commands started by the built-in agent (`bash(run_in_background)`,
# `start_process`) and by scheduled tasks. Deliberately NOT a PTY — stdout and
# stderr stay separate and exit codes stay real, which is what distinguishes it
# from `cognia-terminal`'s PTY sessions.
#
# Linked by BOTH `src-tauri` (desktop) and the headless `cognia-server` binary,
# so there is one implementation and no headless divergence.
[package]
name = "cognia-jobs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Background-job supervisor: process-group-safe spawn/kill, ring+disk output, SQLite journal."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_jobs"
path = "src/lib.rs"

[dependencies]
# Shared outbound proxy policy — a job spawned with `env_clear()` would
# otherwise dial past whatever proxy the user configured.
cognia-net = { path = "../cognia-net" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "sync", "time"] }
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
uuid = { workspace = true, features = ["v4"] }
bytes.workspace = true
log.workspace = true
regex.workspace = true

# Process-group creation (`setsid`) and group kill (`killpg`). Mirrors the
# idiom in `cognia-exec-sandbox/src/macos.rs`.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
