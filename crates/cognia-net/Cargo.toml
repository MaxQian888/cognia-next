# ADR-0067 Tier-B prep — centralized outbound proxy configuration extracted
# from app_lib's `proxy_config/` module: the live `ProxyConfig` slot every
# reqwest builder consults, local proxy-client detection (Clash/Mihomo/…), and
# the WSS CONNECT/SOCKS dialer. Kept separate from `cognia-core` on purpose:
# this crate pulls reqwest + tokio-net, and folding those into core would put
# the whole hyper stack on the critical path of every extracted crate's check
# loop. The `proxy_*` `#[tauri::command]` shells stay app-side.
[package]
name = "cognia-net"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Outbound proxy configuration, detection and WSS proxy dialer shared across cognia subsystem crates."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_net"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
url.workspace = true
base64.workspace = true
# Same feature set as src-tauri so the unified build behaves identically
# (socks is needed for socks5:// proxy URLs, json for the Clash controller
# probe, stream for http_download's bytes_stream()).
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "socks", "stream"] }
# `macros` for the detect-stage tokio::join!; `fs` for http_download's
# streamed writes.
tokio = { workspace = true, features = ["net", "time", "io-util", "rt", "macros", "fs", "sync"] }
# http_download hashes each chunk as it lands rather than buffering the body.
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
# SOCKS5 CONNECT dialing for the WSS proxy path.
tokio-socks = "0.5"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-native-certs.workspace = true
# join_all over the detect-stage probe futures.
futures-util = { workspace = true }
# Proxy-client detection: process snapshot + per-client config-file discovery.
sysinfo = { workspace = true, features = ["system"] }
dirs.workspace = true
regex.workspace = true

[dev-dependencies]
# HTTP mock server for `http_client`.
wiremock.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
rcgen.workspace = true

[lints]
workspace = true
