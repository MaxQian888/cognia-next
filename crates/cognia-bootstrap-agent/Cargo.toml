[package]
name = "cognia-bootstrap-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Standalone bounded environment preparation and task agent"

[[bin]]
name = "cognia-bootstrap"
path = "src/main.rs"

[dependencies]
cognia-net = { path = "../cognia-net" }
cognia-exec-sandbox = { path = "../cognia-exec-sandbox" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "io-std", "sync", "time", "signal"] }
sha2.workspace = true
hex.workspace = true
url.workspace = true
tempfile.workspace = true
clap = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
wiremock.workspace = true

[lints]
workspace = true
