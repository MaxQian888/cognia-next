[package]
name = "cognia-cli"
version = "0.1.0"
edition = "2021"
description = "Cognia WASM plugin author CLI (scaffold / build / sign / verify / dev)"
license = "AGPL-3.0-or-later"
rust-version = "1.82"

[[bin]]
name = "cognia"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
ed25519-dalek = "2"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
notify = "6"
wasmparser = "0.221"
# Used by `install` / `uninstall` / `dev --reload-url` to talk to a
# running cognia desktop's CLI bridge. Plain HTTP because the bridge
# binds to 127.0.0.1 only — see src-tauri/src/cli_bridge/.
ureq = { version = "2", default-features = false, features = ["json"] }
directories = "5"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
# Tiny in-process mock HTTP server for cmd_install / cmd_uninstall tests.
tiny_http = "0.12"
