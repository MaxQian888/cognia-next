[package]
name = "cognia-cli"
version = "0.1.0"
edition.workspace = true
description = "Cognia plugin author CLI (scaffold / lint / build / sign / verify / inspect / bridge ops / dev)"
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "cognia"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
ed25519-dalek.workspace = true
rand.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zip = { workspace = true, features = ["deflate"] }
anyhow.workspace = true
# RFC 8785 canonicalizer for Character Pack signatures (shared leaf).
cognia-canonical-json = { path = "../cognia-canonical-json" }
notify.workspace = true
wasmparser = "0.259"
# Used by status/install/uninstall/list/reload/dev to talk to a running
# cognia desktop's CLI bridge. Plain HTTP because the bridge binds to
# 127.0.0.1 only — see src-tauri/src/cli_bridge/.
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }
# `cognia acp` stdio↔WS bridge to the companion API's ACP endpoint. Sync
# (blocking) client keeps tokio out of the binary, matching the ureq choice.
tungstenite = { version = "0.30", features = ["native-tls"] }
native-tls = "0.2"
dirs.workspace = true
parking_lot.workspace = true
# ── UX/TUI stack (Phase 1 — see plans/cli-tui-majestic-quokka.md) ─────────
# `eyre` + `color-eyre` provide the top-level error report with severity
# colors, cause chains, and suggestion sections. anyhow stays internal —
# we convert at the main() boundary.
eyre = "0.6"
color-eyre = { version = "0.6", default-features = false, features = ["track-caller"] }
# Spinner / progress bar / MultiProgress (for `plugin build` & `plugin dev`).
indicatif = "0.18"
# Confirm / Input / Select / MultiSelect prompts.
dialoguer = { version = "0.12", default-features = false, features = ["completion", "fuzzy-select"] }
# Unicode-aware table layout for `plugin info`.
comfy-table = "8"
# Color macros that honor NO_COLOR / FORCE_COLOR / set_override.
owo-colors = { version = "4", features = ["supports-colors"] }
# TTY detection — std::io::IsTerminal would also work, but is-terminal
# is already a transitive dep via dialoguer/indicatif and gives uniform
# behavior on Windows console.
is-terminal = "0.4"
# Cross-platform Ctrl+C handler for `plugin dev` double-press exit.
# Used as a one-shot installer (`set_handler`) and communicates with the
# event loop via `AtomicU8` so the handler stays signal-safe.
ctrlc = "3"
# Used by `plugin dev` to stamp build outcomes with a wall-clock time on
# the sticky status panel. `default-features = false` keeps timezone
# parsing & serde out of the binary — we only need `Local::now()`.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cognia-observability = { version = "0.1.0", path = "../cognia-observability" }
cognia-headless-contract = { version = "0.1.0", path = "../cognia-headless-contract" }
uuid = { workspace = true, features = ["v4"] }
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
openssl = "0.10"
# Tiny in-process mock HTTP server for cmd_install / cmd_uninstall tests.
tiny_http = "0.12"

[lints]
workspace = true
