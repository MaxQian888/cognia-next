[package]
name = "cognia-cli"
version = "0.1.0"
edition = "2021"
description = "Cognia WASM plugin author CLI (scaffold / build / sign / verify / dev)"
license = "MIT OR Apache-2.0"
rust-version = "1.82"

[[bin]]
name = "cognia"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
ed25519-dalek = "2"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
notify = "6"
wasmparser = "0.221"

[dev-dependencies]
tempfile = "3"
