# ADR-0067 follow-up — CCSwitch provider-relay switcher (Claude Code /
# Codex / OpenCode config file management, provider DB, drift watcher)
# extracted from app_lib's `ccswitch/` module. Re-aliased as
# `crate::ccswitch`.
[package]
name = "cognia-ccswitch"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "CCSwitch — provider-relay switching for Claude Code/Codex/OpenCode config files."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_ccswitch"
path = "src/lib.rs"

[dependencies]
cognia-core = { path = "../cognia-core" }
cognia-subscription = { path = "../cognia-subscription" }
tauri = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
dirs.workspace = true
log.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
notify.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
# Codex config.toml enrichment.
toml_edit = { workspace = true, features = ["serde"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
