# ADR-0182/0183 — the host side of runtime environment sandboxes.
#
# Admission against the tenant environment store (`cognia-environment`) and the
# per-spawn Docker driver of Step ①: stage the agent bundle into named volumes,
# probe the user image with `cognia-sandboxd`, start the agent through
# `init-agent`. The daemon itself stays behind `cognia-external-agent`'s
# container seam, so nothing here links bollard and the whole driver is tested
# against the in-memory daemon.
#
# A separate crate because `cognia-sandboxd` (the probe and manifest types) will
# link `cognia-external-agent` for its Step ② `serve` mode; the driver needs
# both, and putting it in either would close that cycle.
[package]
name = "cognia-sandbox-pool"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Runtime environment sandboxes: admission and the Docker driver."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_sandbox_pool"
path = "src/lib.rs"

[features]
# The bollard client behind `cognia-external-agent`'s container seam. Off by
# default so a desktop build links the boot seam and admission without a
# Docker client; the headless image and the desktop local-container toggle
# turn it on. With it off, a deployment that enables the pool is refused at
# boot rather than downgraded (see `boot`).
docker = ["cognia-external-agent/container-exec"]
# ADR-0221 remote providers. Each is a client for one provider's API; the
# driver, admission and the Host-side git proxy they share are always built.
# A deployment whose providers file names a kind this binary was built without
# is refused at boot, as the `docker` switch is.
kubernetes = ["dep:kube", "dep:k8s-openapi"]
# E2B also fetches the agent bundle from its registry itself (the template
# build copies its filesystem), so it links the registry transport, and the
# Host's proxy policy for every call it makes.
e2b = ["dep:flate2", "cognia-environment/registry"]

[dependencies]
cognia-exec-sandbox = { path = "../cognia-exec-sandbox" }
cognia-core = { path = "../cognia-core", features = ["workspace-env-async"] }
# `store` only: the registry HTTP transport (and the reqwest it pulls) belongs
# to the metadata reader in `cognia-environment`, not to a driver that hands
# every pull to the daemon. `registry::auth` is not behind that feature.
cognia-environment = { path = "../cognia-environment", default-features = false, features = ["store"] }
cognia-external-agent = { path = "../cognia-external-agent", default-features = false }
cognia-sandboxd = { path = "../cognia-sandboxd", default-features = false }
async-trait.workspace = true
log.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
schemars.workspace = true
hex.workspace = true
uuid = { workspace = true, features = ["v4"] }
tempfile.workspace = true
tar.workspace = true
url.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "time", "io-util", "process", "fs", "macros", "rt", "net"] }
# The Host-side git proxy (ADR-0221): one loopback smart-HTTP endpoint per
# remote workspace, forwarding to one upstream with the credential added here.
axum.workspace = true
reqwest = { workspace = true, features = ["stream", "json", "rustls-no-provider"] }
# Not referenced in code: enables rustls' `ring` provider so the reqwest above
# (built `rustls-no-provider`) has a process-default crypto provider in a
# binary that never installs one, as `cognia-environment` does.
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
futures-util = { workspace = true, features = ["std"] }
bytes.workspace = true
base64.workspace = true
cognia-git-mirror = { path = "../cognia-git-mirror" }
# The Host's network proxy policy, applied to every upstream client here (the
# git proxy, the provider APIs). `cognia-environment` links it already.
cognia-net = { path = "../cognia-net" }
# Remote providers, each behind its own feature.
kube = { version = "4", default-features = false, features = ["client", "ws", "runtime", "rustls-tls"], optional = true }
k8s-openapi = { version = "0.28", features = ["v1_32"], optional = true }
flate2 = { workspace = true, optional = true }

[dev-dependencies]
cognia-task-workspace-host = { path = "../cognia-task-workspace-host" }
cognia-external-agent = { path = "../cognia-external-agent", default-features = false, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
