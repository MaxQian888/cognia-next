# ADR-0067 follow-up — Skills subsystem (scan/install/registry for Claude
# Code, Codex and native skill dirs) extracted from app_lib's `skills/`
# module. Zero cross-module coupling; re-aliased as `crate::skills`.
[package]
name = "cognia-skills"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Skills subsystem — scanning, install/mirror/trash lifecycle, registry."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_skills"
path = "src/lib.rs"

[dependencies]
cognia-net = { path = "../cognia-net" }
tauri = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
regex.workspace = true
dirs.workspace = true
tempfile.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream", "socks", "http2", "multipart"] }
tokio = { workspace = true, features = ["sync", "time", "fs"] }
base64.workspace = true
hex.workspace = true
parking_lot.workspace = true
sha2.workspace = true
uuid = { workspace = true, features = ["v4"] }
unicode-normalization = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
