# ADR-0067 follow-up — Skills subsystem (scan/install/registry for Claude
# Code, Codex and native skill dirs) extracted from app_lib's `skills/`
# module. Zero cross-module coupling; re-aliased as `crate::skills`.
[package]
name = "cognia-skills"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
description = "Skills subsystem — scanning, install/mirror/trash lifecycle, registry."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "cognia_skills"
path = "src/lib.rs"

[dependencies]
cognia-net = { path = "../cognia-net" }
tauri = { version = "=2.11.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
dirs = "6"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "socks", "http2", "multipart"] }
tokio = { version = "1", features = ["sync", "time", "fs"] }
base64 = "0.23"
hex = "0.4"
parking_lot = "0.12"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
