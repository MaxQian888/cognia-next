# ADR-0067 Tier C — the confined filesystem surface, extracted from `app_lib`.
#
# 23 `#[tauri::command]`s and the process-global allowed-roots / remote
# git-workspace registries, none of which touch `AppHandle`. Its only outward
# edge was `crate::agents::paths::vendor_roots()` (now a path dep), while
# 37 of its 38 inbound edges come from `companion_api/rpc/*` — extracting it
# clears those blocking edges ahead of the companion_api work.
#
# Owns `gray_matter` (front-matter parsing for slash commands / skills) and
# `ignore` (gitignore-aware workspace walks).
[package]
name = "cognia-files"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Confined filesystem access, workspace search and skill scanning for cognia."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_files"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Base64 transport for workspace binary reads (editor image previews).
base64.workspace = true
# Front-matter on slash-command / skill markdown. `default-features = false`
# keeps the JSON+TOML engines out; must stay byte-identical to src-tauri's
# declaration or cargo builds a second copy.
gray_matter = { version = "0.3", default-features = false, features = ["yaml"] }
# Gitignore-aware recursive walks for workspace search.
ignore.workspace = true
# Case-insensitive content search over workspace files.
regex.workspace = true
# Per-OS roots for the default export directory.
dirs.workspace = true
# Denied-path warnings on the remote (companion) origin.
log.workspace = true
# The async command shells hand blocking IO to `spawn_blocking`; `macros` is
# for the `#[tokio::test]` in this file.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "sync", "time"] }
# The pi-agent vendor root feeds skill scanning.
cognia-agents = { path = "../cognia-agents" }
# The command shells only; the fns stay in the `files` submodule (E0255).
tauri = { workspace = true, features = ["macos-private-api", "macos-proxy", "tray-icon", "image-png", "unstable"] }

[lints]
workspace = true
