# ADR-0067 Tier B — integrated terminal subsystem (ADR-0031/0033) extracted
# from app_lib's `terminal/` module. Isolates `portable-pty`. Re-aliased as
# `crate::terminal`; its `commands::terminal_*` / `exec::terminal_exec` /
# `complete::…` / `headless::…` shells are referenced from generate_handler!.
# The one upward edge (cli_bridge::detect::managed_dirs_snapshot) is inverted:
# the app shell registers a provider via `set_managed_cli_dirs_provider` at
# startup.
[package]
name = "cognia-terminal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Integrated terminal subsystem — portable-pty + xterm.js bridge (ADR-0031/0033)."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_terminal"
path = "src/lib.rs"

[features]
# ADR-0196 — the Tauri command shells that take `State`/`AppHandle`, the
# desktop dock's `Channel` sink and the serial `AppHandle` emitter. Off by
# default so the terminal builds and tests Tauri-free; only `src-tauri`
# enables it.
default = []
tauri-host = ["dep:tauri"]

[dependencies]
# Sandbox launch policy (bwrap/sandbox-exec prefixes, dangerous-env filter).
cognia-exec-sandbox = { path = "../cognia-exec-sandbox" }
# SSH credentials are resolved inside the native process so passwords and
# private-key passphrases never round-trip through the renderer.
cognia-secrets = { path = "../cognia-secrets" }
# The page envelope desktop list commands answer (ADR-0175 B3).
cognia-problem = { path = "../cognia-problem" }
# perf span guards (terminal.exec).
cognia-instrument = { path = "../cognia-instrument" }
tauri = { workspace = true, optional = true }
portable-pty = "0.9"
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# ADR-0175 B4: the wire types this crate answers with derive their own JSON
# Schema, so the published output contract cannot disagree with the struct.
schemars.workspace = true
# `net` + `macros` + `rt` are used directly by the SSH forwarding runtime
# (loopback listeners, `select!`, and the per-tunnel tasks); they were reaching
# this crate only through feature unification before.
tokio = { workspace = true, features = [
  "process",
  "sync",
  "io-util",
  "time",
  "net",
  "macros",
  "rt",
] }
uuid = { workspace = true, features = ["v4", "v7"] }
dirs.workspace = true
log.workspace = true
# Do not enable russh's `rsa` feature: it pulls the unpatched RustCrypto RSA
# implementation affected by RUSTSEC-2023-0071. Ed25519/ECDSA SSH keys remain
# supported through the ring backend.
russh = { version = "=0.62.6", default-features = false, features = ["ring"] }
# SFTP over the SSH connection `ssh.rs` already dialled (ADR-0162). Transport
# agnostic by design: it takes any `AsyncRead + AsyncWrite`, so it rides
# `channel.into_stream()` from the same russh session rather than opening a
# second SSH stack of its own. Apache-2.0, and upstream tests against the same
# russh 0.62 line this crate pins.
russh-sftp = "2.4"
thiserror.workspace = true
# ADR-0067 Tier C — `terminal_host_service` moved in from `app_lib`;
# versions copied verbatim from `src-tauri/Cargo.toml` so the move adds
# no new version to the lock.
base64.workspace = true
chrono = { workspace = true, features = ["serde"] }
ed25519-dalek.workspace = true
hex.workspace = true
once_cell.workspace = true
rand.workspace = true
sha2.workspace = true
# `terminal_host_service` mints its own bootstrap secret + descriptor signing
# key. It talks to `keyring` directly (as it did in `app_lib`); the per-OS
# backend features below mirror `src-tauri` and `cognia-secrets` — without them
# keyring silently falls back to its MOCK store and the secrets never persist.
keyring = { version = "4", default-features = false }
# Serial monitor (`multiplexer.rs`'s sibling, `serial.rs`). `default-features`
# is off deliberately: the default set turns on `libudev`, which makes a Linux
# build need `libudev-dev` on the machine. The cost is that Linux port
# enumeration falls back to a sysfs scan and reports no USB vendor/product
# metadata, which `serial.rs` says out loud rather than reporting empty strings
# as if the device had none. macOS and Windows are unaffected.
tokio-serial = { version = "5.5.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4", features = ["windows-native-keyring-store"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4", features = ["apple-native-keyring-store"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Chosen over `linux-native` (kernel keyutils), which is wiped on reboot.
keyring = { version = "4", features = ["zbus-secret-service-keyring-store"] }

[target.'cfg(unix)'.dependencies]
# chmod on the host socket / descriptor files.
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true

[lints]
workspace = true
