[package]
name = "cognia-media"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
description = "Native local-video metadata, frame extraction, trimming, and analysis for Cognia."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "cognia_media"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=2.11.5" }
thiserror = "2"
tokio = { version = "1", features = ["fs", "process", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
