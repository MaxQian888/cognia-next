[package]
name = "cognia-media"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Native local-video metadata, frame extraction, trimming, and analysis for Cognia."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_media"
path = "src/lib.rs"

[features]
# ADR-0196 — the `commands` module: the Tauri shells over `service`. Off by
# default so the crate builds and tests Tauri-free; `src-tauri` turns it on to
# register the commands in `generate_handler!`.
default = []
tauri-host = ["dep:tauri"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The command shells only (`commands`, behind `tauri-host`).
tauri = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "process", "time"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
