# ADR-0067 Phase 2 — Source Control subsystem (ADR-0038), extracted from
# `app_lib`'s `git/` module. Isolates the `git2`/vendored-libgit2 C compile so
# an edit here recompiles ~5k LOC + a relink instead of the whole Tauri tree.
# The command surface (`commands::git_*`) is referenced from the app's
# `generate_handler!` via `cognia_git::commands::…`; `git2` remains in
# `src-tauri` too (the `twin` module also uses it).
[package]
name = "cognia-git"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Source Control subsystem (ADR-0038) — VSCode-style Git panel backend."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_git"
path = "src/lib.rs"

[features]
# ADR-0196 — the `commands` module (the Tauri shells) and the watcher's
# event-emitting `start`. Off by default so the crate builds and tests
# Tauri-free; `src-tauri` turns it on.
default = []
tauri-host = ["dep:tauri"]

[dependencies]
# Span instrumentation (ADR-0067 Phase 1) — replaces the old `crate::perf::guard`.
cognia-instrument = { path = "../cognia-instrument" }
# ADR-0176. The shared bare-mirror object cache. A leaf, like cognia-instrument:
# this crate carries it and it carries nothing of ours, which is what finally
# lets `clone_repo_guarded` reuse the objects the workspace clones already
# fetched instead of going to the network every time.
cognia-git-mirror = { path = "../cognia-git-mirror" }
# The watch commands take `AppHandle`/`State` and `Emitter` the status-changed event.
tauri = { workspace = true, optional = true }
tokio = { workspace = true, features = ["process", "fs", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
# `default-features = false` (no https/ssh) — mutating/network ops shell out to
# system `git`; git2 is read-only here. Matches the `src-tauri` build exactly.
git2 = { workspace = true, features = ["vendored-libgit2"] }
notify.workspace = true
ignore.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
# `github::workspace` parses the GitHub host a clone targets.
url.workspace = true
# `github::workspace` pushes from a throwaway trusted clone.
tempfile.workspace = true

[dev-dependencies]
# `github::workspace` tests build the credential header they expect a clone to send.
base64.workspace = true

[lints]
workspace = true
