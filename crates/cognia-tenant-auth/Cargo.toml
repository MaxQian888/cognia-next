[package]
name = "cognia-tenant-auth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "ADR-0149 identity primitives: people, orgs, membership resolution and tenant-scoped grants."
license.workspace = true
publish.workspace = true

[features]
# The identity core (ids, roles, membership resolution) is dependency-light on
# purpose: `src-tauri` links it just to stop persisting unvalidated ids, and
# should not pay for HMAC machinery it never calls.
default = []
grants = ["dep:base64", "dep:hmac", "dep:sha2", "dep:serde_json", "dep:uuid"]
# JWKS-discovery OIDC verification. Shared by `cognia-ops-controller` and
# `cognia-collab-server`; NOT by `services/diagnostic-server`, which is on
# `jsonwebtoken 9` and outside this workspace (see lib.rs).
oidc = ["dep:async-trait", "dep:jsonwebtoken", "dep:parking_lot", "dep:reqwest", "dep:serde_json", "dep:anyhow"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, features = ["rust_crypto"], optional = true }
parking_lot = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls-no-provider"], optional = true }
hmac = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4", "serde"], optional = true }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
