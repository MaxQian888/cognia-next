# ADR-0067 follow-up — embedded MCP server (streamable-HTTP transport,
# automation/orchestration tool proxies, sidecar bridge) extracted from
# app_lib's `mcp_server/` module. Re-aliased as `crate::mcp_server`.
[package]
name = "cognia-mcp-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Embedded MCP server — streamable HTTP transport + automation/orchestration proxies (ADR-0008/0020)."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_mcp_server"
path = "src/lib.rs"

[features]
# ADR-0196 — the default build is the transport alone: the streamable-HTTP
# listener, the Node sidecar sessions and the orchestration proxy, which is
# all the headless server starts (it passes no automation binding).
default = []
# The automation proxy that exposes the native UI-automation stack to MCP
# clients. It links `cognia-automation` (uiautomation, xcap, enigo), so only a
# desktop build asks for it.
desktop-automation = ["dep:cognia-automation"]
# The `#[tauri::command]` shells and the Tauri event sink. The start/restart
# commands read the automation state, so this implies `desktop-automation`.
# Only `src-tauri` enables it.
tauri-host = ["dep:tauri", "desktop-automation"]

[dependencies]
cognia-core = { path = "../cognia-core" }
cognia-automation = { path = "../cognia-automation", optional = true }
tauri = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
axum = { workspace = true, features = ["macros", "ws"] }
tower-http = { workspace = true, features = ["limit", "trace", "cors"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util", "process"] }
futures-util = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "v7"] }
parking_lot.workspace = true
log.workspace = true
thiserror.workspace = true
subtle.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util", "limit", "timeout"] }
# http_server integration tests drive the live listener over HTTP.
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }

[lints]
workspace = true
