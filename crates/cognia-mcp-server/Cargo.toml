# ADR-0067 follow-up — embedded MCP server (streamable-HTTP transport,
# automation/orchestration tool proxies, sidecar bridge) extracted from
# app_lib's `mcp_server/` module. Re-aliased as `crate::mcp_server`.
[package]
name = "cognia-mcp-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
description = "Embedded MCP server — streamable HTTP transport + automation/orchestration proxies (ADR-0008/0020)."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "cognia_mcp_server"
path = "src/lib.rs"

[dependencies]
cognia-core = { path = "../cognia-core" }
cognia-automation = { path = "../cognia-automation" }
tauri = { version = "=2.11.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.8", features = ["macros", "ws"] }
tower-http = { version = "0.7", features = ["limit", "trace", "cors"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util", "process"] }
futures-util = { version = "0.3", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7"] }
parking_lot = "0.12"
log = "0.4"
thiserror = "2"
subtle = "2"
rand = "0.10"
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
# http_server integration tests drive the live listener over HTTP.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
