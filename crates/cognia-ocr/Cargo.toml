# ADR-0067 Phase 3 — native OCR subsystem (ADR-0024), extracted from `app_lib`'s
# `ocr/` module. Isolates the optional ONNX/Paddle/ocrs stack (and its heavy
# toolchain floor — `oar-ocr` needs Rust 1.84.1). The 5 `ocr-*` features move
# here; `src-tauri` forwards them. `ort`'s `copy-dylibs` and model DLL staging
# follow the dependency, so bundling is unaffected.
[package]
name = "cognia-ocr"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
description = "Native OCR subsystem (ADR-0024) — tesseract/ocrs/paddle backends behind a dispatch table."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "cognia_ocr"
path = "src/lib.rs"

[dependencies]
cognia-instrument = { path = "../cognia-instrument" }
tauri = { version = "=2.11.1" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "socks", "http2", "multipart"] }
futures-util = { version = "0.3", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
sha2 = "0.11"
hex = "0.4"
dirs = "6"

# ADR-0024 — local OCR engines (opt-in). `ocrs` + `rten` = pure-Rust ONNX-style
# pipeline (no system deps); `oar-ocr` + `ort` = PaddleOCR PP-OCRv5 via ONNX
# Runtime (best CJK accuracy). `image` is the shared decoder for both.
ocrs           = { version = "0.12", optional = true }
rten           = { version = "0.24", optional = true, default-features = false }
rten-imageproc = { version = "0.24", optional = true }
oar-ocr        = { version = "0.6",  optional = true }
ort            = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["download-binaries", "copy-dylibs"] }
image          = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# Cross-platform Tesseract via the local `tesseract` CLI (no crate binding).
ocr-tesseract = []
# Windows.Media.Ocr — requires MSIX package identity at runtime.
ocr-windows = []
# Apple Vision via the bundled Swift sidecar (externalBin).
ocr-apple = []
# Pure-Rust OCR via `ocrs` + RTen. Models downloaded on first use.
ocr-ocrs = ["dep:ocrs", "dep:rten", "dep:rten-imageproc", "dep:image"]
# PaddleOCR PP-OCRv5 via `oar-ocr` + ONNX Runtime (ships an onnxruntime DLL).
ocr-paddle = ["dep:oar-ocr", "dep:ort", "dep:image"]
