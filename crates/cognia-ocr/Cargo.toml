# ADR-0067 Phase 3 — native OCR subsystem (ADR-0024), extracted from `app_lib`'s
# `ocr/` module. Isolates the optional ONNX/Paddle/ocrs stack (and its heavy
# toolchain floor — `oar-ocr` 0.9.x needs Rust 1.95). The `ocr-*` features move
# here; `src-tauri` forwards them. Apple Vision is not feature-gated — it is
# compiled whenever the target is macOS. `ort`'s `copy-dylibs` and model DLL staging
# follow the dependency, so bundling is unaffected.
[package]
name = "cognia-ocr"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Native OCR subsystem (ADR-0024) — tesseract/ocrs/paddle backends behind a dispatch table."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_ocr"
path = "src/lib.rs"

[dependencies]
cognia-instrument = { path = "../cognia-instrument" }
cognia-net = { path = "../cognia-net" }
tauri = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "process", "io-util", "net"] }
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream", "socks", "http2", "multipart"] }
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
chrono = { workspace = true, features = ["serde"] }
once_cell.workspace = true
log.workspace = true
sha2.workspace = true
hex.workspace = true
dirs.workspace = true
tempfile.workspace = true

# ADR-0024 — local OCR engines (opt-in). `ocrs` + `rten` = pure-Rust ONNX-style
# pipeline (no system deps); `oar-ocr` = PaddleOCR PP-OCRv6 via ONNX Runtime
# (best CJK accuracy). `image` is the shared decoder for both.
ocrs           = { version = "0.13", optional = true }
rten           = { version = "0.26", optional = true, default-features = false }
rten-imageproc = { version = "0.26", optional = true }
oar-ocr        = { version = "0.9.2", optional = true, default-features = false, features = ["download-binaries", "simd"] }
image          = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }

# Apple Vision text recognition (macOS) — in-process via the objc2 framework
# bindings (VNRecognizeTextRequest). Compiled unconditionally on macOS: the
# backend has no model downloads and no system deps beyond Vision.framework.
# `image` is pulled in non-optionally here for header-only dimension probing
# (Vision reports bounding boxes normalized; we need pixel dimensions).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSArray", "NSString", "NSDictionary", "NSError", "NSValue"] }
objc2-core-foundation = "0.3"
objc2-vision = { version = "0.3", features = [
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
    "VNObservation",
    "VNTypes",
    "objc2-core-foundation",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }

[features]
default = []
# ADR-0196 — the Tauri command shells. Commands that take `State`/`AppHandle`
# compile only with it; the plain-argument ones stay ordinary fns. Only
# `src-tauri` enables it.
tauri-host = ["dep:tauri"]
# Cross-platform Tesseract via the local `tesseract` CLI (no crate binding).
ocr-tesseract = []
# Windows.Media.Ocr — requires MSIX package identity at runtime.
ocr-windows = []
# Pure-Rust OCR via `ocrs` + RTen. Models downloaded on first use.
ocr-ocrs = ["dep:ocrs", "dep:rten", "dep:rten-imageproc", "dep:image"]
# PaddleOCR PP-OCRv6 via `oar-ocr` + ONNX Runtime (ships an onnxruntime DLL).
ocr-paddle = ["dep:oar-ocr", "dep:image"]

[lints]
workspace = true
