[package]
name = "cognia-collab-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Cognia collaboration plane — server-authoritative Issues over ADR-0149 identity."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_collab_server"
path = "src/lib.rs"

[[bin]]
name = "cognia-collab-server"
path = "src/main.rs"

[[bin]]
name = "cognia-collab-bootstrap"
path = "src/bin/bootstrap.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["macros", "ws"] }
base64.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
cognia-tenant-auth = { path = "../cognia-tenant-auth", features = ["grants", "oidc"] }
deadpool-postgres = "0.14"
futures-util = { workspace = true }
parking_lot.workspace = true
object_store = { version = "0.14", default-features = false, features = ["aws-base", "reqwest", "ring", "fs"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rand.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
rustls-native-certs.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
# sha2 0.11's digest output does not implement LowerHex; `hex` renders it.
hex.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = "0.14"
tower-http = { workspace = true, features = ["cors", "request-id", "trace"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
