# ADR-0067 Phase 5 — Computer Use automation + execution sandbox
# (ADR-0020 / ADR-0028). Extracted from app_lib's automation/ + sandbox/ +
# cua_sandbox/ modules (one cyclic cluster). Isolates the UI-automation stack
# (uiautomation + windows-rs on Windows, enigo + AX on macOS, atspi/seccomp on
# Linux) and xcap. Shared deps (windows, core-graphics, core-foundation, libc)
# stay in src-tauri too; only the cluster-exclusive ones (uiautomation, enigo,
# xcap, accessibility[-sys], seccompiler) were removed there. Native target
# blocks are copied verbatim from src-tauri/Cargo.toml.
[package]
name = "cognia-automation"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
description = "Computer Use automation + execution sandbox (ADR-0020 / ADR-0028)."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "cognia_automation"
path = "src/lib.rs"

[dependencies]
cognia-instrument = { path = "../cognia-instrument" }
cognia-core = { path = "../cognia-core" }
tauri = { version = "=2.11.1", features = ["image-png"] }
# `desktop_paste` writes to the clipboard via ClipboardExt before pasting.
tauri-plugin-clipboard-manager = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "sync", "time", "net", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
parking_lot = "0.12"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "v7"] }
regex = "1"
dirs = "6"
hex = "0.4"
url = "2"
bytes = "1"
rand = "0.8"
futures-util = { version = "0.3", default-features = false }
async-trait = "0.1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-native-roots", "connect"] }

# Cross-platform screenshot (Computer Use). xcap re-exports `image`, so the
# cluster uses `xcap::image` rather than a direct `image` dep.
xcap = "0.0.12"

[dev-dependencies]
tempfile = "3"

[target."cfg(target_os = \"windows\")".dependencies]
# UI Automation — pins windows = 0.62.2 (matched below to avoid a duplicate tree).
uiautomation = { version = "0.25", features = ["process"] }
# Direct windows-rs for SendInput / display-topology / power / DWM. Feature set
# matches src-tauri (superset of what automation + sandbox need).
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
] }

[target."cfg(target_os = \"macos\")".dependencies]
# Input simulation + AX element tree for the macOS Computer Use backend.
enigo = "0.6"
core-graphics = "0.25"
core-graphics-types = "0.2"
core-foundation = "0.10"
accessibility = "0.1"
accessibility-sys = "0.1"
core-foundation-sys = "0.8"
core-foundation-0-9 = { package = "core-foundation", version = "0.9" }

[target."cfg(unix)".dependencies]
# setrlimit for the sandbox CPU / address-space caps (sandbox/limits.rs).
libc = "0.2"

[target."cfg(target_os = \"linux\")".dependencies]
# Linux input sim (atspi backend) + seccomp-bpf filter for the bwrap backend.
enigo = "0.6"
seccompiler = "0.5"
