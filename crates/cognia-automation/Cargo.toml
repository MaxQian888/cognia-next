# ADR-0067 Phase 5 — Computer Use automation (ADR-0020). Extracted from
# app_lib's automation/ + sandbox/ + cua_sandbox/ modules (one cyclic cluster).
# Isolates the UI-automation stack (uiautomation + windows-rs on Windows,
# enigo + AX on macOS, atspi on Linux) and xcap. The execution sandbox itself
# (ADR-0028: bwrap/seccomp, sandbox-exec, the Windows runner) moved on to
# `cognia-exec-sandbox` (ADR-0196 P2); this crate keeps its Tauri commands.
[package]
name = "cognia-automation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Computer Use automation + execution sandbox (ADR-0020 / ADR-0028)."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_automation"
path = "src/lib.rs"

[features]
# ADR-0196 — the Tauri surface: the renderer `#[tauri::command]` shells, the
# clipboard-backed paste, the recorder's Tauri event sink, and the
# `AutomationEventSink` implementation for Tauri's `AppHandle`. Off by default,
# so the automation stack builds and tests Tauri-free; only `src-tauri`
# enables it.
default = []
tauri-host = ["dep:tauri", "dep:tauri-plugin-clipboard-manager"]

[build-dependencies]
cc = "1"

[dependencies]
cognia-instrument = { path = "../cognia-instrument" }
cognia-core = { path = "../cognia-core" }
# The execution sandbox (ADR-0028), its own crate since ADR-0196 P2 and
# re-exported as `crate::sandbox`; the three sandbox Tauri commands and the
# plugin-grant admission check stay in `src/sandbox.rs`.
cognia-exec-sandbox = { path = "../cognia-exec-sandbox" }
tauri = { workspace = true, features = ["image-png"], optional = true }
# `desktop_paste` writes to the clipboard via ClipboardExt before pasting.
tauri-plugin-clipboard-manager = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "sync", "time", "net", "signal"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
once_cell.workspace = true
chrono = { workspace = true, features = ["serde"] }
log.workspace = true
base64.workspace = true
uuid = { workspace = true, features = ["v4", "v7"] }
regex.workspace = true
dirs.workspace = true
hex.workspace = true
sha2.workspace = true
url.workspace = true
bytes.workspace = true
rand.workspace = true
ed25519-dalek.workspace = true
futures-util = { workspace = true }
async-trait.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots", "connect"] }

# Cross-platform screenshot for non-macOS backends. macOS app-session capture
# is implemented with ScreenCaptureKit in `native/macos/screen_capture.m`.
xcap = "0.9.8"

tempfile.workspace = true

[dev-dependencies]

[target."cfg(target_os = \"windows\")".dependencies]
# UI Automation — pins windows = 0.62.2 (matched below to avoid a duplicate tree).
uiautomation = { version = "0.25", features = ["event", "process"] }
# Direct windows-rs for SendInput / display-topology / power / DWM. Feature set
# matches src-tauri (superset of what automation + sandbox need).
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Accessibility",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
] }

[target."cfg(target_os = \"macos\")".dependencies]
# Input simulation + AX element tree for the macOS Computer Use backend.
enigo = "0.6"
core-graphics = "0.25"
core-foundation = "0.10"
# AX element tree, actions, hit-testing and the selection `AXObserver`, on the
# same objc2 stack as AppKit below (replaced `accessibility` 0.2, whose
# `cocoa` / `objc` / `block` chain is unmaintained and trips a
# future-incompatibility lint in `block`).
objc2-application-services = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "HIServices",
    "AXError",
    "AXUIElement",
    "AXValue",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFCGTypes",
    "CFDate",
    "CFDictionary",
    "CFNumber",
    "CFRunLoop",
    "CFString",
    "CFURL",
] }
# `ForeignType::as_ptr` on `CGEvent`, so the recorder's input hook can call
# `CGEventKeyboardGetUnicodeString` (core-graphics binds only the setter).
# Pinned to core-graphics 0.25's own foreign-types requirement.
foreign-types = "0.5"
objc2-app-kit = { version = "0.3.2", features = ["libc", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString", "NSURL"] }
objc2 = "0.6.4"


[target."cfg(target_os = \"linux\")".dependencies]
# Linux input sim (atspi backend). The seccomp filter moved to
# `cognia-exec-sandbox` with the bwrap backend.
enigo = "0.6"

[lints]
workspace = true
