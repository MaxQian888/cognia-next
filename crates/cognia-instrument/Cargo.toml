# ADR-0067 Phase 1 — process-global span instrumentation, extracted from the
# desktop `perf` subsystem so leaf subsystem crates (`cognia-git`,
# `cognia-vector`, `cognia-ocr`, …) can instrument coarse operation boundaries
# without a `path` dependency on the whole Tauri app. The perf panel in
# `app_lib` re-exports these symbols and reads the shared global `REGISTRY`.
[package]
name = "cognia-instrument"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
description = "Process-global span instrumentation registry shared across cognia subsystem crates."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "cognia_instrument"
path = "src/lib.rs"

[dependencies]
once_cell = "1"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
