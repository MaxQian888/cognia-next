# ADR-0067 Tier B — plugin runtime extracted from app_lib's `plugin_api/`
# module (~15k LOC). Isolates wasmtime/cranelift — the heaviest single
# dependency in the tree — plus the WASM capability surface, python/vscode
# plugin hosts, marketplace, signature verification and plugin lifecycle.
# Re-aliased as `crate::plugin_api`. The one upward edge (claude::sidecar's
# dir resolver, used by the vscode LSP host) is inverted via
# `vscode::commands::set_sidecar_dir_resolver`, registered in run().
[package]
name = "cognia-plugin-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Cognia plugin runtime — WASM component host (wasmtime), python/vscode plugin hosts, marketplace, lifecycle."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_plugin_runtime"
path = "src/lib.rs"

[features]
# ADR-0196 — the Tauri surface: every `#[tauri::command]` that takes `State`,
# `AppHandle` or a window, the Tauri-backed WASM host services, and the
# notification / clipboard / opener plugins they use. Off by default so the
# plugin runtime builds and tests Tauri-free; only `src-tauri` enables it.
default = []
tauri-host = [
  "dep:tauri",
  "dep:tauri-plugin-notification",
  "dep:tauri-plugin-clipboard-manager",
  "dep:tauri-plugin-opener",
]

[dependencies]
cognia-core = { path = "../cognia-core" }
# Proxy-aware outbound config + the shared streaming/hashing downloader the
# Open VSX `.vsix` fetch uses.
cognia-net = { path = "../cognia-net" }
cognia-secrets = { path = "../cognia-secrets" }
# Sandboxed Python plugin launches (bwrap/sandbox-exec prefixes, env filter).
cognia-exec-sandbox = { path = "../cognia-exec-sandbox" }
cognia-terminal = { path = "../cognia-terminal" }
tauri = { workspace = true, optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { workspace = true, optional = true }
tauri-plugin-opener = { workspace = true, optional = true }
# The WASM component host — the compile monster this crate isolates.
wasmtime = { version = "=47.0.3", default-features = false, features = ["runtime", "cranelift", "component-model", "async"] }
wasmtime-wasi = "=47.0.3"
# Component/manifest validation during install.
wasmparser = "0.256"
# Bounded child-process shutdown in the python host.
wait-timeout.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "sync", "time", "io-util", "fs"] }
futures-util = { workspace = true }
parking_lot.workspace = true
once_cell.workspace = true
thiserror.workspace = true
log.workspace = true
tracing.workspace = true
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "v7"] }
base64.workspace = true
hex.workspace = true
rand.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
url.workspace = true
dirs.workspace = true
notify.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream", "socks", "http2", "multipart"] }
# Marketplace archive staging / extraction.
tempfile.workspace = true
zip = { workspace = true, features = ["deflate", "bzip2"] }
tar.workspace = true
flate2.workspace = true
cap-std = "4"
cap-fs-ext = "4"

[dev-dependencies]
cognia-secrets = { path = "../cognia-secrets", features = ["test-inmemory"] }

[lints]
workspace = true
