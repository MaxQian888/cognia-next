# ADR-0067 Tier B — plugin runtime extracted from app_lib's `plugin_api/`
# module (~15k LOC). Isolates wasmtime/cranelift — the heaviest single
# dependency in the tree — plus the WASM capability surface, python/vscode
# plugin hosts, marketplace, signature verification and plugin lifecycle.
# Re-aliased as `crate::plugin_api`. The one upward edge (claude::sidecar's
# dir resolver, used by the vscode LSP host) is inverted via
# `vscode::commands::set_sidecar_dir_resolver`, registered in run().
[package]
name = "cognia-plugin-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
description = "Cognia plugin runtime — WASM component host (wasmtime), python/vscode plugin hosts, marketplace, lifecycle."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "cognia_plugin_runtime"
path = "src/lib.rs"

[dependencies]
cognia-core = { path = "../cognia-core" }
# Proxy-aware outbound config + the shared streaming/hashing downloader the
# Open VSX `.vsix` fetch uses.
cognia-net = { path = "../cognia-net" }
cognia-secrets = { path = "../cognia-secrets" }
cognia-automation = { path = "../cognia-automation" }
cognia-terminal = { path = "../cognia-terminal" }
cognia-connectors = { path = "../cognia-connectors" }
tauri = { version = "=2.11.1" }
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
# The WASM component host — the compile monster this crate isolates.
wasmtime = { version = "=36.0.12", default-features = false, features = ["runtime", "cranelift", "component-model", "async"] }
wasmtime-wasi = "=36.0.12"
# Component/manifest validation during install.
wasmparser = "0.221"
# Bounded child-process shutdown in the python host.
wait-timeout = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time", "io-util", "fs"] }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false }
parking_lot = "0.12"
once_cell = "1"
thiserror = "2"
log = "0.4"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7"] }
base64 = "0.22"
hex = "0.4"
rand = "0.8"
sha2 = "0.11"
ed25519-dalek = "2"
url = "2"
dirs = "6"
notify = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "socks", "http2", "multipart"] }
# Marketplace archive staging / extraction.
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2"] }
tar = "0.4"
flate2 = "1"
cap-std = "3"
cap-fs-ext = "3"

[dev-dependencies]
cognia-secrets = { path = "../cognia-secrets", features = ["test-inmemory"] }
