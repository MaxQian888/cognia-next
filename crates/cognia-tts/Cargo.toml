# ADR-0067 follow-up — TTS subsystem (Edge synthesis WS client, provider
# keyring, proxied fetch, realtime session) extracted from app_lib's `tts/`
# module. Re-aliased as `crate::tts`.
[package]
name = "cognia-tts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "TTS subsystem — Edge synthesis, provider keyring, proxied fetch, realtime."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_tts"
path = "src/lib.rs"

[dependencies]
cognia-secrets = { path = "../cognia-secrets" }
cognia-net = { path = "../cognia-net" }
tauri = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
base64.workspace = true
log.workspace = true
uuid = { workspace = true, features = ["v4", "v7"] }
parking_lot.workspace = true
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream", "socks", "http2", "multipart"] }
tokio = { workspace = true, features = ["sync", "time", "net", "io-util"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots", "connect"] }

[dev-dependencies]
cognia-secrets = { path = "../cognia-secrets", features = ["test-inmemory"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
