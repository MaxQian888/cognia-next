# ADR-0067 follow-up — TTS subsystem (Edge synthesis WS client, provider
# keyring, proxied fetch, realtime session) extracted from app_lib's `tts/`
# module. Re-aliased as `crate::tts`.
[package]
name = "cognia-tts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "TTS subsystem — Edge synthesis, provider keyring, proxied fetch, realtime."
license.workspace = true
publish.workspace = true

[lib]
name = "cognia_tts"
path = "src/lib.rs"

[features]
# ADR-0196 — the `#[tauri::command]` attribute on this crate's command fns.
# Off by default: the fns stay plain Rust functions, callable without Tauri;
# `src-tauri` turns it on to register them in `generate_handler!`.
default = []
tauri-host = ["dep:tauri"]

[dependencies]
cognia-secrets = { path = "../cognia-secrets" }
cognia-net = { path = "../cognia-net" }
# The command attribute only, behind `tauri-host`.
tauri = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
base64.workspace = true
log.workspace = true
parking_lot.workspace = true
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream", "socks", "http2", "multipart"] }
tokio = { workspace = true, features = ["sync", "time", "net", "io-util"] }

[dev-dependencies]
cognia-secrets = { path = "../cognia-secrets", features = ["test-inmemory"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
