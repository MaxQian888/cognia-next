# ADR-0067 follow-up — TTS subsystem (Edge synthesis WS client, provider
# keyring, proxied fetch, realtime session) extracted from app_lib's `tts/`
# module. Re-aliased as `crate::tts`.
[package]
name = "cognia-tts"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
description = "TTS subsystem — Edge synthesis, provider keyring, proxied fetch, realtime."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "cognia_tts"
path = "src/lib.rs"

[dependencies]
cognia-secrets = { path = "../cognia-secrets" }
cognia-net = { path = "../cognia-net" }
tauri = { version = "=2.11.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
log = "0.4"
uuid = { version = "1", features = ["v4", "v7"] }
parking_lot = "0.12"
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "socks", "http2", "multipart"] }
tokio = { version = "1", features = ["sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["rustls-tls-native-roots", "connect"] }

[dev-dependencies]
cognia-secrets = { path = "../cognia-secrets", features = ["test-inmemory"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
