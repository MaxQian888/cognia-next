apply plugin: 'com.android.application'

// AppGallery's downloaded client configuration is optional for ordinary builds.
def huaweiPushConfigured = file('agconnect-services.json').isFile()
if (huaweiPushConfigured) {
    apply plugin: 'com.huawei.agconnect'
}

// Generated from the root package version by pnpm version:sync.
def appVersion = new Properties()
rootProject.file('version.properties').withInputStream { appVersion.load(it) }
def appVersionName = appVersion.getProperty('versionName')
def appVersionCode = appVersion.getProperty('versionCode')?.toInteger()
if (!appVersionName || !appVersionCode || appVersionCode < 1 || appVersionCode > 2100000000) {
    throw new GradleException('Invalid Android version.properties; run pnpm version:sync from the repository root')
}

android {
    namespace "com.cognia.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "com.cognia.mobile"
        buildConfigField 'boolean', 'HUAWEI_PUSH_CONFIGURED', huaweiPushConfigured.toString()
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        // Icon contact sheets and visual QA previews are authoring artifacts.
        // Keep them in source/debug builds, but not in the distributed app.
        variant.androidResources.ignoreAssetsPatterns.add('!qa')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "ch.acra:acra-core:5.13.1"
    implementation "com.google.android.gms:play-services-base:18.5.0"
    implementation 'com.huawei.hms:push:6.13.0.301'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // Run bridge payload normalization against real JSON instead of Android's JVM stubs.
    testImplementation 'org.json:json:20250517'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Direct Android Studio/Gradle release builds must also reject stale dev URLs
// and incomplete web copies, even when the Node workflow was bypassed.
def verifyOfflineMobileAssets = tasks.register('verifyOfflineMobileAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/check-android-release.mjs'
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn verifyOfflineMobileAssets
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
